name: Fork ledger

# Fork (giantswarm/kagent-upstream): the carried-commit ledger is one file per
# change under fork/carried/ (FORK.md, "Which kagent are we running"). Every
# pull request and push verifies that the files name commits which sit on top
# of the pin, each once, that FORK.md's Substrate pin rows name the pin, that the harness images' Claude
# Code and Codex pins agree with the Go constants and carry the vendors' checksums, and the run's summary
# shows the table in that order. The public-links job keeps the ledger free of
# citations of a private repository: this repository is public.
on:
  push:
    branches: [giantswarm, "sync/**"]
  pull_request:
    branches: [giantswarm]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ledger-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The pin is the merge base with the mirror; the carried commits
          # sit on top of it.
          fetch-depth: 0
      - name: Check the carried files
        run: scripts/fork/carried.sh --check
      - name: Check the Substrate pin rows
        run: scripts/fork/ledger-check.sh pin
      - name: Check the harness CLI pins
        run: scripts/fork/harness-pins.sh check
      - name: Test the Releases table's writer and gate
        run: scripts/fork/releases-row_test.sh
      - name: Test that the published charts depend on nothing from ghcr.io
        run: scripts/fork/chart-gsoci-deps_test.sh
      - name: Show the table
        run: scripts/fork/carried.sh >> "$GITHUB_STEP_SUMMARY"

  public-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A pull request is checked on the lines it adds, against its base.
          fetch-depth: 0
      - name: Check that FORK.md and fork/ cite public repositories only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            scripts/fork/public-links.sh --added "$BASE_SHA"
          else
            scripts/fork/public-links.sh
          fi
