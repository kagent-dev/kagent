name: Nightly Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  prepare:
    if: github.repository == 'kagent-dev/kagent' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      release: ${{ steps.prepare.outputs.release }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Prepare nightly release
      id: prepare
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PREVIOUS_SHA=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yaml \
          --branch "$GITHUB_REF_NAME" --status success --limit 1 \
          --json headSha --jq '.[0].headSha // empty')
        # Prefix the SHA with g so an all-numeric SHA remains valid SemVer.
        VERSION="0.0.0-alpha.g${GITHUB_SHA:0:12}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$PREVIOUS_SHA" != "$GITHUB_SHA" ]; then
          echo "release=true" >> "$GITHUB_OUTPUT"
        else
          echo "release=false" >> "$GITHUB_OUTPUT"
          echo 'HEAD matches the previous successful nightly; skipping release.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        {
          echo "# Nightly $VERSION"
          echo
          echo "Commit: $GITHUB_SHA"
          echo
          if [ -n "$PREVIOUS_SHA" ]; then
            echo "Compare: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_SHA...$GITHUB_SHA"
            echo
            git log --format='- %h %s (%an)' "$PREVIOUS_SHA..HEAD"
          else
            echo 'First nightly: showing the most recent commits.'
            git log -20 --format='- %h %s (%an)'
          fi
          echo
          echo "Images: ghcr.io/kagent-dev/kagent/<component>:$VERSION"
          echo "Helm charts: oci://ghcr.io/kagent-dev/kagent/helm/{kagent,kagent-crds} --version $VERSION"
          echo 'CLI binaries, checksums and versioned charts are uploaded as artifacts on this run.'
        } >> "$GITHUB_STEP_SUMMARY"

  push-images:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        image:
          - controller
          - ui
          - kagent-adk
          - golang-adk
          - claude-harness
          - codex-harness
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/publish-image
      with:
        version: ${{ needs.prepare.outputs.version }}
        image: ${{ matrix.image }}
        token: ${{ secrets.GITHUB_TOKEN }}

  push-helm-chart:
    needs: [prepare, push-images]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/publish-helm
      with:
        version: ${{ needs.prepare.outputs.version }}
        token: ${{ secrets.GITHUB_TOKEN }}

  artifacts:
    needs: [prepare, push-helm-chart]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/build-release-artifacts
      with:
        version: ${{ needs.prepare.outputs.version }}
    - uses: actions/upload-artifact@v7
      with:
        name: nightly-${{ needs.prepare.outputs.version }}
        path: |
          go/core/bin/kagent-*
          dist/kagent-*.tgz
        if-no-files-found: error
