name: CI Build

on:
  push:
    branches: [main, "release/**"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, "release/**"]
    paths-ignore:
      - "**/*.md"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Cache key components for better organization
  CACHE_KEY_PREFIX: kagent-v2
  # Merge groups share one cache scope; their ref names are unique and would each write a throwaway one.
  BRANCH_CACHE_KEY: ${{ github.head_ref || (github.event.merge_group.base_ref && 'merge-queue') || github.ref_name }}
  # Consistent builder configuration
  BUILDX_BUILDER_NAME: kagent-builder-v0.23.0
  BUILDX_VERSION: v0.23.0
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Generate cache keys
        id: cache-key
        run: |
          # Generate branch-based cache key
          BRANCH_KEY="${CACHE_KEY_PREFIX}-${BRANCH_CACHE_KEY}"
          echo "key=${BRANCH_KEY}" >> $GITHUB_OUTPUT
          echo "::notice title=Cache Key::Branch: ${BRANCH_KEY}"
  test-e2e:
    env:
      VERSION: v0.0.1-test
      SUBSTRATE_VERSION: 0.2.0-beta5
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # 50: main's own 40, kept as headroom. The job itself takes around 10 minutes,
    # UI image and browser suite included, on a warm buildx cache.
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Initialize Environment
        uses: ./.github/actions/initialize-environment
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Cache E2E Go dependencies and build
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: e2e-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go/go.mod', 'go/go.sum') }}
          restore-keys: |
            e2e-go-${{ runner.os }}-${{ runner.arch }}-
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 (ubuntu-latest) enables AppArmor-based restrictions on
        # unprivileged user namespaces by default, which causes bubblewrap
        # to fail with EPERM on unshare(CLONE_NEWUSER)
        # See https://github.com/openai/codex/issues/14919
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: kagent-e2e
          platforms: linux/amd64
          nofallback: true

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.0

      - name: Install Kind
        id: kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2
        with:
          install_only: true

      - name: Create Kind cluster
        run: |
          make create-kind-cluster

      - name: Install Agent Substrate
        run: |
          curl -fsSL -o kubectl-ate "https://github.com/kagent-dev/substrate/releases/download/v${SUBSTRATE_VERSION}/kubectl-ate-linux-amd64"
          chmod +x kubectl-ate
          helm upgrade --install substrate-crds oci://ghcr.io/kagent-dev/substrate/helm/substrate-crds --version "${SUBSTRATE_VERSION}" --namespace ate-system --create-namespace
          helm upgrade --install substrate oci://ghcr.io/kagent-dev/substrate/helm/substrate --version "${SUBSTRATE_VERSION}" --namespace ate-system \
            --set-string 'atelet.extraArgs[0]=--localhost-registry-replacement=kind-registry:5000' \
            --set-string 'ateApi.extraArgs[0]=--template-resync-interval=250ms' \
            --set 'credentialProvider.namespacePolicies[0].atespace=kagent' \
            --set 'credentialProvider.namespacePolicies[0].allowedNamespaces[0]=kagent'
          ./kubectl-ate --context kind-kagent admin make-ca-pool --ca-id=1 --name=service-dns-ca-pool --secret-namespace=podcertificate-controller-system
          ./kubectl-ate --context kind-kagent admin make-ca-pool --ca-id=1 --name=pod-identity-ca-pool --secret-namespace=podcertificate-controller-system
          ./kubectl-ate --context kind-kagent admin make-jwt-pool --key-id=1 --name=actor-id-jwt-pool --secret-namespace=ate-system
          ./kubectl-ate --context kind-kagent admin make-ca-pool --ca-id=1 --name=actor-id-ca-pool --secret-namespace=ate-system
          ./kubectl-ate --context kind-kagent admin make-ca-pool --ca-id=1 --name=egress-mitm-ca-pool --secret-namespace=ate-system --key-type=ECDSAP256
          actor_id_ca_root="$(kubectl get secret actor-id-ca-pool -n ate-system -o jsonpath='{.data.pool}' | base64 --decode | jq -r '.CAs[0].RootCertificateDER' | base64 --decode | openssl x509 -inform der -outform pem)"
          kubectl create secret generic actor-id-ca-certs -n ate-system --from-literal=ca.crt="${actor_id_ca_root}"
          kubectl create configmap ate-api-authentication -n ate-system --from-literal=authentication.yaml=$'actorIdentityJWTProvider: kubernetes\njwtProviders:\n- name: kubernetes\n  issuer: https://kubernetes.default.svc\n  audiences: [api.ate-system.svc]\n  certificateAuthorityFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n  discoveryTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token\n'
          helm upgrade substrate oci://ghcr.io/kagent-dev/substrate/helm/substrate --version "${SUBSTRATE_VERSION}" --namespace ate-system --reuse-values --wait --timeout 5m

      - name: Install Kagent
        id: install-kagent
        env:
          OPENAI_API_KEY: fake
          KMCP_ENABLED: "false"
          KAGENT_HELM_EXTRA_ARGS: >-
            --cleanup-on-fail=false
            --set kagent-tools.enabled=false
            --set grafana-mcp.enabled=false
            --set controller.substrate.enabled=true
            --set controller.substrate.ateApiEndpoint=dns:///api.ate-system.svc:443
            --set controller.substrate.atenetRouterURL=http://atenet-router.ate-system.svc:80
            --set controller.substrate.defaultWorkerPool.name=kagent-default
            --set substrateWorkerPool.create=true
            --set substrateWorkerPool.replicas=4
            --set-string substrateWorkerPool.workerImage=ghcr.io/kagent-dev/substrate/ateom-gvisor:v${{ env.SUBSTRATE_VERSION }}
            --set otel.tracing.enabled=true
            --set-string otel.tracing.exporter.otlp.endpoint=http://172.17.0.1:14317
        run: |
          # Reuse Blacksmith's persistent layers and Go cache mounts. The Makefile
          # otherwise selects a fresh local builder, discarding that cache.
          BUILDX_BUILDER_NAME=$(docker buildx inspect | awk '$1 == "Name:" { print $2; exit }')
          test -n "$BUILDX_BUILDER_NAME"
          export BUILDX_BUILDER_NAME
          # Before the fan-out. Each `build-*` runs it again — it is not passed `-o` the
          # way `proto-generate` is below — which is harmless only because the target
          # documents itself as safe to run concurrently.
          make buildx-create
          # Likewise once, and for a sharper reason: `build-ui` and `build-golang-adk` both
          # depend on it, and `buf generate` writes `ui/src/generated` as well as
          # `go/api/gen` — so in parallel one make would write into the directory the
          # other is tarring as a build context. `-o proto-generate` below says it is done.
          make proto-generate
          # `ui` is here so the browser suite below runs against the image an operator
          # gets: nginx, the SPA fallback, and the env-config.js rendered at pod start.
          printf '%s\n' controller ui golang-adk claude-harness codex-harness byo-a2a | xargs -P5 -n1 bash -c '
            image="$1"
            DOCKER_BUILD_ARGS="--platform=linux/amd64 --push" \
              make -o proto-generate GIT_COMMIT=e2e BUILD_DATE=1970-01-01 "build-${image}"
          ' _
          make helm-install-provider
          kubectl rollout status deployment/kagent-controller -n kagent --timeout=120s
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/component=controller -n kagent --timeout=120s

      - name: Run e2e tests
        if: success()
        working-directory: go
        run: |
          RUNTIME_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/golang-adk:${VERSION}" | awk '$1 == "Digest:" { print $2; exit }')
          test -n "$RUNTIME_DIGEST"
          export KAGENT_E2E_RUNTIME_IMAGE="localhost:5001/kagent-dev/kagent/golang-adk@${RUNTIME_DIGEST}"
          BYO_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/byo-a2a:${VERSION}" | awk '$1 == "Digest:" { print $2; exit }')
          test -n "$BYO_DIGEST"
          export KAGENT_E2E_BYO_IMAGE="localhost:5001/kagent-dev/kagent/byo-a2a@${BYO_DIGEST}"
          CLAUDE_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/claude-harness:${VERSION}" | awk '$1 == "Digest:" { print $2; exit }')
          test -n "$CLAUDE_DIGEST"
          export KAGENT_E2E_CLAUDE_IMAGE="localhost:5001/kagent-dev/kagent/claude-harness@${CLAUDE_DIGEST}"
          CODEX_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/codex-harness:${VERSION}" | awk '$1 == "Digest:" { print $2; exit }')
          test -n "$CODEX_DIGEST"
          export KAGENT_E2E_CODEX_IMAGE="localhost:5001/kagent-dev/kagent/codex-harness@${CODEX_DIGEST}"
          envsubst < core/test/e2e/manifests/lifecycle.yaml.tmpl | kubectl apply -f -
          for _ in $(seq 1 60); do
            READY=$(kubectl get agenttemplate smoke -n kagent -o jsonpath='{.status.harnesses[?(@.harness=="kagent")].conditions[?(@.type=="Ready")].status}')
            if [ "$READY" = True ]; then break; fi
            sleep 5
          done
          test "$READY" = True
          export KAGENT_API_URL="http://$(kubectl get svc -n kagent kagent-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}'):8083"
          export KAGENT_GATEWAY_URL="$KAGENT_API_URL"
          echo "KAGENT_API_URL: $KAGENT_API_URL"
          make core/bin/kagent-local
          export KAGENT_E2E_CLI="$PWD/core/bin/kagent-local"
          envsubst < core/test/e2e/manifests/tracing.yaml.tmpl | kubectl apply -f -
          export KAGENT_E2E_API_URL="$KAGENT_API_URL"
          export KAGENT_LOCAL_HOST=172.17.0.1
          # TestMain keeps the receiver alive for every runtime's response flush.
          export KAGENT_E2E_OTLP_LISTEN_ADDRESS=:14317
          go test -v github.com/kagent-dev/kagent/go/core/test/e2e -failfast -shuffle=on -parallel 4 -count=1

      # The `smoke` template is applied part-way through the step above, after four
      # digest lookups. The browser journeys below need an agent to schedule and a
      # template to list, so a step that died before that apply would fail them for a
      # reason that has nothing to do with the UI — three retries each, against an empty
      # cluster. `continue-on-error`, because a missing template means the Go step has
      # already failed the job and this only decides whether the UI steps are worth
      # running: `outcome` still reports the failure the gate below reads.
      - name: Check the cluster has the smoke agent
        id: smoke-agent
        if: ${{ !cancelled() && steps.install-kagent.outcome == 'success' }}
        continue-on-error: true
        # Retried, because everything below is gated on this one command. Asked once, a
        # transient API-server or kubeconfig hiccup skips the whole browser lane and the
        # job still reports green — which is the shape of #2638, a suite that measured
        # nothing while every check passed.
        run: |
          for attempt in $(seq 1 10); do
            if kubectl get agenttemplate smoke -n kagent; then exit 0; fi
            echo "attempt ${attempt}: not there yet"
            sleep 6
          done
          kubectl get agenttemplate -A || true
          exit 1

      # And when it is genuinely absent, said out loud on the run. A skipped lane and a
      # passing one look identical in the checks list otherwise.
      - name: Say so if the UI suite was skipped
        if: ${{ !cancelled() && steps.smoke-agent.outcome != 'success' }}
        run: |
          echo "::warning title=UI live suite skipped::No smoke agent on the cluster, so the live Playwright lane did not run."

      # The UI, against this same cluster and the image built above. `ui-tests` runs on
      # the in-browser mock, so a backend contract change cannot fail it — which is how
      # #2638 emptied three Substrate fields with every check green.
      #
      # After the Go tests, not beside them: both create and delete resources in the same
      # namespace, and these journeys read the lists back.
      #
      # Gated on the cluster being usable rather than on `success()`, so one failed Go
      # test under `-failfast` does not also cost every UI signal. No cluster or no
      # agent, no run.
      - name: Setup Node.js
        if: ${{ !cancelled() && steps.smoke-agent.outcome == 'success' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc

      # Before the cache step, as in `ui-tests`: package.json pins Yarn 4, and the
      # runner's own shim cannot read this lock file.
      - name: Enable Corepack
        if: ${{ !cancelled() && steps.smoke-agent.outcome == 'success' }}
        run: corepack enable

      - name: Cache Yarn downloads
        if: ${{ !cancelled() && steps.smoke-agent.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: ui/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('ui/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Prepare the live browser suite
        if: ${{ !cancelled() && steps.smoke-agent.outcome == 'success' }}
        working-directory: ./ui
        # Chromium only: the live suite declares one project. The mock suite's second
        # engine is there to disagree about layout, which no backend contract rests on.
        run: |
          yarn install --immutable
          yarn playwright install --with-deps chromium

      - name: Run live browser tests
        if: ${{ !cancelled() && steps.smoke-agent.outcome == 'success' }}
        working-directory: ./ui
        run: |
          kubectl -n kagent rollout status deploy/kagent-ui --timeout=5m
          # Already a LoadBalancer on a MetalLB cluster, so this is the address the
          # controller e2e step takes — not a port-forward to keep alive for the run.
          UI_IP="$(kubectl get svc -n kagent kagent-ui -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          test -n "$UI_IP"
          export UI_LOOP_LIVE_URL="http://${UI_IP}:8080"
          echo "UI_LOOP_LIVE_URL: $UI_LOOP_LIVE_URL"
          # `globalSetup` refuses the run if that address answers with fixtures, or is a
          # dev server rather than the built image.
          yarn test:pw:live

      - name: Upload live browser report
        # Any finished run, not just a failed one: CI retries twice, so a spec that
        # fails and then passes leaves a green job and no trace of the failure — which
        # is the run whose trace is worth the most. A clean run uploads the HTML report
        # and nothing else, since `test-results` only has content when something failed.
        if: ${{ !cancelled() && steps.install-kagent.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: ui-live-playwright-report
          # The trace is the only record of what the cluster answered — there is no fixed
          # fixture to re-read afterwards, as there would be for the mock suite. The HTML
          # report is what links one to the other, and it exists because the config asks
          # for `html` alongside `github`; `github` on its own writes annotations and no
          # files, which is how this path came to be uploaded empty.
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: fail print info
        if: failure()
        run: |
          echo "::error::Failed to run e2e tests"
          echo "::error::Kubectl get pods -n kagent"
          kubectl describe pods -n kagent
          echo "::error::Kubectl get events -n kagent"
          kubectl get events -n kagent
          echo "::error::Kubectl get Harnesses and AgentTemplates -n kagent"
          kubectl get harnesses,agenttemplates -n kagent
          echo "::error::Kubectl logs -n kagent deployment/kagent-controller"
          kubectl logs -n kagent deployment/kagent-controller
          # nginx logs every proxied request, so a browser failure that was really a
          # backend failure says so here, as does an init.sh that rejected a value.
          echo "::error::Kubectl logs -n kagent deployment/kagent-ui"
          kubectl logs -n kagent deployment/kagent-ui --tail=200 || true
          kubectl get pods,actortemplates,workerpools -A
          echo "::error::Substrate logs"
          kubectl logs -n ate-system -l app --all-containers --prefix --tail=200 || true
          kubectl logs -n ate-system -l app --all-containers --prefix --previous --tail=200 || true
          kubectl logs -n kagent -l ate.dev/worker-pool --all-containers --prefix --tail=200 || true
          kubectl logs -n kagent -l ate.dev/worker-pool --all-containers --prefix --previous --tail=200 || true

  proto-check:
    name: Protobuf Contract Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      - name: Lint and generate protobuf contracts
        run: make proto-check
      - name: Check protobuf compatibility
        run: make proto-breaking

  upgrade-tests:
    needs:
      - setup
    env:
      VERSION: v0.0.1-test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # prev-stable: the previous minor line's latest published version,
        #   including a prerelease before GA — runs on every base.
        # adjacent: the same-line latest published version, including prereleases
        #   — only meaningful on a release branch and skipped on main.
        upgrade-from: [adjacent, prev-stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history + tags so the version resolvers can derive the
          # upgrade-from release, and so the local action below is on disk.
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare upgrade test environment
        id: prep
        uses: ./.github/actions/upgrade-test-setup
        with:
          upgrade-from: ${{ matrix.upgrade-from }}
      - name: Run upgrade tests
        if: steps.prep.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: fake
          BUILDX_BUILDER_NAME: ${{ env.BUILDX_BUILDER_NAME }}
          KAGENT_HELM_EXTRA_ARGS: --cleanup-on-fail=false
          DOCKER_BUILD_ARGS: >-
            --cache-from=type=gha,scope=${{ needs.setup.outputs.cache-key }}-e2e
            --cache-from=type=gha,scope=${{ env.CACHE_KEY_PREFIX }}-main-e2e
            --platform=linux/amd64
            --push
        run: |
          make run-upgrade-tests UPGRADE_FROM_VERSION="${{ steps.prep.outputs.version }}"
      - name: fail print info
        if: failure() && steps.prep.outputs.skip != 'true'
        run: |
          echo "::error::Failed to run upgrade tests"
          kubectl describe pods -n kagent
          kubectl get events -n kagent
          kubectl logs -n kagent deployment/kagent-controller || true

  rolling-upgrade-tests:
    needs:
      - setup
    env:
      VERSION: v0.0.1-test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # prev-stable: the previous minor line's latest published version,
        #   including a prerelease before GA — runs on every base.
        # adjacent: the same-line latest published version, including prereleases
        #   — only meaningful on a release branch and skipped on main.
        upgrade-from: [adjacent, prev-stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history + tags so the version resolvers can derive the
          # upgrade-from release, and so the local action below is on disk.
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare upgrade test environment
        id: prep
        uses: ./.github/actions/upgrade-test-setup
        with:
          upgrade-from: ${{ matrix.upgrade-from }}
      - name: Run rolling upgrade tests
        if: steps.prep.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: fake
          BUILDX_BUILDER_NAME: ${{ env.BUILDX_BUILDER_NAME }}
          KAGENT_HELM_EXTRA_ARGS: --cleanup-on-fail=false
          DOCKER_BUILD_ARGS: >-
            --cache-from=type=gha,scope=${{ needs.setup.outputs.cache-key }}-e2e
            --cache-from=type=gha,scope=${{ env.CACHE_KEY_PREFIX }}-main-e2e
            --platform=linux/amd64
            --push
        run: |
          make run-rolling-upgrade-tests UPGRADE_FROM_VERSION="${{ steps.prep.outputs.version }}"
      - name: fail print info
        if: failure() && steps.prep.outputs.skip != 'true'
        run: |
          echo "::error::Failed to run rolling upgrade tests"
          kubectl describe pods -n kagent
          kubectl get events -n kagent
          kubectl logs -n kagent deployment/kagent-controller || true

  go-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum

      - name: Run Go unit tests
        working-directory: go
        env:
          # Runners are ephemeral, so Ryuk's leaked-container cleanup buys nothing,
          # and its single session-scoped reaper is contended by the parallel package
          # processes of `go test ./...`, intermittently timing out the Postgres tests.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          make setup-envtest
          export KUBEBUILDER_ASSETS="$(make -s envtest-path)"
          go test -race -skip 'TestE2E.*' -v ./...

  helm-unit-tests:
    env:
      VERSION: v0.0.1-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.0
      # Install unittest plugin
      - name: Install unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Chart init
        run: |
          make helm-version

      - name: Run helm unit tests
        run: |
          helm unittest helm/kagent
          helm unittest helm/tools/grafana-mcp

  ui-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc

      # Before any cache step that shells out to yarn: the pinned version in
      # ui/package.json "packageManager" is Yarn 4, and without corepack the shim
      # on the runner is a different one that cannot read this lock file.
      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: ui/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('ui/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./ui
        run: yarn install --immutable

      - name: Typecheck
        working-directory: ./ui
        run: yarn typecheck

      - name: Run lint
        working-directory: ./ui
        run: yarn lint

      - name: Run unit tests
        working-directory: ./ui
        run: yarn test

      # Both engines the suite declares. Installing only one leaves that project
      # failing to launch, which reads as a broken app rather than a missing browser.
      - name: Install Playwright browsers
        working-directory: ./ui
        run: yarn playwright install --with-deps chromium firefox

      - name: Run browser tests
        working-directory: ./ui
        run: yarn test:pw

  # This job builds the Docker images for the controller, UI, ADKs, and CLI on arm64.
  build:
    env:
      VERSION: v0.0.1-test
    strategy:
      matrix:
        image:
          - controller
          - ui
          - kagent-adk
          - cli
          - golang-adk
          - claude-harness
          - codex-harness
    runs-on: blacksmith-2vcpu-ubuntu-2404
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: kagent-build-${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          nofallback: true
      - name: Run make build
        env:
          DOCKER_BUILD_ARGS: >-
            --platform=linux/amd64,linux/arm64
            --push
          DOCKER_REPO: "${{ github.repository_owner }}/kagent"
          DOCKER_BUILDER: "docker buildx build"
        run: |
          BUILDX_BUILDER_NAME=$(docker buildx inspect | awk '$1 == "Name:" { print $2; exit }')
          test -n "$BUILDX_BUILDER_NAME"
          export BUILDX_BUILDER_NAME
          make build-${{ matrix.image }}
        working-directory: ./

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      - name: golangci-lint
        working-directory: go
        run: make lint

  python-test:
    env:
      OPENAI_API_KEY: fake
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        working-directory: ./python
        run: uv sync --all-extras

      - name: Generate test certificates
        working-directory: ./python
        run: make generate-test-certs

      - name: Run tests
        working-directory: ./python
        run: make test

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install python
        run: uv python install 3.11

      - name: Verify uv.lock matches pyproject.toml
        working-directory: ./python
        run: uv lock --check

      - name: Sync dependencies
        working-directory: ./python
        run: uv sync --all-extras

      - name: Run ruff linter
        working-directory: ./python
        run: uv run ruff check

      - name: Run ruff format check
        working-directory: ./python
        run: |
          if ! uv run ruff format --diff .; then
            echo "Ruff formatting issues detected. Please run 'uv run ruff format' locally to fix formatting issues."
            exit 1
          fi

  manifests-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum

      - name: Generate controller manifests
        run: make controller-manifests

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Controller manifests are out of date!"
            echo "::error::Please run 'make controller-manifests' and commit the changes."
            echo ""
            echo "The following files have differences:"
            git diff --name-only
            echo ""
            echo "Diff details:"
            git diff
            exit 1
          fi
          echo "✓ Controller manifests are up to date"
