name: CI Build

# Fork (giantswarm/kagent-upstream): the consumed branch and the sync
# candidates run this suite on every push and pull request, on GitHub-hosted
# runners (the org has no Blacksmith runners), and report one `ci-ok` status
# for the ruleset. No paths-ignore: a docs-only pull request must still report
# the required checks to be mergeable. See FORK.md.
on:
  push:
    branches: [main, "release/**", giantswarm, "sync/**"]
  pull_request:
    branches: [main, "release/**", giantswarm]
  merge_group:
  workflow_dispatch:
    inputs:
      e2e_parallel:
        description: Concurrent E2E scenarios (compare on the same revision)
        type: choice
        default: "4"
        options:
          - "4"
          - "8"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Cache key components for better organization
  CACHE_KEY_PREFIX: kagent-v2
  # Merge groups share one cache scope; their ref names are unique and would each write a throwaway one.
  BRANCH_CACHE_KEY: ${{ github.head_ref || (github.event.merge_group.base_ref && 'merge-queue') || github.ref_name }}
  # Consistent builder configuration
  BUILDX_BUILDER_NAME: kagent-builder-v0.23.0
  BUILDX_VERSION: v0.23.0
  # Fork: Docker Hub images come through mirror.gcr.io, Docker Hub's public
  # cache, so the runner's shared IP never meets the unauthenticated pull limit:
  # the jobs' service containers, QEMU and BuildKit images name it, the builds'
  # base images resolve through it.
  BUILDKITD_CONFIG: |
    [registry."docker.io"]
      mirrors = ["mirror.gcr.io"]
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Generate cache keys
        id: cache-key
        run: |
          # Generate branch-based cache key
          BRANCH_KEY="${CACHE_KEY_PREFIX}-${BRANCH_CACHE_KEY}"
          echo "key=${BRANCH_KEY}" >> $GITHUB_OUTPUT
          echo "::notice title=Cache Key::Branch: ${BRANCH_KEY}"
  test-e2e:
    strategy:
      fail-fast: false
      matrix:
        # The Giant Swarm line of Substrate publishes the gVisor worker only
        # (its FORK.md, "Publishing"); the platform runs no micro-VM pool.
        sandbox_class: [gvisor]
    env:
      VERSION: v0.0.1-test
      KIND_SANDBOX_CLASS: ${{ matrix.sandbox_class }}
      # Keep the four-vCPU runner bounded; manual runs can compare higher concurrency.
      E2E_PARALLEL: ${{ inputs.e2e_parallel || '4' }}
    runs-on: ubuntu-latest
    # The setup before the tests takes up to 16 minutes on hosted runners and
    # the tests up to 15: go test's own -timeout (20m) must fire before this one, so
    # a test that hangs still prints its goroutine dump and the logs upload.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Resolve the Substrate pin
        # One source of truth: the Makefile's SUBSTRATE_VERSION / SUBSTRATE_REPO
        # (the Giant Swarm line of Substrate, gsoci.azurecr.io/giantswarm/substrate) drive
        # the charts' dependencies and the Substrate this cluster runs.
        run: |
          make -s substrate-pin | tee -a "$GITHUB_ENV"
          registry=$(make -s substrate-pin | sed -n 's|^SUBSTRATE_REPO=oci://||p')
          echo "SUBSTRATE_IMAGE_REGISTRY=${registry%/helm}" | tee -a "$GITHUB_ENV"
      - name: Initialize Environment
        uses: ./.github/actions/initialize-environment
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Cache E2E Go dependencies and build
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: e2e-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go/go.mod', 'go/go.sum') }}
          restore-keys: |
            e2e-go-${{ runner.os }}-${{ runner.arch }}-
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 (ubuntu-latest) enables AppArmor-based restrictions on
        # unprivileged user namespaces by default, which causes bubblewrap
        # to fail with EPERM on unshare(CLONE_NEWUSER)
        # See https://github.com/openai/codex/issues/14919
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Pull Docker Hub images through mirror.gcr.io
        # Fork: the Kind registry and node images, under the names
        # scripts/kind/setup-kind.sh runs, so it finds them locally.
        run: |
          kind_version=$(make -s --eval 'print-%: ; @echo $($*)' print-KIND_IMAGE_VERSION)
          for image in library/registry:2 "kindest/node:v${kind_version}"; do
            docker pull "mirror.gcr.io/${image}"
            docker tag "mirror.gcr.io/${image}" "${image#library/}"
          done
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER_NAME }}
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            network=host
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: ${{ env.BUILDKITD_CONFIG }}
          use: "true"

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.0

      - name: Install Kind
        id: kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2
        with:
          version: v0.33.0
          install_only: true

      - name: Create Kind cluster
        run: make create-kind-cluster

      - name: Install Kagent
        id: install-kagent
        env:
          OPENAI_API_KEY: fake
          KAGENT_HELM_EXTRA_ARGS: >-
            --set registry=localhost:5001
            --set tag=${{ env.VERSION }}
            --set imagePullPolicy=Always
            --set controller.image.pullPolicy=Always
            --set controller.service.type=LoadBalancer
            --set ui.replicas=0
            --set kmcp.enabled=false
            --set kagent-tools.enabled=false
            --set grafana-mcp.enabled=false
            --set controller.push.allowHTTP=true
            --set controller.push.allowPrivateNetworks=true
            --set substrateWorkerPool.create=true
            --set substrateWorkerPool.replicas=4
            --set substrateWorkerPool.sandboxClass=${{ matrix.sandbox_class }}
            --set substrateWorkerPool.workerImage=${{ env.SUBSTRATE_IMAGE_REGISTRY }}/ateom-${{ matrix.sandbox_class }}:${{ env.SUBSTRATE_VERSION }}
            --set controller.session.admission.jwt.jwksURL=http://e2e-grant-jwks.kagent.svc.cluster.local/.well-known/jwks.json
            --set controller.session.admission.jwt.allowHTTP=true
            --set controller.session.admission.jwt.issuer=https://grant-issuer.e2e.kagent.dev
            --set controller.session.admission.jwt.audience=kagent-e2e
            --set otel.traces.enabled=true
            --set otel.metrics.enabled=true
            --set otel.exporter.otlp.endpoint=http://e2e-otlp.kagent.svc.cluster.local:14317
            --set controller.env[0].name=KAGENT_SESSION_EXPIRATION_POLL_INTERVAL
            --set controller.env[0].value=1s
            --set database.postgres.role=
          KAGENT_SUBSTRATE_HELM_EXTRA_ARGS: >-
            --set atelet.extraArgs[0]=--localhost-registry-replacement=kind-registry:5000
            --set ateApi.extraArgs[0]=--template-resync-interval=250ms
            --set credentialProvider.namespacePolicies[0].atespace=kagent
            --set credentialProvider.namespacePolicies[0].allowedNamespaces[0]=kagent
            --set credentialProvider.namespacePolicies[1].atespace=ate-golden
            --set credentialProvider.namespacePolicies[1].allowedNamespaces[0]=kagent
            --set credentialProvider.additionalProviders[0].uriAuthority=credentials.e2e.kagent.dev
            --set credentialProvider.additionalProviders[0].host=e2e-credential-provider.kagent.svc:50051
        run: |
          # Reuse Blacksmith's persistent layers and Go cache mounts. The Makefile
          # otherwise selects a fresh local builder, discarding that cache.
          BUILDX_BUILDER_NAME=$(docker buildx inspect | awk '$1 == "Name:" { print $2; exit }')
          test -n "$BUILDX_BUILDER_NAME"
          export BUILDX_BUILDER_NAME
          make buildx-create
          printf '%s\n' controller golang-adk claude-harness codex-harness byo-a2a e2e-credential-provider sandbox-guest | xargs -P4 -n1 bash -c '
            image="$1"
            DOCKER_BUILD_ARGS="--platform=linux/amd64 --push" \
              make GIT_COMMIT=e2e BUILD_DATE=1970-01-01 "build-${image}"
          ' _
          # Resolve the guest on the runner: localhost:5001 is not reachable
          # from the controller pod. Substrate rewrites registry pulls on workers.
          GUEST_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/sandbox-guest:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
          test -n "$GUEST_DIGEST"
          export KAGENT_HELM_EXTRA_ARGS="${KAGENT_HELM_EXTRA_ARGS} --set controller.sandbox.guestImage.digest=${GUEST_DIGEST}"
          make build-cli-local helm-version
          # The line's Substrate signs no certificates for the CLI's bundled PostgreSQL.
          scripts/fork/dev-postgres.sh kagent
          # The Substrate of the line's pin (the "Resolve the Substrate pin" step), not the CLI's upstream default.
          KAGENT_SUBSTRATE_HELM_REPO="${SUBSTRATE_REPO}/" KAGENT_SUBSTRATE_HELM_VERSION="${SUBSTRATE_VERSION}" \
            KAGENT_HELM_REPO=./helm/ KAGENT_HELM_VERSION="${VERSION}" ./go/core/bin/kagent-local install --namespace kagent --skip-database-setup
          kubectl rollout status deployment/kagent-controller -n kagent --timeout=120s
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/component=controller -n kagent --timeout=120s
          # The egress gateway dials upstream HTTPS itself and trusts this CA
          # there; the egress credential tests sign their HTTPS upstreams with it.
          # kagent install passes --set values only, so the bundle follows as an upgrade.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj "/CN=kagent e2e egress upstream" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign" \
            -keyout "$RUNNER_TEMP/egress-ca.key" -out "$RUNNER_TEMP/egress-ca.crt"
          helm upgrade substrate "${SUBSTRATE_REPO}/substrate" --version "${SUBSTRATE_VERSION}" --namespace ate-system --reuse-values \
            --set-file "atenetEgress.upstreamTrust.caBundle=$RUNNER_TEMP/egress-ca.crt" --wait --timeout 5m

      - name: Install read-write-many NFS storage
        # The workspace fixture claims its shared volume from the NFS class, and
        # Substrate mounts its directories into Session actors through the NFS
        # CSI driver's CSIDriverConfig (core/test/e2e/README.md).
        run: |
          sudo modprobe nfs
          sudo modprobe nfsd
          bash scripts/kind/setup-csi-nfs.sh

      - name: Cache Cloud Hypervisor assets
        if: matrix.sandbox_class == 'microvm'
        uses: actions/cache@v6
        with:
          path: .cache/substrate/microvm-assets/amd64
          key: microvm-assets-amd64-${{ env.SUBSTRATE_VERSION }}

      - name: Install Cloud Hypervisor runtime
        if: matrix.sandbox_class == 'microvm'
        run: bash scripts/kind/setup-microvm.sh

      - name: Run e2e tests
        if: success()
        working-directory: go
        shell: bash
        run: |
          # Read all output so Docker does not get a broken pipe under pipefail.
          RUNTIME_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/golang-adk:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
          test -n "$RUNTIME_DIGEST"
          export KAGENT_E2E_RUNTIME_IMAGE="localhost:5001/kagent-dev/kagent/golang-adk@${RUNTIME_DIGEST}"
          BYO_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/byo-a2a:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
          test -n "$BYO_DIGEST"
          export KAGENT_E2E_BYO_IMAGE="localhost:5001/kagent-dev/kagent/byo-a2a@${BYO_DIGEST}"
          PROVIDER_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/e2e-credential-provider:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
          test -n "$PROVIDER_DIGEST"
          export KAGENT_E2E_CREDENTIAL_PROVIDER_IMAGE="localhost:5001/kagent-dev/kagent/e2e-credential-provider@${PROVIDER_DIGEST}"
          CLAUDE_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/claude-harness:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
          test -n "$CLAUDE_DIGEST"
          export KAGENT_E2E_CLAUDE_IMAGE="localhost:5001/kagent-dev/kagent/claude-harness@${CLAUDE_DIGEST}"
          CODEX_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/codex-harness:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
          test -n "$CODEX_DIGEST"
          export KAGENT_E2E_CODEX_IMAGE="localhost:5001/kagent-dev/kagent/codex-harness@${CODEX_DIGEST}"
          envsubst < core/test/e2e/manifests/lifecycle.yaml.tmpl | kubectl apply -f -
          for _ in $(seq 1 60); do
            READY=$(kubectl get agent smoke -n kagent -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
            if [ "$READY" = True ]; then break; fi
            sleep 5
          done
          test "$READY" = True
          export KAGENT_API_URL="http://$(kubectl get svc -n kagent kagent-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}'):8083"
          export KAGENT_GATEWAY_URL="$KAGENT_API_URL"
          echo "KAGENT_API_URL: $KAGENT_API_URL"
          make core/bin/kagent-local
          export KAGENT_E2E_CLI="$PWD/core/bin/kagent-local"
          export KAGENT_E2E_API_URL="$KAGENT_API_URL"
          export KAGENT_E2E_LOCAL_HOST=172.17.0.1
          export KAGENT_E2E_EGRESS_CA_FILE="$RUNNER_TEMP/egress-ca.crt" KAGENT_E2E_EGRESS_CA_KEY_FILE="$RUNNER_TEMP/egress-ca.key"
          envsubst < core/test/e2e/manifests/tracing.yaml.tmpl | kubectl apply -f -
          # TestMain keeps the receiver alive for every runtime's response flush.
          export KAGENT_E2E_OTLP_LISTEN_ADDRESS=:14317
          # TestMain replays what the receiver got to Weaver live-check.
          # The registry manifest reads its dependencies from the pinned checkouts.
          make -C .. semconv-deps
          ../telemetry/live-check.sh start
          export KAGENT_E2E_LIVE_CHECK_ENDPOINT=127.0.0.1:4319
          # Concurrent actors can push an earlier failure out of the final log tail.
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          kubectl logs -n kagent -l ate.dev/worker-pool --all-containers --prefix --timestamps --tail=-1 --follow --max-log-requests=20 > "$RUNNER_TEMP/e2e-logs/workers.log" 2>&1 &
          worker_logs_pid=$!
          kubectl logs -n ate-system -l app --all-containers --prefix --timestamps --tail=-1 --follow --max-log-requests=20 > "$RUNNER_TEMP/e2e-logs/substrate.log" 2>&1 &
          substrate_logs_pid=$!
          # The NFS server's nfsd state and the runner's pressure over time, for a
          # stall of the workspace volumes (scripts/kind/nfs-diagnostics.sh).
          bash ../scripts/kind/nfs-diagnostics.sh watch "$RUNNER_TEMP/e2e-logs/nfs" &
          nfs_watch_pid=$!
          # Tests roll the controller (withControllerEnv, the sandbox restart), and a
          # log read at the end holds only the final pod: every controller pod is
          # followed from the moment it runs, into a file of its own.
          controller_log_pids="$RUNNER_TEMP/controller-log-pids"
          : > "$controller_log_pids"
          (
            followed=" "
            while true; do
              for pod in $(kubectl get pods -n kagent -l app.kubernetes.io/component=controller -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}'); do
                case "$followed" in *" $pod "*) continue ;; esac
                followed="$followed$pod "
                kubectl logs -n kagent "$pod" --all-containers --prefix --timestamps --tail=-1 --follow > "$RUNNER_TEMP/e2e-logs/controller-$pod.log" 2>&1 &
                echo $! >> "$controller_log_pids"
              done
              sleep 5
            done
          ) &
          controller_logs_pid=$!
          trap 'kill "$worker_logs_pid" "$substrate_logs_pid" "$nfs_watch_pid" "$controller_logs_pid" $(cat "$controller_log_pids") 2>/dev/null || true; wait "$worker_logs_pid" "$substrate_logs_pid" "$nfs_watch_pid" "$controller_logs_pid" $(cat "$controller_log_pids") 2>/dev/null || true' EXIT
          go test -v github.com/kagent-dev/kagent/go/core/test/e2e -shuffle=on -parallel "$E2E_PARALLEL" -count=1 -timeout=20m 2>&1 | tee "$RUNNER_TEMP/e2e-logs/tests.log"

      - name: Check E2E telemetry with Weaver live-check
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          telemetry/live-check.sh stop || echo "::warning::Weaver live-check produced no report"
          cp -r telemetry/conformance/report "$RUNNER_TEMP/e2e-logs/live-check" 2>/dev/null || true

      - name: Collect NFS state
        # The NFS server and CSI driver behind csi-nfs-sc, their full logs, the
        # server's nfsd state and the runner's kernel messages, into the artifact.
        if: always()
        run: bash scripts/kind/nfs-diagnostics.sh dump "$RUNNER_TEMP/e2e-logs/nfs"

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.sandbox_class }}
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7

      - name: fail print info
        if: failure()
        run: |
          echo "::error::Failed to run e2e tests"
          echo "::error::Kubectl get pods -n kagent"
          kubectl describe pods -n kagent
          echo "::error::Kubectl get events -n kagent"
          kubectl get events -n kagent
          echo "::error::Kubectl get Harnesses and AgentTemplates -n kagent"
          kubectl get harnesses,agenttemplates -n kagent
          echo "::error::Kubectl logs -n kagent deployment/kagent-controller"
          kubectl logs -n kagent deployment/kagent-controller
          kubectl get pods,workerpools -A
          echo "::error::Substrate logs"
          kubectl logs -n ate-system -l app --all-containers --prefix --tail=200 || true
          kubectl logs -n ate-system -l app --all-containers --prefix --previous --tail=200 || true
          kubectl logs -n kagent -l ate.dev/worker-pool --all-containers --prefix --tail=200 || true
          kubectl logs -n kagent -l ate.dev/worker-pool --all-containers --prefix --previous --tail=200 || true
          echo "::error::NFS server, CSI driver, nfsd state and kernel messages: the artifact's nfs/"
          cat "$RUNNER_TEMP/e2e-logs/nfs/nfsd.txt" || true
          grep -i -E 'nfs|rpc|lockd|blocked for more than|oom' "$RUNNER_TEMP/e2e-logs/nfs/host.txt" | tail -100 || true

  proto-check:
    name: Protobuf Contract Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      - name: Lint and generate protobuf contracts
        run: make proto-check
      - name: Check protobuf compatibility
        run: make proto-breaking

  semconv-check:
    name: Telemetry Contract Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Cache the contract's upstream sources at their pins
        uses: actions/cache@v6
        with:
          path: telemetry/deps
          key: telemetry-deps-${{ hashFiles('telemetry/versions.env') }}
      - name: Install the pinned Weaver
        # Fork: telemetry/weaver.sh runs a weaver of the pinned version instead
        # of its Docker Hub image, which the shared runner IPs are refused.
        run: |
          source telemetry/versions.env
          archive=weaver-x86_64-unknown-linux-gnu.tar.xz
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/${archive}"
          curl -fsSLO "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          sudo tar -xJf "$archive" --strip-components=1 -C /usr/local/bin "${archive%.tar.xz}/weaver"
          weaver --version
      - name: Check the registry and generated conventions
        run: make semconv-verify

  upgrade-tests:
    needs:
      - setup
    env:
      VERSION: v0.0.1-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # prev-stable: the previous minor line's latest published version,
        #   including a prerelease before GA — runs on every base.
        # adjacent: the same-line latest published version, including prereleases
        #   — only meaningful on a release branch and skipped on main.
        upgrade-from: [adjacent, prev-stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history + tags so the version resolvers can derive the
          # upgrade-from release, and so the local action below is on disk.
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare upgrade test environment
        id: prep
        uses: ./.github/actions/upgrade-test-setup
        with:
          upgrade-from: ${{ matrix.upgrade-from }}
      - name: Run upgrade tests
        if: steps.prep.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: fake
          BUILDX_BUILDER_NAME: ${{ env.BUILDX_BUILDER_NAME }}
          DOCKER_BUILD_ARGS: >-
            --cache-from=type=gha,scope=${{ needs.setup.outputs.cache-key }}-e2e
            --cache-from=type=gha,scope=${{ env.CACHE_KEY_PREFIX }}-main-e2e
            --platform=linux/amd64
            --push
        run: |
          make run-upgrade-tests UPGRADE_FROM_VERSION="${{ steps.prep.outputs.version }}"
      - name: fail print info
        if: failure() && steps.prep.outputs.skip != 'true'
        run: |
          echo "::error::Failed to run upgrade tests"
          kubectl describe pods -n kagent
          kubectl get events -n kagent
          kubectl logs -n kagent deployment/kagent-controller || true

  rolling-upgrade-tests:
    needs:
      - setup
    env:
      VERSION: v0.0.1-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # prev-stable: the previous minor line's latest published version,
        #   including a prerelease before GA — runs on every base.
        # adjacent: the same-line latest published version, including prereleases
        #   — only meaningful on a release branch and skipped on main.
        upgrade-from: [adjacent, prev-stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history + tags so the version resolvers can derive the
          # upgrade-from release, and so the local action below is on disk.
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare upgrade test environment
        id: prep
        uses: ./.github/actions/upgrade-test-setup
        with:
          upgrade-from: ${{ matrix.upgrade-from }}
      - name: Run rolling upgrade tests
        if: steps.prep.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: fake
          BUILDX_BUILDER_NAME: ${{ env.BUILDX_BUILDER_NAME }}
          DOCKER_BUILD_ARGS: >-
            --cache-from=type=gha,scope=${{ needs.setup.outputs.cache-key }}-e2e
            --cache-from=type=gha,scope=${{ env.CACHE_KEY_PREFIX }}-main-e2e
            --platform=linux/amd64
            --push
        run: |
          make run-rolling-upgrade-tests UPGRADE_FROM_VERSION="${{ steps.prep.outputs.version }}"
      - name: fail print info
        if: failure() && steps.prep.outputs.skip != 'true'
        run: |
          echo "::error::Failed to run rolling upgrade tests"
          kubectl describe pods -n kagent
          kubectl get events -n kagent
          kubectl logs -n kagent deployment/kagent-controller || true

  go-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum

      - name: Run Go unit tests
        working-directory: go
        env:
          # Runners are ephemeral, so Ryuk's leaked-container cleanup buys nothing,
          # and its single session-scoped reaper is contended by the parallel package
          # processes of `go test ./...`, intermittently timing out the Postgres tests.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # Fork: the Postgres containers come from Docker Hub through its public cache.
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io
        run: |
          make setup-envtest
          export KUBEBUILDER_ASSETS="$(make -s envtest-path)"
          go test -race -skip 'TestE2E.*' -v ./...

      # Fork: the claude harness splits Claude Code off only when it runs as root,
      # so its root-only tests run again as root, with no capability beyond the
      # CHOWN, SETUID and SETGID the claude translator asks Substrate for.
      - name: Run the claude harness tests as root
        working-directory: go
        run: |
          go test -c -o "$RUNNER_TEMP/claude-adapter.test" ./harness/claude/internal/adapter/
          caps="--bounding-set=-all,+chown,+setuid,+setgid --inh-caps=-all --ambient-caps=-all"
          sudo setpriv $caps -- grep -E '^Cap(Prm|Eff)' /proc/self/status
          sudo setpriv $caps -- "$RUNNER_TEMP/claude-adapter.test" -test.count=1 -test.v

  helm-unit-tests:
    env:
      VERSION: v0.0.1-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.0
      # Install unittest plugin
      - name: Install unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Chart init
        run: |
          make helm-version

      - name: Run helm unit tests
        run: |
          helm unittest helm/kagent
          helm unittest helm/tools/grafana-mcp

  ui-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc

      # Before any cache step that shells out to yarn: the pinned version in
      # ui/package.json "packageManager" is Yarn 4, and without corepack the shim
      # on the runner is a different one that cannot read this lock file.
      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: ui/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('ui/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./ui
        run: yarn install --immutable

      - name: Typecheck
        working-directory: ./ui
        run: yarn typecheck

      - name: Run lint
        working-directory: ./ui
        run: yarn lint

      - name: Run unit tests
        working-directory: ./ui
        run: yarn test

      # Both engines the suite declares. Installing only one leaves that project
      # failing to launch, which reads as a broken app rather than a missing browser.
      - name: Install Playwright browsers
        working-directory: ./ui
        run: yarn playwright install --with-deps chromium firefox

      - name: Run browser tests
        working-directory: ./ui
        run: yarn test:pw

      # What a failed attempt leaves behind: its screenshot and video, and the trace of
      # its retry. The log names the step that timed out; only the trace shows what was
      # on the page under the pointer while it did, and the runner discards it otherwise.
      # Kept whether the job failed or a retry passed: a flaky test leaves the job green
      # and is the case that most needs its trace. A run whose every attempt passed
      # writes nothing here (Playwright's `.last-run.json` is hidden, and hidden files
      # are not uploaded), so it keeps no artifact.
      - name: Keep the browser suite's evidence of a failed attempt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results
          path: ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  # This job builds the Docker images for the controller, UI, ADKs, and CLI on arm64.
  build:
    env:
      VERSION: v0.0.1-test
    strategy:
      matrix:
        # Fork: the images the platform publishes (FORK.md) — the Python ADK,
        # the Codex harness and the CLI image are not offered.
        image:
          - controller
          - ui
          - golang-adk
          - claude-harness
          - codex-harness
          - sandbox-guest
    runs-on: ubuntu-latest
    services:
      registry:
        image: mirror.gcr.io/library/registry:2
        ports:
          - 5001:5000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER_NAME }}
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            network=host
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: ${{ env.BUILDKITD_CONFIG }}
          use: "true"
      - name: Run make build
        env:
          DOCKER_BUILD_ARGS: >-
            --platform=linux/amd64,linux/arm64
            --push
          DOCKER_REPO: "${{ github.repository_owner }}/kagent"
          DOCKER_BUILDER: "docker buildx build"
        run: |
          BUILDX_BUILDER_NAME=$(docker buildx inspect | awk '$1 == "Name:" { print $2; exit }')
          test -n "$BUILDX_BUILDER_NAME"
          export BUILDX_BUILDER_NAME
          make build-${{ matrix.image }}
        working-directory: ./

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      - name: golangci-lint
        working-directory: go
        run: make lint

  python-test:
    env:
      OPENAI_API_KEY: fake
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        working-directory: ./python
        run: uv sync --all-extras

      - name: Generate test certificates
        working-directory: ./python
        run: make generate-test-certs

      - name: Run tests
        working-directory: ./python
        run: make test

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install python
        run: uv python install 3.11

      - name: Verify uv.lock matches pyproject.toml
        working-directory: ./python
        run: uv lock --check

      - name: Sync dependencies
        working-directory: ./python
        run: uv sync --all-extras

      - name: Run ruff linter
        working-directory: ./python
        run: uv run ruff check

      - name: Run ruff format check
        working-directory: ./python
        run: |
          if ! uv run ruff format --diff .; then
            echo "Ruff formatting issues detected. Please run 'uv run ruff format' locally to fix formatting issues."
            exit 1
          fi

  manifests-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum

      - name: Check environment documentation
        run: make env-docs-check

      - name: Generate controller manifests
        run: make controller-manifests

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Controller manifests are out of date!"
            echo "::error::Please run 'make controller-manifests' and commit the changes."
            echo ""
            echo "The following files have differences:"
            git diff --name-only
            echo ""
            echo "Diff details:"
            git diff
            exit 1
          fi
          echo "✓ Controller manifests are up to date"

  # Fork: the one status the ruleset requires. Every job above must succeed; a
  # leg a job skips internally (the upgrade tests on a non-release base) still
  # ends in success, a skipped or failed job does not.
  ci-ok:
    if: always()
    needs:
      - setup
      - test-e2e
      - proto-check
      - upgrade-tests
      - rolling-upgrade-tests
      - go-unit-tests
      - helm-unit-tests
      - ui-tests
      - build
      - go-lint
      - python-test
      - python-lint
      - manifests-check
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null
