name: Scan images

# Fork (giantswarm/kagent-upstream): every image the fork publishes is scanned
# on every push to the consumed branch and the sync candidates, on every pull
# request to the consumed branch and weekly (the schedule runs on the default
# branch, which is the consumed branch); the Go module graph is scanned with
# govulncheck. One `scan-ok` status for the ruleset. See FORK.md.
on:
  # Trigger once a week on the default branch
  schedule:
  - cron: '0 0 * * 0' # Every Monday at midnight UTC

  push:
    branches: [main, "release/**", giantswarm, "sync/**"]
  pull_request:
    branches: [giantswarm]

  workflow_dispatch:

concurrency:
  group: image-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cache key components for better organization
  CACHE_KEY_PREFIX: kagent-v2
  BRANCH_CACHE_KEY: ${{ github.head_ref || github.ref_name }}
  # Consistent builder configuration
  BUILDX_BUILDER_NAME: kagent-builder-v0.23.0
  BUILDX_VERSION: v0.23.0
  # Fork: base images of the builds come from Docker Hub through its public cache.
  BUILDKITD_CONFIG: |
    [registry."docker.io"]
      mirrors = ["mirror.gcr.io"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Fork: the images the platform publishes (FORK.md).
        include:
          - build_target: controller
            image_name: controller
            tag_suffix: ""
          - build_target: ui
            image_name: ui
            tag_suffix: ""
          - build_target: golang-adk
            image_name: golang-adk
            tag_suffix: ""
          - build_target: claude-harness
            image_name: claude-harness
            tag_suffix: ""
          - build_target: codex-harness
            image_name: codex-harness
            tag_suffix: ""
          - build_target: sandbox-guest
            image_name: sandbox-guest
            tag_suffix: ""
    runs-on: ubuntu-latest
    # Fork: Docker Hub images come through mirror.gcr.io, Docker Hub's public
    # cache, so the runner's shared IP never meets the unauthenticated pull limit.
    services:
      registry:
        image: mirror.gcr.io/library/registry:2
        ports:
          - 5001:5000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDX_BUILDER_NAME }}
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            network=host
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: ${{ env.BUILDKITD_CONFIG }}
          use: "true"
      - name: Set version
        id: vars
        run: echo "version=v0.0.0-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Print version
        run: |
          echo "Version: ${{ steps.vars.outputs.version }}"
      - name: Run make build
        env:
          DOCKER_BUILDER: "docker buildx build"
          DOCKER_BUILD_ARGS: >-
            --cache-from=type=gha,scope=${{ env.CACHE_KEY_PREFIX }}-${{ matrix.build_target }}
            --cache-from=type=gha
            --cache-to=type=gha,scope=${{ env.CACHE_KEY_PREFIX }}-${{ matrix.build_target }},mode=max
            --build-arg=VERSION=${{ steps.vars.outputs.version }}
            --push
        run: |
          export VERSION=${{ steps.vars.outputs.version }}
          make build-${{ matrix.build_target }}
        working-directory: ./
      - name: Image vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'
        with:
          image-ref: localhost:5001/kagent-dev/kagent/${{ matrix.image_name }}:${{ steps.vars.outputs.version }}${{ matrix.tag_suffix }}
          ignore-policy: .github/image-scan.rego
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  # Fork: the Go module graph. Upstream ships the target (go/Makefile) without a
  # workflow that runs it.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      - name: Scan the Go module graph
        run: scripts/fork/govulncheck.sh

  # Fork: the one status the ruleset requires.
  scan-ok:
    if: always()
    needs:
      - build
      - govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Every scan succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null
