name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create (v prefix required, e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

# Build the selected workflow ref's commit; create its tag only when publishing the release.
jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve version
      id: version
      env:
        TAG: ${{ inputs.version }}
      run: |
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo '::error::Expected a release tag with a v prefix, such as v0.1.0 or v0.1.0-rc.1.'
          exit 1
        fi
        git check-ref-format "refs/tags/$TAG"
        if git show-ref --verify --quiet "refs/tags/$TAG"; then
          echo "::error::Tag $TAG already exists. Choose a new release version."
          exit 1
        fi
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  push-images:
    needs: setup
    strategy:
      matrix:
        image:
          - controller
          - ui
          - kagent-adk
          - golang-adk
          - claude-harness
          - codex-harness
          - sandbox-guest
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6

    - uses: ./.github/actions/publish-image
      with:
        version: ${{ needs.setup.outputs.version }}
        image: ${{ matrix.image }}
        token: ${{ secrets.GITHUB_TOKEN }}

  push-helm-chart:
    needs:
    - setup
    - push-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6

    - uses: ./.github/actions/publish-helm
      with:
        version: ${{ needs.setup.outputs.version }}
        token: ${{ secrets.GITHUB_TOKEN }}

  release-python-packages:
    needs: setup
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: 'Release Python Packages'
      working-directory: python
      run: |
        uv sync --all-extras
        # Bump every package version to $VERSION first
        uv version $VERSION --package kagent-core
        uv version $VERSION --package kagent-skills
        uv version $VERSION --package kagent-adk
        uv version $VERSION --package kagent-langgraph
        uv version $VERSION --package kagent-crewai
        uv version $VERSION --package kagent-openai
        uv version $VERSION --package agentsts-core
        uv version $VERSION --package agentsts-adk
        # Update intra-repo dependency lower bounds to match the new version.
        # Without this, a user upgrading e.g. kagent-adk via pip/uv could have
        # older intra-repo siblings still locked at a stale version that may be
        # missing symbols the new package requires.
        for pkg in kagent-core kagent-skills agentsts-core agentsts-adk; do
          find packages -name "pyproject.toml" \
            -exec sed -i "s/\"${pkg}>=[^\"]*\"/\"${pkg}>=${VERSION}\"/g" {} +
        done
        # Build all packages
        uv build --package kagent-core
        uv build --package kagent-skills
        uv build --package kagent-adk
        uv build --package kagent-langgraph
        uv build --package kagent-crewai
        uv build --package kagent-openai
        uv build --package agentsts-core
        uv build --package agentsts-adk
        uv publish --token ${{ secrets.PYPI_TOKEN }}

  build-release-artifacts:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: ./.github/actions/build-release-artifacts
      with:
        version: ${{ needs.setup.outputs.version }}
    - uses: actions/upload-artifact@v7
      with:
        name: release-artifacts
        path: |
          go/core/bin/kagent-*
          dist/kagent-*.tgz
        if-no-files-found: error

  release:
    # Create the tag and publish after all packages and release artifacts are ready.
    needs:
    - setup
    - build-release-artifacts
    - push-helm-chart
    - release-python-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: release-artifacts
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.setup.outputs.tag }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        files: |
          go/core/bin/kagent-*
          dist/kagent-*.tgz
