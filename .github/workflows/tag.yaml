name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create (v prefix required, e.g. v0.10.7)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

# Build the dispatched commit of release/v0.10.x and create its tag only when
# publishing the release. Releases from this branch never become GitHub
# "latest", which belongs to the current release line on main.
jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve version
      id: version
      env:
        TAG: ${{ inputs.version }}
      run: |
        if [ "$GITHUB_REF" != "refs/heads/release/v0.10.x" ]; then
          echo "::error::Run this workflow from release/v0.10.x, not $GITHUB_REF."
          exit 1
        fi
        if [[ ! "$TAG" =~ ^v0\.10\.[0-9]+$ ]]; then
          echo '::error::Expected a v0.10.x patch tag with a v prefix, such as v0.10.7.'
          exit 1
        fi
        if git show-ref --verify --quiet "refs/tags/$TAG"; then
          echo "::error::Tag $TAG already exists. Choose a new release version."
          exit 1
        fi
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  push-images:
    needs: setup
    strategy:
      matrix:
        image:
          - controller
          - ui
          - app
          - golang-adk
          - golang-adk-full
          - skills-init
          - acp-sandbox-hermes
          - acp-sandbox-openclaw
          - acp-sandbox-claude
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        name: kagent-builder-v0.23.0
        platforms: linux/amd64,linux/arm64
        version: v0.23.0
        use: 'true'
    - name: 'Build Images'
      env:
        VERSION: ${{ needs.setup.outputs.version }}
        DOCKER_BUILD_ARGS: "--push --platform linux/amd64,linux/arm64"
        DOCKER_BUILDER: "docker buildx build"
        DOCKER_REGISTRY: "ghcr.io" # prod for releases, local for dev
      run: |
        make build-${{ matrix.image }}
  push-helm-chart:
    needs:
    - setup
    - push-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Build Helm Chart'
      env:
        VERSION: ${{ needs.setup.outputs.version }}
      run: |
        make helm-publish
  release-python-packages:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: 'Release Python Packages'
      working-directory: python
      env:
        VERSION: ${{ needs.setup.outputs.version }}
      run: |
        uv sync --all-extras
        # Bump every package version to $VERSION first
        uv version $VERSION --package kagent-core
        uv version $VERSION --package kagent-skills
        uv version $VERSION --package kagent-adk
        uv version $VERSION --package kagent-langgraph
        uv version $VERSION --package kagent-crewai
        uv version $VERSION --package kagent-openai
        uv version $VERSION --package agentsts-core
        uv version $VERSION --package agentsts-adk
        # Update intra-repo dependency lower bounds to match the new version.
        # Without this, a user upgrading e.g. kagent-adk via pip/uv could have
        # older intra-repo siblings still locked at a stale version that may be
        # missing symbols the new package requires.
        for pkg in kagent-core kagent-skills agentsts-core agentsts-adk; do
          find packages -name "pyproject.toml" \
            -exec sed -i "s/\"${pkg}>=[^\"]*\"/\"${pkg}>=${VERSION}\"/g" {} +
        done
        # Build all packages
        uv build --package kagent-core
        uv build --package kagent-skills
        uv build --package kagent-adk
        uv build --package kagent-langgraph
        uv build --package kagent-crewai
        uv build --package kagent-openai
        uv build --package agentsts-core
        uv build --package agentsts-adk
        uv publish --token ${{ secrets.PYPI_TOKEN }}

  release:
    # Only run release after images and helm chart are pushed
    # In the future we can take the chart from the helm action,
    # and build the CLI beforehand.
    needs:
    - setup
    - push-helm-chart
    - release-python-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Build
      env:
        VERSION: ${{ needs.setup.outputs.version }}
      run: |
        make build-cli
        make helm-version
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.setup.outputs.tag }}
        target_commitish: ${{ github.sha }}
        make_latest: false
        generate_release_notes: true
        files: |
          go/core/bin/kagent-*
          kagent-*.tgz
