name: Tag and Push

on:
  push:
    tags:
    - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'

# https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#release
# GITHUB_SHA = Last commit in the tagged release
# GITHUB_REF = Tag ref of release refs/tags/<tag_name>
jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Resolve version
      id: version
      env:
        VERSION: ${{ inputs.version || github.ref_name }}
      run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

  push-images:
    needs: setup
    strategy:
      matrix:
        image:
          - controller
          - ui
          - kagent-adk
          - golang-adk
          - claude-harness
          - codex-harness
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6

    - uses: ./.github/actions/publish-image
      with:
        version: ${{ needs.setup.outputs.version }}
        image: ${{ matrix.image }}
        token: ${{ secrets.GITHUB_TOKEN }}

  push-helm-chart:
    needs:
    - setup
    - push-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6

    - uses: ./.github/actions/publish-helm
      with:
        version: ${{ needs.setup.outputs.version }}
        token: ${{ secrets.GITHUB_TOKEN }}

  release-python-packages:
    needs: setup
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: 'Release Python Packages'
      working-directory: python
      run: |
        uv sync --all-extras
        # Bump every package version to $VERSION first
        uv version $VERSION --package kagent-core
        uv version $VERSION --package kagent-skills
        uv version $VERSION --package kagent-adk
        uv version $VERSION --package kagent-langgraph
        uv version $VERSION --package kagent-crewai
        uv version $VERSION --package kagent-openai
        uv version $VERSION --package agentsts-core
        uv version $VERSION --package agentsts-adk
        # Update intra-repo dependency lower bounds to match the new version.
        # Without this, a user upgrading e.g. kagent-adk via pip/uv could have
        # older intra-repo siblings still locked at a stale version that may be
        # missing symbols the new package requires.
        for pkg in kagent-core kagent-skills agentsts-core agentsts-adk; do
          find packages -name "pyproject.toml" \
            -exec sed -i "s/\"${pkg}>=[^\"]*\"/\"${pkg}>=${VERSION}\"/g" {} +
        done
        # Build all packages
        uv build --package kagent-core
        uv build --package kagent-skills
        uv build --package kagent-adk
        uv build --package kagent-langgraph
        uv build --package kagent-crewai
        uv build --package kagent-openai
        uv build --package agentsts-core
        uv build --package agentsts-adk
        uv publish --token ${{ secrets.PYPI_TOKEN }}

  release:
    # Only run release after images and helm chart are pushed
    # In the future we can take the chart from the helm action,
    # and build the CLI beforehand.
    needs:
    - setup
    - push-helm-chart
    - release-python-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: ./.github/actions/build-release-artifacts
      with:
        version: ${{ needs.setup.outputs.version }}
    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        generate_release_notes: true
        files: |
          go/core/bin/kagent-*
          dist/kagent-*.tgz

  # Tell kagent-dev/website to regenerate the kagent reference docs at this
  # release. That workflow builds from a release tag rather than main, so
  # without this ping the docs only move when someone runs it by hand.
  notify-docs:
    # After `release` on purpose: the docs job looks this release up by tag and
    # resolves the runtime image digests from GHCR, so the release and the
    # images both have to exist before it starts.
    needs:
    - setup
    - release
    # Never fail a release because the docs ping failed. A miss here is
    # recoverable by dispatching the website workflow by hand; a red release is
    # not worth it.
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    # GITHUB_TOKEN is scoped to this repository and cannot dispatch into
    # website, so this mints a short-lived token from a GitHub App installed
    # there. The App needs only Contents: write.
    - name: Mint a token for the website repository
      id: token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: website

    - name: Trigger the reference docs regeneration
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        VERSION: ${{ needs.setup.outputs.version }}
      run: |
        set -euo pipefail
        # The version is sent explicitly rather than letting the docs workflow
        # read "latest release", so a re-run of an older tag regenerates that
        # release instead of whatever is newest.
        gh api --method POST "repos/$OWNER/website/dispatches" --input - <<JSON
        {"event_type": "kagent-release", "client_payload": {"version": "$VERSION"}}
        JSON
        echo "Dispatched kagent-release $VERSION to $OWNER/website"
