name: Setup UI toolchain
description: Node from ui/.nvmrc, Yarn 4 via Corepack, and the Yarn download cache
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ui/.nvmrc
    # Before the cache step: without Corepack the runner's Yarn can't read this lock file.
    - shell: bash
      run: corepack enable
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('ui/yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-
