name: Build release artifacts
description: Build CLI binaries, checksums and versioned Helm chart archives
inputs:
  version:
    description: Version without a v prefix
    required: true
runs:
  using: composite
  steps:
  - name: Build CLI and charts
    shell: bash
    env:
      VERSION: ${{ inputs.version }}
    run: |
      make build-cli
      make helm-version
