name: Publish Helm charts
description: Package and publish the kagent and kagent-crds charts
inputs:
  version:
    description: Version without a v prefix
    required: true
  token:
    description: GitHub token with packages write permission
    required: true
runs:
  using: composite
  steps:
  - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
    with:
      pattern: runtime-image-*
      path: ${{ runner.temp }}/runtime-images
      merge-multiple: true
  - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ inputs.token }}
  - name: Build and push charts
    shell: bash
    env:
      VERSION: ${{ inputs.version }}
    run: make helm-publish RUNTIME_IMAGE_METADATA_DIR="$RUNNER_TEMP/runtime-images"
  - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    with:
      name: release-charts
      path: dist/kagent-*.tgz
      if-no-files-found: error
