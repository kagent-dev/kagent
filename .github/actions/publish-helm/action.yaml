name: Publish Helm charts
description: Package and publish the kagent and kagent-crds charts
inputs:
  version:
    description: Version without a v prefix
    required: true
  token:
    description: GitHub token with packages write permission
    required: true
runs:
  using: composite
  steps:
  - uses: actions/download-artifact@v8
    with:
      pattern: runtime-image-*
      path: ${{ runner.temp }}/runtime-images
      merge-multiple: true
  - uses: docker/login-action@v4
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ inputs.token }}
  - name: Build and push charts
    shell: bash
    env:
      VERSION: ${{ inputs.version }}
    run: make helm-publish RUNTIME_IMAGE_METADATA_DIR="$RUNNER_TEMP/runtime-images"
  - uses: actions/upload-artifact@v7
    with:
      name: release-charts
      path: dist/kagent-*.tgz
      if-no-files-found: error
