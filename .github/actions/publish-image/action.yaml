name: Publish image
description: Build and publish a multi-platform kagent component image
inputs:
  version:
    description: Version without a v prefix
    required: true
  image:
    description: Component image name
    required: true
  token:
    description: GitHub token with packages write permission
    required: true
  extra-tag:
    description: Optional additional image tag
    default: ''
runs:
  using: composite
  steps:
  - uses: docker/login-action@v4
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ inputs.token }}
  - uses: docker/setup-qemu-action@v4
  - uses: docker/setup-buildx-action@v4
    with:
      name: kagent-builder-v0.23.0
      platforms: linux/amd64,linux/arm64
      version: v0.23.0
      use: 'true'
  - name: Build and push image
    shell: bash
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ${{ inputs.image }}
      EXTRA_TAG: ${{ inputs.extra-tag }}
      DOCKER_BUILD_ARGS: '--push --platform linux/amd64,linux/arm64'
      DOCKER_BUILDER: docker buildx build
      DOCKER_REGISTRY: ghcr.io
    run: |
      if [ -n "$EXTRA_TAG" ]; then
        export DOCKER_BUILD_ARGS="$DOCKER_BUILD_ARGS -t ghcr.io/kagent-dev/kagent/$IMAGE:$EXTRA_TAG"
      fi
      make "build-$IMAGE"
