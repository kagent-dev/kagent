name: Publish image
description: Build and publish a multi-platform kagent component image
inputs:
  version:
    description: Version without a v prefix
    required: true
  image:
    description: Component image name
    required: true
  token:
    description: GitHub token with packages write permission
    required: true
runs:
  using: composite
  steps:
  - uses: docker/login-action@v4
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ inputs.token }}
  - uses: docker/setup-qemu-action@v4
  - uses: docker/setup-buildx-action@v4
    with:
      name: kagent-builder-v0.23.0
      platforms: linux/amd64,linux/arm64
      version: v0.23.0
      use: 'true'
  - name: Build and push image
    shell: bash
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ${{ inputs.image }}
      DOCKER_BUILDER: docker buildx build
      DOCKER_REGISTRY: ghcr.io
    run: |
      export DOCKER_BUILD_ARGS="--push --platform linux/amd64,linux/arm64 --metadata-file $RUNNER_TEMP/$IMAGE.json"
      make "build-$IMAGE"
  - uses: actions/upload-artifact@v7
    if: contains(fromJSON('["golang-adk", "claude-harness", "codex-harness"]'), inputs.image)
    with:
      name: runtime-image-${{ inputs.image }}
      path: ${{ runner.temp }}/${{ inputs.image }}.json
      if-no-files-found: error
