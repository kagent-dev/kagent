name: Publish image
description: Build and publish a multi-platform kagent component image
inputs:
  version:
    description: Version without a v prefix
    required: true
  image:
    description: Component image name
    required: true
  token:
    description: GitHub token with packages write permission
    required: true
runs:
  using: composite
  steps:
  - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ inputs.token }}
  - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
  - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    with:
      name: kagent-builder-v0.23.0
      platforms: linux/amd64,linux/arm64
      version: v0.23.0
      use: 'true'
  - name: Build and push image
    shell: bash
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ${{ inputs.image }}
      DOCKER_BUILDER: docker buildx build
      DOCKER_REGISTRY: ghcr.io
    run: |
      export DOCKER_BUILD_ARGS="--push --platform linux/amd64,linux/arm64"
      export RUNTIME_IMAGE_METADATA_DIR="$RUNNER_TEMP"
      make "build-$IMAGE"
  - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    if: contains(fromJSON('["golang-adk", "claude-harness", "codex-harness"]'), inputs.image)
    with:
      name: runtime-image-${{ inputs.image }}
      path: ${{ runner.temp }}/${{ inputs.image }}.json
      if-no-files-found: error
