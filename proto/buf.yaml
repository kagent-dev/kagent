version: v2
modules:
  - path: .
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  ignore:
    - a2a.proto
    - ateapi.proto
    - ateenv/v1alpha/guest.proto
  # An omitted runtime operation means no operation is active.
  ignore_only:
    ENUM_ZERO_VALUE_SUFFIX:
      - kagent/api/v1alpha1/runtime.proto
breaking:
  use:
    - FILE
  ignore_unstable_packages: true
