version: v2
modules:
  - path: .
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  ignore:
    - a2a.proto
    - api/ateapi/v1/ateapi.proto
    - ateenv/v1alpha/guest.proto
breaking:
  use:
    - FILE
  ignore_only:
    # Pre-RC cleanup removes unused Harness status and ADK configuration fields.
    # Remove once the cleanup is present on the comparison branch.
    FIELD_NO_DELETE:
      - kagent/api/v1/harnesses.proto
      - kagent/config/v1/adk.proto
    MESSAGE_NO_DELETE:
      - kagent/config/v1/adk.proto
    # Pre-release cleanup removes obsolete identity reservations.
    # Remove once the cleanup is present on the comparison branch.
    RESERVED_MESSAGE_NO_DELETE:
      - kagent/runtime/v1/memory.proto
      - kagent/api/v1/sessions.proto
      - kagent/api/v1/agent_templates.proto
    # Substrate v0.7.0-alpha1 renames the inventory types to substrate.ateapi.v1
    # without changing their wire shape. Remove after the upgrade reaches main.
    FIELD_SAME_TYPE:
      - kagent/api/v1/system.proto
      # Pre-release Session.agent records immutable Agent provenance.
      # Remove once the provenance contract is on the comparison branch.
      - kagent/api/v1/sessions.proto
  # Vendored Substrate APIs follow go.mod, including the v1 schema relocation.
  ignore:
    - ateapi.proto
    - api/ateapi/v1/ateapi.proto
  ignore_unstable_packages: true
