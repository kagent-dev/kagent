syntax = "proto3";

package kagent.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1;apiv1";

// Kubernetes-owned automation. Each occurrence creates a fresh Session using
// the scheduler's principal; task state and history belong to upstream A2A.
service ScheduledRunService {
  rpc CreateScheduledRun(CreateScheduledRunRequest) returns (CreateScheduledRunResponse);
  rpc GetScheduledRun(GetScheduledRunRequest) returns (GetScheduledRunResponse);
  rpc ListScheduledRuns(ListScheduledRunsRequest) returns (ListScheduledRunsResponse);
  rpc UpdateScheduledRun(UpdateScheduledRunRequest) returns (UpdateScheduledRunResponse);
  rpc DeleteScheduledRun(DeleteScheduledRunRequest) returns (DeleteScheduledRunResponse);
  rpc TriggerScheduledRun(TriggerScheduledRunRequest) returns (TriggerScheduledRunResponse);
  rpc GetScheduledRunExecution(GetScheduledRunExecutionRequest) returns (GetScheduledRunExecutionResponse);
  rpc ListScheduledRunExecutions(ListScheduledRunExecutionsRequest) returns (ListScheduledRunExecutionsResponse);
}

// Kubernetes ScheduledRun resource, including metadata, spec, and status.
message ScheduledRun {
  ResourceReference ref = 1;
  StructuredObject resource = 2;
}

message CreateScheduledRunRequest {
  ResourceReference ref = 1 [(buf.validate.field).required = true];
  StructuredObject resource = 2 [(buf.validate.field).required = true];
}
message CreateScheduledRunResponse {
  ScheduledRun scheduled_run = 1;
}
message GetScheduledRunRequest {
  ResourceReference ref = 1 [(buf.validate.field).required = true];
}
message GetScheduledRunResponse {
  ScheduledRun scheduled_run = 1;
}
message ListScheduledRunsRequest {
  PageRequest page = 1;
  string namespace = 2 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {
      max_len: 63
      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
    }
  }];
}
message ListScheduledRunsResponse {
  repeated ScheduledRun scheduled_runs = 1;
  PageResponse page = 2;
}
message UpdateScheduledRunRequest {
  ResourceReference ref = 1 [(buf.validate.field).required = true];
  // metadata.resourceVersion is required and is passed unchanged to Kubernetes.
  StructuredObject resource = 2 [(buf.validate.field).required = true];
}
message UpdateScheduledRunResponse {
  ScheduledRun scheduled_run = 1;
}
message DeleteScheduledRunRequest {
  ResourceReference ref = 1 [(buf.validate.field).required = true];
  string uid = 2 [(buf.validate.field).string.uuid = true];
  string resource_version = 3 [(buf.validate.field).string.min_len = 1];
}
message DeleteScheduledRunResponse {}
message TriggerScheduledRunRequest {
  // Kubernetes UID; a reconciled projection is required before triggering.
  string scheduled_run_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}
message TriggerScheduledRunResponse {
  ScheduledRunExecution execution = 1;
}

// Summary of the initial scheduled invocation, independent of session lifecycle.
// A2A remains authoritative for task state, interaction, and transcripts.
enum ScheduledRunExecutionState {
  SCHEDULED_RUN_EXECUTION_STATE_UNSPECIFIED = 0;
  SCHEDULED_RUN_EXECUTION_STATE_PENDING = 1;
  SCHEDULED_RUN_EXECUTION_STATE_RUNNING = 2;
  SCHEDULED_RUN_EXECUTION_STATE_SUCCEEDED = 3;
  SCHEDULED_RUN_EXECUTION_STATE_FAILED = 4;
  SCHEDULED_RUN_EXECUTION_STATE_TIMED_OUT = 5;
}

// One accepted firing. Its identity and immutable inputs survive session deletion.
message ScheduledRunExecution {
  string id = 1;
  // Scheduler principal, independent of runtime identity or manual initiator.
  string creator = 2;
  string scheduled_run_id = 3;
  oneof trigger {
    google.protobuf.Timestamp scheduled_time = 4;
    string manual_request_id = 5;
  }
  string prompt = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp deadline = 8;
  // Reserved atomically when the execution is accepted. Retained after deletion;
  // it is a historical reference and does not imply that the session still exists.
  string session_id = 9;
  ScheduledRunExecutionState state = 10;
  // Original A2A task; never changes when a user continues the conversation.
  string task_id = 11;
  google.protobuf.Timestamp completed_at = 12;
  // Stable explanation of failure. Runtime diagnostics remain in A2A/telemetry.
  string failure_reason = 13;
  // Immutable accepted inputs and provenance. These survive resource deletion.
  ResourceReference scheduled_run = 14;
  int64 scheduled_run_generation = 15;
  // Revision pinned when this occurrence was accepted.
  string runtime_revision = 16;
  string initiator = 18;
}

message GetScheduledRunExecutionRequest {
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetScheduledRunExecutionResponse {
  ScheduledRunExecution execution = 1;
}
message ListScheduledRunExecutionsRequest {
  string scheduled_run_id = 1 [(buf.validate.field).string.uuid = true];
  PageRequest page = 2;
}
message ListScheduledRunExecutionsResponse {
  repeated ScheduledRunExecution executions = 1;
  PageResponse page = 2;
}
