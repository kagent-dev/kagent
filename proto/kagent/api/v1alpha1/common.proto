syntax = "proto3";

package kagent.api.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

message StructuredObject {
  string api_version = 1;
  string kind = 2;
  google.protobuf.Struct value = 3;
}

message ResourceReference {
  string namespace = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
  }];
}

message PageRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 2;
  // Where to start, for a list a reader pages by number rather than by walking.
  // A sorted list cannot offer a keyset cursor over columns chosen at call time, so
  // the ones that take a sort take this instead. Ignored when `page_token` is set.
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message PageResponse {
  string next_page_token = 1;
}

// Which way a sorted list runs. Unspecified is ascending, so a caller that names a
// field and nothing else gets the obvious order rather than an error.
enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}
