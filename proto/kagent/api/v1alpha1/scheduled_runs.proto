syntax = "proto3";

package kagent.api.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1alpha1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

// Creator-owned automation stored in PostgreSQL. Each occurrence creates a fresh
// AgentInstance; Task state and history belong to upstream A2A.
service ScheduledRunService {
  rpc CreateScheduledRun(CreateScheduledRunRequest) returns (CreateScheduledRunResponse);
  rpc GetScheduledRun(GetScheduledRunRequest) returns (GetScheduledRunResponse);
  rpc ListScheduledRuns(ListScheduledRunsRequest) returns (ListScheduledRunsResponse);
  rpc UpdateScheduledRun(UpdateScheduledRunRequest) returns (UpdateScheduledRunResponse);
  rpc DeleteScheduledRun(DeleteScheduledRunRequest) returns (DeleteScheduledRunResponse);
  rpc TriggerScheduledRun(TriggerScheduledRunRequest) returns (TriggerScheduledRunResponse);
  rpc GetScheduledRunExecution(GetScheduledRunExecutionRequest) returns (GetScheduledRunExecutionResponse);
  rpc ListScheduledRunExecutions(ListScheduledRunExecutionsRequest) returns (ListScheduledRunExecutionsResponse);
}

// Mutable configuration. Changes affect only subsequently reserved executions.
message ScheduledRunConfig {
  string name = 1 [(buf.validate.field).string.max_len = 200];
  string schedule = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // An omitted time zone defaults to UTC.
  string time_zone = 3 [(buf.validate.field).string.max_len = 253];
  string prompt = 4 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 32768
    pattern: "\\S"
  }];
  bool paused = 5;
  // Omitted means 15 minutes. Includes queueing and provisioning. Minimum one
  // microsecond matches PostgreSQL timestamp precision.
  google.protobuf.Duration execution_timeout = 6 [(buf.validate.field).duration = {
    gte: {nanos: 1000}
    lte: {
      seconds: 9223372036
      nanos: 0
    }
  }];
}

message ScheduledRun {
  string id = 1;
  // Human owner; this does not select credentials for execution or tool calls.
  string creator = 2;
  ResourceReference harness = 3;
  ResourceReference agent_template = 4;
  ScheduledRunConfig config = 5;
  string etag = 6;
  google.protobuf.Timestamp next_execution_time = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Deleted schedules retain identity and history but accept no new executions.
  google.protobuf.Timestamp deleted_at = 10;
}

message CreateScheduledRunRequest {
  option (buf.validate.message).cel = {
    id: "same_target_namespace"
    message: "Harness and AgentTemplate must be in the same namespace"
    expression: "this.harness.namespace == this.agent_template.namespace"
  };
  ResourceReference harness = 1 [(buf.validate.field).required = true];
  ResourceReference agent_template = 2 [(buf.validate.field).required = true];
  string request_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ScheduledRunConfig config = 4 [(buf.validate.field).required = true];
}
message CreateScheduledRunResponse {
  ScheduledRun scheduled_run = 1;
}
message GetScheduledRunRequest {
  string scheduled_run_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetScheduledRunResponse {
  ScheduledRun scheduled_run = 1;
}
message ListScheduledRunsRequest {
  PageRequest page = 1;
}
message ListScheduledRunsResponse {
  repeated ScheduledRun scheduled_runs = 1;
  PageResponse page = 2;
}
message UpdateScheduledRunRequest {
  string scheduled_run_id = 1 [(buf.validate.field).string.uuid = true];
  string etag = 2 [(buf.validate.field).string.uuid = true];
  ScheduledRunConfig config = 3 [(buf.validate.field).required = true];
}
message UpdateScheduledRunResponse {
  ScheduledRun scheduled_run = 1;
}
message DeleteScheduledRunRequest {
  string scheduled_run_id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteScheduledRunResponse {
  ScheduledRun scheduled_run = 1;
}
message TriggerScheduledRunRequest {
  string scheduled_run_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}
message TriggerScheduledRunResponse {
  ScheduledRunExecution execution = 1;
}

// Summary of the initial scheduled invocation, independent of instance lifecycle.
// A2A remains authoritative for task state, interaction, and transcripts.
enum ScheduledRunExecutionState {
  SCHEDULED_RUN_EXECUTION_STATE_UNSPECIFIED = 0;
  SCHEDULED_RUN_EXECUTION_STATE_PENDING = 1;
  SCHEDULED_RUN_EXECUTION_STATE_RUNNING = 2;
  SCHEDULED_RUN_EXECUTION_STATE_SUCCEEDED = 3;
  SCHEDULED_RUN_EXECUTION_STATE_FAILED = 4;
  SCHEDULED_RUN_EXECUTION_STATE_TIMED_OUT = 5;
}

// One accepted firing. Its identity and immutable inputs survive instance deletion.
message ScheduledRunExecution {
  string id = 1;
  // Human owner inherited from the schedule, independent of runtime identity.
  string creator = 2;
  string scheduled_run_id = 3;
  oneof trigger {
    google.protobuf.Timestamp scheduled_time = 4;
    string manual_request_id = 5;
  }
  string prompt = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp deadline = 8;
  // Empty until an instance is reserved. Retained after that instance is deleted;
  // it is a historical reference and does not imply that the instance still exists.
  string agent_instance_id = 9;
  ScheduledRunExecutionState state = 10;
  // Original A2A task; never changes when a user continues the conversation.
  string task_id = 11;
  google.protobuf.Timestamp completed_at = 12;
  // Stable explanation of failure. Runtime diagnostics remain in A2A/telemetry.
  string failure_reason = 13;
}

message GetScheduledRunExecutionRequest {
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetScheduledRunExecutionResponse {
  ScheduledRunExecution execution = 1;
}
message ListScheduledRunExecutionsRequest {
  string scheduled_run_id = 1 [(buf.validate.field).string.uuid = true];
  PageRequest page = 2;
}
message ListScheduledRunExecutionsResponse {
  repeated ScheduledRunExecution executions = 1;
  PageResponse page = 2;
}
