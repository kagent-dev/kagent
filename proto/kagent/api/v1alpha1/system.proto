syntax = "proto3";

package kagent.api.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1alpha1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

service SystemService {
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  // Every actor and worker in one message, which a large cluster cannot fit: at
  // 410,110 actors the response is roughly 43MB against gRPC's 16MB ceiling, so the
  // call fails outright rather than returning a truncated inventory. Anything that
  // renders the inventory wants GetSubstrateSummary and the two list calls below.
  //
  // Deliberately not marked deprecated. It is still the only way to ask for the whole
  // inventory in one answer, which is what a caller looking one actor up by id has to
  // do — paging to find a row it can already name would be the slower way round.
  rpc GetSubstrateStatus(GetSubstrateStatusRequest) returns (GetSubstrateStatusResponse);

  rpc GetSubstrateSummary(GetSubstrateSummaryRequest) returns (GetSubstrateSummaryResponse);
  rpc ListSubstrateActors(ListSubstrateActorsRequest) returns (ListSubstrateActorsResponse);
  rpc ListSubstrateWorkers(ListSubstrateWorkersRequest) returns (ListSubstrateWorkersResponse);
}

message GetVersionRequest {}

message GetVersionResponse {
  string kagent_version = 1;
  string git_commit = 2;
  string build_date = 3;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  google.protobuf.Struct claims = 1;
}

message ListNamespacesRequest {}

message Namespace {
  string name = 1;
  string status = 2;
}

message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
}

message GetSubstrateStatusRequest {
  string namespace = 1;
}

message GetSubstrateStatusResponse {
  bool enabled = 1;
  string ate_api_error = 2;
  repeated SubstrateWorkerPool worker_pools = 3;
  repeated SubstrateActorTemplate actor_templates = 4;
  repeated SubstrateActor actors = 5;
  repeated SubstrateWorker workers = 6;
}

message SubstrateWorkerPool {
  string namespace = 1;
  string name = 2;
  int32 replicas = 3;
  string ateom_image = 4;
}

message SubstrateActorTemplate {
  string namespace = 1;
  string name = 2;
  string phase = 3;
  string golden_actor_id = 4;
  string golden_snapshot = 5;
  string sandbox_class = 6;
  string worker_selector = 7;
  string harness_name = 8;
  bool managed_by_kagent = 9;
}

message SubstrateActor {
  string actor_id = 1;
  string atespace = 2;
  string status = 3;
  string actor_template_namespace = 4;
  string actor_template_name = 5;
  string ateom_pod_namespace = 6;
  string ateom_pod_name = 7;
  string ateom_pod_ip = 8;
  string latest_snapshot = 9;
  string worker_pool_name = 10;
  string in_progress_snapshot = 11;
  int64 version = 12;
}

message SubstrateWorker {
  string worker_namespace = 1;
  string worker_pool = 2;
  string worker_pod = 3;
  string actor_namespace = 4;
  string actor_template = 5;
  string actor_id = 6;
  string ip = 7;
  int64 version = 8;
}

// The inventory as counts, plus the two lists whose length is set by configuration
// rather than by the cluster.
//
// This is the only place a *total* comes from. The actor and worker calls below
// answer with a page, and a page's length is not a total: counting the rows on
// screen and labelling the result "Actors" reports 100 for a cluster running four
// hundred thousand.
//
// Producing these counts costs a walk of every ate-api page, because ate-api
// reports no totals of its own — ListActorsResponse is a page plus a token. The
// walk stays on the server and only the counts cross the wire, so this call has no
// message-size ceiling. It is not free, though: a caller polling it at the rate it
// polls a page will spend most of its time here.
message GetSubstrateSummaryRequest {
  string namespace = 1;
}

message SubstrateActorStatusCount {
  string status = 1;
  int64 count = 2;
}

message GetSubstrateSummaryResponse {
  // False when the controller has no ate-api endpoint configured.
  //
  // A deployment choice rather than a failure, and the answer stops there: every other
  // field is left empty, because all of them describe a substrate that is not running.
  // Show it as a configuration note, not as an error and not as an empty cluster.
  bool enabled = 1;
  // Set when one of the three ate-api reads behind this answer failed.
  //
  // They do not gate each other: a failed template listing still leaves the actors and
  // the workers counted, and a walk that dies partway keeps what it had tallied. So the
  // figures here may be short while the Kubernetes-derived lists are complete — a
  // warning to show beside the data rather than an error to fail the call with.
  //
  // Never a database failure. Those are internal errors, because reporting a
  // control-plane outage as "ate-api answered with an error" sends an operator to fix
  // a healthy component.
  string ate_api_error = 2;
  repeated SubstrateWorkerPool worker_pools = 3;
  repeated SubstrateActorTemplate actor_templates = 4;
  int64 actor_count = 5;
  int64 worker_count = 6;
  int64 running_actor_count = 7;
  // A worker is busy when an actor is bound to it.
  int64 busy_worker_count = 8;
  // Every actor status present, with how many hold it. The whole distribution
  // rather than the running count alone: knowing 12 of 410,110 are running says
  // nothing about the other 410,098.
  repeated SubstrateActorStatusCount actor_status_counts = 9;
  // When this answer was computed, which is not when it was received.
  google.protobuf.Timestamp computed_at = 10;
}

// Which way a sorted substrate read runs.
enum SubstrateSortOrder {
  SUBSTRATE_SORT_ORDER_UNSPECIFIED = 0;
  SUBSTRATE_SORT_ORDER_ASC = 1;
  SUBSTRATE_SORT_ORDER_DESC = 2;
}

// The columns ListSubstrateActors can order by.
//
// Every one of them ends in the actor id, which is unique. An order whose last key
// repeats gives a page boundary that names more than one row, and paging across it
// drops or repeats whatever shares the key.
enum SubstrateActorSortField {
  // Status, then actor id. What a reader gets without asking.
  SUBSTRATE_ACTOR_SORT_FIELD_UNSPECIFIED = 0;
  SUBSTRATE_ACTOR_SORT_FIELD_STATUS = 1;
  SUBSTRATE_ACTOR_SORT_FIELD_ACTOR_ID = 2;
  SUBSTRATE_ACTOR_SORT_FIELD_TEMPLATE = 3;
  SUBSTRATE_ACTOR_SORT_FIELD_WORKER_POD = 4;
}

// The columns ListSubstrateWorkers can order by, each ending in the worker's
// namespace and pod, which together are unique.
enum SubstrateWorkerSortField {
  // Pool, then pod.
  SUBSTRATE_WORKER_SORT_FIELD_UNSPECIFIED = 0;
  SUBSTRATE_WORKER_SORT_FIELD_POOL = 1;
  SUBSTRATE_WORKER_SORT_FIELD_POD = 2;
  SUBSTRATE_WORKER_SORT_FIELD_IP = 3;
}

// One page of actors, ordered and narrowed across the whole inventory.
//
// ate-api offers paging and nothing else, so the controller reads every one of its
// pages, applies the filter and the order, and answers with the slice asked for. That
// costs a walk of the inventory per request — seconds on a large cluster — and it is
// what makes the order and the filter mean the cluster rather than the hundred rows a
// reader happens to be looking at.
message ListSubstrateActorsRequest {
  // Empty means every namespace the controller observes.
  string namespace = 1;
  // The shared page request, as every other paged read on this API takes it: `limit`
  // is the most rows to answer with, capped at 100 there rather than here, and zero
  // means the server's default. Above the cap is refused rather than clamped, so a
  // caller learns its page size was not honoured.
  PageRequest page = 2;
  // Matched case-insensitively, as a substring, against the fields a row shows: id,
  // status, template and worker pod. Empty matches everything. Applied before the page
  // is cut, so a match on the ninth page is still found.
  string filter = 3 [(buf.validate.field).string.max_len = 200];
  SubstrateActorSortField sort_field = 4 [(buf.validate.field).enum.defined_only = true];
  SubstrateSortOrder sort_order = 5 [(buf.validate.field).enum.defined_only = true];
}

message ListSubstrateActorsResponse {
  bool enabled = 1;
  string ate_api_error = 2;
  // Never more than page_size, and possibly fewer while still not being the last
  // page: rows outside the requested namespace are dropped after ate-api has counted
  // them into its page. next_page_token, not the row count, is what says there is more.
  repeated SubstrateActor actors = 3;
  // Empty next_page_token on the last page.
  PageResponse page = 4;
  google.protobuf.Timestamp computed_at = 5;
  // How many actors match the filter across every page.
  //
  // What makes "20 of 4,312" sayable. Without it a page can only report its own
  // length, which reads as the whole result.
  int64 total_size = 6;
  // The order actually applied, reported rather than assumed.
  //
  // A client that drew its own control's state would still claim "sorted by status"
  // after sending an order the server did not honour.
  SubstrateActorSortField applied_sort_field = 7;
  SubstrateSortOrder applied_sort_order = 8;
}

// One page of worker assignments. The mirror of ListSubstrateActors.
message ListSubstrateWorkersRequest {
  string namespace = 1;
  PageRequest page = 2;
  // Matched against the namespace, pool, pod and IP a row shows.
  string filter = 3 [(buf.validate.field).string.max_len = 200];
  SubstrateWorkerSortField sort_field = 4 [(buf.validate.field).enum.defined_only = true];
  SubstrateSortOrder sort_order = 5 [(buf.validate.field).enum.defined_only = true];
}

message ListSubstrateWorkersResponse {
  bool enabled = 1;
  string ate_api_error = 2;
  repeated SubstrateWorker workers = 3;
  PageResponse page = 4;
  google.protobuf.Timestamp computed_at = 5;
  int64 total_size = 6;
  SubstrateWorkerSortField applied_sort_field = 7;
  SubstrateSortOrder applied_sort_order = 8;
}
