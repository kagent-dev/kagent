syntax = "proto3";

package kagent.api.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

// CLIConfig is local CLI configuration. The executable selects this message;
// files have no kind or version envelope. Explicit flags override file values.
message CLIConfig {
  ConnectionConfig connection = 1;
  OutputConfig output = 2;
  LoggingConfig logging = 3;
  InstallConfig install = 4;
  DatabaseConfig database = 5;
}

message ConnectionConfig {
  optional string api_url = 1 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://[^/?#]+"
  }];
  optional string gateway_url = 2 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://[^/?#]+"
  }];
  optional string namespace = 3 [(buf.validate.field).string.min_len = 1];
  optional string user_id = 4 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^\\S+$"
  }];
  google.protobuf.Duration timeout = 5 [(buf.validate.field).duration = {
    gte: {}
    lte: {seconds: 9223372036}
  }];
  string ca_file = 6;
  string server_name = 7;
  bool verbose = 8;
}

message OutputConfig {
  optional string format = 1 [
    (buf.validate.field).string.in = "table",
    (buf.validate.field).string.in = "json",
    (buf.validate.field).string.in = "yaml"
  ];
}

message LoggingConfig {
  optional string level = 1 [(buf.validate.field).string = {
    in: [
      "debug",
      "info",
      "warn",
      "error"
    ]
  }];
}

message InstallConfig {
  optional string default_model_provider = 1 [(buf.validate.field).string = {
    in: [
      "OpenAI",
      "Anthropic",
      "AzureOpenAI",
      "Ollama",
      "Gemini",
      "GeminiVertexAI",
      "AnthropicVertexAI",
      "Bedrock"
    ]
  }];
  ChartConfig kagent = 2;
  ChartConfig substrate = 3;
  ChartConfig pod_certificate = 4;
  optional string bundled_postgres_image = 5 [(buf.validate.field).string.min_len = 1];
}

message ChartConfig {
  optional string repository = 1 [(buf.validate.field).string.min_len = 1];
  optional string version = 2 [(buf.validate.field).string.min_len = 1];
  repeated string values_files = 3 [(buf.validate.field).repeated.items.string.min_len = 1];
}

// ControllerConfig configures one controller process. Runtime defaults are
// compiled into the existing harness Go/JSON contracts, not protobuf payloads.
message ControllerConfig {
  option (buf.validate.message).cel = {
    id: "controller.database_url"
    message: "database.url_file is required"
    expression: "has(this.database) && this.database.url_file != ''"
  };
  KubernetesConfig kubernetes = 1;
  ControllerServerConfig server = 2;
  DatabaseConfig database = 3 [(buf.validate.field).required = true];
  SubstrateConfig substrate = 4;
  SessionsConfig sessions = 5;
  GatewayConfig gateway = 6;
  SandboxConfig sandboxes = 7;
  ScheduledRunsConfig scheduled_runs = 8;
  RuntimeRevisionsConfig runtime_revisions = 9;
  MetricsConfig metrics = 10;
  LoggingConfig logging = 11;
  TelemetryConfig telemetry = 12;
  RuntimeDefaultsConfig runtime_defaults = 13;
}

message KubernetesConfig {
  optional string namespace = 1 [(buf.validate.field).string.min_len = 1];
  repeated string watch_namespaces = 2 [(buf.validate.field).repeated.items.string.min_len = 1];
  optional bool leader_election = 3;
}

message ControllerServerConfig {
  optional string bind_address = 1 [(buf.validate.field).string.min_len = 1];
  bool grpc_reflection = 2;
  AuthenticationConfig auth = 3;
}

message AuthenticationConfig {
  optional string mode = 1 [(buf.validate.field).string = {
    in: [
      "insecure",
      "trusted-proxy"
    ]
  }];
  string user_id_claim = 2;
}

// DatabaseConfig references a local secret file. The CLI requires the file only
// for commands which connect to PostgreSQL; the controller always requires it.
message DatabaseConfig {
  string url_file = 1;
  string role = 2;
  bool vector_enabled = 3;
  // Skip applying migrations at controller startup. The controller still verifies
  // that all required migrations are applied and fails to start if any are missing.
  bool skip_migrations = 4;
  PostgresPoolConfig pool = 5;
  optional string schema = 6 [(buf.validate.field).string = {
    pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
    max_len: 63
  }];
  optional string vector_schema = 7 [(buf.validate.field).string = {
    pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
    max_len: 63
  }];
}

message PostgresPoolConfig {
  option (buf.validate.message).cel = {
    id: "postgres_pool.bounds"
    message: "min_conns must not exceed max_conns"
    expression: "!has(this.min_conns) || !has(this.max_conns) || this.min_conns <= this.max_conns"
  };
  optional int32 min_conns = 1 [(buf.validate.field).int32.gte = 0];
  optional int32 max_conns = 2 [(buf.validate.field).int32.gt = 0];
  google.protobuf.Duration max_conn_idle_time = 3 [(buf.validate.field).duration = {
    gt: {}
    lte: {seconds: 9223372036}
  }];
  google.protobuf.Duration max_conn_lifetime = 4 [(buf.validate.field).duration = {
    gt: {}
    lte: {seconds: 9223372036}
  }];
}

message SubstrateConfig {
  optional string api_endpoint = 1 [(buf.validate.field).string.min_len = 1];
  string ca_file = 2;
  string client_cert_file = 3;
  optional string router_url = 4 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://[^/?#]+"
  }];
}

message SessionsConfig {
  // Zero disables idle expiration.
  google.protobuf.Duration idle_ttl = 1 [(buf.validate.field).duration = {
    gte: {}
    lte: {seconds: 9223372036}
  }];
  // Zero leaves session shares unbounded.
  google.protobuf.Duration share_max_ttl = 2 [(buf.validate.field).duration = {
    gte: {}
    lte: {seconds: 9223372036}
  }];
  google.protobuf.Duration expiration_interval = 3 [(buf.validate.field).duration = {
    gt: {}
    lte: {seconds: 9223372036}
  }];
  google.protobuf.Duration quiescence_recovery_interval = 4 [(buf.validate.field).duration = {
    gt: {}
    lte: {seconds: 9223372036}
  }];
}

message GatewayConfig {
  optional string public_url = 1 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://[^/?#]+"
  }];
  PushConfig push = 2;
}

message PushConfig {
  // Optional unencrypted PKCS#8 Ed25519 PEM key. Empty disables JWT signing.
  string signing_private_key_file = 1;
  optional string issuer = 2 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://[^/?#]+"
  }];
  bool allow_http = 3;
  bool allow_private_networks = 4;
}

message SandboxConfig {
  option (buf.validate.message).cel = {
    id: "sandbox.ttl_bounds"
    message: "default_ttl must not exceed max_ttl"
    expression: "!has(this.default_ttl) || !has(this.max_ttl) || this.default_ttl <= this.max_ttl"
  };
  string guest_image = 1;
  optional string cpu = 2 [(buf.validate.field).string.min_len = 1];
  optional string memory = 3 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Duration default_ttl = 4 [(buf.validate.field).duration = {
    gt: {}
    lte: {seconds: 9223372036}
  }];
  google.protobuf.Duration max_ttl = 5 [(buf.validate.field).duration = {
    gt: {}
    lte: {seconds: 86400}
  }];
  google.protobuf.Duration expiration_interval = 6 [(buf.validate.field).duration = {
    gt: {}
    lte: {seconds: 9223372036}
  }];
}

message ScheduledRunsConfig {
  google.protobuf.Duration poll_interval = 1 [(buf.validate.field).duration = {
    gt: {}
    lte: {seconds: 9223372036}
  }];
  google.protobuf.Duration execution_interval = 2 [(buf.validate.field).duration = {
    gt: {}
    lte: {seconds: 9223372036}
  }];
}

message RuntimeRevisionsConfig {
  google.protobuf.Duration gc_interval = 1 [(buf.validate.field).duration = {
    gt: {}
    lte: {seconds: 9223372036}
  }];
}

message MetricsConfig {
  // "0" disables the listener.
  optional string bind_address = 1 [(buf.validate.field).string.min_len = 1];
  bool secure = 2;
}

// TelemetryConfig supplies defaults for this process. Standard OTEL_*
// environment settings override them locally; controller overrides do not
// affect runtime_defaults. An absent signal is off unless env enables it.
message TelemetryConfig {
  OTLPConfig traces = 1;
  OTLPConfig metrics = 2;
  OTLPConfig logs = 3;
  map<string, string> resource_attributes = 4;
  bool capture_content = 5;
  bool capture_raw_api_bodies = 6;
  optional int32 max_capture_bytes = 7 [(buf.validate.field).int32 = {
    gt: 0
    lte: 65536
  }];
  bool openai_native_tracing = 8;
}

message OTLPConfig {
  string endpoint = 1 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://[^/?#]+"
  }];
  optional string protocol = 2 [(buf.validate.field).string = {
    in: [
      "grpc",
      "http/protobuf"
    ]
  }];
  google.protobuf.Duration timeout = 3 [(buf.validate.field).duration = {
    gte: {nanos: 1000000}
    lte: {seconds: 86400}
  }];
}

message RuntimeDefaultsConfig {
  optional string control_plane_url = 1 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://[^/?#]+"
  }];
  optional string gateway_url = 2 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://[^/?#]+"
  }];
  LoggingConfig logging = 3;
  TelemetryConfig telemetry = 4 [(buf.validate.field).cel = {
    id: "runtime_defaults.telemetry.service_identity"
    message: "runtime telemetry resource_attributes must not override compiled service.name or service.namespace"
    expression: "!('service.name' in this.resource_attributes) && !('service.namespace' in this.resource_attributes)"
  }];
  optional int64 max_content_length = 5 [(buf.validate.field).int64.gte = 0];
  TokenPropagationConfig token_propagation = 6;
  bool file_search_tools = 7;
  string bash_venv_path = 8;
}

message TokenPropagationConfig {
  bool enabled = 1;
  optional string sts_well_known_uri = 2 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://[^/?#]+"
  }];
  repeated string resources = 3 [(buf.validate.field).repeated.items.string = {
    min_len: 1
    pattern: "^\\S(?:.*\\S)?$"
  }];
  repeated string audiences = 4 [(buf.validate.field).repeated.items.string = {
    min_len: 1
    pattern: "^\\S(?:.*\\S)?$"
  }];
}
