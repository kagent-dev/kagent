syntax = "proto3";

package kagent.api.v1alpha1;

import "kagent/api/v1alpha1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

service AgentService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetSandboxAgent(GetSandboxAgentRequest) returns (GetSandboxAgentResponse);
  rpc CreateSandboxAgent(CreateSandboxAgentRequest) returns (CreateSandboxAgentResponse);
  rpc UpdateSandboxAgent(UpdateSandboxAgentRequest) returns (UpdateSandboxAgentResponse);
  rpc DeleteSandboxAgent(DeleteSandboxAgentRequest) returns (DeleteSandboxAgentResponse);
  rpc GetAgentHarness(GetAgentHarnessRequest) returns (GetAgentHarnessResponse);
  rpc CreateAgentHarness(CreateAgentHarnessRequest) returns (CreateAgentHarnessResponse);
  rpc DeleteAgentHarness(DeleteAgentHarnessRequest) returns (DeleteAgentHarnessResponse);
  rpc EnsureAgentHarnessSessionActor(EnsureAgentHarnessSessionActorRequest) returns (EnsureAgentHarnessSessionActorResponse);
  rpc SuspendAgentHarnessSessionActor(SuspendAgentHarnessSessionActorRequest) returns (SuspendAgentHarnessSessionActorResponse);
  rpc GetAgentHarnessSessionActor(GetAgentHarnessSessionActorRequest) returns (GetAgentHarnessSessionActorResponse);
}

enum AgentKind {
  AGENT_KIND_UNSPECIFIED = 0;
  reserved 1;
  AGENT_KIND_SANDBOX_AGENT = 2;
  AGENT_KIND_AGENT_HARNESS = 3;
}

enum AgentHarnessActorState {
  AGENT_HARNESS_ACTOR_STATE_UNSPECIFIED = 0;
  AGENT_HARNESS_ACTOR_STATE_RUNNING = 1;
  AGENT_HARNESS_ACTOR_STATE_SUSPENDED = 2;
  AGENT_HARNESS_ACTOR_STATE_MISSING = 3;
}

message AgentHarnessDetails {
  string backend = 1;
  string actor_id = 2;
  string backend_ref_id = 3;
  string endpoint = 4;
  string acp_path = 5;
}

message Agent {
  ResourceReference ref = 1;
  AgentKind kind = 2;
  StructuredObject resource = 3;
  string id = 4;
  string model_provider = 5;
  string model = 6;
  ResourceReference model_config_ref = 7;
  repeated StructuredObject tools = 8;
  bool ready = 9;
  bool accepted = 10;
  reserved 11;
  AgentHarnessDetails agent_harness = 12;
  repeated string memory_refs = 13;
}

message ListAgentsRequest {
  string namespace = 1;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message GetSandboxAgentRequest {
  ResourceReference ref = 1;
}

message GetSandboxAgentResponse {
  Agent agent = 1;
}

message CreateSandboxAgentRequest {
  ResourceReference ref = 1;
  StructuredObject resource = 2;
}

message CreateSandboxAgentResponse {
  Agent agent = 1;
}

message UpdateSandboxAgentRequest {
  ResourceReference ref = 1;
  StructuredObject resource = 2;
}

message UpdateSandboxAgentResponse {
  Agent agent = 1;
}

message DeleteSandboxAgentRequest {
  ResourceReference ref = 1;
}

message DeleteSandboxAgentResponse {}

message GetAgentHarnessRequest {
  ResourceReference ref = 1;
}

message GetAgentHarnessResponse {
  Agent agent = 1;
}

message CreateAgentHarnessRequest {
  ResourceReference ref = 1;
  StructuredObject resource = 2;
}

message CreateAgentHarnessResponse {
  Agent agent = 1;
}

message DeleteAgentHarnessRequest {
  ResourceReference ref = 1;
}

message DeleteAgentHarnessResponse {}

message EnsureAgentHarnessSessionActorRequest {
  ResourceReference ref = 1;
  string session_id = 2;
}

message SuspendAgentHarnessSessionActorRequest {
  ResourceReference ref = 1;
  string session_id = 2;
}

message GetAgentHarnessSessionActorRequest {
  ResourceReference ref = 1;
  string session_id = 2;
}

message AgentHarnessSessionActor {
  ResourceReference ref = 1;
  string session_id = 2;
  string actor_id = 3;
  AgentHarnessActorState state = 4;
}

message EnsureAgentHarnessSessionActorResponse {
  AgentHarnessSessionActor actor = 1;
}

message SuspendAgentHarnessSessionActorResponse {
  AgentHarnessSessionActor actor = 1;
}

message GetAgentHarnessSessionActorResponse {
  AgentHarnessSessionActor actor = 1;
}
