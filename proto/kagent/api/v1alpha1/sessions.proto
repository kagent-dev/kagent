syntax = "proto3";

package kagent.api.v1alpha1;

import "a2a.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1alpha1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

service SessionService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListSessionsByAgent(ListSessionsByAgentRequest) returns (ListSessionsByAgentResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc AddSessionEvent(AddSessionEventRequest) returns (AddSessionEventResponse);
  rpc CreateSessionShare(CreateSessionShareRequest) returns (CreateSessionShareResponse);
  rpc ListSessionShares(ListSessionSharesRequest) returns (ListSessionSharesResponse);
  rpc DeleteSessionShare(DeleteSessionShareRequest) returns (DeleteSessionShareResponse);
}

// TaskStoreService is the private persistence API used by agent runtimes.
service TaskStoreService {
  rpc UpsertTask(UpsertTaskRequest) returns (UpsertTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
}

enum SessionSource {
  SESSION_SOURCE_UNSPECIFIED = 0;
  SESSION_SOURCE_USER = 1;
  SESSION_SOURCE_AGENT = 2;
}

enum EventOrder {
  EVENT_ORDER_UNSPECIFIED = 0;
  EVENT_ORDER_ASCENDING = 1;
  EVENT_ORDER_DESCENDING = 2;
}

message Session {
  string id = 1;
  optional string name = 2;
  string user_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
  optional string agent_id = 7;
  optional SessionSource source = 8;
  optional string share_token = 9;
  optional bool share_read_only = 10;
}

message SessionEvent {
  string id = 1;
  string session_id = 2;
  string user_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
  string data = 7;
}

message SessionShare {
  int64 id = 1;
  string token = 2;
  string session_id = 3;
  string user_id = 4;
  bool read_only = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message ListSessionsByAgentRequest {
  ResourceReference agent_ref = 1;
}

message ListSessionsByAgentResponse {
  repeated Session sessions = 1;
}

message CreateSessionRequest {
  optional string id = 1;
  string agent_ref = 2;
  optional string name = 3;
  optional SessionSource source = 4;
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1;
  EventOrder order = 2;
  google.protobuf.Timestamp after = 3;
  optional int32 limit = 4;
}

message GetSessionResponse {
  Session session = 1;
  repeated SessionEvent events = 2;
  optional bool read_only = 3;
}

message UpdateSessionRequest {
  string session_id = 1;
  optional string name = 2;
  optional string agent_ref = 3;
}

message UpdateSessionResponse {
  Session session = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {}

message AddSessionEventRequest {
  string session_id = 1;
  string id = 2;
  string data = 3;
}

message AddSessionEventResponse {}

message CreateSessionShareRequest {
  string session_id = 1;
  optional bool read_only = 2;
}

message CreateSessionShareResponse {
  SessionShare share = 1;
}

message ListSessionSharesRequest {
  string session_id = 1;
}

message ListSessionSharesResponse {
  repeated SessionShare shares = 1;
}

message DeleteSessionShareRequest {
  string session_id = 1;
  string token = 2;
}

message DeleteSessionShareResponse {}

message UpsertTaskRequest {
  lf.a2a.v1.Task task = 1;
}

message UpsertTaskResponse {}

message GetTaskRequest {
  string task_id = 1;
}

message GetTaskResponse {
  lf.a2a.v1.Task task = 1;
}

message DeleteTaskRequest {
  string task_id = 1;
}

message DeleteTaskResponse {}

message ListTasksRequest {
  string session_id = 1;
}

message ListTasksResponse {
  repeated lf.a2a.v1.Task tasks = 1;
}
