syntax = "proto3";

package kagent.api.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1alpha1/agent_instances.proto";
import "kagent/api/v1alpha1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

service CheckpointService {
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (CreateCheckpointResponse);
  rpc GetCheckpoint(GetCheckpointRequest) returns (GetCheckpointResponse);
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  rpc DeleteCheckpoint(DeleteCheckpointRequest) returns (DeleteCheckpointResponse);
  rpc ForkAgentInstance(ForkAgentInstanceRequest) returns (ForkAgentInstanceResponse);
}

enum CheckpointState {
  CHECKPOINT_STATE_UNSPECIFIED = 0;
  CHECKPOINT_STATE_CREATING = 1;
  CHECKPOINT_STATE_READY = 2;
  CHECKPOINT_STATE_FAILED = 3;
  CHECKPOINT_STATE_DELETING = 4;
}

message Checkpoint {
  string id = 1;
  string namespace = 2;
  string agent_instance_id = 3;
  string head_task_id = 4;
  uint64 history_sequence = 5;
  CheckpointState state = 6;
  google.protobuf.Timestamp created_at = 7;
  Failure failure = 8;
}

message CreateCheckpointRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string agent_instance_id = 2 [(buf.validate.field).string.min_len = 1];
  string request_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message CreateCheckpointResponse {
  Checkpoint checkpoint = 1;
}

message GetCheckpointRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string checkpoint_id = 2 [(buf.validate.field).string.min_len = 1];
}

message GetCheckpointResponse {
  Checkpoint checkpoint = 1;
}

message ListCheckpointsRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string agent_instance_id = 2 [(buf.validate.field).string.min_len = 1];
  PageRequest page = 3;
}

message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
  PageResponse page = 2;
}

message DeleteCheckpointRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string checkpoint_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteCheckpointResponse {}

message ForkAgentInstanceRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string checkpoint_id = 2 [(buf.validate.field).string.min_len = 1];
  string request_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ForkAgentInstanceResponse {
  AgentInstance agent_instance = 1;
}
