syntax = "proto3";

package kagent.api.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1alpha1/agent_instances.proto";
import "kagent/api/v1alpha1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

service CheckpointService {
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (CreateCheckpointResponse);
  rpc GetCheckpoint(GetCheckpointRequest) returns (GetCheckpointResponse);
  // Lists ready checkpoints from the instance's history and inherited prefixes.
  // Checkpoints retain their originating instance IDs, including after deletion
  // of the originating or listed instance.
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  rpc DeleteCheckpoint(DeleteCheckpointRequest) returns (DeleteCheckpointResponse);
  rpc ForkAgentInstance(ForkAgentInstanceRequest) returns (ForkAgentInstanceResponse);
  rpc UpdateCheckpointName(UpdateCheckpointNameRequest) returns (UpdateCheckpointNameResponse);
}

enum CheckpointState {
  CHECKPOINT_STATE_UNSPECIFIED = 0;
  CHECKPOINT_STATE_CREATING = 1;
  CHECKPOINT_STATE_READY = 2;
  CHECKPOINT_STATE_FAILED = 3;
  CHECKPOINT_STATE_DELETING = 4;
}

message Checkpoint {
  string id = 1;
  // The instance that created this checkpoint. For an inherited checkpoint this
  // differs from the instance requested in ListCheckpoints.
  string agent_instance_id = 2;
  string head_task_id = 3;
  uint64 history_sequence = 4;
  CheckpointState state = 5;
  google.protobuf.Timestamp created_at = 6;
  Failure failure = 7;
  // Display name for the checkpoint, and the name a fork taken from it is given.
  // Defaulted at creation from the source instance and the turn the boundary sits
  // at, because both are what a reader has to tell two boundaries apart by.
  string name = 8;
}

message CreateCheckpointRequest {
  string agent_instance_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message CreateCheckpointResponse {
  Checkpoint checkpoint = 1;
}

message GetCheckpointRequest {
  string checkpoint_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetCheckpointResponse {
  Checkpoint checkpoint = 1;
}

message ListCheckpointsRequest {
  // The instance whose local and inherited checkpoints to list. Its retained
  // history remains listable after the instance is deleted.
  string agent_instance_id = 1 [(buf.validate.field).string.uuid = true];
  PageRequest page = 2;
}

message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
  PageResponse page = 2;
}

message DeleteCheckpointRequest {
  string checkpoint_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteCheckpointResponse {}

message ForkAgentInstanceRequest {
  string checkpoint_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ForkAgentInstanceResponse {
  AgentInstance agent_instance = 1;
}

message UpdateCheckpointNameRequest {
  string checkpoint_id = 1 [(buf.validate.field).string.uuid = true];
  // The new display name. Empty restores the generated default rather than leaving
  // the checkpoint nameless, so a fork always has something to be called.
  string name = 2 [(buf.validate.field).string = {
    max_len: 200
    pattern: "^(?:$|[^\\p{Z}\\p{Cc}](?:[^\\p{Cc}]*[^\\p{Z}\\p{Cc}])?)$"
  }];
}

message UpdateCheckpointNameResponse {
  Checkpoint checkpoint = 1;
}
