syntax = "proto3";

package kagent.api.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1alpha1/agent_instances.proto";
import "kagent/api/v1alpha1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

service CheckpointService {
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (CreateCheckpointResponse);
  rpc GetCheckpoint(GetCheckpointRequest) returns (GetCheckpointResponse);
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  rpc DeleteCheckpoint(DeleteCheckpointRequest) returns (DeleteCheckpointResponse);
  rpc ForkAgentInstance(ForkAgentInstanceRequest) returns (ForkAgentInstanceResponse);
}

enum CheckpointState {
  CHECKPOINT_STATE_UNSPECIFIED = 0;
  CHECKPOINT_STATE_CREATING = 1;
  CHECKPOINT_STATE_READY = 2;
  CHECKPOINT_STATE_FAILED = 3;
  CHECKPOINT_STATE_DELETING = 4;
}

message Checkpoint {
  string id = 1;
  string agent_instance_id = 2;
  string head_task_id = 3;
  uint64 history_sequence = 4;
  CheckpointState state = 5;
  google.protobuf.Timestamp created_at = 6;
  Failure failure = 7;
  // What the conversation was called when this was taken, so a list across
  // conversations can name each row without a read per row. It is also the only name a
  // listing can filter or order by. Empty for a conversation that never had one.
  string conversation_name = 8;
}

message CreateCheckpointRequest {
  string agent_instance_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message CreateCheckpointResponse {
  Checkpoint checkpoint = 1;
}

message GetCheckpointRequest {
  string checkpoint_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetCheckpointResponse {
  Checkpoint checkpoint = 1;
}

// Sortable columns. `CONVERSATION` orders by `Checkpoint.conversation_name`, the name
// the conversation had when the checkpoint was taken.
enum CheckpointSortField {
  CHECKPOINT_SORT_FIELD_UNSPECIFIED = 0;
  CHECKPOINT_SORT_FIELD_CREATED_AT = 1;
  CHECKPOINT_SORT_FIELD_CONVERSATION = 2;
  CHECKPOINT_SORT_FIELD_STATE = 3;
}

message CheckpointSortBy {
  CheckpointSortField field = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  SortDirection direction = 2 [(buf.validate.field).enum.defined_only = true];
}

message ListCheckpointsRequest {
  // Optional. Empty lists every checkpoint the caller owns, across their conversations.
  string agent_instance_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  PageRequest page = 2;
  // Matched, case-insensitively, against `Checkpoint.conversation_name` and the
  // checkpoint's own identifiers. Empty matches everything.
  string filter = 3 [(buf.validate.field).string.max_len = 256];
  // Applied in order, so ["state", "created_at desc"] groups by state and puts the
  // newest first within each group. Empty is newest first.
  repeated CheckpointSortBy sort_by = 4 [(buf.validate.field).repeated.max_items = 4];
}

message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
  PageResponse page = 2;
  // Every checkpoint the filter matches, not just this page — what a page control
  // needs to say "1-25 of 137" without reading them all.
  int32 total_size = 3;
}

message DeleteCheckpointRequest {
  string checkpoint_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteCheckpointResponse {}

message ForkAgentInstanceRequest {
  string checkpoint_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ForkAgentInstanceResponse {
  AgentInstance agent_instance = 1;
}
