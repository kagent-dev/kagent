syntax = "proto3";

package kagent.api.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1alpha1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

service AgentInstanceService {
  rpc CreateAgentInstance(CreateAgentInstanceRequest) returns (CreateAgentInstanceResponse);
  rpc GetAgentInstance(GetAgentInstanceRequest) returns (GetAgentInstanceResponse);
  rpc ListAgentInstances(ListAgentInstancesRequest) returns (ListAgentInstancesResponse);
  rpc RenameAgentInstance(RenameAgentInstanceRequest) returns (RenameAgentInstanceResponse);
  rpc SuspendAgentInstance(SuspendAgentInstanceRequest) returns (SuspendAgentInstanceResponse);
  rpc ResumeAgentInstance(ResumeAgentInstanceRequest) returns (ResumeAgentInstanceResponse);
  rpc DeleteAgentInstance(DeleteAgentInstanceRequest) returns (DeleteAgentInstanceResponse);
  rpc CreateAgentInstanceShare(CreateAgentInstanceShareRequest) returns (CreateAgentInstanceShareResponse);
  rpc ListAgentInstanceShares(ListAgentInstanceSharesRequest) returns (ListAgentInstanceSharesResponse);
  rpc RevokeAgentInstanceShare(RevokeAgentInstanceShareRequest) returns (RevokeAgentInstanceShareResponse);
}

enum AgentInstanceState {
  AGENT_INSTANCE_STATE_UNSPECIFIED = 0;
  AGENT_INSTANCE_STATE_CREATING = 1;
  AGENT_INSTANCE_STATE_READY = 2;
  AGENT_INSTANCE_STATE_SUSPENDED = 3;
  AGENT_INSTANCE_STATE_FAILED = 4;
  AGENT_INSTANCE_STATE_DELETING = 5;
  AGENT_INSTANCE_STATE_DELETED = 6;
}

enum AgentInstanceOperation {
  AGENT_INSTANCE_OPERATION_UNSPECIFIED = 0;
  AGENT_INSTANCE_OPERATION_CREATE = 1;
  AGENT_INSTANCE_OPERATION_SUSPEND = 2;
  AGENT_INSTANCE_OPERATION_RESUME = 3;
  AGENT_INSTANCE_OPERATION_DELETE = 4;
}

enum AgentInstanceSharePermission {
  AGENT_INSTANCE_SHARE_PERMISSION_UNSPECIFIED = 0;
  // Allows A2A get, list, and subscribe operations.
  AGENT_INSTANCE_SHARE_PERMISSION_READ_ONLY = 1;
  // Also allows A2A send and cancel operations.
  AGENT_INSTANCE_SHARE_PERMISSION_READ_WRITE = 2;
}

message Failure {
  string reason = 1;
  string message = 2;
}

message AgentInstance {
  string id = 1;
  string namespace = 2;
  string creator = 3;
  ResourceReference harness = 4;
  ResourceReference agent_template = 5;
  string prepared_revision = 6;
  string a2a_authority = 7;
  AgentInstanceState state = 8;
  AgentInstanceOperation operation = 9;
  Failure failure = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  map<string, string> labels = 13;
  // Reader-supplied display name for the conversation. Empty means unnamed,
  // which is the state every instance created before this field existed is in.
  string name = 14;
}

message CreateAgentInstanceRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string harness = 2 [(buf.validate.field).string.min_len = 1];
  string agent_template = 3 [(buf.validate.field).string.min_len = 1];
  string request_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Optional display name. Empty means unnamed.
  string name = 5 [(buf.validate.field).string = {
    max_len: 200
    pattern: "^(?:$|[^\\p{Z}\\p{Cc}](?:[^\\p{Cc}]*[^\\p{Z}\\p{Cc}])?)$"
  }];
}

message CreateAgentInstanceResponse {
  AgentInstance agent_instance = 1;
}

message GetAgentInstanceRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string agent_instance_id = 2 [(buf.validate.field).string.min_len = 1];
}

message GetAgentInstanceResponse {
  AgentInstance agent_instance = 1;
}

message ListAgentInstancesRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  map<string, string> match_labels = 2;
  // Includes instances created by other users when authorized.
  bool all_creators = 3;
  PageRequest page = 4;
  // Narrows the list to the conversations of one agent, an agent being an
  // (AgentTemplate, Harness) pair. Either may be given alone. Both are matched
  // against the pair the instance's prepared revision was built from, so they
  // also select instances created before these fields existed.
  string agent_template = 5 [(buf.validate.field).string = {
    max_len: 253
    pattern: "^(?:$|[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\\.[a-z0-9](?:[-a-z0-9]*[a-z0-9])?)*)$"
  }];
  string harness = 6 [(buf.validate.field).string = {
    max_len: 253
    pattern: "^(?:$|[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\\.[a-z0-9](?:[-a-z0-9]*[a-z0-9])?)*)$"
  }];
}

message ListAgentInstancesResponse {
  repeated AgentInstance agent_instances = 1;
  PageResponse page = 2;
}

message RenameAgentInstanceRequest {
  string namespace = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$"
  }];
  string agent_instance_id = 2 [(buf.validate.field).string.uuid = true];
  // The new display name. Empty clears the name, returning the conversation to
  // being identified by its id.
  string name = 3 [(buf.validate.field).string = {
    max_len: 200
    pattern: "^(?:$|[^\\p{Z}\\p{Cc}](?:[^\\p{Cc}]*[^\\p{Z}\\p{Cc}])?)$"
  }];
}

message RenameAgentInstanceResponse {
  AgentInstance agent_instance = 1;
}

message SuspendAgentInstanceRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string agent_instance_id = 2 [(buf.validate.field).string.min_len = 1];
}

message SuspendAgentInstanceResponse {
  AgentInstance agent_instance = 1;
}

message ResumeAgentInstanceRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string agent_instance_id = 2 [(buf.validate.field).string.min_len = 1];
}

message ResumeAgentInstanceResponse {
  AgentInstance agent_instance = 1;
}

message DeleteAgentInstanceRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string agent_instance_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteAgentInstanceResponse {
  AgentInstance agent_instance = 1;
}

message AgentInstanceShare {
  string id = 1;
  string namespace = 2;
  string agent_instance_id = 3;
  string creator = 4;
  AgentInstanceSharePermission permission = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateAgentInstanceShareRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string agent_instance_id = 2 [(buf.validate.field).string.min_len = 1];
  AgentInstanceSharePermission permission = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message CreateAgentInstanceShareResponse {
  AgentInstanceShare share = 1;
  // Returned only when the share is created.
  string token = 2;
}

message ListAgentInstanceSharesRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string agent_instance_id = 2 [(buf.validate.field).string.min_len = 1];
  PageRequest page = 3;
}

message ListAgentInstanceSharesResponse {
  repeated AgentInstanceShare shares = 1;
  PageResponse page = 2;
}

message RevokeAgentInstanceShareRequest {
  string namespace = 1 [(buf.validate.field).string.min_len = 1];
  string share_id = 2 [(buf.validate.field).string.min_len = 1];
}

message RevokeAgentInstanceShareResponse {}
