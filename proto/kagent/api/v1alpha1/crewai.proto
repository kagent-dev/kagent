syntax = "proto3";

package kagent.api.v1alpha1;

import "kagent/api/v1alpha1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/api/v1alpha1;apiv1alpha1";

service CrewAIService {
  rpc StoreMemory(StoreMemoryRequest) returns (StoreMemoryResponse);
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);
  rpc ResetMemory(ResetMemoryRequest) returns (ResetMemoryResponse);
  rpc StoreFlowState(StoreFlowStateRequest) returns (StoreFlowStateResponse);
  rpc GetFlowState(GetFlowStateRequest) returns (GetFlowStateResponse);
}

message CrewAIMemory {
  string thread_id = 1;
  string user_id = 2;
  StructuredObject memory_data = 3;
}

message CrewAIFlowState {
  string thread_id = 1;
  string method_name = 2;
  StructuredObject state_data = 3;
}

message StoreMemoryRequest {
  string thread_id = 1;
  StructuredObject memory_data = 2;
}

message StoreMemoryResponse {}

message GetMemoryRequest {
  string thread_id = 1;
  string task_description = 2;
  optional int32 limit = 3;
}

message GetMemoryResponse {
  repeated CrewAIMemory memories = 1;
}

message ResetMemoryRequest {
  string thread_id = 1;
}

message ResetMemoryResponse {}

message StoreFlowStateRequest {
  string thread_id = 1;
  string method_name = 2;
  StructuredObject state_data = 3;
}

message StoreFlowStateResponse {}

message GetFlowStateRequest {
  string thread_id = 1;
}

message GetFlowStateResponse {
  CrewAIFlowState state = 1;
}
