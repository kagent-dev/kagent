syntax = "proto3";

package kagent.config.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/config/v1;configv1";

// GitWorkspaceConfig initializes a private repository before golden readiness.
// It contains no credentials. Authorization is an inert header replaced by the
// golden actor's egress gateway. Restored instances reuse the saved checkout.
message GitWorkspaceConfig {
  reserved 4;
  reserved "refresh_token";

  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
    prefix: "https://"
  }];
  string ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
  }];
  bool authorization = 3;
}
