// Worker is a schedulable worker pod.
//
// Global-scoped: metadata.atespace is always empty. metadata.name is assigned
// by the control plane and is opaque to clients — never parse it or derive it
// from anything else; read pod identity from the named fields below.
//
// labels and epoch are the only mutable fields; every other field is
// either immutable after creation or output-only. UpdateWorker replaces the whole resource, so
// an immutable field that a request changes — including by omitting it, which
// would clear it — is rejected with INVALID_ARGUMENT.
message Worker {
  // Output-only: name, uid, version and timestamps are all server-assigned.
  // uid and version are echoed back on UpdateWorker as preconditions.
  //
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ResourceMetadata metadata = 1;

  // Kubernetes coordinates. Immutable, set at creation.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  // +k8s:immutable
  string worker_namespace = 2;
  // +k8s:required
  // +k8s:format=k8s-long-name
  // +k8s:immutable
  string worker_pool = 3;
  // +k8s:required
  // +k8s:format=k8s-long-name
  // +k8s:immutable
  string worker_pod = 4;
  // +k8s:required
  // +k8s:format=k8s-uuid
  // +k8s:immutable
  string worker_pod_uid = 5;
  // +k8s:required
  // +k8s:format=k8s-long-name
  // +k8s:immutable
  string node_name = 6;
  // ips are the worker pod's IPs, at most one per IP family, in the order
  // Kubernetes reports them; the first is in the cluster's primary family.
  //
  // +k8s:required
  // +k8s:maxItems=2
  // +k8s:listType=atomic
  // +k8s:customValidation # until `format=k8s-ip` is supported
  // +k8s:immutable
  repeated string ips = 7;

  // sandbox_class mirrors the WorkerPool's sandboxClass; its values are the
  // CRD's own vocabulary, so it is only bounded, not validated.
  //
  // +k8s:optional
  // +k8s:maxLength=63
  // +k8s:immutable
  string sandbox_class = 8;

  // labels mirror the WorkerPool object's Kubernetes labels, which selectors
  // match against.
  // Kubernetes does not cap an object's label count, so the bound below is
  // a generous guardrail, not a mirror of an upstream limit.
  //
  // +k8s:optional
  // +k8s:maxProperties=64
  // +k8s:eachKey=+k8s:format=k8s-label-key
  // +k8s:eachVal=+k8s:format=k8s-label-value
  map<string, string> labels = 9;

  // epoch counts the runs of the worker pod's ateom container: 1 for its first
  // run and one more for each restart. 0 means it has not been reported.
  //
  // A restarted ateom has lost the sandboxes of the Actors it was hosting, so
  // once epoch rises the control plane crashes every Actor placed during an
  // earlier epoch; status.observed_epoch reports when that is done. It may only
  // increase.
  //
  // +k8s:optional
  // +k8s:minimum=0
  // +k8s:update=NoUnset
  // +k8s:customValidation
  int64 epoch = 12;

  // Output-only server-managed state. Absent from Create/Update request
  // payloads; whatever a request carries here is ignored. DrainWorker is the
  // only way a client moves state, and the assignments are the scheduler's.
  //
  // +k8s:optional
  WorkerStatus status = 11;
}

enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  // Ready; schedulable.
  WORKER_STATE_ACTIVE = 1;
  // Pod terminating. Not schedulable.
  WORKER_STATE_DRAINING = 2;
  // Keep this in sync with WorkerStatus.state's maximum.
}

message WorkerStatus {
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=2 # keep this in sync with the WorkerState enum
  WorkerState state = 1;

  // The total resource capacity of the Worker.
  //
  // A Worker should report every dimension of resources it has available to be
  // consumed by Actors. Any resource not specified here is assumed to be 0. An
  // Actor which requests a resource which is not present in a Worker's
  // capacity will prevent that Actor from running on that Worker.
  //
  // Shrinking capacity below allocated prevents new placements but does not
  // evicts running Actors.
  //
  // +k8s:optional
  WorkerResources capacity = 2;

  // The allocated resources of the Worker.  This is the sum of all the
  // resources consumed by the Actors currently assigned to this Worker.
  //
  // +k8s:optional
  WorkerResources allocated = 3;

  // observed_epoch is the latest epoch whose earlier Actors the control plane
  // has crashed and released. While it is below epoch, Actors placed before
  // the ateom's last restart may still be reported as running.
  //
  // +k8s:optional
  // +k8s:minimum=0
  int64 observed_epoch = 4;

  // Hardware identity reported by the Worker at registration.
  //
  // +k8s:optional
  HardwareIdentity hardware = 5;
}

// HardwareIdentity identifies the hardware of a Worker or the Worker a
// snapshot was captured on.
message HardwareIdentity {
  // Key-value pairs describing hardware properties (currently
  // "architecture"; TODO: add "cpu_vendor", "cpu_model", etc.).
  //
  // +k8s:optional
  // +k8s:maxProperties=32
  // +k8s:eachKey=+k8s:maxLength=128
  // +k8s:eachVal=+k8s:maxLength=256
  map<string, string> attributes = 1;
}

// WorkerResources represents a set of resources.
message WorkerResources {
  // Resources match the Actor's definition of resources.
  // They are matched by name and used for placement.
  //
  // +k8s:optional
  Resources resources = 1;

  // A count of Actors.  Workers can use this to limit the number of Actors
  // that can be placed on them, constraining the costs of other things that
  // are not captured in the resources above, but which still have costs -
  // netns, mounts, file descriptors, etc.
  //
  // +k8s:optional
  // +k8s:minimum=1
  int32 actors = 2;
}

// ActorAssignment binds an Actor to a Worker.  This is a subresource of the
// Worker.
message ActorAssignment {
  // Metadata about the assignment.
  //
  // The atespace field is always empty, since it corresponds to a Worker, and
  // Workers are not atespaced. The name field is the Actor's UID, so the Actor
  // that caused an assignment is what addresses it.
  //
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ResourceMetadata metadata = 6;

  // actor is the Actor that is assigned to the Worker.
  //
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  ObjectRef actor = 2;

  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;

  // actor_template_ref names the ActorTemplate resource the assigned Actor
  // uses.
  //
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  ObjectRef actor_template_ref = 4;

  // The resources allocated to the Actor when it was assigned.
  //
  // +k8s:optional
  Resources resources = 5;

  // worker_epoch is the Worker's epoch when the Actor was bound.
  //
  // +k8s:optional
  // +k8s:minimum=0
  int64 worker_epoch = 7;
}

// WorkerService is how a Worker tells the control plane what it observes. It is
// separate from Control because the two have different callers and different
// authorization: Control is the client-facing API, while these RPCs are served
// only to an atelet, and only for the Workers on its own node.
service WorkerService {
  // RegisterWorker records what a Worker can hold and its hardware identity in
  // one write, so a Worker is never schedulable without hardware to match
  // snapshots against. Capacity and hardware are the Worker's to report rather
  // than the control plane's to infer: they are what the ateom can actually
  // supply and expose, only its node can observe them, and a fleet may run
  // mixed ateom versions.
  //
  // atelet calls this with its own client certificate, as it does for
  // MintCert. Idempotent: re-sending the same capacity and hardware is not a
  // write.
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);

  // Create a Substrate-issued SPIFFE certificate that asserts an ateom acting
  // on behalf of a particular actor.
  //
  // SPIFFE URI: spiffe://${trustdomain}/ateom-for-actor/${atespace}/${actor}
  rpc MintAteomActorCertificate(MintAteomActorCertificateRequest) returns (MintAteomActorCertificateResponse);

  // RequestActorSuspend asks the control plane to suspend an Actor that the
  // calling Worker hosts. Only the Worker can observe what makes an Actor
  // worth reclaiming -- whether its workload still has anything to do -- and
  // only the control plane can decide whether to act on that.
  //
  // This is a request, not a command. It runs the same suspend workflow
  // Control.SuspendActor runs, behind the same preconditions, so a proposal
  // that races a resume, pause, or delete loses to it.
  //
  // atelet calls this with its own client certificate, as it does for
  // RegisterWorker, naming the Worker its caller proved itself to be. The
  // control plane serves it only for an Actor that is assigned to that Worker.
  //
  // Not idempotent, unlike Control.SuspendActor, which reports an
  // already-suspended Actor as the success it is. A suspend releases the
  // Worker it ran on, so the second request names an Actor the caller no
  // longer hosts, and is refused as NotFound like any other. A Worker that
  // retries a suspend it had already been granted therefore sees a failure
  // rather than a repeat of its success.
  rpc RequestActorSuspend(RequestActorSuspendRequest) returns (RequestActorSuspendResponse);
}

message RegisterWorkerRequest {
  // The Worker being registered. atespace is always empty; Workers are
  // global-scoped.
  //
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ObjectRef worker = 1;

  // Everything the Worker can hold. This replaces what is recorded rather than
  // merging into it: a dimension left out is one the Worker no longer supplies,
  // and an Actor asking for that dimension will not be placed here.
  //
  // +k8s:required
  WorkerResources capacity = 2;

  // Hardware identity reported by the Worker. Like capacity, this replaces
  // what is recorded on the Worker.
  //
  // +k8s:required
  HardwareIdentity hardware = 3;
}

message RegisterWorkerResponse {
  // The Worker as recorded, so a caller sees what its report resolved to.
  Worker worker = 1;
}

// Request message for MintAteomActorCertificate.
message MintAteomActorCertificateRequest {
  // The actor for which the certificate should be issued.
  //
  // Must be a valid actor that currently exists according to the actor store.
  //
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  ObjectRef actor = 1;

  // The UID of the actor --- used to guard against deletion and recreation of
  // an actor with the same name.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 2;

  // Request contains DER encoded bytes of a x509 certificate signing request.
  // The signer will ignore the contents of the CSR except to extract the
  // subject public key.
  //
  // +k8s:required
  // +k8s:maxBytes=16384
  bytes certificate_signing_request = 3;
}

// Response message for MintAteomActorCertificate.
message MintAteomActorCertificateResponse {
  // Response contains a list of DER encoded certificates. The first entry is the
  // leaf certificate, and any remaining entries are intermediates in
  // leaf-to-root order.
  repeated bytes actor_certificates = 1;
}

message RequestActorSuspendRequest {
  // The Worker making the request. atespace is always empty; Workers are
  // global-scoped. atelet fills this in from its caller's certificate, so it
  // names the Worker the request provably came from.
  //
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ObjectRef worker = 1;

  // The Actor to suspend. It must be assigned to worker; a Worker may speak
  // only for what it hosts.
  //
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  ObjectRef actor = 2;

  // The UID of the Actor the Worker believes it is hosting, which pins the
  // request to one incarnation. Without it a request could outlive the Actor
  // it was made about and suspend the recreation that took its name.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;
}

message RequestActorSuspendResponse {
  // The Actor as the suspend workflow left it.
  Actor actor = 1;
}

// AccessPolicy is an access policy resource nested under a parent resource (or
// the global singleton installation). Every parent resource has at most one
// access policy resource, named "default".
message AccessPolicy {
  // Standard resource metadata. Atespace must match the parent resource (empty
  // for global-scoped parents like Global and Atespace) and name must be
  // "default". Both are caller-specified on create and immutable. UID, version,
  // create_time, and update_time are server-managed.
  //
  // +k8s:required
  // +k8s:customValidation # name must be "default"
  ResourceMetadata metadata = 1;

  // Role bindings granting permissions on the parent resource.
  //
  // +k8s:optional
  // +k8s:listType=atomic
  // +k8s:maxItems=100
  repeated Binding bindings = 2;
}

// Binding associates a list of principals (members) with a single role.
message Binding {
  // The role name for the parent resource type (e.g., "owner", "editor",
  // "viewer").
  //
  // +k8s:required
  // +k8s:maxLength=64
  string role = 1;

  // Principal identities granted this role.
  // Examples:
  //   - "user:alice@example.com"
  //   - "user:sa-ci-runner"
  //
  // +k8s:required
  // +k8s:listType=set
  // +k8s:maxItems=1500
  // +k8s:eachVal=+k8s:maxLength=512
  repeated string members = 2;
}

// GetGlobalAccessPolicyRequest retrieves the deployment-wide global access policy singleton.
message GetGlobalAccessPolicyRequest {}

// CreateGlobalAccessPolicyRequest creates the deployment-wide global access policy singleton.
message CreateGlobalAccessPolicyRequest {
  // The policy to create. metadata.name must be "default" and
  // metadata.atespace must be empty.
  //
  // +k8s:required
  AccessPolicy access_policy = 1;
}

// UpdateGlobalAccessPolicyRequest replaces the deployment-wide global access policy singleton.
message UpdateGlobalAccessPolicyRequest {
  // Full replacement. Metadata UID and version are required preconditions;
  // metadata.name must be "default" and metadata.atespace must be empty.
  //
  // +k8s:required
  AccessPolicy access_policy = 1;
}

// GetAtespaceAccessPolicyRequest identifies an Atespace's access policy.
message GetAtespaceAccessPolicyRequest {
  // The parent Atespace of the access policy resource to retrieve.
  //
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ObjectRef atespace = 1;
}

// CreateAtespaceAccessPolicyRequest creates an access policy for an Atespace.
message CreateAtespaceAccessPolicyRequest {
  // Parent Atespace under which to create the policy resource.
  //
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ObjectRef atespace = 1;

  // The policy to create. metadata.name must be "default" and
  // metadata.atespace must be empty.
  //
  // +k8s:required
  AccessPolicy access_policy = 2;
}

// UpdateAtespaceAccessPolicyRequest replaces an Atespace's access policy.
message UpdateAtespaceAccessPolicyRequest {
  // Parent Atespace under which to update the policy resource.
  //
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ObjectRef atespace = 1;

  // Full replacement. Metadata UID and version are required preconditions;
  // metadata.name must be "default" and metadata.atespace must be empty.
  //
  // +k8s:required
  AccessPolicy access_policy = 2;
}

// DeleteAtespaceAccessPolicyRequest identifies an Atespace's access policy.
message DeleteAtespaceAccessPolicyRequest {
  // The parent Atespace of the access policy resource to delete.
  //
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ObjectRef atespace = 1;

  // Optional per-delete preconditions.
  //
  // +k8s:optional
  DeleteOptions options = 2;
}
