syntax = "proto3";

package ateapi;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/agent-substrate/substrate/pkg/proto/ateapipb";

// Control is the primary RPC interface for Agentic Substrate.
service Control {
  // Get an Actor.
  rpc GetActor(GetActorRequest) returns (Actor) {}

  // Create a new Actor deriving from a given ActorTemplate.
  rpc CreateActor(CreateActorRequest) returns (Actor) {}

  // Update mutable fields on an existing Actor.
  rpc UpdateActor(UpdateActorRequest) returns (Actor) {}

  // Suspend a given actor to a new snapshot. A running actor is checkpointed
  // on its worker; a paused actor's node-local snapshot is uploaded, narrowed
  // to the template's commit scope where required (Full capture, Data commit).
  rpc SuspendActor(SuspendActorRequest) returns (SuspendActorResponse) {}

  // Pause a given actor and keep its snapshots on node VM.
  rpc PauseActor(PauseActorRequest) returns (PauseActorResponse) {}

  // Resume an actor from its latest snapshot.
  rpc ResumeActor(ResumeActorRequest) returns (ResumeActorResponse) {}

  // Revert an actor to SUSPENDED state.
  // Only crashed, running or paused actors can be reverted.
  rpc RevertActor(RevertActorRequest) returns (RevertActorResponse) {}

  // Delete an actor. Only suspended or crashed actors can be deleted unless
  // any_state is set.
  rpc DeleteActor(DeleteActorRequest) returns (Actor) {}

  // Get the egress policy resource nested under an Actor.
  rpc GetActorEgressPolicy(GetActorEgressPolicyRequest) returns (EgressPolicy) {}

  // Create the egress policy resource nested under an Actor.
  rpc CreateActorEgressPolicy(CreateActorEgressPolicyRequest) returns (EgressPolicy) {}

  // Replace the egress policy resource nested under an Actor.
  rpc UpdateActorEgressPolicy(UpdateActorEgressPolicyRequest) returns (EgressPolicy) {}

  // Delete the egress policy resource nested under an Actor.
  rpc DeleteActorEgressPolicy(DeleteActorEgressPolicyRequest) returns (EgressPolicy) {}

  // Create a Substrate-issued JWT asserting the actor identity.
  //
  // * Called by the egress gateway when actor JWT injection is configured for outbound requests.
  rpc MintActorJWT(MintActorJWTRequest) returns (MintActorJWTResponse) {}

  // Create a Substrate-issued SPIFFE certificate asserting the actor identity.
  //
  // SPIFFE URI: spiffe://${trustdomain}/actor/${atespace}/${actor}
  //
  // * Called by the egress gateway when actor client certificate injection is
  //   configured for outbound requests.
  rpc MintActorCertificate(MintActorCertificateRequest) returns (MintActorCertificateResponse) {}

  // Tag the external snapshot a suspended Actor holds. The tag gets its own
  // copy of that snapshot, so suspending or deleting the Actor afterwards
  // cannot collect it.
  rpc CreateTag(CreateTagRequest) returns (Tag) {}

  // Get a Tag.
  rpc GetTag(GetTagRequest) returns (Tag) {}

  // List Tags.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse) {}

  // Publish or unpublish a Tag without changing its address.
  rpc UpdateTag(UpdateTagRequest) returns (Tag) {}

  // Delete a Tag and the external snapshot it owns. Actors created from the
  // tag that have not yet been suspended still point at that external snapshot
  // and become unrecoverable, so do not delete a tag while such Actors exist.
  rpc DeleteTag(DeleteTagRequest) returns (Tag) {}

  // List Workers.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse) {}

  // Get a Worker.
  rpc GetWorker(GetWorkerRequest) returns (Worker) {}

  // Register a Worker. Called once its Pod is Ready and has an IP.
  rpc CreateWorker(CreateWorkerRequest) returns (Worker) {}

  // Update observed pool state on a Worker.
  rpc UpdateWorker(UpdateWorkerRequest) returns (Worker) {}

  // Deregister a Worker. Does not cascade: the caller is responsible for
  // cleaning up related resources first.
  rpc DeleteWorker(DeleteWorkerRequest) returns (Worker) {}

  // Mark a Worker as terminating so the scheduler stops routing new Actors to
  // it. Idempotent; one-way. Deliberately leaves any bound Actor alone.
  // Returns ABORTED if another write lands on the Worker first; retry.
  rpc DrainWorker(DrainWorkerRequest) returns (Worker) {}

  // List the Actors hosted by a given Worker.
  rpc ListWorkerActorAssignments(ListWorkerActorAssignmentsRequest) returns (ListWorkerActorAssignmentsResponse) {}

  // List Actors.
  rpc ListActors(ListActorsRequest) returns (ListActorsResponse) {}

  // Create a new Atespace. Substrate-native, stored in database.
  rpc CreateAtespace(CreateAtespaceRequest) returns (Atespace) {}

  // Get an Atespace by name.
  rpc GetAtespace(GetAtespaceRequest) returns (Atespace) {}

  // List Atespaces.
  rpc ListAtespaces(ListAtespacesRequest) returns (ListAtespacesResponse) {}

  // Delete an empty Atespace. Rejects (FailedPrecondition) if any Actors or
  // Tags remain.
  rpc DeleteAtespace(DeleteAtespaceRequest) returns (Atespace) {}

  rpc CreateActorTemplate(CreateActorTemplateRequest) returns (ActorTemplate) {}

  rpc GetActorTemplate(GetActorTemplateRequest) returns (ActorTemplate) {}

  rpc ListActorTemplates(ListActorTemplatesRequest) returns (ListActorTemplatesResponse) {}

  // Delete an ActorTemplate together with its golden actor and golden
  // tag in the reserved ate-golden atespace.
  rpc DeleteActorTemplate(DeleteActorTemplateRequest) returns (ActorTemplate) {}

  // Get the deployment-wide global access policy singleton. Returns NotFound
  // until the policy has been created.
  rpc GetGlobalAccessPolicy(GetGlobalAccessPolicyRequest) returns (AccessPolicy) {}

  // Create the deployment-wide global access policy singleton. The server's
  // configured bootstrap owners are global owners whether or not this policy
  // exists, so they can create it.
  rpc CreateGlobalAccessPolicy(CreateGlobalAccessPolicyRequest) returns (AccessPolicy) {}

  // Replace the deployment-wide global access policy singleton. Empty
  // bindings revoke every grant held through the policy; bootstrap owners
  // keep access.
  rpc UpdateGlobalAccessPolicy(UpdateGlobalAccessPolicyRequest) returns (AccessPolicy) {}

  // Get the access policy resource nested under an Atespace.
  rpc GetAtespaceAccessPolicy(GetAtespaceAccessPolicyRequest) returns (AccessPolicy) {}

  // Create the access policy resource nested under an Atespace.
  rpc CreateAtespaceAccessPolicy(CreateAtespaceAccessPolicyRequest) returns (AccessPolicy) {}

  // Replace the access policy resource nested under an Atespace.
  rpc UpdateAtespaceAccessPolicy(UpdateAtespaceAccessPolicyRequest) returns (AccessPolicy) {}

  // Delete the access policy resource nested under an Atespace.
  rpc DeleteAtespaceAccessPolicy(DeleteAtespaceAccessPolicyRequest) returns (AccessPolicy) {}
}

// ExternalSnapshot addresses a snapshot held in object storage.
message ExternalSnapshot {
  // snapshot_uri addresses the snapshot's prefix in object storage.
  //
  // +k8s:required
  // +k8s:maxLength=2048 # the template's storage_location bound plus the owner prefix and snapshot name
  string snapshot_uri = 1;

  // content_scope is what the snapshot captured.
  //
  // +k8s:optional
  // +k8s:minimum=1
  // +k8s:maximum=2 # keep this in sync with the SnapshotContentScope enum
  SnapshotContentScope content_scope = 2;

  // UID of the ActorTemplate whose sandbox this snapshot's guest state was
  // captured from.
  //
  // +k8s:optional
  // +k8s:format=k8s-uuid
  string actor_template_uid = 3;
}

// LocalSnapshot records information about a node-local snapshot.
message LocalSnapshot {
  // The name of the local checkpoint on the node. Checkpoint names are
  // server-generated UUIDs, but any resource name is valid here.
  //
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string snapshot_name = 1;

  // Scope the pause checkpoint captured (the template's onCommit at pause
  // time).
  //
  // +k8s:optional
  // +k8s:minimum=1
  // +k8s:maximum=2 # keep this in sync with the SnapshotContentScope enum
  SnapshotContentScope content_scope = 2;
}

enum SnapshotContentScope {
  // Unspecified snapshot content scope.
  SNAPSHOT_CONTENT_SCOPE_UNSPECIFIED = 0;
  // Captures process memory, root filesystem changes, and durable data.
  SNAPSHOT_CONTENT_SCOPE_FULL = 1;
  // Captures durable data without process memory or root filesystem changes.
  SNAPSHOT_CONTENT_SCOPE_DATA = 2;
  // Keep this in sync with the maximums on fields of this type.
}

enum TagScope {
  // Not set and rejected wherever a client supplies a scope
  TAG_SCOPE_UNSPECIFIED = 0;
  // May initialize Actors only in the tag's owning Atespace.
  TAG_SCOPE_ATESPACE = 1;
  // Published for use by Actors in any Atespace. The tag remains addressed
  // through its owning Atespace.
  TAG_SCOPE_PUBLISHED = 2;
}

// Selector matches worker pools by label.
// Only equality-based matching is supported.
message Selector {
  // match_labels selects by exact equality on a set of labels.
  //
  // +k8s:optional
  // +k8s:unionMember
  // +k8s:minProperties=1
  // +k8s:maxProperties=10
  // +k8s:eachKey=+k8s:format=k8s-label-key
  // +k8s:eachVal=+k8s:format=k8s-label-value
  map<string, string> match_labels = 1;
}

// ResourceMetadata holds the common fields carried by every Substrate resource.
//
// +k8s:customValidation # timestamps must be valid, and update_time must not precede create_time
message ResourceMetadata {
  // atespace is the namespace the resource belongs to. Empty for global-scoped
  // resources. Caller-specified at creation and immutable thereafter.
  //
  // Atespaced resources should add `+k8s:subfield(atespace)=+k8s:required`
  // Non-atespaced resources should add `+k8s:subfield(atespace)=+k8s:forbidden`
  // +k8s:optional
  // +k8s:format=k8s-short-name
  // +k8s:immutable
  string atespace = 1;

  // name is the resource's name, unique within its atespace (or globally, for
  // global-scoped resources). Caller-specified at creation and immutable thereafter.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  // +k8s:immutable
  string name = 2;

  // uid is a server-assigned, globally unique identifier for this resource.
  // Immutable throughout the lifecycle of the resource.
  //
  // This field is ignored during create operations and used as precondition
  // for update operations.
  //
  // +k8s:optional
  // +k8s:format=k8s-uuid
  // +k8s:immutable
  string uid = 3;

  // version is increased on every mutation.
  //
  // This field is ignored during create operations and used as precondition
  // for update operations.
  //
  // +k8s:optional
  // +k8s:alpha(since: "0.0")=+k8s:monotonic # TODO: get rid of alpha prefix
  // +k8s:minimum=1
  // +k8s:update=NoUnset
  int64 version = 4;

  // create_time is the time the resource was created.
  //
  // This field is ignored on input.
  //
  // +k8s:optional
  // +k8s:immutable
  google.protobuf.Timestamp create_time = 5;

  // update_time is the time the resource was last updated.
  //
  // This field is ignored on input.
  //
  // +k8s:optional
  // +k8s:update=NoUnset
  google.protobuf.Timestamp update_time = 6;
}

message ExternalVolume {
  // Name of the volume specified in the actor template. Template volume
  // names are DNS labels.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  // +k8s:update=NoModify
  // +k8s:update=NoUnset # set-once; immutable would reject the create
  // ratchet's nil->set when the final object is validated as an update
  string volume_name = 1;

  // The globally unique volume_id returned from the storage system.
  // This will be initially empty during volume creation. Its format is the
  // storage system's own, so it is only bounded and checked for control
  // characters (U+0000-U+0008, U+000B, U+000C, U+000E-U+001F, U+007F-U+009F).
  // The CSI spec caps IDs at 128 bytes but does not require it, so allow
  // some slack. Set once when provisioning completes, then never changed.
  //
  // +k8s:optional
  // +k8s:maxLength=256
  // +k8s:update=NoModify
  // +k8s:update=NoUnset
  // +k8s:customValidation # no control characters
  string storage_volume_id = 2;

  // Internal volume plugin name or CSI driver name, from the StorageClass
  // provisioner. Must be a DNS subdomain, optionally prefixed with
  // "substrate.io/" (per the CSI spec's driver-name syntax).
  //
  // +k8s:required
  // +k8s:maxLength=253
  // +k8s:update=NoModify
  // +k8s:update=NoUnset # set-once, like volume_name above
  // +k8s:customValidation
  string volume_type = 3;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    // Volume creation pending in the storage system.
    STATUS_PENDING = 1;
    // Volume successfully created in the storage system.
    STATUS_CREATED = 2;
    // Volume being deleted from the storage system.
    STATUS_DELETING = 3;
    // Keep this in sync with ExternalVolume.status's maximum.
  }

  // +k8s:optional
  // +k8s:minimum=1
  // +k8s:maximum=3 # keep this in sync with the Status enum
  Status status = 4;

  // volume_context contains metadata returned by the CSI driver during volume
  // provisioning, needed by the node plugin for mounting (e.g. attachment
  // info). Keys and values are the driver's own, so they are only bounded,
  // not validated.
  //
  // +k8s:optional
  // +k8s:maxProperties=32
  // +k8s:eachKey=+k8s:maxLength=128
  // +k8s:eachVal=+k8s:maxLength=256
  map<string, string> volume_context = 5;
}

message Actor {
  // Common resource metadata: atespace, name, uid, version, timestamps.
  //
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  ResourceMetadata metadata = 1;

  // TODO: replace with full actor_template spec if we decide to make each Actor self-contained.
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  // +k8s:mutable
  ObjectRef actor_template = 4;

  // worker_selector is the per-actor placement constraint. The scheduler
  // evaluates the AND of this selector and the template's workerSelector to
  // find eligible pools.
  // Changes take effect on the next ResumeActor call.
  //
  // +k8s:optional
  Selector worker_selector = 5;

  // The tag specified by the caller at CreateActor to seed this Actor from an
  // ActorSnapshot. Unset if the Actor was not created from a snapshot. Set
  // once at creation and immutable afterward.
  //
  // +k8s:optional
  // +k8s:subfield(atespace)=+k8s:required
  // +k8s:immutable
  ObjectRef source_tag = 6;

  // status is the system-managed state of the Actor. It is updated by the
  // server and ignored on input. It is always present in output.
  //
  // +k8s:optional
  ActorStatus status = 7;
}

// EgressPolicy is an egress policy resource nested under an Actor. An Actor has
// at most one egress policy resource, named "default".
//
message EgressPolicy {
  // Standard resource metadata. Atespace must match the parent Actor and name
  // must be "default". Both are caller-specified on create and immutable.
  // UID, version, create_time, and update_time are server-managed.
  //
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  // +k8s:customValidation # name must be "default"
  ResourceMetadata metadata = 1;

  // Rules are an unordered set of allows. Traffic is denied when no rule
  // matches.
  //
  // For a given destination name and port, exactly one rule decides,
  // whatever its protocol. When more than one rule matches, the winner is
  // chosen by these criteria, in order, moving to the next one on a tie:
  //
  //   * A matching hostname without a wildcard.
  //   * A matching port number rather than all ports.
  //
  // Two rules with the same pattern on the same port, or both on all ports,
  // are rejected at admission.
  //
  // These criteria apply within a protocol and across protocols that decide
  // on the same input, such as an https and a tls_passthrough rule that match
  // the same pattern. Only the winning rule's effects are applied.
  //
  // +k8s:optional
  // +k8s:maxItems=256
  // +k8s:listType=atomic
  // +k8s:customValidation # no two rules tie on a name and port
  repeated EgressRule rules = 2;
}

// EgressRule allows traffic for a given protocol and destination (host name
// or IP, and port). The protocol fixes what the gateway matches on and when:
// a request, or a TLS connection at its ClientHello. Traffic that matches no
// rule is refused. All protocols here run over TCP; UDP is blocked. Protocols
// where the server sends first after connect are not supported.
//
// Users should expect additional protocols to be supported in the future.
message EgressRule {
  // Cleartext HTTP to the named hosts: HTTP/1.1, and h2c as used by gRPC.
  // TLS to these names is not allowed by this rule.
  //
  // +k8s:optional
  // +k8s:unionMember
  HTTPRule http = 1;

  // HTTPS to the named hosts, intercepted (man-in-the-middle) so the gateway
  // can authorize and modify each request. HTTP/1.1 and HTTP/2 inside the
  // TLS connection; HTTP/3 is not supported.
  //
  // +k8s:optional
  // +k8s:unionMember
  HTTPSRule https = 2;

  // TLS to the named servers, forwarded without decryption.
  //
  // +k8s:optional
  // +k8s:unionMember
  TLSPassthroughRule tls_passthrough = 3;
}

// HTTPRule allows cleartext HTTP and is evaluated per request on the request
// authority (Host or :authority) and port. The gateway resolves the name and
// dials it.
message HTTPRule {
  // Hostname patterns: a DNS name, or a DNS name with "*" as its leftmost
  // label. The rule matches when any pattern matches.
  //
  // The DNS name must conform to RFC 1034 and RFC 1123. It must be lowercase
  // and must not have a trailing dot.
  //
  // A wildcard replaces the complete leftmost label. "*.example.com" matches
  // exactly one non-empty label, such as "api.example.com". It does not match
  // "example.com" or "nested.api.example.com". "*" alone matches every name.
  // No other wildcard syntax is accepted. A pattern without a wildcard matches
  // only the complete normalized name. Patterns may overlap: the rule ranks
  // by the most specific pattern that matches the destination.
  //
  // Internationalized names must use their IDNA A-label (punycode) form; no
  // Unicode conversion is performed. URLs, IP addresses, names with ports,
  // malformed DNS names (for example, "foo..example.com"), and more than one
  // trailing dot are invalid.
  //
  // +k8s:required
  // +k8s:maxItems=256
  // +k8s:listType=set
  // +k8s:customValidation # format
  repeated string hostnames = 1;

  // Ports of the destination the Actor connected to. A port in a request's
  // authority is neither matched nor dialed. Defaults to port 80.
  //
  // +k8s:optional
  Ports ports = 2;

  // Effects do not authorize traffic. They are applied only when this is the
  // deciding rule.
  //
  // +k8s:optional
  HttpRuleEffects effects = 3;
}

// HTTPSRule allows HTTPS that the gateway intercepts (MITM). Every Actor behind such
// a rule must trust the gateway CA. Without it, TLS to these names fails in the
// Actor.
//
// A TLS connection whose SNI and port match is terminated with a leaf
// certificate for that name issued by the gateway CA. Each request inside it
// is then decided on its authority, and the gateway re-originates TLS to that
// authority; the SNI only selects the leaf.
//
// Interception is for HTTP. A connection that sends no SNI does not match,
// and a non-HTTP protocol inside an intercepted connection fails.
message HTTPSRule {
  // Server names matched against the SNI, in the pattern syntax of
  // HTTPRule.hostnames.
  //
  // +k8s:required
  // +k8s:maxItems=256
  // +k8s:listType=set
  // +k8s:customValidation # format
  repeated string hostnames = 1;

  // Ports of the destination the Actor connected to. Defaults to port 443.
  //
  // +k8s:optional
  Ports ports = 2;

  // Effects do not authorize traffic. They are applied only when this is the
  // deciding rule.
  //
  // +k8s:optional
  HttpRuleEffects effects = 3;
}

// TLSPassthroughRule allows TLS that the gateway forwards without decryption.
// It is evaluated once per connection at the ClientHello, on the SNI and
// port, for any protocol carried over TLS. A connection that sends no SNI
// does not match. Protocols that upgrade to TLS after a cleartext exchange
// (STARTTLS) do not match. Because the gateway reads nothing after the
// ClientHello, a passthrough rule has no effects, and a policy change reaches
// an open connection only when it ends.
message TLSPassthroughRule {
  // Server names matched against the SNI, in the pattern syntax of
  // HTTPRule.hostnames.
  //
  // +k8s:required
  // +k8s:maxItems=256
  // +k8s:listType=set
  // +k8s:customValidation # format
  repeated string hostnames = 1;

  // Ports of the destination the Actor connected to.
  //
  // +k8s:required
  Ports ports = 2;
}

// Ports selects the destination ports a rule matches. Every port, or a set
// of port numbers. all and numbers can not be set together.
message Ports {
  // Every port.
  //
  // +k8s:optional
  // +k8s:unionMember
  AllPorts all = 1;

  // Port numbers, without repeats.
  //
  // +k8s:optional
  // +k8s:unionMember
  // +k8s:maxItems=16
  // +k8s:listType=set
  // +k8s:eachVal=+k8s:minimum=1
  // +k8s:eachVal=+k8s:maximum=65535
  repeated int32 numbers = 2;
}

// AllPorts selects every port. It has no fields.
message AllPorts {}

// HttpRuleEffects contains effects applied by a matching HTTP or HTTPS rule.
//
// +k8s:customValidation # for "at least one" and duplicate headers
message HttpRuleEffects {
  // Replaces placeholder request headers with credentials. A header is
  // replaced only when the request from the Actor carries it; requests
  // without the header are forwarded unchanged, so a credential reaches only
  // the requests that ask for it. Header names must be unique
  // case-insensitively.
  //
  // Replacement is supported on HTTP and HTTPS. On HTTP, the gateway does
  // not originate TLS to the destination. Without separate transport
  // protection, observers can read the credential and attackers on the path
  // can modify the request. Deployments may encrypt traffic outside the
  // gateway; policy authors must account for any unprotected segments
  // between credential injection and the intended destination.
  //
  // +k8s:optional
  // +k8s:maxItems=16
  // +k8s:listType=map
  // +k8s:listMapKey=header
  // +k8s:customUnique # case-insensitive
  // +k8s:customValidation # for duplicate headers
  repeated CredentialHeader replace_headers = 1;
}

// CredentialHeader replaces the value of an HTTP request header with a
// credential. The Actor sends the header with a placeholder value, such as
// "Authorization: <something>"; the gateway discards that value and forwards
// the header with the credential instead. The placeholder itself is not
// inspected, so any value works. A request without the header is not
// modified.
message CredentialHeader {
  // The case-insensitive HTTP request header to replace when present.
  //
  // +k8s:required
  // +k8s:customValidation # format
  string header = 1;

  // Prepended verbatim to the credential value. Include any desired separator;
  // for example, use "Bearer " (including the space) for Authorization.
  //
  // +k8s:optional
  // +k8s:customValidation # format
  string prefix = 2;

  // Source-agnostic reference interpreted by a registered credential provider:
  // ate-secret://<provider-class>/<provider-name>/<provider-specific-tail>
  //
  // Exactly one of credential_uri and actor_jwt must be set.
  //
  // +k8s:optional
  // +k8s:unionMember
  // +k8s:customValidation # format
  string credential_uri = 3;

  // A Substrate-issued JWT asserting the identity of the Actor that sent the
  // request.
  //
  // +k8s:optional
  // +k8s:unionMember
  ActorJWTSource actor_jwt = 4;
}

// ActorJWTSource has the gateway mint a JWT for the Actor that sent the
// request. Relying parties verify it with OpenID Connect Discovery against its
// issuer. The gateway reuses a JWT across requests while enough of its
// lifetime remains, so its jti does not identify a single request.
message ActorJWTSource {
  // The audiences the JWT is bound to, which become its aud claim.
  //
  // +k8s:required
  // +k8s:maxItems=16
  // +k8s:listType=set
  // +k8s:eachVal=+k8s:minLength=1
  // +k8s:eachVal=+k8s:maxLength=512
  repeated string audiences = 1;

  // Lifetime of each JWT, in seconds.
  //
  // +k8s:required
  // +k8s:minimum=300
  // +k8s:maximum=3600
  int64 expiration_seconds = 2;
}

enum ActorState {
  ACTOR_STATE_UNSPECIFIED = 0;
  ACTOR_STATE_RESUMING = 1;
  ACTOR_STATE_RUNNING = 2;
  ACTOR_STATE_SUSPENDING = 3;
  ACTOR_STATE_SUSPENDED = 4;
  ACTOR_STATE_PAUSING = 5;
  ACTOR_STATE_PAUSED = 6;
  ACTOR_STATE_CRASHED = 7;
  ACTOR_STATE_DELETING = 8;
  ACTOR_STATE_REVERTING = 9;
  // Keep this in sync with ActorStatus.state's maximum.
}

message ActorStatus {
  // state is the Actor's current lifecycle state.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=9 # keep this in sync with the ActorState enum
  ActorState state = 1;

  // worker_assignment points at the worker currently hosting this Actor.
  // Unset whenever the Actor has no worker (SUSPENDED, PAUSED, CRASHED).
  //
  // +k8s:optional
  // +k8s:update=NoModify # can be set and cleared, but not changed in place
  WorkerAssignment worker_assignment = 2;

  // in_progress_snapshot_uri is the URI in object storage of the durable
  // snapshot the Actor is currently taking.
  //
  // +k8s:optional
  // +k8s:maxLength=2048 # the template's storage_location bound plus the owner prefix and snapshot name
  string in_progress_snapshot_uri = 3;

  // external_snapshot is the Actor's current external snapshot.
  // If the Actor was created from a Tag this is the tag's snapshot, borrowed
  // until the Actor's first suspend writes one of its own. Otherwise it is
  // unset until the Actor is first suspended.
  // +k8s:optional
  ExternalSnapshot external_snapshot = 4;

  // Node-local state used only while the Actor is paused.
  //
  // +k8s:optional
  LocalSnapshot local_snapshot = 5;

  // Volumes attached to the actor. These volumes only live as long as the actor.
  // They are deleted when the actor is deleted. Each template volume
  // appears at most once.
  //
  // +k8s:optional
  // +k8s:maxItems=32 # matches the template's volumes bound
  // +k8s:listType=map
  // +k8s:listMapKey=volume_name
  repeated ExternalVolume actor_volumes = 7;

  // The name of the in-progress node-local checkpoint. Like durable snapshot
  // names, these are server-generated UUIDs.
  //
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string in_progress_local_snapshot_name = 8;

  // crash records why and when the Actor entered CRASHED. It is set with the
  // CRASHED state and cleared when a revert returns the Actor to SUSPENDED.
  //
  // +k8s:optional
  ActorCrash crash = 9;

  // assigned_node is the Kubernetes node the Actor is currently attached to
  // (hosting its active worker or its node-local snapshots). Unset when the
  // Actor is detached from any node.
  //
  // +k8s:optional
  // +k8s:format=k8s-long-name
  string assigned_node = 10;
}

// ActorCrash describes the failure that moved an Actor to CRASHED.
message ActorCrash {
  // message is a human-readable description of the failure.
  //
  // +k8s:optional
  // +k8s:maxLength=4096
  string message = 1;

  // crash_time is when the Actor entered CRASHED.
  //
  // +k8s:optional
  google.protobuf.Timestamp crash_time = 2;
}

// WorkerAssignment points at the Worker currently hosting an Actor.
//
// This is a denormalized snapshot, not merely a reference: atenet reads
// worker_pod_ips on the request-routing path and must not need a second lookup,
// and kubectl-ate displays the pod name. The copies stay valid for the life of
// the assignment because a Worker's identity fields are immutable.
//
// Pass `worker` to GetWorker; none of the denormalized fields identify the
// Worker to the API.
message WorkerAssignment {
  // worker references the assigned Worker. This is the field to look the Worker
  // up by; the worker_* fields below are a denormalized copy kept so that
  // readers on a hot path do not have to fetch the Worker at all.
  //
  // Workers are global-scoped, so this carries no atespace.
  //
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  // +k8s:required
  ObjectRef worker = 6;

  // worker_namespace is the Kubernetes namespace of the WorkerPool and worker Pod.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string worker_namespace = 1;

  // worker_pool is the name of the WorkerPool the worker belongs to.
  //
  // +k8s:required
  // +k8s:format=k8s-long-name
  string worker_pool = 2;

  // worker_pod is the name of the Kubernetes pod hosting the Actor.
  //
  // +k8s:required
  // +k8s:format=k8s-long-name
  string worker_pod = 3;

  // worker_pod_uid is the Kubernetes UID of worker_pod.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string worker_pod_uid = 4;

  // worker_pod_ips are the IPs of worker_pod, copied from Worker.ips.
  //
  // +k8s:required
  // +k8s:maxItems=2
  // +k8s:listType=atomic
  // +k8s:customValidation # until `format=k8s-ip` is supported
  repeated string worker_pod_ips = 5;

  // node_name is the Kubernetes node hosting worker_pod.
  //
  // +k8s:required
  // +k8s:format=k8s-long-name
  string node_name = 7;

  // worker_epoch is the Worker's epoch when the Actor was placed on it. 0 if
  // the Worker had not reported one.
  //
  // +k8s:optional
  // +k8s:minimum=0
  int64 worker_epoch = 8;
}

// TagStatus is the server-owned state of a Tag.
// The tag is fixed to one external snapshot once its creation completes, so
// the rest is immutable provenance.
message TagStatus {
  // snapshot is the external snapshot this tag points at. Unset while the tag
  // is still being created, and immutable once set: a tag never moves between
  // snapshots. A tag is usable only once this is set.
  //
  // +k8s:optional
  ExternalSnapshot snapshot = 1;

  // UID of the ActorTemplate the snapshot was taken under. Actors can only be
  // seeded from a tag under the same template.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_template_uid = 2;

  // storage_location is the base object-storage URI for this tag's snapshot.
  // Set by the server from the source actor's template when the tag is created
  // and immutable thereafter. The full snapshot URI is available in
  // snapshot.snapshot_uri once tag creation completes.
  //
  // +k8s:required
  // +k8s:maxLength=1024
  string storage_location = 3;
}

// Tag is an Atespace-owned, stable name for one external snapshot. The
// external snapshot pointed by a tag is a copy of an actor snapshot. The
// snapshot is copied when the tag is created, and deleted when the tag is. Its
// owning Atespace cannot be deleted until the tag is removed.
message Tag {
  // Common resource metadata: atespace, name, uid, version, timestamps.
  //
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  ResourceMetadata metadata = 1;

  // status is set by the control plane; it is ignored on write.
  //
  // +k8s:optional
  TagStatus status = 2;

  // scope controls who may create an Actor from this tag.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=2 # keep this in sync with the TagScope enum
  TagScope scope = 3;

  // source_actor is the suspended Actor whose external snapshot this tag
  // captures. The tag lives in this Actor's Atespace. Set once at creation and
  // immutable afterward.
  //
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  // +k8s:immutable
  ObjectRef source_actor = 4;
}

// Atespace is the isolation boundary an Actor is created into. Global-scoped:
// metadata.atespace is always empty; the atespace's identity is metadata.name.
message Atespace {
  // Common resource metadata: name, uid, version, timestamps.
  //
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ResourceMetadata metadata = 1;
}

// ObjectRef references a Substrate resource by its atespace and name.
message ObjectRef {
  // The atespace of the referenced resource. This field should be empty if the
  // target resource is global-scoped, but references to objects in the same
  // atespace as the referrer must still populate this field.
  //
  // References to atespaced resources should add `+k8s:subfield(atespace)=+k8s:required`
  // References to non-atespaced resources should add `+k8s:subfield(atespace)=+k8s:forbidden`
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string atespace = 1;

  // The name of the referenced resource. This field is required.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 2;
}

// SandboxClass selects the sandbox runtime family. Snapshots are not portable
// across classes.
enum SandboxClass {
  SANDBOX_CLASS_UNSPECIFIED = 0;
  SANDBOX_CLASS_GVISOR = 1;
  SANDBOX_CLASS_MICROVM = 2;
  // Keep this in sync with SandboxConfig.sandbox_class's maximum.
}

message ActorTemplate {
  // Common resource metadata: atespace, name, uid, version, timestamps.
  //
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  ResourceMetadata metadata = 1;

  // worker_selector restricts which worker pools actors from this template
  // may use.
  //
  // +k8s:optional
  Selector worker_selector = 2;

  // +k8s:required # at least one container
  // +k8s:maxItems=10
  // +k8s:listType=map
  // +k8s:listMapKey=name
  repeated Container containers = 3;

  // +k8s:optional
  // +k8s:maxItems=32
  // +k8s:listType=map
  // +k8s:listMapKey=name
  repeated Volume volumes = 4;

  // +k8s:required
  SnapshotConfig snapshot_config = 5;

  // sandbox_config selects the sandbox runtime this version's actors run on.
  //
  // +k8s:required
  SandboxConfig sandbox_config = 6;

  // Resource usage configuration.
  //
  // +k8s:optional
  Resources resources = 7;

  // +k8s:optional
  ActorTemplateStatus status = 8;
}

message Resources {
  // limits is the maximum amount of compute resources allowed. Only "cpu"
  // and "memory" are supported, each at most once, and each quantity must be
  // greater than zero; the cpu limit must be less than 1000 cores.
  //
  // +k8s:optional
  // +k8s:maxItems=2
  // +k8s:listType=map
  // +k8s:listMapKey=name
  repeated Limits limits = 1;
}

// +k8s:customValidation # names, quantity parse/positivity, cpu bound
message Limits {
  // +k8s:required
  // +k8s:maxLength=16 # the Limits hook restricts values to cpu/memory
  string name = 1;

  // quantity is in Kubernetes resource.Quantity string form (e.g. "500m",
  // "2Gi").
  //
  // +k8s:required
  // +k8s:maxLength=32 # the Limits hook requires a parseable quantity
  string quantity = 2;
}

message GoldenSnapshotStatus {
  // golden_tag owns the immutable snapshot built by the template controller.
  // Set after tagging the snapshot and deleting the temporary golden Actor.
  // +k8s:optional
  // +k8s:subfield(atespace)=+k8s:required
  ObjectRef golden_tag = 1;

  // take_golden_snapshot_at is when the golden-actor warmup ends and the
  // golden snapshot may be taken.
  //
  // +k8s:optional
  google.protobuf.Timestamp take_golden_snapshot_at = 2;

  // error_message is set when the golden snapshot build fails and will not be
  // retried, formatted as "<Reason>: <detail>". A nonempty value is terminal.
  //
  // +k8s:optional
  // +k8s:maxLength=4096
  string error_message = 3;
}

message ActorTemplateStatus {
  // +k8s:optional
  GoldenSnapshotStatus golden_snapshot_status = 1;
}

// SandboxConfig selects the sandbox runtime for an ActorTemplate.
message SandboxConfig {
  // sandbox_class selects the sandbox runtime family.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=2 # keep this in sync with the SandboxClass enum
  SandboxClass sandbox_class = 1;

  // config_name names the cluster-scoped SandboxConfig Kubernetes object
  // supplying the sandbox binaries. Required; must match sandbox_class.
  //
  // +k8s:required
  // +k8s:format=k8s-long-name
  string config_name = 2;
}

// SnapshotConfig selects what actor snapshots capture and where they are
// stored. A FULL snapshot resumes from its own content. A DATA snapshot
// resumes by starting the containers afresh from the OCI image, with the
// durable-dir volumes populated from the snapshot.
message SnapshotConfig {
  // on_commit defines the scope of every snapshot taken of an actor, both
  // the node-local one captured on pause and the one uploaded on suspend.
  // Defaults to FULL when unset.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=2 # keep this in sync with the SnapshotContentScope enum
  SnapshotContentScope on_commit = 2;

  // storage_location is the base object-storage URI snapshots of actors on
  // this version are stored under. Required.
  //
  // +k8s:required
  // +k8s:maxLength=1024
  // +k8s:customValidation # Validate URI
  string storage_location = 4;
}

// Container is a single application container of an ActorTemplate.
message Container {
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;

  // image is the OCI image reference the container runs:
  // [registry/]repository[:tag]@digest. Must be pinned by digest
  // (e.g. "name@sha256:...").
  //
  // +k8s:required
  // +k8s:maxLength=512 # matches ImageVolumeSource.reference's bound
  // +k8s:customValidation # must be a well-formed image reference, pinned by digest
  string image = 2;

  // Entrypoint array; when set, the image's ENTRYPOINT and CMD are both
  // ignored and the process argv is command + args. Unlike Kubernetes,
  // $(VAR_NAME) references are NOT expanded.
  //
  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=atomic
  // +k8s:eachVal=+k8s:maxLength=4096 # argv strings; guardrail, not a contract
  repeated string command = 3;

  // Arguments to the entrypoint; the image's CMD is used if unset (unless
  // command is set, which discards the image's CMD).
  //
  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=atomic
  // +k8s:eachVal=+k8s:maxLength=4096 # argv strings; guardrail, not a contract
  repeated string args = 4;

  // Env variables to set in the container's process environment. Unlike
  // Kubernetes, $(VAR_NAME) references are NOT expanded in this field.
  //
  // +k8s:optional
  // +k8s:maxItems=32
  // +k8s:listType=map # each variable is set at most once
  // +k8s:listMapKey=name
  repeated EnvVar env = 5;

  // wakeup_probe gates each wakeup on this container: ResumeActor returns
  // only after the probe answers HTTP 200. Without it, ResumeActor returns
  // as soon as the container has started, which may be before it listens.
  //
  // +k8s:optional
  ContainerWakeupProbe wakeup_probe = 6;

  // Keyed by mount_path: each path hosts exactly one mount, while a volume
  // may be mounted at multiple paths.
  //
  // +k8s:optional
  // +k8s:maxItems=32
  // +k8s:listType=map
  // +k8s:listMapKey=mount_path
  // +k8s:customValidation # mounts must not nest
  repeated VolumeMount volume_mounts = 7;

  // security_context adjusts the container's security settings. Unset leaves
  // the default capability set.
  //
  // +k8s:optional
  SecurityContext security_context = 8;

  // resources carries this container's compute limits, enforced inside the
  // actor's sandbox. Only cpu and memory limits are supported.
  //
  // +k8s:optional
  Resources resources = 9;
}

// SecurityContext holds security settings for a container's process,
// modeling a subset of the Kubernetes container securityContext.
message SecurityContext {
  // capabilities adjusts the Linux capabilities of the container's process.
  //
  // +k8s:optional
  Capabilities capabilities = 1;
}

// Capabilities adjusts a container's Linux capabilities relative to the
// default set. Drop applies first, then add, so a capability in both is
// granted. Capabilities are named without the "CAP_" prefix; "ALL" in drop
// removes the whole default set.
message Capabilities {
  // add lists capabilities to grant on top of the default set. "ALL" is
  // rejected: name the individual capabilities the container needs.
  //
  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=set
  // +k8s:customValidation # capability grammar; "ALL" not accepted
  repeated string add = 1;

  // drop lists capabilities to remove from the default set. "ALL" drops the
  // whole set, so drop+add expresses an exact set rather than a relative one.
  //
  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=set
  // +k8s:customValidation # capability grammar
  repeated string drop = 2;
}

// EnvVar supplies one environment variable to a container. Values are not
// expanded with Kubernetes-style $(VAR) references.
message EnvVar {
  // name may be any printable ASCII character except '='.
  //
  // +k8s:required
  // +k8s:maxLength=256 # guardrail;
  // +k8s:customValidation # printable ASCII except '='
  string name = 1;

  // value is the literal value.
  //
  // +k8s:optional
  // +k8s:maxLength=32768 # guardrail;
  string value = 2 [ debug_redact = true ];
}

// ContainerWakeupProbe tells the platform when a container is serving. It is
// polled on every wakeup, whether the actor cold-boots or is restored from a
// snapshot, and not again while the actor stays running. A probe that does
// not answer 200 within timeout_seconds crashes the actor.
message ContainerWakeupProbe {
  // http_get is the request to poll.
  //
  // +k8s:required
  HTTPGetAction http_get = 1;

  // timeout_seconds is how long to keep polling before giving up.
  // Defaults to 30 when unset.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=3600
  int32 timeout_seconds = 2;
}

// HTTPGetAction describes the HTTP GET the probe polls.
message HTTPGetAction {
  // path must be a URL path starting with "/", using only RFC 3986
  // path-segment characters, without query or fragment.
  // Defaults to "/" when unset.
  //
  // +k8s:required
  // +k8s:maxLength=1024
  // +k8s:customValidation # RFC 3986 path shape; no regex/pattern tag exists
  string path = 1;

  // port is the container port to connect to.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=65535
  int32 port = 2;
}

message Volume {
  // name of the volume. Must be a DNS label.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;

  // Exactly one of durable_dir / external_volume_template / image /
  // system_info must be set.
  //
  // +k8s:optional
  // +k8s:unionMember
  DurableDirVolumeSource durable_dir = 2;

  // +k8s:optional
  // +k8s:unionMember
  ExternalVolumeTemplate external_volume_template = 3;

  // +k8s:optional
  // +k8s:unionMember
  SystemInfoVolumeSource system_info = 5;

  // image mounts the contents of an OCI image, read-only.
  //
  // +k8s:optional
  // +k8s:unionMember
  ImageVolumeSource image = 6;
}

// ImageVolumeSource mounts the contents of an OCI image, read-only. The
// reference must include a digest: changing the image invalidates
// snapshots.
message ImageVolumeSource {
  // reference is the OCI image reference. Must include a digest
  // (e.g. "name@sha256:...").
  //
  // +k8s:required
  // +k8s:maxLength=512
  // +k8s:customValidation # must be a well-formed image reference, pinned by digest
  string reference = 1;
}

// DurableDirVolumeSource is a durable directory on rootfs that persists
// across resumes and participates in snapshots.
message DurableDirVolumeSource {}

// ExternalVolumeTemplate provisions an external volume per actor; the volume
// lives only as long as the actor.
message ExternalVolumeTemplate {
  // capacity of the volume to create, in Kubernetes resource.Quantity string
  // form (e.g. "10Gi"). Required.
  //
  // +k8s:required
  // +k8s:maxLength=32 # matches Limits.quantity's bound
  // +k8s:customValidation # must parse as a resource.Quantity
  string capacity = 1;

  // storage_class_name names the cluster-scoped Kubernetes StorageClass to
  // create the volume from. Required.
  //
  // +k8s:required
  // +k8s:format=k8s-long-name
  string storage_class_name = 2;
}

// SystemInfoVolumeSource is a read-only volume of substrate-generated
// per-actor files (identity fields, projected trust bundles), regenerated by
// atelet on every Run/Restore.
message SystemInfoVolumeSource {
  // data_sources lists the projections to place within the volume. At most
  // one actor_metadata entry may appear, and file paths must be unique
  // across all entries.
  //
  // +k8s:optional
  // +k8s:maxItems=8
  // +k8s:listType=atomic
  // +k8s:customValidation # paths unique across entries
  repeated SystemInfoDataSource data_sources = 1;
}

message SystemInfoDataSource {
  // Exactly one of actor_metadata / trust_bundle must be set.
  //
  // +k8s:optional
  // +k8s:unionMember
  ActorMetadataDataSource actor_metadata = 1;

  // +k8s:optional
  // +k8s:unionMember
  TrustBundleDataSource trust_bundle = 2;
}

// ActorMetadataDataSource projects the actor's identity fields to files, one
// per item.
message ActorMetadataDataSource {
  // items must not project the same field twice, and item paths must be
  // unique.
  //
  // +k8s:required
  // +k8s:minItems=1
  // +k8s:maxItems=8
  // +k8s:listType=atomic
  // +k8s:unique=map
  // +k8s:listMapKey=field
  repeated ActorMetadataItem items = 1;
}

// ActorMetadataItem projects one actor identity field to a file at path,
// a clean relative Unix path from the root of the volume.
message ActorMetadataItem {
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=3 # keep this in sync with the ActorMetadataField enum
  ActorMetadataField field = 1;

  // path must be a clean relative Unix path: at most 16 '/'-separated
  // segments, none of them empty, '.' or '..', and no NUL byte.
  //
  // +k8s:required
  // +k8s:minLength=1
  // +k8s:maxLength=255
  // +k8s:customValidation # projected-path rule shared with atelet, see internal/volumepath
  string path = 2;
}

// ActorMetadataField selects one identity field of the actor.
enum ActorMetadataField {
  ACTOR_METADATA_FIELD_UNSPECIFIED = 0;
  ACTOR_METADATA_FIELD_NAME = 1;
  ACTOR_METADATA_FIELD_ATESPACE = 2;
  ACTOR_METADATA_FIELD_UID = 3;
  // Keep this in sync with ActorMetadataItem.field's maximum.
}

// TrustBundleDataSource projects the trust anchors of the named trust bundle
// to a PEM file at path. Supported names are allowlisted in atelet.
message TrustBundleDataSource {
  // One or more named trust bundles to unify and place at the specified path.
  //
  // Substrate supports a short list of predefined names:
  //
  // * egress-mitm.ate.dev --- The trust anchors for the Substrate egress
  //   gateway TLS man-in-the-middle interceptor.
  //
  // * system-roots.ate.dev --- A selection of well-known public CA root certificates,
  //   built into Substrate
  //
  // +k8s:required
  // +k8s:minItems=1
  // +k8s:maxItems=8
  // +k8s:eachVal=+k8s:minLength=1
  // +k8s:eachVal=+k8s:maxLength=253
  // +k8s:listType=set
  repeated string names = 3;

  // path must be a clean relative Unix path: at most 16 '/'-separated
  // segments, none of them empty, '.' or '..', and no NUL byte.
  //
  // +k8s:required
  // +k8s:minLength=1
  // +k8s:maxLength=255
  // +k8s:customValidation # projected-path rule shared with atelet, see internal/volumepath
  string path = 2;

  reserved 1;
  reserved "name";
}

// VolumeMount mounts a named Volume into a container.
message VolumeMount {
  // name must match the name of a Volume.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;

  // mount_path within the container. Must be a clean absolute Unix path:
  // must start with '/', not be '/', and contain no ':', '..', '.', '//',
  // trailing '/', or control characters.
  //
  // +k8s:required
  // +k8s:maxLength=4096
  // +k8s:customValidation # clean-absolute-path shape; no regex/pattern tag exists
  string mount_path = 2;
}

message CreateAtespaceRequest {
  // The atespace to create.
  //
  // +k8s:required
  Atespace atespace = 1;
}

message GetAtespaceRequest {
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ObjectRef atespace = 1;
}

message ListAtespacesRequest {
  // Requested page size; the server may return fewer, or occasionally
  // slightly more. If unspecified, defaults to a server-chosen value;
  // values above 1000 are coerced to 1000.
  //
  // +k8s:optional
  // +k8s:minimum=1
  int32 page_size = 1;

  // Pagination token from a previous ListAtespaces response.
  // Omit or leave empty for the first request.
  //
  // +k8s:optional
  // +k8s:maxLength=256
  string page_token = 2;
}

message ListAtespacesResponse {
