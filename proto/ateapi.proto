  int64 version = 1;

  // Delete only if the resource still has this uid, that is, it is the one
  // the caller read and not a later one created under the same name. Empty
  // skips the check.
  //
  // +k8s:optional
  // +k8s:format=k8s-uuid
  string uid = 2;
}

