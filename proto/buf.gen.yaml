version: v2
# Keep the hand-written a2a_pb2 compatibility shim in the shared Python output.
clean: false
inputs:
  - directory: .
    exclude_paths:
      - a2a.proto
      - ateapi.proto
      - ateenv/v1alpha/guest.proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../go/api/gen
    opt:
      - paths=source_relative
      - Ma2a.proto=github.com/a2aproject/a2a-go/v2/a2apb/v1
  - remote: buf.build/grpc/go:v1.6.2
    out: ../go/api/gen
    opt:
      - paths=source_relative
      - Ma2a.proto=github.com/a2aproject/a2a-go/v2/a2apb/v1
  # StructuredObject is also consumed directly by kagent-core's envelope helpers.
  - remote: buf.build/protocolbuffers/python:v33.5
    out: ../python/packages/kagent-proto/src
    types:
      - kagent.runtime.v1.MemoryService
      - kagent.runtime.v1.TaskStoreService
      - kagent.api.v1.StructuredObject
      - kagent.config.v1.ADKConfig
  - remote: buf.build/protocolbuffers/pyi:v33.5
    out: ../python/packages/kagent-proto/src
    types:
      - kagent.runtime.v1.MemoryService
      - kagent.runtime.v1.TaskStoreService
      - kagent.api.v1.StructuredObject
      - kagent.config.v1.ADKConfig
  - remote: buf.build/grpc/python:v1.83.0
    out: ../python/packages/kagent-proto/src
    types:
      - kagent.runtime.v1.MemoryService
      - kagent.runtime.v1.TaskStoreService
      - kagent.api.v1.StructuredObject
