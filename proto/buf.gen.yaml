version: v2
# Keep the hand-written a2a_pb2 compatibility shim in the shared Python output.
clean: false
inputs:
  - directory: .
    exclude_paths:
      - a2a.proto
      - api/ateapi/v1/ateapi.proto
      - ateenv/v1alpha/guest.proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../go/api/gen
    opt:
      - paths=source_relative
      - Ma2a.proto=github.com/a2aproject/a2a-go/v2/a2apb/v1
  - remote: buf.build/grpc/go:v1.6.2
    out: ../go/api/gen
    opt:
      - paths=source_relative
      - Ma2a.proto=github.com/a2aproject/a2a-go/v2/a2apb/v1
  # StructuredObject is also consumed directly by kagent-core's envelope helpers.
  - remote: buf.build/protocolbuffers/python:v33.5
    out: ../python/packages/kagent-proto/src
    types:
      - kagent.runtime.v1.MemoryService
      - kagent.runtime.v1.TaskStoreService
      - kagent.api.v1.StructuredObject
      - kagent.api.v1.ToolActivity
      - kagent.api.v1.HitlTool
      - kagent.api.v1.NestedHitlRequest
      - kagent.api.v1.ToolApprovalRequest
      - kagent.api.v1.ToolApproval
      - kagent.api.v1.ToolApprovalResponse
      - kagent.api.v1.HitlQuestion
      - kagent.api.v1.AskUserRequest
      - kagent.api.v1.AskUserAnswer
      - kagent.api.v1.AskUserResponse
      - kagent.api.v1.ListSessionsInput
      - kagent.api.v1.SessionSummary
      - kagent.api.v1.ListSessionsOutput
      - kagent.api.v1.InvokeSessionInput
      - kagent.api.v1.InvokeSessionOutput
      - kagent.config.v1.ADKConfig
  - remote: buf.build/protocolbuffers/pyi:v33.5
    out: ../python/packages/kagent-proto/src
    types:
      - kagent.runtime.v1.MemoryService
      - kagent.runtime.v1.TaskStoreService
      - kagent.api.v1.StructuredObject
      - kagent.api.v1.ToolActivity
      - kagent.api.v1.HitlTool
      - kagent.api.v1.NestedHitlRequest
      - kagent.api.v1.ToolApprovalRequest
      - kagent.api.v1.ToolApproval
      - kagent.api.v1.ToolApprovalResponse
      - kagent.api.v1.HitlQuestion
      - kagent.api.v1.AskUserRequest
      - kagent.api.v1.AskUserAnswer
      - kagent.api.v1.AskUserResponse
      - kagent.api.v1.ListSessionsInput
      - kagent.api.v1.SessionSummary
      - kagent.api.v1.ListSessionsOutput
      - kagent.api.v1.InvokeSessionInput
      - kagent.api.v1.InvokeSessionOutput
      - kagent.config.v1.ADKConfig
  - remote: buf.build/grpc/python:v1.83.0
    out: ../python/packages/kagent-proto/src
    types:
      - kagent.runtime.v1.MemoryService
      - kagent.runtime.v1.TaskStoreService
      - kagent.api.v1.StructuredObject
  - remote: buf.build/bufbuild/protoschema-jsonschema:v0.6.0
    out: ../go/core/internal/mcp/schema
    types:
      - kagent.api.v1.ListSessionsInput
      - kagent.api.v1.ListSessionsOutput
      - kagent.api.v1.InvokeSessionInput
      - kagent.api.v1.InvokeSessionOutput
    opt: [target=json-bundle]
