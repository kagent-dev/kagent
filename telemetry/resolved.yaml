    brief: One execution segment of a kagent agent.
    id: kagent.invoke_agent.internal
    kind: internal
    name:
      note: |
        **Span name** SHOULD be `invoke_agent {gen_ai.agent.name}` if `gen_ai.agent.name` is readily available.
        When `gen_ai.agent.name` is not available, it SHOULD be `invoke_agent`.
        Semantic conventions for individual GenAI systems and frameworks MAY specify different span name format.
    note: |
      Named `invoke_agent {gen_ai.agent.name}`. kagent opens it only for a runtime that emits no invoke_agent span of its own. A resumed segment links to the segment that started the native turn, with `kagent.invocation.relationship` set to `resume_origin`.
    provenance:
      path: telemetry/registry/signals.yaml
    requirement_level: recommended
    stability: development
    type: gen_ai.invoke_agent.internal
