refinements:
  entities:
  - brief: An agent runtime compiled by kagent.
    description:
    - brief: The human-readable name of the invoked GenAI agent.
      examples:
      - Math Tutor
      - Fiction Writer
      key: gen_ai.agent.name
      note: The compiled agent identity, `\u003cagent\u003e`.
      provenance:
        path: telemetry/registry/signals.yaml
      requirement_level: required
      stability: development
      type: string
    - brief: The Generative AI provider as identified by the client or server instrumentation.
      key: gen_ai.provider.name
      note: The provider the agent is compiled against.
      provenance:
        source: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
      requirement_level:
        conditionally_required: The runtime is a harness compiled against one model.
      stability: development
      type:
        members:
        - brief: \u0027[OpenAI](https://openai.com/)\u0027
          id: openai
          stability: development
          value: openai
        - brief: Any Google generative AI endpoint
          id: gcp.gen_ai
          note: |
            May be used when specific backend is unknown.
          stability: development
          value: gcp.gen_ai
        - brief: \u0027[Vertex AI](https://cloud.google.com/vertex-ai)\u0027
          id: gcp.vertex_ai
          note: |
            Used when accessing the \u0027aiplatform.googleapis.com\u0027 endpoint.
          stability: development
          value: gcp.vertex_ai
        - brief: \u0027[Gemini](https://cloud.google.com/products/gemini)\u0027
          id: gcp.gemini
          note: |
            Used when accessing the \u0027generativelanguage.googleapis.com\u0027 endpoint. Also known as the AI Studio API.
          stability: development
          value: gcp.gemini
        - brief: \u0027[Anthropic](https://www.anthropic.com/)\u0027
          id: anthropic
          stability: development
          value: anthropic
        - brief: \u0027[Cohere](https://cohere.com/)\u0027
          id: cohere
          stability: development
          value: cohere
        - brief: Azure AI Inference
          id: azure.ai.inference
          stability: development
          value: azure.ai.inference
        - brief: \u0027[Azure OpenAI](https://learn.microsoft.com/en-us/azure/ai-services/openai/overview)\u0027
          id: azure.ai.openai
          stability: development
          value: azure.ai.openai
        - brief: \u0027[IBM Watsonx AI](https://www.ibm.com/products/watsonx-ai)\u0027
          id: ibm.watsonx.ai
          stability: development
          value: ibm.watsonx.ai
        - brief: \u0027[AWS Bedrock](https://aws.amazon.com/bedrock)\u0027
          id: aws.bedrock
          stability: development
          value: aws.bedrock
        - brief: \u0027[Perplexity](https://www.perplexity.ai/)\u0027
          id: perplexity
          stability: development
          value: perplexity
        - brief: \u0027[xAI](https://x.ai/)\u0027
          id: x_ai
          stability: development
          value: x_ai
        - brief: \u0027[DeepSeek](https://www.deepseek.com/)\u0027
          id: deepseek
          stability: development
          value: deepseek
        - brief: \u0027[Groq](https://groq.com/)\u0027
          id: groq
          stability: development
          value: groq
        - brief: \u0027[Mistral AI](https://mistral.ai/)\u0027
          id: mistral_ai
          stability: development
          value: mistral_ai
        - brief: \u0027[Moonshot AI](https://www.moonshot.ai/)\u0027
          id: moonshot_ai
          stability: development
          value: moonshot_ai
    - brief: The name of the GenAI model configured for the agent.
      examples: gpt-4
      key: gen_ai.request.model
      note: The model the agent is compiled against.
      provenance:
        path: telemetry/registry/signals.yaml
      requirement_level:
        conditionally_required: The runtime is a harness compiled against one model.
      stability: development
      type: string
    - brief: The runtime that produces the model and tool spans of an agent.
      key: kagent.runtime
      note: |
        Every runtime declares it on its resource. The name of a Harness object is not its runtime.
      provenance:
        path: telemetry/registry/kagent.yaml
      requirement_level: required
      stability: development
      type:
        members:
        - brief: The Go ADK runtime.
          id: adk_go
          stability: development
          value: adk-go
        - brief: The Python ADK runtime.
          id: adk_python
          stability: development
          value: adk-python
        - brief: The Claude Code harness.
          id: claude
          stability: development
          value: claude
        - brief: The Codex harness.
          id: codex
          stability: development
          value: codex
        - brief: The LangGraph runtime.
          id: langgraph
          stability: development
          value: langgraph
        - brief: The CrewAI runtime.
          id: crewai
          stability: development
          value: crewai
        - brief: The OpenAI Agents SDK runtime.
          id: openai_agents
          stability: development
          value: openai-agents
        - brief: A bring-your-own image built on kagent-core.
          id: byo
          stability: development
          value: byo
    id: kagent.agent
    identity:
    - brief: The unique and stable identifier of the GenAI hosted agent resource.
      examples:
      - asst_5j66UpCpwteGg4YSxUnt7lPY
      - arn:aws:bedrock:us-east-1:123:agent/42
      - urn:agent:projects-123:projects:123:locations:us-east1:aiplatform:reasoningEngines:456
      key: gen_ai.agent.id
      note: The agent identity qualified by its namespace, `\u003cnamespace\u003e/\u003cagent\u003e`.
      provenance:
        source: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
      requirement_level: required
      stability: development
      type: string
    note: |
      Conversation, task and user identity never appear here, since one runtime process serves many of each.
    provenance:
      path: telemetry/registry/signals.yaml
    requirement_level: recommended
    stability: development
    type: kagent.agent
  events: []
  metrics:
  - attributes:
    - brief: |
        Describes a class of error the operation ended with.
      examples:
      - timeout
      - java.net.UnknownHostException
      - server_certificate_invalid
      - \u0027500\u0027
      key: error.type
      note: |
        The gRPC status code name for Substrate errors, or `_OTHER` for other failures. Absent on success. Never raw error text or revision, template, UID, or namespace identity.
      provenance:
        path: telemetry/registry/signals.yaml
      requirement_level:
        conditionally_required: The attempt failed.
      stability: stable
      type:
        members:
        - brief: |
            A fallback error value to be used when the instrumentation doesn\u0027t define a custom value.
          id: other
          stability: stable
          value: _OTHER
    - brief: The stage of a runtime revision garbage collection attempt.
      key: kagent.gc.stage
      provenance:
        path: telemetry/registry/kagent.yaml
      requirement_level: required
      stability: development
      type:
        members:
        - brief: Discovering cleanup-eligible persisted revisions.
          id: discovery
          stability: development
          value: discovery
        - brief: Claiming, deleting compute for, or finalizing a revision.
          id: collection
          stability: development
          value: collection
    brief: Duration of a runtime revision garbage collection attempt.
    id: kagent.runtime_revision.gc.duration
    instrument: histogram
    name: kagent.runtime_revision.gc.duration
    note: |
      Records each discovery and each collection attempt, including the database claim, Substrate read and deletion, and database finalization. A no-op claim is a successful attempt. Parent cancellation is excluded; an operation deadline while the parent remains active is recorded as a failure. Explicit bucket boundaries in seconds are 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, and 60.
    provenance:
      path: telemetry/registry/signals.yaml
    requirement_level: recommended
    stability: development
    unit: s
  - brief: Number of cleanup-eligible runtime revisions in the last successful discovery.
    id: kagent.runtime_revision.gc.pending
    instrument: gauge
    name: kagent.runtime_revision.gc.pending
    note: |
      An observable integer gauge over a cached count, without collection-time database or network access. Absent before successful discovery and while inactive; zero means a successful empty discovery. Discovery errors retain the previous count while garbage collection is active.
    provenance:
      path: telemetry/registry/signals.yaml
    requirement_level: recommended
    stability: development
    unit: \u0027{revision}\u0027
  spans:
  - attributes:
    - brief: The A2A method that started the invocation.
      key: a2a.method
      provenance:
        path: telemetry/registry/a2a.yaml
      requirement_level: required
      stability: development
      type:
        members:
        - brief: A unary A2A request.
          id: send_message
          stability: development
          value: SendMessage
        - brief: A streaming A2A request.
          id: send_streaming_message
          stability: development
          value: SendStreamingMessage
    - brief: The A2A task that an invocation executes.
      examples:
      - 0f6a7c1e-3d2b-4b8e-9a51-2c7d8e4f1a90
      key: a2a.task.id
      note: |
        The GenAI conventions have no task identity, so it stays in the A2A namespace. Never on a resource or a metric.
      provenance:
        path: telemetry/registry/a2a.yaml
      requirement_level:
        conditionally_required: The gateway assigned an A2A task.
      stability: development
      type: string
    - brief: The A2A task state that execution reported.
      key: a2a.task.state
      note: |
        The values are the A2A v1 wire names. An absent state does not mean success.
      provenance:
        path: telemetry/registry/a2a.yaml
      requirement_level:
        conditionally_required: Execution reported a task state.
      stability: development
      type:
        members:
        - brief: The task was accepted.
          id: submitted
          stability: development
          value: TASK_STATE_SUBMITTED
        - brief: The task is running.
          id: working
          stability: development
          value: TASK_STATE_WORKING
        - brief: The task finished.
          id: completed
          stability: development
          value: TASK_STATE_COMPLETED
        - brief: The task failed.
          id: failed
          stability: development
          value: TASK_STATE_FAILED
        - brief: The task was canceled.
          id: canceled
          stability: development
          value: TASK_STATE_CANCELED
        - brief: The task waits for an approval or an answer.
          id: input_required
          stability: development
          value: TASK_STATE_INPUT_REQUIRED
        - brief: The agent rejected the task.
          id: rejected
          stability: development
          value: TASK_STATE_REJECTED
        - brief: The task waits for authentication.
          id: auth_required
          stability: development
          value: TASK_STATE_AUTH_REQUIRED
    - brief: Client address - domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain socket name.
      examples:
      - 83.164.160.102
      key: client.address
      note: |
        The IP address of the original client behind all proxies, if known (e.g. from [Forwarded#for](https://developer.mozilla.org/docs/Web/HTTP/Headers/Forwarded#for), [X-Forwarded-For](https://developer.mozilla.org/docs/Web/HTTP/Headers/X-Forwarded-For), or a similar header). Otherwise, the immediate client peer address.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: recommended
      sampling_relevant: true
      stability: stable
      type: string
    - brief: The port of whichever client was captured in `client.address`.
      examples:
      - 65123
      key: client.port
      note: |
        When observed from the server side, and when communicating through an intermediary, `client.port` SHOULD represent the client port behind any intermediaries,  for example proxies, if it\u0027s available.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      stability: stable
      type: int
    - brief: Unique identifier of an end user in the system. It maybe a username, email address, or other identifier.
      examples:
      - username
      key: enduser.id
      note: |
        Absent when the gateway forwarded no trusted identity. Never on a resource or a metric. Hashing the value is an operator decision.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: A trusted identity reached the runtime.
      stability: development
      type: string
    - brief: |
        Describes a class of error the operation ended with.
      examples:
      - timeout
      - java.net.UnknownHostException
      - server_certificate_invalid
      - \u0027500\u0027
      key: error.type
      note: |
        A bounded kagent vocabulary: `runtime_panic`, `invalid_request`, `continuation_unavailable`, `actor_unavailable`, `runtime_error`, `invalid_runtime_outcome`, `invalid_input_request`, `runtime_failure` and `transport_error`. Never a provider response, a credential or captured content.
      provenance:
        path: telemetry/registry/signals.yaml
      requirement_level:
        conditionally_required: The invocation failed.
      stability: stable
      type:
        members:
        - brief: |
            A fallback error value to be used when the instrumentation doesn\u0027t define a custom value.
          id: other
          stability: stable
          value: _OTHER
    - brief: The unique identifier for a conversation (session, thread), used to store and correlate messages within this conversation.
      examples:
      - conv_5j66UpCpwteGg4YSxUnt7lPY
      key: gen_ai.conversation.id
      note: The A2A context ID.
      provenance:
        path: telemetry/registry/signals.yaml
      requirement_level:
        conditionally_required: The gateway assigned an A2A context.
      stability: development
      type: string
    - brief: |
        The size of the request payload body in bytes. This is the number of bytes transferred excluding headers and is often, but not always, present as the [Content-Length](https://www.rfc-editor.org/rfc/rfc9110.html#field.content-length) header. For requests using transport encoding, this should be the compressed size.
      examples: 3495
      key: http.request.body.size
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      stability: development
      type: int
    - brief: |
        HTTP request headers, `\u003ckey\u003e` being the normalized HTTP Header name (lowercase), the value being the header values.
      examples:
      - - application/json
      - - 1.2.3.4
        - 1.2.3.5
      key: http.request.header
      note: |
        Instrumentations SHOULD require an explicit configuration of which headers are to be captured.
        Including all request headers can be a security risk - explicit configuration helps avoid leaking sensitive information.

        The `User-Agent` header is already captured in the `user_agent.original` attribute.
        Users MAY explicitly configure instrumentations to capture them even though it is not recommended.

        The attribute value MUST consist of either multiple header values as an array of strings
        or a single-item array containing a possibly comma-concatenated string, depending on the way
        the HTTP library provides access to headers.

        Examples:

        - A header `Content-Type: application/json` SHOULD be recorded as the `http.request.header.content-type`
          attribute with value `["application/json"]`.
        - A header `X-Forwarded-For: 1.2.3.4, 1.2.3.5` SHOULD be recorded as the `http.request.header.x-forwarded-for`
          attribute with value `["1.2.3.4", "1.2.3.5"]` or `["1.2.3.4, 1.2.3.5"]` depending on the HTTP library.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      sampling_relevant: true
      stability: stable
      type: template[string[]]
    - brief: HTTP request method.
      examples:
      - GET
      - POST
      - HEAD
      key: http.request.method
      note: |
        HTTP request method value SHOULD be "known" to the instrumentation.
        By default, this convention defines "known" methods as the ones listed in [RFC9110](https://www.rfc-editor.org/rfc/rfc9110.html#name-methods),
        the PATCH method defined in [RFC5789](https://www.rfc-editor.org/rfc/rfc5789.html)
        and the QUERY method defined in [httpbis-safe-method-w-body](https://datatracker.ietf.org/doc/draft-ietf-httpbis-safe-method-w-body/?include_text=1).

        If the HTTP request method is not known to instrumentation, it MUST set the `http.request.method` attribute to `_OTHER`.

        If the HTTP instrumentation could end up converting valid HTTP request methods to `_OTHER`, then it MUST provide a way to override
        the list of known HTTP methods. If this override is done via environment variable, then the environment variable MUST be named
        OTEL_INSTRUMENTATION_HTTP_KNOWN_METHODS and support a comma-separated list of case-sensitive known HTTP methods.

        ![Development](https://img.shields.io/badge/-development-blue)
        If this override is done via declarative configuration, then the list MUST be configurable via the `known_methods` property
        (an array of case-sensitive strings with minimum items 0) under `.instrumentation/development.general.http.client` and/or
        `.instrumentation/development.general.http.server`.

        In either case, this list MUST be a full override of the default known methods,
        it is not a list of known methods in addition to the defaults.

        HTTP method names are case-sensitive and `http.request.method` attribute value MUST match a known HTTP method name exactly.
        Instrumentations for specific web frameworks that consider HTTP methods to be case insensitive, SHOULD populate a canonical equivalent.
        Tracing instrumentations that do so, MUST also set `http.request.method_original` to the original value.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: required
      sampling_relevant: true
      stability: stable
      type:
        members:
        - brief: CONNECT method.
          id: connect
          stability: stable
          value: CONNECT
        - brief: DELETE method.
          id: delete
          stability: stable
          value: DELETE
        - brief: GET method.
          id: get
          stability: stable
          value: GET
        - brief: HEAD method.
          id: head
          stability: stable
          value: HEAD
        - brief: OPTIONS method.
          id: options
          stability: stable
          value: OPTIONS
        - brief: PATCH method.
          id: patch
          stability: stable
          value: PATCH
        - brief: POST method.
          id: post
          stability: stable
          value: POST
        - brief: PUT method.
          id: put
          stability: stable
          value: PUT
        - brief: TRACE method.
          id: trace
          stability: stable
          value: TRACE
        - brief: QUERY method.
          id: query
          stability: development
          value: QUERY
        - brief: Any HTTP method that the instrumentation has no prior knowledge of.
          id: other
          stability: stable
          value: _OTHER
    - brief: Original HTTP method sent by the client in the request line.
      examples:
      - GeT
      - ACL
      - foo
      key: http.request.method_original
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: If and only if it\u0027s different than `http.request.method`.
      stability: stable
      type: string
    - brief: |
        The total size of the request in bytes. This should be the total number of bytes sent over the wire, including the request line (HTTP/1.1), framing (HTTP/2 and HTTP/3), headers, and request body if any.
      examples: 1437
      key: http.request.size
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      stability: development
      type: int
    - brief: |
        The size of the response payload body in bytes. This is the number of bytes transferred excluding headers and is often, but not always, present as the [Content-Length](https://www.rfc-editor.org/rfc/rfc9110.html#field.content-length) header. For requests using transport encoding, this should be the compressed size.
      examples: 3495
      key: http.response.body.size
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      stability: development
      type: int
    - brief: |
        HTTP response headers, `\u003ckey\u003e` being the normalized HTTP Header name (lowercase), the value being the header values.
      examples:
      - - application/json
      - - abc
        - def
      key: http.response.header
      note: |
        Instrumentations SHOULD require an explicit configuration of which headers are to be captured.
        Including all response headers can be a security risk - explicit configuration helps avoid leaking sensitive information.

        Users MAY explicitly configure instrumentations to capture them even though it is not recommended.

        The attribute value MUST consist of either multiple header values as an array of strings
        or a single-item array containing a possibly comma-concatenated string, depending on the way
        the HTTP library provides access to headers.

        Examples:

        - A header `Content-Type: application/json` header SHOULD be recorded as the `http.request.response.content-type`
          attribute with value `["application/json"]`.
        - A header `My-custom-header: abc, def` header SHOULD be recorded as the `http.response.header.my-custom-header`
          attribute with value `["abc", "def"]` or `["abc, def"]` depending on the HTTP library.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      stability: stable
      type: template[string[]]
    - brief: |
        The total size of the response in bytes. This should be the total number of bytes sent over the wire, including the status line (HTTP/1.1), framing (HTTP/2 and HTTP/3), headers, and response body and trailers if any.
      examples: 1437
      key: http.response.size
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      stability: development
      type: int
    - brief: \u0027[HTTP response status code](https://tools.ietf.org/html/rfc7231#section-6).\u0027
      examples:
      - 200
      key: http.response.status_code
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: If and only if one was received/sent.
      stability: stable
      type: int
    - brief: |
        The matched route template for the request. This MUST be low-cardinality and include all static path segments, with dynamic path segments represented with placeholders.
      examples:
      - /users/:userID?
      - my-controller/my-action/{id?}
      key: http.route
      note: |
        MUST NOT be populated when this is not supported by the HTTP server framework as the route attribute should have low-cardinality and the URI path can NOT substitute it.
        SHOULD include the [application root](/docs/http/http-spans.md#http-server-definitions) if there is one.

        A static path segment is a part of the route template with a fixed, low-cardinality value. This includes literal strings like `/users/` and placeholders that
        are constrained to a finite, predefined set of values, e.g. `{controller}` or `{action}`.

        A dynamic path segment is a placeholder for a value that can have high cardinality and is not constrained to a predefined list like static path segments.

        Instrumentations SHOULD use routing information provided by the corresponding web framework. They SHOULD pick the most precise source of routing information and MAY
        support custom route formatting. Instrumentations SHOULD document the format and the API used to obtain the route string.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: If and only if it\u0027s available
      stability: stable
      type: string
    - brief: How a segment stopped, when the task state does not say it.
      key: kagent.invocation.disposition
      provenance:
        path: telemetry/registry/kagent.yaml
      requirement_level:
        conditionally_required: The task state does not say how the segment stopped.
      stability: development
      type:
        members:
        - brief: A client asked to cancel the task.
          id: canceled
          stability: development
          value: canceled
        - brief: The A2A event consumer stopped reading before execution finished.
          id: abandoned
          stability: development
          value: abandoned
        - brief: The execution context ended without a cancellation request.
          id: interrupted
          stability: development
          value: interrupted
    - brief: Whether an execution starts a task or continues it.
      key: kagent.invocation.segment
      note: |
        A task that pauses for an approval or a question runs as several segments. Count turns by this attribute, not by invoke_agent spans.
      provenance:
        path: telemetry/registry/kagent.yaml
      requirement_level: required
      stability: development
      type:
        members:
        - brief: The first execution of a task.
          id: initial
          stability: development
          value: initial
        - brief: An execution that continues a task after an approval or a question.
          id: resumed
          stability: development
          value: resumed
    - brief: Local socket address. Useful in case of a multi-IP host.
      examples:
      - 10.1.2.80
      - /tmp/my.sock
      key: network.local.address
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      stability: stable
      type: string
    - brief: Local socket port. Useful in case of a multi-port host.
      examples:
      - 65123
      key: network.local.port
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      stability: stable
      type: int
    - brief: Peer address of the network connection - IP address or UNIX domain socket name.
      examples:
      - 10.1.2.80
      - /tmp/my.sock
      key: network.peer.address
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: recommended
      stability: stable
      type: string
    - brief: Peer port number of the network connection.
      examples:
      - 65123
      key: network.peer.port
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        recommended: If `network.peer.address` is set.
      stability: stable
      type: int
    - brief: \u0027[OSI application layer](https://wikipedia.org/wiki/Application_layer) or non-OSI equivalent.\u0027
      examples:
      - http
      - spdy
      key: network.protocol.name
      note: The value SHOULD be normalized to lowercase.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: If not `http` and `network.protocol.version` is set.
      stability: stable
      type: string
    - brief: The actual version of the protocol used for network communication.
      examples:
      - \u00271.0\u0027
      - \u00271.1\u0027
      - \u00272\u0027
      - \u00273\u0027
      key: network.protocol.version
      note: |
        If protocol version is subject to negotiation (for example using [ALPN](https://www.rfc-editor.org/rfc/rfc7301.html)), this attribute SHOULD be set to the negotiated version. If the actual protocol version is not known, this attribute SHOULD NOT be set.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: recommended
      stability: stable
      type: string
    - brief: |
        [OSI transport layer](https://wikipedia.org/wiki/Transport_layer) or [inter-process communication method](https://wikipedia.org/wiki/Inter-process_communication).
      examples:
      - tcp
      - udp
      key: network.transport
      note: |
        Generally `tcp` for `HTTP/1.0`, `HTTP/1.1`, and `HTTP/2`. Generally `udp` for `HTTP/3`. Other obscure implementations are possible.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      stability: stable
      type:
        members:
        - brief: TCP
          id: tcp
          stability: stable
          value: tcp
        - brief: UDP
          id: udp
          stability: stable
          value: udp
        - brief: Named or anonymous pipe.
          id: pipe
          stability: stable
          value: pipe
        - brief: UNIX domain socket
          id: unix
          stability: stable
          value: unix
        - brief: QUIC
          id: quic
          stability: stable
          value: quic
    - brief: |
        Name of the local HTTP server that received the request.
      examples:
      - example.com
      - 10.1.2.80
      - /tmp/my.sock
      key: server.address
      note: |
        See [Setting `server.address` and `server.port` attributes](/docs/http/http-spans.md#setting-serveraddress-and-serverport-attributes).
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: recommended
      sampling_relevant: true
      stability: stable
      type: string
    - brief: |
        Port of the local HTTP server that received the request.
      examples:
      - 80
      - 8080
      - 443
      key: server.port
      note: |
        See [Setting `server.address` and `server.port` attributes](/docs/http/http-spans.md#setting-serveraddress-and-serverport-attributes).
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: If available and `server.address` is set.
      sampling_relevant: true
      stability: stable
      type: int
    - brief: |
        The [URI path](https://www.rfc-editor.org/rfc/rfc3986#section-3.3) component
      examples:
      - /search
      key: url.path
      note: |
        Sensitive content provided in `url.path` SHOULD be scrubbed when instrumentations can identify it.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: required
      sampling_relevant: true
      stability: stable
      type: string
    - brief: |
        The [URI query](https://www.rfc-editor.org/rfc/rfc3986#section-3.4) component
      examples:
      - q=OpenTelemetry
      key: url.query
      note: |
        Sensitive content provided in `url.query` SHOULD be scrubbed when instrumentations can identify it.

        ![Development](https://img.shields.io/badge/-development-blue)
        Query string values for the following keys SHOULD be redacted by default and replaced by the value `REDACTED`:

        * [`X-Amz-Signature`](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv-authentication-methods.html)
        * [`X-Amz-Credential`](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv-authentication-methods.html)
        * [`X-Amz-Security-Token`](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv-authentication-methods.html)
        * [`sig`](https://learn.microsoft.com/azure/storage/common/storage-sas-overview#sas-token)
        * [`X-Goog-Signature`](https://cloud.google.com/storage/docs/access-control/signed-urls)

        This list is subject to change over time.

        Matching of query parameter keys against the sensitive list SHOULD be case-sensitive.

        Instrumentation MAY provide a way to override this list via declarative configuration.
        If so, it SHOULD use the `sensitive_query_parameters` property
        (an array of case-sensitive strings with minimum items 0) under
        `.instrumentation/development.general.sanitization.url`.
        This list is a full override of the default sensitive query parameter keys,
        it is not a list of keys in addition to the defaults.

        When a query string value is redacted, the query string key SHOULD still be preserved, e.g.
        `q=OpenTelemetry\u0026sig=REDACTED`.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: If and only if one was received/sent.
      sampling_relevant: true
      stability: stable
      type: string
    - brief: |
        The [URI scheme](https://www.rfc-editor.org/rfc/rfc3986#section-3.1) component identifying the used protocol.
      examples:
      - http
      - https
      key: url.scheme
      note: |
        The scheme of the original client request, if known (e.g. from [Forwarded#proto](https://developer.mozilla.org/docs/Web/HTTP/Headers/Forwarded#proto), [X-Forwarded-Proto](https://developer.mozilla.org/docs/Web/HTTP/Headers/X-Forwarded-Proto), or a similar header). Otherwise, the scheme of the immediate peer request.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: required
      sampling_relevant: true
      stability: stable
      type: string
    - brief: |
        Value of the [HTTP User-Agent](https://www.rfc-editor.org/rfc/rfc9110.html#field.user-agent) header sent by the client.
      examples:
      - CERN-LineMode/2.15 libwww/2.17b3
      - Mozilla/5.0 (iPhone; CPU iPhone OS 14_7_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/14.1.2 Mobile/15E148 Safari/604.1
      - YourApp/1.0.0 grpc-java-okhttp/1.27.2
      key: user_agent.original
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: recommended
      sampling_relevant: true
      stability: stable
      type: string
    - brief: |
        Specifies the category of synthetic traffic, such as tests or bots.
      key: user_agent.synthetic.type
      note: |
        This attribute MAY be derived from the contents of the `user_agent.original` attribute. Components that populate the attribute are responsible for determining what they consider to be synthetic bot or test traffic. This attribute can either be set for self-identification purposes, or on telemetry detected to be generated as a result of a synthetic request. This attribute is useful for distinguishing between genuine client traffic and synthetic traffic generated by bots or tests.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: opt_in
      stability: development
      type:
        members:
        - brief: Bot source.
          id: bot
          stability: development
          value: bot
        - brief: Synthetic test source.
          id: test
          stability: development
          value: test
    brief: The instrumentation SERVER span of an A2A request over HTTP.
