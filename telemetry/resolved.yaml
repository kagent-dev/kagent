    - brief: Whether an execution starts a task or continues it.
      key: kagent.invocation.segment
      note: |
        A task that pauses for an approval or a question runs as several segments. Count turns by this attribute, not by invoke_agent spans.
      provenance:
        path: telemetry/registry/kagent.yaml
      requirement_level: required
      stability: development
      type:
        members:
        - brief: The first execution of a task.
          id: initial
          stability: development
          value: initial
        - brief: An execution that continues a task after an approval or a question.
          id: resumed
          stability: development
          value: resumed
    brief: One execution segment of a runtime that emits its own invoke_agent span.
    kind: internal
    name:
      note: The constant `a2a.request`.
    note: |
      The Go ADK, the Python ADK and OpenAI Agents describe the agent invocation themselves, so kagent opens this span instead of an invoke_agent span. It ends and exports before a quiescent event leaves the process, because the gateway may suspend the Actor on that event while the SERVER span is still open. It carries no `gen_ai.operation.name`.
    provenance:
      path: telemetry/registry/signals.yaml
    requirement_level: recommended
    stability: development
    type: kagent.a2a.request
