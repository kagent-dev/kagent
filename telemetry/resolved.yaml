          stability: development
          value: initial
        - brief: An execution that continues a task after an approval or a question.
          id: resumed
          stability: development
          value: resumed
    - brief: Peer address of the network connection - IP address or UNIX domain socket name.
      examples:
      - 10.1.2.80
      - /tmp/my.sock
      key: network.peer.address
      note: |
        If a RPC involved multiple network calls (for example retries), the last contacted address SHOULD be used.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: recommended
      stability: stable
      type: string
    - brief: Peer port number of the network connection.
      examples:
      - 65123
      key: network.peer.port
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        recommended: If `network.peer.address` is set.
      stability: stable
      type: int
    - brief: The fully-qualified logical name of the method from the RPC interface perspective.
      examples:
      - com.example.ExampleService/exampleMethod
      - EchoService/Echo
      - _OTHER
      key: rpc.method
      note: |
        The method name MAY have unbounded cardinality in edge or error cases.

        Some RPC frameworks or libraries provide a fixed set of recognized methods
        for client stubs and server implementations. Instrumentations for such
        frameworks MUST set this attribute to the original method name only
        when the method is recognized by the framework or library.

        When the method is not recognized, for example, when the server receives
        a request for a method that is not predefined on the server, or when
        instrumentation is not able to reliably detect if the method is predefined,
        the attribute MUST be set to `_OTHER`.

        If the RPC instrumentation could end up converting valid RPC methods to
        `_OTHER`, then it SHOULD provide a way to configure the list of recognized
        RPC methods.

        The `rpc.method` can be different from the name of any implementing
        method/function.
        The `code.function.name` attribute may be used to record the fully-qualified
        method actually executing the call on the server side, or the
        RPC client stub method on the client side.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: if available.
      sampling_relevant: true
      stability: release_candidate
      type: string
    - brief: |
        The original name of the method used by the client.
      examples:
      - com.myservice.EchoService/catchAll
      - com.myservice.EchoService/unknownMethod
      - InvalidMethod
      key: rpc.method_original
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: If and only if it\u0027s different than `rpc.method`.
      stability: release_candidate
      type: string
    - brief: Status code of the RPC returned by the RPC server or generated by the client
      examples:
      - OK
      - DEADLINE_EXCEEDED
      - \u0027-32602\u0027
      key: rpc.response.status_code
      note: |
        Usually it represents an error code, but may also represent partial success, warning, or differentiate between various types of successful outcomes.
        Semantic conventions for individual RPC frameworks SHOULD document what `rpc.response.status_code` means in the context of that system and which values are considered to represent errors.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: if available.
      stability: release_candidate
      type: string
    - brief: The Remote Procedure Call (RPC) system.
      key: rpc.system.name
      note: |
        The client and server RPC systems may differ for the same RPC interaction. For example, a client may use Apache Dubbo or Connect RPC to communicate with a server that uses gRPC since both protocols provide compatibility with gRPC.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level: required
      sampling_relevant: true
      stability: release_candidate
      type:
        members:
        - brief: \u0027[gRPC](https://grpc.io/)\u0027
          id: grpc
          stability: release_candidate
          value: grpc
        - brief: \u0027[Apache Dubbo](https://dubbo.apache.org/)\u0027
          id: dubbo
          stability: release_candidate
          value: dubbo
        - brief: \u0027[Connect RPC](https://connectrpc.com/)\u0027
          id: connectrpc
          stability: development
          value: connectrpc
        - brief: \u0027[JSON-RPC](https://www.jsonrpc.org/)\u0027
          id: jsonrpc
          stability: development
          value: jsonrpc
    - brief: |
        A string identifying a group of RPC server instances request is sent to.
      examples:
      - example.com
      - 10.1.2.80
      - /tmp/my.sock
      key: server.address
      note: |
        May contain a DNS name, an endpoint and path in the service registry, local socket name or an IP address.
        Semantic conventions for individual RPC systems SHOULD document how to populate this attribute.
        When address is an IP address, instrumentations SHOULD NOT do a reverse DNS lookup to obtain a DNS name and SHOULD set `server.address` to the provided IP address.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: If available.
      sampling_relevant: true
      stability: stable
      type: string
    - brief: Server port number.
      examples:
      - 80
      - 8080
      - 443
      key: server.port
      note: |
        When observed from the client side, and when communicating through an intermediary, `server.port` SHOULD represent the server port behind any intermediaries, for example proxies, if it\u0027s available.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: if applicable and if `server.address` is set.
      sampling_relevant: true
      stability: stable
      type: int
