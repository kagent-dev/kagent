    brief: One model request of a harness turn.
    id: kagent.inference.client
    kind: client
    name:
      note: |
        **Span name** SHOULD be `{gen_ai.operation.name} {gen_ai.request.model}`.
        Semantic conventions for individual GenAI systems and frameworks MAY specify different span name format
        and MUST follow the overall [guidelines for span names](https://github.com/open-telemetry/opentelemetry-specification/blob/v1.56.0/specification/trace/api.md#span).
    note: |
      Named `chat {gen_ai.request.model}`, or `chat` when the request model is unknown. A child of the invoke_agent span when one exists, otherwise a root span. A call that ended with finish reason `error` has an error status, unless it was canceled. Codex reports no finish reason, so its calls never have an error status. A request rejected before any response has no chat span.
    provenance:
      path: telemetry/registry/signals.yaml
    requirement_level: recommended
    stability: development
    type: gen_ai.client.inference
  - attributes:
    - brief: The A2A method that started the invocation.
      key: a2a.method
      provenance:
        path: telemetry/registry/a2a.yaml
      requirement_level: required
      stability: development
      type:
        members:
        - brief: A unary A2A request.
          id: send_message
          stability: development
          value: SendMessage
        - brief: A streaming A2A request.
          id: send_streaming_message
          stability: development
          value: SendStreamingMessage
    - brief: The A2A task that an invocation executes.
      examples:
      - 0f6a7c1e-3d2b-4b8e-9a51-2c7d8e4f1a90
      key: a2a.task.id
      note: |
        The GenAI conventions have no task identity, so it stays in the A2A namespace. Never on a resource or a metric.
      provenance:
        path: telemetry/registry/a2a.yaml
      requirement_level:
        conditionally_required: The gateway assigned an A2A task.
      stability: development
      type: string
    - brief: The A2A task state that execution reported.
      key: a2a.task.state
      note: |
        The values are the A2A v1 wire names. An absent state does not mean success.
      provenance:
        path: telemetry/registry/a2a.yaml
      requirement_level:
        conditionally_required: Execution reported a task state.
      stability: development
      type:
        members:
        - brief: The task was accepted.
          id: submitted
          stability: development
          value: TASK_STATE_SUBMITTED
        - brief: The task is running.
          id: working
          stability: development
          value: TASK_STATE_WORKING
        - brief: The task finished.
          id: completed
          stability: development
          value: TASK_STATE_COMPLETED
        - brief: The task failed.
          id: failed
          stability: development
          value: TASK_STATE_FAILED
        - brief: The task was canceled.
          id: canceled
          stability: development
          value: TASK_STATE_CANCELED
        - brief: The task waits for an approval or an answer.
          id: input_required
          stability: development
          value: TASK_STATE_INPUT_REQUIRED
        - brief: The agent rejected the task.
          id: rejected
          stability: development
          value: TASK_STATE_REJECTED
        - brief: The task waits for authentication.
          id: auth_required
          stability: development
          value: TASK_STATE_AUTH_REQUIRED
    - brief: Unique identifier of an end user in the system. It maybe a username, email address, or other identifier.
      examples:
      - username
      key: enduser.id
      note: |
        Absent when the gateway forwarded no trusted identity. Never on a resource or a metric. Hashing the value is an operator decision.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: A trusted identity reached the runtime.
      stability: development
      type: string
    - brief: |
        Describes a class of error the operation ended with.
      examples:
      - timeout
      - java.net.UnknownHostException
      - server_certificate_invalid
      - \u0027500\u0027
      key: error.type
      note: |
        A bounded kagent vocabulary: `runtime_panic`, `invalid_request`, `continuation_unavailable`, `actor_unavailable`, `runtime_error`, `invalid_runtime_outcome`, `invalid_input_request`, `runtime_failure` and `transport_error`. Never a provider response, a credential or captured content.
      provenance:
        source: https://opentelemetry.io/schemas/1.44.0
      requirement_level:
        conditionally_required: The invocation failed.
      stability: stable
      type:
        members:
        - brief: |
            A fallback error value to be used when the instrumentation doesn\u0027t define a custom value.
          id: other
          stability: stable
          value: _OTHER
    - brief: The free-form description of the invoked GenAI agent.
      examples:
      - Helps with math problems
      - Generates fiction stories
      key: gen_ai.agent.description
      provenance:
        source: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
      requirement_level:
        conditionally_required: When available.
      stability: development
      type: string
    - brief: The unique and stable identifier of the GenAI hosted agent resource.
      examples:
      - asst_5j66UpCpwteGg4YSxUnt7lPY
      - arn:aws:bedrock:us-east-1:123:agent/42
      - urn:agent:projects-123:projects:123:locations:us-east1:aiplatform:reasoningEngines:456
      key: gen_ai.agent.id
      note: The agent identity qualified by its namespace, `\u003cnamespace\u003e/\u003cagent\u003e`.
      provenance:
        source: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
      requirement_level: required
      stability: development
      type: string
    - brief: The human-readable name of the invoked GenAI agent.
      examples:
      - Math Tutor
      - Fiction Writer
      key: gen_ai.agent.name
      note: The compiled agent identity, `\u003cagent\u003e`.
      provenance:
        source: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
      requirement_level: required
      sampling_relevant: true
      stability: development
      type: string
    - brief: The unique identifier for a conversation (session, thread), used to store and correlate messages within this conversation.
      examples:
      - conv_5j66UpCpwteGg4YSxUnt7lPY
      key: gen_ai.conversation.id
      note: The A2A context ID.
      provenance:
        source: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
      requirement_level:
        conditionally_required: The gateway assigned an A2A context.
      stability: development
      type: string
    - brief: The data source identifier.
      examples:
      - H7STPQYOND
      key: gen_ai.data_source.id
      note: |
        Data sources are used by AI agents and RAG applications to store grounding data. A data source may be an external database, object store, document collection, website, or any other storage system used by the GenAI agent or application. The `gen_ai.data_source.id` SHOULD match the identifier used by the GenAI system rather than a name specific to the external storage, such as a database or object store. Semantic conventions referencing `gen_ai.data_source.id` MAY also leverage additional attributes, such as `db.*`, to further identify and describe the data source.
      provenance:
        source: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
      requirement_level:
        conditionally_required: If applicable.
      stability: development
      type: string
    - annotations:
        type:
          json_schema: model/gen-ai/gen-ai-input-messages.json
      brief: |
        The chat history provided to the model as an input.
      examples:
      - |
        [
          {
            "role": "user",
            "parts": [
              {
                "type": "text",
                "content": "Weather in Paris?"
              }
            ]
          },
          {
            "role": "assistant",
            "parts": [
              {
                "type": "tool_call",
                "id": "call_VSPygqKTWdrhaFErNvMV18Yl",
                "name": "get_weather",
                "arguments": {
                  "location": "Paris"
                }
              }
            ]
          },
          {
            "role": "tool",
            "parts": [
              {
                "type": "tool_call_response",
                "id": "call_VSPygqKTWdrhaFErNvMV18Yl",
                "response": "rainy, 57°F"
              }
            ]
          }
