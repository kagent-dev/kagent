  - attributes:
    - brief: |
        Describes a class of error the operation ended with.
      examples:
      - timeout
      - java.net.UnknownHostException
      - server_certificate_invalid
      - \u0027500\u0027
      key: error.type
      note: |
        The gRPC status code name for Substrate errors, or `_OTHER` for other failures. Absent on success. Never raw error text or revision, template, UID, or namespace identity.
      provenance:
        path: telemetry/registry/signals.yaml
