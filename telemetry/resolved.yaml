      - 40
      key: gen_ai.request.top_k
      note: |
        This is a decoding/sampling parameter (e.g., Anthropic `top_k`, Cohere `k`, Google `topK`), not an output-shaping parameter. In particular, OpenAI\u0027s `top_logprobs` controls how many per-token log-probabilities are returned in the response and does not change generation; it MUST NOT be reported as `gen_ai.request.top_k`.
      provenance:
        source: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
      requirement_level:
        conditionally_required: If applicable.
      stability: development
      type: int
    - brief: The top_p sampling setting for the GenAI request.
      examples:
      - 1.0
      key: gen_ai.request.top_p
      provenance:
        source: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
      requirement_level: recommended
      stability: development
      type: double
    - brief: Array of reasons the model stopped generating tokens, corresponding to each generation received.
      examples:
