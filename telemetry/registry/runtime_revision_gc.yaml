file_format: definition/2
attributes:
  - key: kagent.gc.stage
    brief: The stage of a runtime revision garbage collection attempt.
    stability: development
    type:
      members:
        - id: discovery
          value: discovery
          brief: Discovering cleanup-eligible persisted revisions.
          stability: development
        - id: collection
          value: collection
          brief: Claiming, deleting compute for, or finalizing a revision.
          stability: development

metrics:
  - name: kagent.runtime_revision.gc.pending
    requirement_level: recommended
    instrument: gauge
    unit: "{revision}"
    brief: Number of cleanup-eligible runtime revisions in the last successful discovery.
    note: >
      An observable integer gauge over a cached count, without collection-time
      database or network access. Absent before successful discovery and while
      inactive; zero means a successful empty discovery. Discovery errors retain
      the previous count while garbage collection is active.
    stability: development
    attributes: []

  - name: kagent.runtime_revision.gc.failures
    requirement_level: recommended
    instrument: counter
    unit: "{failure}"
    brief: Number of failed runtime revision garbage collection attempts.
    note: >
      A monotonic integer counter. Parent cancellation is excluded; an operation
      deadline while the parent remains active is counted. Revision and compute
      identity remain in logs, never in metric attributes.
    stability: development
    attributes:
      - ref: kagent.gc.stage
        requirement_level: required
