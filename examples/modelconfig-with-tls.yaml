# ModelConfig TLS configuration for the kagent harness.
# Custom CA Secret references and disableSystemCAs are deferred.
# Credentials reference an existing Secret in the ModelConfig namespace.

# Default: verify upstream certificates using system trust.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: openai-public
  namespace: kagent
spec:
  provider: OpenAI
  model: gpt-4.1-mini
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
---
# Development only: disable verification for a test endpoint.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: litellm-dev
  namespace: kagent
spec:
  provider: OpenAI
  model: gpt-4.1-mini
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: https://litellm-dev.example.com
  tls:
    disableVerify: true
