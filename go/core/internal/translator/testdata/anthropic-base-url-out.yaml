metadata:
  atespace: test
  name: default
rules:
- http:
    hostnames:
    - kagent-controller.kagent
    ports:
      numbers:
      - 8083
- https:
    effects:
      replace_headers:
      - credential_uri: ate-secret://k8s.io/default/test/model-auth/api-key
        header: x-api-key
    hostnames:
    - models.example.com
    ports:
      numbers:
      - 443
