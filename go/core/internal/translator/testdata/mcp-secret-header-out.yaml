metadata:
  atespace: test
  name: default
rules:
- http:
    hostnames:
    - kagent-controller.kagent
    ports:
      numbers:
      - 8083
- https:
    hostnames:
    - api.openai.com
    ports:
      numbers:
      - 443
- https:
    effects:
      replace_headers:
      - credential_uri: ate-secret://k8s.io/default/test/search-auth/token
        header: authorization
    hostnames:
    - search.example.com
    ports:
      numbers:
      - 443
