operation: translateAgent
targetObject: s3-skills-agent
namespace: test
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: openai-secret
      namespace: test
    data:
      api-key: c2stdGVzdC1hcGkta2V5  # base64 encoded "sk-test-api-key"
  - apiVersion: kagent.dev/v1alpha2
    kind: ModelConfig
    metadata:
      name: basic-model
      namespace: test
    spec:
      provider: OpenAI
      model: gpt-4o
      apiKeySecret: openai-secret
      apiKeySecretKey: api-key
      openAI:
        temperature: "0.7"
        maxTokens: 1024
        topP: "0.95"
        reasoningEffort: "low"
      defaultHeaders:
        User-Agent: "kagent/1.0"
  - apiVersion: kagent.dev/v1alpha2
    kind: Agent
    metadata:
      name: s3-skills-agent
      namespace: test
    spec:
      skills:
        s3Refs:
          - uri: s3://my-skills-bucket/team-a/kebab-maker
            name: kebab-maker
            region: us-east-1
          - uri: s3://my-skills-bucket/bundles/ops.zip
        initContainer:
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: secret-access-key
            - name: AWS_REGION
              value: us-east-1
      type: Declarative
      declarative:
        description: An agent with S3-based skills
        systemMessage: You are a helpful assistant with skills from S3.
        modelConfig: basic-model
        tools: []
