# Showcase: a root Workflow plus LlmAgent specialists covering every node type,
# StringRoute and DEFAULT routing, fan-out and join, and nested workflows.
#
# ADK graph constraints this document respects:
# - A mid-graph agent or llm node runs single_turn; task agents cannot be graph
#   nodes.
# - Mutually exclusive routes must not fan in to a non-join node, so each route
#   ends in its own terminal.
# - A join is for fan-out that always runs every branch.
# - An agent has one parent: it appears in at most one sub_agents list.
apiVersion: adk.declarative/v0alpha1
kind: AgentSystem
agents:
  - name: multi_agent_root
    agent_class: Workflow
    description: Orchestrator with fan-out and join, string routes and every node type
    entry: branch_a
    sub_agents: [specialist_helper]
    nodes:
      # Fan-out branches and their join.
      - { id: branch_a, type: function, function: branch_a }
      - { id: branch_b, type: function, function: branch_b }
      - { id: branch_c, type: function, function: branch_c }
      - { id: gather, type: join }

      # Route dispatcher.
      - { id: classify, type: function, function: route_by_text }

      # BUG: nested workflow -> terminal.
      - id: nested
        type: workflow
        nodes:
          - { id: n_plan, type: function, function: plan }
          - { id: n_exec, type: function, function: execute }
        edges:
          - { from: START, to: n_plan }
          - { from: n_plan, to: n_exec }
      - { id: finish_bug, type: function, function: summarize_join }

      # BILLING: tool node -> terminal.
      - { id: lookup, type: tool, tool: lookup_customer }
      - { id: finish_billing, type: function, function: summarize_join }

      # SUPPORT: agent node -> terminal.
      - { id: call_specialist, type: agent, agent: specialist_helper }
      - { id: finish_support, type: function, function: summarize_join }

      # OTHER: inline llm -> terminal.
      - id: inline_llm
        type: llm
        model: stub
        description: Inline LLM node for OTHER tickets
        instruction: Summarize the ticket in one short sentence.
        tools: [lookup_customer]
        output_key: ticket_summary
      - { id: finish_other, type: function, function: summarize_join }

      # Fallback terminal.
      - id: finish_default
        type: function
        function: prefix
        timeout: 30s
        retry: { max_attempts: 2, initial_delay: 10ms, max_delay: 50ms, backoff_factor: 2, jitter: 0 }

    edges:
      - { from: START, to: branch_a }
      - { from: START, to: branch_b }
      - { from: START, to: branch_c }
      - { from: branch_a, to: gather }
      - { from: branch_b, to: gather }
      - { from: branch_c, to: gather }
      - { from: gather, to: classify }
      - { from: classify, to: nested, route: BUG }
      - { from: classify, to: lookup, route: BILLING }
      - { from: classify, to: call_specialist, route: SUPPORT }
      - { from: classify, to: inline_llm, route: OTHER }
      - { from: classify, to: finish_default, route: DEFAULT }
      - { from: nested, to: finish_bug }
      - { from: lookup, to: finish_billing }
      - { from: call_specialist, to: finish_support }
      - { from: inline_llm, to: finish_other }

  - name: specialist_helper
    agent_class: LlmAgent
    model: stub
    mode: single_turn
    description: Support specialist with a tool and a sub-agent
    instruction: |
      Handle SUPPORT tickets. Delegate coding details to code_expert.
    tools: [lookup_customer]
    output_key: specialist_reply
    sub_agents: [code_expert]

  - name: code_expert
    agent_class: LlmAgent
    model: stub
    mode: single_turn
    description: Coding helper sub-agent
    instruction: Answer coding questions briefly with a short example.
    global_instruction: Be concise.
    include_contents: none
    disallow_transfer_to_peers: true

  # A chat coordinator is not a graph node; it documents the chat + sub_agents
  # pattern and is addressable through System.Agent.
  - name: learning_coordinator
    agent_class: LlmAgent
    model: stub
    mode: chat
    description: Chat coordinator that delegates to a docs expert
    instruction: Delegate documentation questions to docs_expert and answer the rest yourself.
    tools: [lookup_customer]
    output_key: coordinator_reply
    sub_agents: [docs_expert]

  - name: docs_expert
    agent_class: LlmAgent
    model: stub
    mode: single_turn
    description: Documentation helper
    instruction: Answer documentation questions briefly.
    output_schema:
      type: object
      properties:
        answer: { type: string }
      required: [answer]
