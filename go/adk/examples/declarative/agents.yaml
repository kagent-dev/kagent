# A support triage workflow: classify the request, then answer it with a model
# node, look the customer up, or fall back to a canned reply.
#
#   START -> classify -+- BILLING -> customer_lookup -> bill_reply
#                      +- QUESTION -> answer (llm)
#                      +- DEFAULT  -> fallback
apiVersion: adk.declarative/v0.2
kind: AgentSystem
agents:
  - name: support_triage
    agent_class: Workflow
    description: Routes a support request to the right handler
    nodes:
      - { id: classify, type: function, function: classify }
      - { id: customer_lookup, type: tool, tool: lookup_customer }
      - { id: bill_reply, type: function, function: bill_reply }
      - id: answer
        type: llm
        model: gpt-4o-mini
        instruction: Answer the support question in two sentences.
      - { id: fallback, type: function, function: fallback, timeout: 5s }
    edges:
      - { from: START, to: classify }
      - { from: classify, to: customer_lookup, route: BILLING }
      - { from: classify, to: answer, route: QUESTION }
      - { from: classify, to: fallback, route: DEFAULT }
      - { from: customer_lookup, to: bill_reply }
