# Harness, AgentTemplate and Agent for the declarative writer-critics workflow.
# The workflow document is delivered through a ConfigMap built from agent-system.yaml:
#   kubectl create configmap writer-critics-workflow --from-file=agent-system.yaml
#
# The harness runs the generic workflow-agent image (make build-workflow-agent
# VERSION=dev). It serves whatever document workflowFrom delivers and resolves
# every model name in it, such as `reviewer`, to the template's ModelConfig.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: writer-critics
  namespace: kagent
spec:
  byo: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/writer-critics
    workerPoolRef:
      name: kagent-default
  workload:
    command:
      - /app
    image: localhost:5001/kagent-dev/kagent/workflow-agent:dev
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: writer-critics
  namespace: kagent
spec:
  description: A writer drafts a paragraph, three critics review it in parallel, and the writer revises for at most 5 turns
  modelConfig:
    name: default-model-config
  workflowFrom:
    name: writer-critics-workflow
    key: agent-system.yaml
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: writer-critics
  namespace: kagent
spec:
  harnessRef:
    name: writer-critics
  template:
    ref:
      name: writer-critics
