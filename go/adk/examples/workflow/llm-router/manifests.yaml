# Harness, AgentTemplate and Agent for the declarative llm-router workflow.
# The workflow document itself is delivered through a ConfigMap built from
# agent-system.yaml by deploy.sh:
#   kubectl create configmap llm-router-workflow --from-file=agent-system.yaml
#
# The harness runs the generic workflow-agent image (make build-workflow-agent
# VERSION=dev). It serves whatever document workflowFrom delivers and resolves
# every model name in it, such as `reviewer`, to the template's ModelConfig.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: llm-router
  namespace: kagent
spec:
  byo: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/llm-router
    workerPoolRef:
      name: kagent-default
  workload:
    command:
      - /app
    image: localhost:5001/kagent-dev/kagent/workflow-agent:dev
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: llm-router
  namespace: kagent
spec:
  description: Classifies a message as question, exclamation or statement with an LLM and routes it to a handler
  modelConfig:
    name: default-model-config
  workflowFrom:
    name: llm-router-workflow
    key: agent-system.yaml
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: llm-router
  namespace: kagent
spec:
  harnessRef:
    name: llm-router
  template:
    ref:
      name: llm-router
