apiVersion: adk.declarative/v0.2
kind: AgentSystem
agents:
  - name: terminal_tool
    agent_class: Workflow
    nodes:
      - { id: args, type: function, function: customer_args }
      - { id: lookup, type: tool, tool: lookup_customer }
    edges:
      - { from: START, to: args }
      - { from: args, to: lookup }
