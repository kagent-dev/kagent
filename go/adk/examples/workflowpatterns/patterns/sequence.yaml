apiVersion: adk.declarative/v0.2
kind: AgentSystem
agents:
  - name: sequence
    agent_class: Workflow
    nodes:
      - { id: clean, type: function, function: clean }
      - { id: upper, type: function, function: upper }
      - { id: exclaim, type: function, function: exclaim }
    edges:
      - { from: START, to: clean }
      - { from: clean, to: upper }
      - { from: upper, to: exclaim }
