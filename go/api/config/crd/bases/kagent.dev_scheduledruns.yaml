---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: scheduledruns.kagent.dev
spec:
  group: kagent.dev
  names:
    kind: ScheduledRun
    listKind: ScheduledRunList
    plural: scheduledruns
    singular: scheduledrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspended
      name: Suspended
      type: boolean
    - jsonPath: .status.lastExecutionTime
      name: Last Execution
      type: date
    - jsonPath: .status.nextExecutionTime
      name: Next Execution
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: ScheduledRun is the Schema for the scheduledruns API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScheduledRunSpec defines the desired state of ScheduledRun.
            properties:
              allowSessionInteraction:
                default: false
                description: |-
                  AllowSessionInteraction allows users who can read this ScheduledRun to
                  continue sessions created by it. Defaults to false.
                type: boolean
              executionTimeout:
                default: 15m
                description: |-
                  ExecutionTimeout is the maximum duration allowed for one execution, including
                  dispatch and asynchronous task polling. Defaults to 15 minutes.
                type: string
              prompt:
                description: Prompt is the text prompt to send to the agent for each
                  execution.
                maxLength: 32768
                minLength: 1
                pattern: \S
                type: string
              recentExecutionsLimit:
                default: 10
                description: |-
                  RecentExecutionsLimit is the maximum number of recently completed
                  executions included with the ScheduledRun. In-progress and older
                  executions remain available in execution history.
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              schedule:
                description: |-
                  Schedule is a cron expression defining when to dispatch an execution. Standard
                  5-field cron syntax (minute hour day-of-month month day-of-week). Each
                  tick starts an independent execution, so executions may overlap. Ticks
                  missed while the scheduler is unavailable are not replayed.
                minLength: 1
                pattern: ^\S+(\s+\S+){4}$
                type: string
              suspended:
                default: false
                description: |-
                  Suspended pauses automatic scheduling when set to true. Manual triggers
                  are still allowed.
                type: boolean
              targetRef:
                description: |-
                  TargetRef identifies a resource in the same namespace to dispatch to. APIGroup,
                  Kind, and Name are required; the scheduler currently supports kagent.dev
                  Agent and SandboxAgent resources. TargetRef is immutable after creation so
                  execution recovery and historical session links always use the original target.
                properties:
                  apiGroup:
                    description: |-
                      APIGroup is the group for the resource being referenced.
                      If APIGroup is not specified, the specified Kind must be in the core API group.
                      For any other third-party types, APIGroup is required.
                    type: string
                  kind:
                    description: Kind is the type of resource being referenced
                    type: string
                  name:
                    description: Name is the name of resource being referenced
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-map-type: atomic
              timeZone:
                default: UTC
                description: |-
                  TimeZone is an IANA time zone name (e.g. "America/Los_Angeles") used
                  to interpret Schedule. Defaults to UTC.
                maxLength: 253
                minLength: 1
                pattern: ^\S+$
                type: string
            required:
            - prompt
            - schedule
            - targetRef
            type: object
            x-kubernetes-validations:
            - message: targetRef.name must be a valid DNS subdomain
              rule: self.targetRef.name.size() <= 253 && self.targetRef.name.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?)([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
            - message: targetRef.kind must be Agent or SandboxAgent
              rule: has(self.targetRef.kind) && self.targetRef.kind in ['Agent', 'SandboxAgent']
            - message: targetRef.apiGroup must be kagent.dev
              rule: has(self.targetRef.apiGroup) && self.targetRef.apiGroup == 'kagent.dev'
            - message: executionTimeout must be greater than zero
              rule: '!has(self.executionTimeout) || duration(self.executionTimeout)
                > duration(''0s'')'
            - message: targetRef is immutable
              rule: self.targetRef == oldSelf.targetRef
          status:
            description: ScheduledRunStatus defines the observed state of ScheduledRun.
            properties:
              conditions:
                description: Conditions describe whether the ScheduledRun configuration
                  is accepted.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastExecutionTime:
                description: LastExecutionTime is when the most recent scheduled or
                  manual execution started.
                format: date-time
                type: string
              nextExecutionTime:
                description: |-
                  NextExecutionTime is the next automatic execution time. It is omitted while the
                  ScheduledRun is suspended or rejected.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata generation evaluated
                  by the controller.
                format: int64
                type: integer
              recentExecutions:
                description: |-
                  RecentExecutions contains in-progress executions and the most recently
                  completed executions selected by spec.recentExecutionsLimit.
                items:
                  description: ScheduledRunExecution describes one dispatch to a ScheduledRun
                    target.
                  properties:
                    completionTime:
                      description: CompletionTime is when the execution reached a
                        terminal state.
                      format: date-time
                      type: string
                    id:
                      description: ID uniquely identifies this execution independently
                        of its session or task.
                      maxLength: 128
                      minLength: 1
                      type: string
                    sessionID:
                      description: SessionID identifies the conversation session created
                        for this execution.
                      maxLength: 256
                      minLength: 1
                      type: string
                    startTime:
                      description: StartTime is when the dispatch began.
                      format: date-time
                      type: string
                    status:
                      description: Status is the current lifecycle state of this execution.
                      enum:
                      - DispatchFailed
                      - InProgress
                      - Succeeded
                      - Failed
                      - TimedOut
                      type: string
                    statusMessage:
                      description: |-
                        StatusMessage provides human-readable details when dispatch fails or an
                        execution fails or times out.
                      maxLength: 32768
                      minLength: 1
                      type: string
                    taskID:
                      description: |-
                        TaskID identifies an asynchronous task created for this execution. It is
                        retained after completion for correlation and recovery.
                      maxLength: 1024
                      minLength: 1
                      type: string
                    trigger:
                      description: |-
                        Trigger identifies whether the execution was started by the schedule or
                        by a manual request.
                      enum:
                      - Scheduled
                      - Manual
                      type: string
                  required:
                  - id
                  - startTime
                  - status
                  - trigger
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
