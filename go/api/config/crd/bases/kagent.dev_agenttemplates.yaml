---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agenttemplates.kagent.dev
spec:
  group: kagent.dev
  names:
    categories:
    - kagent
    kind: AgentTemplate
    listKind: AgentTemplateList
    plural: agenttemplates
    singular: agenttemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: AgentTemplate defines portable agent behavior.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentTemplateSpec defines portable agent behavior.
            properties:
              description:
                type: string
              modelConfig:
                description: AgentTemplateLocalReference identifies a resource in
                  the AgentTemplate's namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              plugins:
                items:
                  description: PluginBundle selects Agent Skills from one immutable
                    Agent Plugins package.
                  properties:
                    skills:
                      description: An empty selection enables nothing.
                      items:
                        minLength: 1
                        type: string
                      maxItems: 50
                      type: array
                      x-kubernetes-list-type: set
                    source:
                      description: ArtifactSource selects exactly one immutable artifact.
                      properties:
                        bucket:
                          description: BucketArtifact selects the supported object-store
                            provider.
                          properties:
                            s3:
                              description: S3Object identifies one immutable S3 object
                                version.
                              properties:
                                bucket:
                                  minLength: 1
                                  type: string
                                key:
                                  minLength: 1
                                  type: string
                                versionId:
                                  minLength: 1
                                  type: string
                              required:
                              - bucket
                              - key
                              - versionId
                              type: object
                          required:
                          - s3
                          type: object
                        git:
                          description: GitArtifact identifies immutable content at
                            a full Git commit ID.
                          properties:
                            commit:
                              pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
                              type: string
                            url:
                              minLength: 1
                              type: string
                          required:
                          - commit
                          - url
                          type: object
                        oci:
                          description: OCI is a digest-pinned image reference.
                          pattern: ^[^[:space:]@]+@sha256:[0-9a-f]{64}$
                          type: string
                        path:
                          description: Path selects a directory within the immutable
                            artifact.
                          maxLength: 1024
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of oci, git or bucket must be specified
                        rule: '(has(self.oci) ? 1 : 0) + (has(self.git) ? 1 : 0) +
                          (has(self.bucket) ? 1 : 0) == 1'
                      - message: path must be relative and must not contain '..' segments
                        rule: '!has(self.path) || (!self.path.startsWith(''/'') &&
                          !self.path.split(''/'').exists(p, p == ''..''))'
                  required:
                  - source
                  type: object
                maxItems: 20
                type: array
              promptTemplate:
                description: AgentTemplatePromptTemplateSpec enables Go template rendering
                  and ConfigMap includes.
                properties:
                  dataSources:
                    description: DataSources are same-namespace ConfigMaps available
                      to include("source/key").
                    items:
                      description: AgentTemplatePromptSource makes a same-namespace
                        ConfigMap available to a prompt template.
                      properties:
                        alias:
                          description: Alias is the name used by include. The ConfigMap
                            name is used when omitted.
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 20
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              skills:
                items:
                  description: AgentTemplateSkill identifies one standalone skill
                    and its immutable source.
                  properties:
                    name:
                      minLength: 1
                      type: string
                    source:
                      description: ArtifactSource selects exactly one immutable artifact.
                      properties:
                        bucket:
                          description: BucketArtifact selects the supported object-store
                            provider.
                          properties:
                            s3:
                              description: S3Object identifies one immutable S3 object
                                version.
                              properties:
                                bucket:
                                  minLength: 1
                                  type: string
                                key:
                                  minLength: 1
                                  type: string
                                versionId:
                                  minLength: 1
                                  type: string
                              required:
                              - bucket
                              - key
                              - versionId
                              type: object
                          required:
                          - s3
                          type: object
                        git:
                          description: GitArtifact identifies immutable content at
                            a full Git commit ID.
                          properties:
                            commit:
                              pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
                              type: string
                            url:
                              minLength: 1
                              type: string
                          required:
                          - commit
                          - url
                          type: object
                        oci:
                          description: OCI is a digest-pinned image reference.
                          pattern: ^[^[:space:]@]+@sha256:[0-9a-f]{64}$
                          type: string
                        path:
                          description: Path selects a directory within the immutable
                            artifact.
                          maxLength: 1024
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of oci, git or bucket must be specified
                        rule: '(has(self.oci) ? 1 : 0) + (has(self.git) ? 1 : 0) +
                          (has(self.bucket) ? 1 : 0) == 1'
                      - message: path must be relative and must not contain '..' segments
                        rule: '!has(self.path) || (!self.path.startsWith(''/'') &&
                          !self.path.split(''/'').exists(p, p == ''..''))'
                  required:
                  - name
                  - source
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              systemPrompt:
                type: string
              systemPromptFrom:
                description: SystemPromptFrom references prompt text in a same-namespace
                  ConfigMap.
                properties:
                  key:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              tools:
                items:
                  description: ToolBinding selects exactly one MCP or AgentTemplate-backed
                    tool source.
                  properties:
                    agent:
                      description: AgentToolBinding exposes another same-namespace
                        AgentTemplate as a logical tool.
                      properties:
                        description:
                          description: Description tells the parent when to route
                            work to this binding.
                          minLength: 1
                          type: string
                        isolation:
                          default: Shared
                          description: AgentToolIsolation controls whether a referenced
                            template shares its parent's runtime boundary.
                          enum:
                          - Shared
                          - Dedicated
                          type: string
                        name:
                          minLength: 1
                          type: string
                        templateRef:
                          description: AgentTemplateLocalReference identifies a resource
                            in the AgentTemplate's namespace.
                          properties:
                            name:
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - description
                      - name
                      - templateRef
                      type: object
                    mcp:
                      description: MCPToolBinding selects tools from a same-namespace
                        MCP server.
                      properties:
                        server:
                          description: AgentTemplateTypedLocalReference identifies
                            a typed resource in the AgentTemplate's namespace.
                          properties:
                            kind:
                              enum:
                              - RemoteMCPServer
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                          required:
                          - kind
                          - name
                          type: object
                        tools:
                          items:
                            minLength: 1
                            type: string
                          maxItems: 50
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - server
                      - tools
                      type: object
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of mcp or agent must be specified
                    rule: has(self.mcp) != has(self.agent)
                maxItems: 50
                type: array
            required:
            - modelConfig
            type: object
            x-kubernetes-validations:
            - message: systemPrompt and systemPromptFrom are mutually exclusive
              rule: '!(has(self.systemPrompt) && has(self.systemPromptFrom))'
          status:
            description: AgentTemplateStatus is the controller-observed state for
              each admitting Harness.
            properties:
              harnesses:
                description: Harnesses has at most one entry for each admitting Harness.
                items:
                  description: AgentTemplateHarnessStatus reports runtime revision
                    state for one admitting Harness.
                  properties:
                    conditions:
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      maxItems: 4
                      type: array
                      x-kubernetes-list-map-keys:
                      - type
                      x-kubernetes-list-type: map
                    desiredRevision:
                      minLength: 1
                      type: string
                    harness:
                      description: |-
                        Harness names a same-namespace Harness whose admission selector matches
                        this AgentTemplate.
                      minLength: 1
                      type: string
                    latestSuccessfulRevision:
                      minLength: 1
                      type: string
                  required:
                  - desiredRevision
                  - harness
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - harness
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
