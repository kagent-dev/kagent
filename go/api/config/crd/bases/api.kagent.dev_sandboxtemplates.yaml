---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: sandboxtemplates.api.kagent.dev
spec:
  group: api.kagent.dev
  names:
    categories:
    - kagent
    kind: SandboxTemplate
    listKind: SandboxTemplateList
    plural: sandboxtemplates
    singular: sandboxtemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workload.image
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          SandboxTemplate defines standalone sandbox configuration. Creating one does not
          allocate a user sandbox. The controller prepares its reusable runtime.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SandboxTemplateSpec defines standalone sandbox environment
              configuration.
            properties:
              env:
                description: |-
                  Env supplies literal runtime environment defaults. Sandboxes do not
                  support credentialRef.
                items:
                  description: |-
                    RuntimeEnvVar configures one runtime environment variable: either a literal
                    value or a gateway-injected credential.
                  properties:
                    credentialRef:
                      description: |-
                        CredentialRef binds a Secret key to one HTTP(S) destination. The runtime
                        process never receives the Secret value: the variable is set to an inert
                        placeholder, and Substrate's egress gateway replaces Header on requests
                        to the destination host with Prefix followed by the current Secret value.
                        The destination origin is added to the agent's egress allow-list.

                        Use it for API keys and bearer tokens consumed by HTTP clients inside the
                        runtime. It cannot provide values that must be read by the process itself,
                        such as signing keys or web-identity token files.
                      properties:
                        header:
                          description: |-
                            Header is the HTTP request header the gateway replaces. Requests that do
                            not carry the header are forwarded unchanged, so the client must send it
                            with any value (the placeholder works).
                          maxLength: 128
                          minLength: 1
                          pattern: ^[-!#$%&'*+.^_|~0-9A-Za-z]+$
                          type: string
                        key:
                          description: Key within the Secret. The full value is injected
                            after Prefix.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[-._a-zA-Z0-9]+$
                          type: string
                        name:
                          description: Name of the Secret in the owning resource's
                            namespace.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                          type: string
                        prefix:
                          description: Prefix is prepended verbatim to the Secret
                            value, for example "Bearer ".
                          maxLength: 64
                          pattern: ^[ -~]*$
                          type: string
                        url:
                          description: |-
                            URL is the HTTP(S) destination. Only its scheme, DNS hostname and port
                            are used: the gateway matches the hostname, and the origin is allowed for
                            egress. IP addresses are not supported.
                          maxLength: 2048
                          pattern: ^https?://[^[:space:]/?#@]+(/[^[:space:]?#]*)?$
                          type: string
                          x-kubernetes-validations:
                          - message: url must be an absolute HTTP(S) URL
                            rule: isURL(self)
                      required:
                      - header
                      - key
                      - name
                      - url
                      type: object
                      x-kubernetes-validations:
                      - message: header must not be a hop-by-hop, framing, proxy or
                          cookie header
                        rule: '!(self.header.lowerAscii() in [''host'', ''connection'',
                          ''content-length'', ''transfer-encoding'', ''te'', ''upgrade'',
                          ''proxy-authorization'', ''cookie''])'
                    name:
                      minLength: 1
                      type: string
                    value:
                      description: |-
                        Value is a literal value, including an empty string. Required unless
                        credentialRef is set.
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: one of value or credentialRef must be specified
                    rule: has(self.value) || has(self.credentialRef)
                  - message: value and credentialRef are mutually exclusive
                    rule: '!has(self.credentialRef) || !has(self.value) || size(self.value)
                      == 0'
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: credentialRef is not supported on SandboxTemplate env
                  rule: self.all(e, !has(e.credentialRef))
              substrate:
                description: |-
                  Substrate configures compute placement and snapshot storage. References are
                  resolved in this template's namespace.
                properties:
                  snapshotPolicy:
                    description: SnapshotPolicy configures runtime snapshot storage.
                    properties:
                      location:
                        description: Location is the snapshot storage location used
                          by Substrate.
                        pattern: ^[^[:space:]]+$
                        type: string
                    required:
                    - location
                    type: object
                  workerPoolRef:
                    description: WorkerPoolRef references a WorkerPool in the resource's
                      namespace.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - snapshotPolicy
                - workerPoolRef
                type: object
                x-kubernetes-validations:
                - message: workerPoolRef name must not be empty
                  rule: self.workerPoolRef.name.size() > 0
              workload:
                description: Workload selects the immutable runtime image.
                properties:
                  image:
                    description: Image is an OCI image reference pinned by sha256
                      digest.
                    pattern: ^[^[:space:]@]+@sha256:[a-f0-9]{64}$
                    type: string
                required:
                - image
                type: object
            required:
            - substrate
            - workload
            type: object
          status:
            description: SandboxTemplateStatus reports preparation of the current
              template inputs.
            properties:
              conditions:
                description: Conditions describe whether a prepared revision is available.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation considered by preparation.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
