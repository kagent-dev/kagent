---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agents.api.kagent.dev
spec:
  group: api.kagent.dev
  names:
    categories:
    - kagent
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: Agent is a runnable definition with an explicit template and
          harness.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSpec pairs portable behavior with a platform-managed runtime. References
              are local to the Agent's namespace, including references nested in inline
              template specs.
            properties:
              egressPolicyRefs:
                description: |-
                  EgressPolicyRefs grants additional access to the whole runtime, including
                  shared subagents. Policies resolve in this Agent's namespace. Integration
                  access inferred from models and tools is always included. Changes update
                  existing Sessions without a new invocation or runtime restart.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: egressPolicyRefs requires non-empty names
                  rule: self.all(ref, has(ref.name) && ref.name != '')
              harnessRef:
                description: |-
                  HarnessRef selects the platform-managed runtime configuration that executes
                  the behavior.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: harnessRef.name must not be empty
                  rule: has(self.name) && self.name != ''
              template:
                description: Template selects the portable behavior this Agent exposes.
                properties:
                  inline:
                    description: |-
                      Inline defines the Agent's portable behavior directly. It cannot be set
                      together with Ref.
                    properties:
                      description:
                        type: string
                      modelConfig:
                        description: ModelConfig is required by managed harnesses
                          and optional for BYO harnesses.
                        properties:
                          name:
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                          namespace:
                            maxLength: 63
                            pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                        x-kubernetes-validations:
                        - message: name must not be empty
                          rule: has(self.name) && self.name != ''
                      outputSchema:
                        description: |-
                          OutputSchema constrains successful terminal output when this template is
                          compiled as the root agent.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      outputSchemaFrom:
                        description: |-
                          OutputSchemaFrom references a JSON Schema stored as JSON in a
                          same-namespace ConfigMap key.
                        properties:
                          key:
                            minLength: 1
                            type: string
                          name:
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      outputSchemaStrict:
                        description: |-
                          OutputSchemaStrict tells OpenAI, Azure OpenAI, and Foundry (openai format)
                          to limit generation to the output schema. kagent then checks the schema
                          against OpenAI's strict mode rules on every provider.
                        type: boolean
                      plugins:
                        items:
                          description: PluginBundle selects Agent Skills from one
                            immutable Agent Plugins package.
                          properties:
                            skills:
                              description: An empty selection enables nothing.
                              items:
                                minLength: 1
                                type: string
                              maxItems: 50
                              type: array
                              x-kubernetes-list-type: set
                            source:
                              description: ArtifactSource selects exactly one immutable
                                artifact.
                              properties:
                                bucket:
                                  description: BucketArtifact selects the supported
                                    object-store provider.
                                  properties:
                                    s3:
                                      description: S3Object identifies one immutable
                                        S3 object version.
                                      properties:
                                        bucket:
                                          minLength: 1
                                          type: string
                                        endpoint:
                                          description: Endpoint is the HTTP(S) endpoint
                                            of an AWS or S3-compatible service.
                                          pattern: ^https?://[^[:space:]]+$
                                          type: string
                                        key:
                                          minLength: 1
                                          type: string
                                        region:
                                          description: Region is used for request
                                            signing when required by the service.
                                          type: string
                                        versionId:
                                          minLength: 1
                                          type: string
                                      required:
                                      - bucket
                                      - endpoint
                                      - key
                                      - versionId
                                      type: object
                                  required:
                                  - s3
                                  type: object
                                git:
                                  description: GitArtifact identifies immutable content
                                    at a full Git commit ID.
                                  properties:
                                    commit:
                                      pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
                                      type: string
                                    url:
                                      minLength: 1
                                      pattern: ^https?://[^[:space:]]+$
                                      type: string
                                  required:
                                  - commit
                                  - url
                                  type: object
                                oci:
                                  description: OCI is a digest-pinned image reference.
                                  pattern: ^[^[:space:]@]+@sha256:[0-9a-f]{64}$
                                  type: string
                                path:
                                  description: Path selects a directory within the
                                    immutable artifact.
                                  maxLength: 1024
                                  type: string
                              type: object
                              x-kubernetes-validations:
                              - message: path must be relative and must not contain
                                  '..' segments
                                rule: '!has(self.path) || (!self.path.startsWith(''/'')
                                  && !self.path.split(''/'').exists(p, p == ''..''))'
                              - message: exactly one of the fields in [oci git bucket]
                                  must be set
                                rule: (has(self.oci)?1:0)+(has(self.git)?1:0)+(has(self.bucket)?1:0)
                                  == 1
                          required:
                          - source
                          type: object
                        maxItems: 20
                        type: array
                      promptTemplate:
                        description: AgentTemplatePromptTemplateSpec enables Go template
                          rendering and ConfigMap includes.
                        properties:
                          dataSources:
                            description: DataSources are same-namespace ConfigMaps
                              available to include("source/key").
                            items:
                              description: AgentTemplatePromptSource makes a same-namespace
                                ConfigMap available to a prompt template.
                              properties:
                                alias:
                                  description: Alias is the name used by include.
                                    The ConfigMap name is used when omitted.
                                  minLength: 1
                                  type: string
                                name:
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              type: object
                            maxItems: 20
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                        type: object
                      skills:
                        items:
                          description: AgentTemplateSkill identifies one standalone
                            skill and its immutable source.
                          properties:
                            name:
                              minLength: 1
                              type: string
                            source:
                              description: ArtifactSource selects exactly one immutable
                                artifact.
                              properties:
                                bucket:
                                  description: BucketArtifact selects the supported
                                    object-store provider.
                                  properties:
                                    s3:
                                      description: S3Object identifies one immutable
                                        S3 object version.
                                      properties:
                                        bucket:
                                          minLength: 1
                                          type: string
                                        endpoint:
                                          description: Endpoint is the HTTP(S) endpoint
                                            of an AWS or S3-compatible service.
                                          pattern: ^https?://[^[:space:]]+$
                                          type: string
                                        key:
                                          minLength: 1
                                          type: string
                                        region:
                                          description: Region is used for request
                                            signing when required by the service.
                                          type: string
                                        versionId:
                                          minLength: 1
                                          type: string
                                      required:
                                      - bucket
                                      - endpoint
                                      - key
                                      - versionId
                                      type: object
                                  required:
                                  - s3
                                  type: object
                                git:
                                  description: GitArtifact identifies immutable content
                                    at a full Git commit ID.
                                  properties:
                                    commit:
                                      pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
                                      type: string
                                    url:
                                      minLength: 1
                                      pattern: ^https?://[^[:space:]]+$
                                      type: string
                                  required:
                                  - commit
                                  - url
                                  type: object
                                oci:
                                  description: OCI is a digest-pinned image reference.
                                  pattern: ^[^[:space:]@]+@sha256:[0-9a-f]{64}$
                                  type: string
                                path:
                                  description: Path selects a directory within the
                                    immutable artifact.
                                  maxLength: 1024
                                  type: string
                              type: object
                              x-kubernetes-validations:
                              - message: path must be relative and must not contain
                                  '..' segments
                                rule: '!has(self.path) || (!self.path.startsWith(''/'')
                                  && !self.path.split(''/'').exists(p, p == ''..''))'
                              - message: exactly one of the fields in [oci git bucket]
                                  must be set
                                rule: (has(self.oci)?1:0)+(has(self.git)?1:0)+(has(self.bucket)?1:0)
                                  == 1
                          required:
                          - name
                          - source
                          type: object
                        maxItems: 50
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      systemPrompt:
                        type: string
                      systemPromptFrom:
                        description: SystemPromptFrom references prompt text in a
                          same-namespace ConfigMap.
                        properties:
                          key:
                            minLength: 1
                            type: string
                          name:
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      tools:
                        items:
                          description: ToolBinding selects exactly one MCP or subagent
                            tool source.
                          properties:
                            mcp:
                              description: MCPToolBinding binds tools from an authorized
                                MCP server.
                              properties:
                                requireApproval:
                                  description: |-
                                    RequireApproval pauses before each invocation of a tool exposed by this
                                    binding. It applies to the selected tools, or to every server tool when
                                    Tools is omitted or empty.
                                  type: boolean
                                server:
                                  description: TypedObjectReference contains enough
                                    information to let you locate the typed referenced
                                    object
                                  properties:
                                    apiGroup:
                                      description: |-
                                        APIGroup is the group for the resource being referenced.
                                        If APIGroup is not specified, the specified Kind must be in the core API group.
                                        For any other third-party types, APIGroup is required.
                                      type: string
                                    kind:
                                      description: Kind is the type of resource being
                                        referenced
                                      type: string
                                    name:
                                      description: Name is the name of resource being
                                        referenced
                                      type: string
                                    namespace:
                                      description: |-
                                        Namespace is the namespace of resource being referenced
                                        Note that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace's owner to accept the reference. See the ReferenceGrant documentation for details.
                                        (Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.
                                      type: string
                                  required:
                                  - kind
                                  - name
                                  type: object
                                  x-kubernetes-validations:
                                  - message: kind must be RemoteMCPServer
                                    rule: self.kind == 'RemoteMCPServer'
                                  - message: apiGroup must be omitted
                                    rule: '!has(self.apiGroup)'
                                  - fieldPath: .name
                                    message: name must contain between 1 and 253 characters
                                    rule: size(self.name) > 0 && size(self.name) <=
                                      253
                                  - fieldPath: .namespace
                                    message: namespace must contain at most 63 characters
                                    rule: '!has(self.namespace) || size(self.namespace)
                                      <= 63'
                                tools:
                                  description: |-
                                    Tools optionally limits which server tools are exposed. An omitted or empty
                                    list exposes every tool. Harnesses that cannot enforce a partial selection
                                    may expose the whole server and report a warning.
                                  items:
                                    minLength: 1
                                    type: string
                                  maxItems: 50
                                  type: array
                                  x-kubernetes-list-type: set
                              required:
                              - server
                              type: object
                            subAgent:
                              description: SubAgentToolBinding exposes a same-namespace
                                AgentTemplate as a logical tool.
                              properties:
                                description:
                                  description: Description tells the parent when to
                                    route work to this binding.
                                  minLength: 1
                                  type: string
                                name:
                                  minLength: 1
                                  type: string
                                templateRef:
                                  description: TemplateRef selects a Shared subagent
                                    compiled into the parent's runtime using its Harness.
                                  properties:
                                    name:
                                      default: ""
                                      description: |-
                                        Name of the referent.
                                        This field is effectively required, but due to backwards compatibility is
                                        allowed to be empty. Instances of this type with an empty value here are
                                        almost certainly wrong.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                      type: string
                                  type: object
                                  x-kubernetes-map-type: atomic
                                  x-kubernetes-validations:
                                  - message: templateRef.name must not be empty
                                    rule: has(self.name) && self.name != ''
                              required:
                              - description
                              - name
                              - templateRef
                              type: object
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of the fields in [mcp subAgent] must
                              be set
                            rule: (has(self.mcp)?1:0)+(has(self.subAgent)?1:0) ==
                              1
                        maxItems: 50
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: outputSchemaStrict requires outputSchema or outputSchemaFrom
                      rule: '!has(self.outputSchemaStrict) || !self.outputSchemaStrict
                        || has(self.outputSchema) || has(self.outputSchemaFrom)'
                    - message: at most one of the fields in [systemPrompt systemPromptFrom]
                        may be set
                      rule: (has(self.systemPrompt)?1:0)+(has(self.systemPromptFrom)?1:0)
                        <= 1
                    - message: at most one of the fields in [outputSchema outputSchemaFrom]
                        may be set
                      rule: (has(self.outputSchema)?1:0)+(has(self.outputSchemaFrom)?1:0)
                        <= 1
                  ref:
                    description: |-
                      Ref names an AgentTemplate in the Agent's namespace. It cannot be set
                      together with Inline.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-validations:
                    - message: ref.name must not be empty
                      rule: has(self.name) && self.name != ''
                type: object
                x-kubernetes-validations:
                - message: exactly one of the fields in [inline ref] must be set
                  rule: (has(self.inline)?1:0)+(has(self.ref)?1:0) == 1
            required:
            - harnessRef
            - template
            type: object
          status:
            description: AgentStatus reports compilation and preparation of an Agent.
            properties:
              conditions:
                description: |-
                  Conditions report runtime readiness and independent egress grant admission.
                  EgressPoliciesApplied is False for EgressPolicyNotFound, InvalidEgressPolicy,
                  or EgressGrantConflict; Applied means all grants are admitted. Grant issues
                  do not affect Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 5
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredRevision:
                minLength: 1
                type: string
              latestSuccessfulRevision:
                minLength: 1
                type: string
              observedGeneration:
                format: int64
                type: integer
              warnings:
                description: |-
                  Warnings reports non-blocking compatibility decisions made while compiling
                  this Agent.
                items:
                  type: string
                maxItems: 100
                type: array
                x-kubernetes-list-type: set
              workloadImage:
                description: |-
                  WorkloadImage is the digest-pinned image selected for the desired revision.
                  Existing Sessions may still use an older revision and image.
                pattern: ^[^[:space:]@]+@sha256:[a-f0-9]{64}$
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
