---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modelproviderconfigs.api.kagent.dev
spec:
  group: api.kagent.dev
  names:
    categories:
    - kagent
    kind: ModelProviderConfig
    listKind: ModelProviderConfigList
    plural: modelproviderconfigs
    shortNames:
    - mprov
    singular: modelproviderconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.modelCount
      name: Models
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          ModelProviderConfig is the Schema for the modelproviderconfigs API.
          It represents a model provider configuration with automatic model discovery.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelProviderConfigSpec defines the desired state of ModelProviderConfig.
            properties:
              discoveryAuth:
                description: |-
                  DiscoveryAuth authenticates requests to list models. Omit for unauthenticated discovery.
                  These credentials are never used to invoke discovered models.
                properties:
                  secretRef:
                    description: |-
                      SecretRef selects the discovery Bearer token from a Secret in the
                      ModelProviderConfig's namespace. The selected value must be nonempty.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-validations:
                    - message: secretRef requires a name and key
                      rule: has(self.name) && self.name != '' && self.key != ''
                    - message: discovery credentials cannot be optional
                      rule: '!has(self.optional) || !self.optional'
                required:
                - secretRef
                type: object
              endpoint:
                description: |-
                  Endpoint is the API endpoint URL for the provider.
                  If not specified, the default endpoint for the provider type will be used.
                pattern: ^https?://[^/?#@]+(/[^?#]*)?$
                type: string
              modelConfigTemplate:
                description: |-
                  ModelConfigTemplate configures the ModelConfigs created for discovered models
                  in this ModelProviderConfig's namespace.
                properties:
                  allowedNamespaces:
                    description: |-
                      AllowedNamespaces controls which namespaces may reference discovered models
                      and their invocation credentials. Omitted policy permits only the same namespace.
                    properties:
                      from:
                        default: Same
                        description: |-
                          From indicates where references to this resource can originate.
                          Possible values are:
                          * All: References from all namespaces are allowed.
                          * Same: Only references from the same namespace are allowed (default).
                          * Selector: References from namespaces matching the selector are allowed.
                        enum:
                        - All
                        - Same
                        - Selector
                        type: string
                      selector:
                        description: |-
                          Selector is a label selector for namespaces that are allowed to reference this resource.
                          Only used when From is set to "Selector".
                        properties:
                          matchExpressions:
                            description: matchExpressions is a list of label selector
                              requirements. The requirements are ANDed.
                            items:
                              description: |-
                                A label selector requirement is a selector that contains values, a key, and an operator that
                                relates the key and values.
                              properties:
                                key:
                                  description: key is the label key that the selector
                                    applies to.
                                  type: string
                                operator:
                                  description: |-
                                    operator represents a key's relationship to a set of values.
                                    Valid operators are In, NotIn, Exists and DoesNotExist.
                                  type: string
                                values:
                                  description: |-
                                    values is an array of string values. If the operator is In or NotIn,
                                    the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                    the values array must be empty. This array is replaced during a strategic
                                    merge patch.
                                  items:
                                    type: string
                                  type: array
                                  x-kubernetes-list-type: atomic
                              required:
                              - key
                              - operator
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: |-
                              matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                              map is equivalent to an element of matchExpressions, whose key field is "key", the
                              operator is "In", and the values array contains only "value". The requirements are ANDed.
                            type: object
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                    x-kubernetes-validations:
                    - message: selector must be specified when from is Selector
                      rule: '!(self.from == ''Selector'' && !has(self.selector))'
                  auth:
                    description: |-
                      Auth configures invocation credentials. Omit to add no explicit credentials.
                      Discovery credentials are not inherited.
                    properties:
                      actorJwt:
                        description: ActorJWT authenticates as the executing Actor.
                          Substrate mints and injects the token.
                        properties:
                          audiences:
                            description: |-
                              Audiences names the services permitted to accept this token. The runtime
                              control-plane audience is reserved and cannot be exported downstream.
                            items:
                              maxLength: 512
                              minLength: 1
                              type: string
                            maxItems: 16
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: set
                            x-kubernetes-validations:
                            - message: the runtime control-plane audience is reserved
                              rule: '!self.exists(a, a == ''kagent-runtime'')'
                          expirationSeconds:
                            default: 900
                            description: |-
                              ExpirationSeconds requests a token lifetime. Substrate refreshes tokens at
                              the gateway independently of the invocation caller's token lifetime.
                            format: int64
                            maximum: 3600
                            minimum: 300
                            type: integer
                        required:
                        - audiences
                        type: object
                      secretRef:
                        description: |-
                          SecretRef selects the invocation API key from a Secret in the
                          ModelProviderConfig and generated ModelConfig namespace.
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                        x-kubernetes-validations:
                        - message: secretRef requires a name and key
                          rule: has(self.name) && self.name != '' && self.key != ''
                        - message: invocation credentials cannot be optional
                          rule: '!has(self.optional) || !self.optional'
                      tokenPassthrough:
                        description: TokenPassthrough forwards the incoming A2A bearer
                          token to the model provider.
                        type: boolean
                    type: object
                    x-kubernetes-validations:
                    - message: at most one of the fields in [actorJwt secretRef tokenPassthrough]
                        may be set
                      rule: (has(self.actorJwt)?1:0)+(has(self.secretRef)?1:0)+(has(self.tokenPassthrough)?1:0)
                        <= 1
                type: object
              type:
                description: Type is the discovery protocol. OpenAI-compatible endpoints
                  are supported.
                enum:
                - Anthropic
                - OpenAI
                - AzureOpenAI
                - Ollama
                - Gemini
                - GeminiVertexAI
                - AnthropicVertexAI
                - Bedrock
                - SAPAICore
                - Foundry
                - Mistral
                type: string
                x-kubernetes-validations:
                - message: only OpenAI-compatible discovery is supported
                  rule: self == 'OpenAI'
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: endpoint must be a valid URL starting with http:// or https://
              rule: '!has(self.endpoint) || size(self.endpoint) == 0 || self.endpoint.startsWith(''http://'')
                || self.endpoint.startsWith(''https://'')'
          status:
            description: ModelProviderConfigStatus defines the observed state of ModelProviderConfig.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the ModelProviderConfig's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              modelCount:
                description: ModelCount is the number of discovered models (for kubectl
                  display)
                type: integer
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed ModelProviderConfig spec
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
