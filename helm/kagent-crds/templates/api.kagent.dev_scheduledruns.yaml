---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: scheduledruns.api.kagent.dev
spec:
  group: api.kagent.dev
  names:
    categories:
    - kagent
    kind: ScheduledRun
    listKind: ScheduledRunList
    plural: scheduledruns
    singular: scheduledrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef.name
      name: Agent
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.paused
      name: Paused
      type: boolean
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          ScheduledRun sends a prompt to an Agent on a cron schedule. Each occurrence
          creates a fresh Session owned by the ScheduledRun rather than by a human user.
          Task state and history belong to upstream A2A.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ScheduledRunSpec describes when and what to send. The Agent reference is
              local to the ScheduledRun's namespace.
            properties:
              agentRef:
                description: |-
                  AgentRef names the Agent that receives each occurrence. It is immutable:
                  reserved occurrences resolve the schedule's Agent when they start, so a
                  change could send an earlier prompt to a different Agent. Recreate the
                  ScheduledRun to target another Agent.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: agentRef.name must not be empty
                  rule: has(self.name) && self.name != ''
                - message: agentRef is immutable
                  rule: self == oldSelf
              executionTimeout:
                default: 15m
                description: |-
                  ExecutionTimeout bounds one occurrence, including queueing and runtime
                  provisioning. Omitted means 15 minutes.
                type: string
                x-kubernetes-validations:
                - message: executionTimeout must be positive and at most 9223372036s
                  rule: duration(self) > duration('0s') && duration(self) <= duration('9223372036s')
              paused:
                default: false
                description: |-
                  Paused keeps the schedule and its history without reserving new
                  occurrences. Omitted means false.
                type: boolean
              prompt:
                description: Prompt is the user message sent at each occurrence.
                maxLength: 32768
                minLength: 1
                pattern: \S
                type: string
              schedule:
                description: |-
                  Schedule is a standard five-field cron expression evaluated in TimeZone.
                  Macros such as @hourly and seconds fields are not accepted.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: schedule must contain five cron fields
                  rule: self.split(' ').filter(f, f != '').size() == 5
              timeZone:
                description: TimeZone is an IANA time zone name such as Europe/Paris.
                  Omitted means UTC.
                maxLength: 253
                minLength: 1
                type: string
            required:
            - agentRef
            - prompt
            - schedule
            type: object
          status:
            description: ScheduledRunStatus reports control-plane persistence of a
              ScheduledRun.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 3
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
