              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ScheduledRunSpec defines unattended invocations of an Agent. Accepted
              executions retain their inputs when the resource changes or is deleted.
            properties:
              agentRef:
                description: AgentRef names the Agent to invoke in the ScheduledRun's
                  namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: agentRef.name is required
                  rule: has(self.name) && self.name.size() > 0
              executionTimeout:
                default: 15m
                description: ExecutionTimeout includes queueing and provisioning.
                type: string
                x-kubernetes-validations:
                - message: executionTimeout must be between one microsecond and 2562047
                    hours
                  rule: duration(self) >= duration('1us') && duration(self) <= duration('2562047h')
              paused:
                default: false
                description: Paused stops new cron reservations. Manual triggers remain
                  available.
                type: boolean
              prompt:
                description: Prompt is the message submitted for each occurrence.
                maxLength: 32768
                minLength: 1
                pattern: \S
                type: string
              schedule:
                description: Schedule is a five-field cron expression.
                maxLength: 256
                minLength: 1
                pattern: ^\S+\s+\S+\s+\S+\s+\S+\s+\S+$
                type: string
              timeZone:
