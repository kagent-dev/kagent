                      - message: path must be relative and must not contain '..' segments
                        rule: '!has(self.path) || (!self.path.startsWith(''/'') &&
                          !self.path.split(''/'').exists(p, p == ''..''))'
                  required:
                  - name
                  - source
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              systemPrompt:
                type: string
              systemPromptFrom:
                description: SystemPromptFrom references prompt text in a same-namespace
                  ConfigMap.
                properties:
                  key:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              tools:
                items:
                  description: ToolBinding selects exactly one MCP or subagent tool
                    source.
                  properties:
                    mcp:
                      description: MCPToolBinding binds tools from a same-namespace
                        MCP server.
                      properties:
                        requireApproval:
                          description: |-
                            RequireApproval pauses before each invocation of a tool exposed by this
                            binding. It applies to the selected tools, or to every server tool when
                            Tools is omitted or empty.
                          type: boolean
                        server:
                          description: |-
                            TypedLocalObjectReference contains enough information to let you locate the
                            typed referenced object inside the same namespace.
                          properties:
                            apiGroup:
                              description: |-
                                APIGroup is the group for the resource being referenced.
                                If APIGroup is not specified, the specified Kind must be in the core API group.
                                For any other third-party types, APIGroup is required.
                              type: string
                            kind:
                              description: Kind is the type of resource being referenced
                              type: string
                            name:
                              description: Name is the name of resource being referenced
                              type: string
                          required:
                          - kind
                          - name
                          type: object
                          x-kubernetes-map-type: atomic
                          x-kubernetes-validations:
                          - message: kind must be RemoteMCPServer
