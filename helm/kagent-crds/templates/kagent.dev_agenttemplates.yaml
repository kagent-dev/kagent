                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                          type: object
                          x-kubernetes-map-type: atomic
                          x-kubernetes-validations:
                          - message: templateRef.name must not be empty
                            rule: has(self.name) && self.name != ''
                      required:
                      - description
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of templateRef or agentRef must be specified
                        rule: has(self.templateRef) != has(self.agentRef)
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of mcp or subAgent must be specified
                    rule: has(self.mcp) != has(self.subAgent)
                maxItems: 50
                type: array
            type: object
            x-kubernetes-validations:
            - message: systemPrompt and systemPromptFrom are mutually exclusive
              rule: '!(has(self.systemPrompt) && has(self.systemPromptFrom))'
            - message: outputSchema and outputSchemaFrom are mutually exclusive
              rule: '!(has(self.outputSchema) && has(self.outputSchemaFrom))'
