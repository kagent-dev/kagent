                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: name must not be empty
                  rule: has(self.name) && self.name != ''
              outputSchema:
                description: |-
                  OutputSchema constrains successful terminal output when this template is
                  compiled as the root agent.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              outputSchemaFrom:
                description: |-
                  OutputSchemaFrom references a JSON Schema stored as JSON in a
                  same-namespace ConfigMap key.
                properties:
                  key:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              plugins:
                items:
                  description: PluginBundle selects Agent Skills from one immutable
                    Agent Plugins package.
                  properties:
                    skills:
                      description: An empty selection enables nothing.
                      items:
                        minLength: 1
                        type: string
                      maxItems: 50
                      type: array
                      x-kubernetes-list-type: set
                    source:
                      description: ArtifactSource selects exactly one immutable artifact.
                      properties:
                        bucket:
                          description: BucketArtifact selects the supported object-store
