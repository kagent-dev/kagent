---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: egresspolicies.api.kagent.dev
spec:
  group: api.kagent.dev
  names:
    categories:
    - kagent
    kind: EgressPolicy
    listKind: EgressPolicyList
    plural: egresspolicies
    singular: egresspolicy
  scope: Namespaced
  versions:
  - name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          EgressPolicy is a reusable grant of additional network access. Workloads in its
          namespace select it explicitly; changes update their existing runtime Actors.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EgressPolicySpec grants additional HTTP(S) access to workloads
              in its namespace.
            properties:
              destinations:
                description: Destinations are additional origins the workload may
                  reach.
                items:
                  description: EgressDestination grants access to one HTTP(S) origin,
                    including all its paths.
                  properties:
                    headers:
                      description: Headers sets credential headers for the declared
                        endpoint.
                      items:
                        description: |-
                          Header sets an HTTP header from a credential source for the declared endpoint.
                          Literal values are not supported by this contract.
                        properties:
                          name:
                            description: Name is the HTTP credential header, for example
                              Authorization or X-API-Key.
                            maxLength: 256
                            pattern: ^[!#$%&'*+.^_\x60|~0-9A-Za-z-]+$
                            type: string
                            x-kubernetes-validations:
                            - message: this header cannot carry an egress credential
                              rule: '!(self.lowerAscii() in [''host'', ''connection'',
                                ''content-length'', ''transfer-encoding'', ''te'',
                                ''trailer'', ''upgrade'', ''keep-alive'', ''proxy-authorization'',
                                ''proxy-authenticate'', ''cookie''])'
                          prefix:
                            description: Prefix is prepended verbatim, including any
                              separating space. For example, "Bearer ".
                            maxLength: 256
                            pattern: ^[^\x00-\x08\x0a-\x1f\x7f]*$
                            type: string
                          valueFrom:
                            description: ValueFrom selects exactly one credential
                              source.
                            properties:
                              secretKeyRef:
                                description: SecretKeyRef selects a required Secret
                                  key in the resource's namespace.
                                properties:
                                  key:
                                    description: The key of the secret to select from.  Must
                                      be a valid secret key.
                                    type: string
                                  name:
                                    default: ""
                                    description: |-
                                      Name of the referent.
                                      This field is effectively required, but due to backwards compatibility is
                                      allowed to be empty. Instances of this type with an empty value here are
                                      almost certainly wrong.
                                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                    type: string
                                  optional:
                                    description: Specify whether the Secret or its
                                      key must be defined
                                    type: boolean
                                required:
                                - key
                                type: object
                                x-kubernetes-map-type: atomic
                                x-kubernetes-validations:
                                - message: secretKeyRef requires a name and key
                                  rule: has(self.name) && self.name != '' && self.key
                                    != ''
                                - message: credentials cannot be optional
                                  rule: '!has(self.optional) || !self.optional'
                              tokenPassthrough:
                                description: |-
                                  TokenPassthrough selects the authenticated invocation's bearer credential.
                                  Missing or expired credentials fail without selecting another source.
                                type: object
                            type: object
                            x-kubernetes-validations:
                            - message: exactly one of the fields in [secretKeyRef
                                tokenPassthrough] must be set
                              rule: (has(self.secretKeyRef)?1:0)+(has(self.tokenPassthrough)?1:0)
                                == 1
                        required:
                        - name
                        - valueFrom
                        type: object
                      maxItems: 16
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                      x-kubernetes-validations:
                      - message: credential header names must be unique ignoring case
                        rule: self.all(a, self.filter(b, a.name.lowerAscii() == b.name.lowerAscii()).size()
                          == 1)
                    origin:
                      description: |-
                        Origin is a scheme, DNS hostname, and optional port. A wildcard replaces
                        exactly one leftmost DNS label, for example https://*.example.com.
                      maxLength: 270
                      pattern: ^https?://(\*\.([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+|([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)*)[a-z]([-a-z0-9]{0,61}[a-z0-9])?(:([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?$
                      type: string
                  required:
                  - origin
                  type: object
                  x-kubernetes-validations:
                  - message: credential headers require an exact HTTP(S) origin
                    rule: '!has(self.headers) || !self.origin.contains(''*'')'
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - origin
                x-kubernetes-list-type: map
            required:
            - destinations
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
