---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: remotemcpservers.api.kagent.dev
spec:
  group: api.kagent.dev
  names:
    categories:
    - kagent
    kind: RemoteMCPServer
    listKind: RemoteMCPServerList
    plural: remotemcpservers
    shortNames:
    - rmcps
    singular: remotemcpserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.protocol
      name: Protocol
      type: string
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=='Accepted')].status
      name: Accepted
      type: string
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: RemoteMCPServer is the Schema for the RemoteMCPServers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RemoteMCPServerSpec defines the desired state of RemoteMCPServer.
            properties:
              actorJwt:
                description: |-
                  ActorJWT authenticates as the executing Actor with Authorization: Bearer.
                  Substrate injects the token; tool discovery runs inside the Actor.
                properties:
                  audiences:
                    description: |-
                      Audiences names the services permitted to accept this token. The runtime
                      control-plane audience is reserved and cannot be exported downstream.
                    items:
                      maxLength: 512
                      minLength: 1
                      type: string
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: the runtime control-plane audience is reserved
                      rule: '!self.exists(a, a == ''kagent-runtime'')'
                  expirationSeconds:
                    default: 900
                    description: |-
                      ExpirationSeconds requests a token lifetime. Substrate refreshes tokens at
                      the gateway independently of the invocation caller's token lifetime.
                    format: int64
                    maximum: 3600
                    minimum: 300
                    type: integer
                required:
                - audiences
                type: object
              allowedNamespaces:
                description: |-
                  AllowedNamespaces defines which namespaces are allowed to reference this RemoteMCPServer.
                  This follows the Gateway API pattern for cross-namespace route attachments.
                  If not specified, only Agents in the same namespace can reference this RemoteMCPServer.
                  See: https://gateway-api.sigs.k8s.io/guides/multiple-ns/#cross-namespace-route-attachment
                properties:
                  from:
                    default: Same
                    description: |-
                      From indicates where references to this resource can originate.
                      Possible values are:
                      * All: References from all namespaces are allowed.
                      * Same: Only references from the same namespace are allowed (default).
                      * Selector: References from namespaces matching the selector are allowed.
                    enum:
                    - All
                    - Same
                    - Selector
                    type: string
                  selector:
                    description: |-
                      Selector is a label selector for namespaces that are allowed to reference this resource.
                      Only used when From is set to "Selector".
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
                x-kubernetes-validations:
                - message: selector must be specified when from is Selector
                  rule: '!(self.from == ''Selector'' && !has(self.selector))'
              description:
                type: string
              headersFrom:
                description: |-
                  HeadersFrom supplies request headers. Secret-backed headers are injected by
                  the egress gateway and cannot use routing, framing, hop-by-hop,
                  proxy-authentication, or Cookie headers. At most 64 headers may be supplied.
                items:
                  description: ValueRef represents a configuration value
                  properties:
                    name:
                      maxLength: 256
                      type: string
                    value:
                      type: string
                    valueFrom:
                      description: ValueSource defines a source for configuration
                        values from a Secret or ConfigMap
                      properties:
                        key:
                          description: The key of the ConfigMap or Secret.
                          maxLength: 253
                          type: string
                        name:
                          description: The name of the ConfigMap or Secret.
                          maxLength: 253
                          type: string
                        type:
                          enum:
                          - ConfigMap
                          - Secret
                          type: string
                      required:
                      - key
                      - name
                      - type
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - fieldPath: .name
                    message: Secret-backed headers require a valid HTTP header name
                    rule: '!has(self.valueFrom) || self.valueFrom.type != ''Secret''
                      || self.name.matches(''^[!#$%&\\x27*+.^_`|~0-9A-Za-z-]+$'')'
                  - fieldPath: .name
                    message: this header cannot carry an egress credential
                    rule: '!has(self.valueFrom) || self.valueFrom.type != ''Secret''
                      || !(self.name.lowerAscii() in [''host'', ''connection'', ''content-length'',
                      ''transfer-encoding'', ''te'', ''trailer'', ''upgrade'', ''keep-alive'',
                      ''proxy-authorization'', ''proxy-authenticate'', ''cookie''])'
                  - message: exactly one of the fields in [value valueFrom] must be
                      set
                    rule: (has(self.value)?1:0)+(has(self.valueFrom)?1:0) == 1
                maxItems: 64
                type: array
              protocol:
                default: STREAMABLE_HTTP
                enum:
                - SSE
                - STREAMABLE_HTTP
                type: string
              sseReadTimeout:
                type: string
                x-kubernetes-validations:
                - message: sseReadTimeout must be positive and at most 9223372036s
                  rule: duration(self) > duration('0s') && duration(self) <= duration('9223372036s')
              terminateOnClose:
                default: true
                type: boolean
              timeout:
                default: 30s
                type: string
                x-kubernetes-validations:
                - message: timeout must be positive and at most 9223372036s
                  rule: duration(self) > duration('0s') && duration(self) <= duration('9223372036s')
              tls:
                description: |-
                  TLS configuration for the upstream MCP server connection.
                  DisableVerify turns off certificate validation for development or testing.
                  Custom CA bundles are not supported. TLS must be unset for HTTP URLs.
                properties:
                  disableVerify:
                    default: false
                    description: |-
                      DisableVerify disables SSL certificate verification entirely.
                      When false (default), SSL certificates are verified.
                      When true, SSL certificate verification is disabled.
                      WARNING: This should ONLY be used in development/testing environments.
                      Production deployments MUST use proper certificates.
                    type: boolean
                type: object
              tokenPassthrough:
                description: |-
                  TokenPassthrough forwards the bearer token from the incoming A2A request
                  to this server as its Authorization header. Requests without a caller
                  token fail. Controller tool discovery has no caller token, so servers that
                  require one should disable discovery with the kagent.dev/discovery label.
                type: boolean
              url:
                minLength: 1
                type: string
            required:
            - description
            - url
            type: object
            x-kubernetes-validations:
            - message: 'spec.tls must be unset when spec.url has http:// scheme: a
                TLS opinion contradicts a plaintext URL. Either drop spec.tls, or
                use https:// / a scheme-less URL.'
              rule: '!self.url.startsWith(''http://'') || !has(self.tls)'
            - message: headersFrom cannot set Authorization when tokenPassthrough
                is enabled
              rule: '!(has(self.tokenPassthrough) && self.tokenPassthrough) || !has(self.headersFrom)
                || !self.headersFrom.exists(h, h.name.lowerAscii() == ''authorization'')'
            - message: headersFrom cannot set Authorization when actorJwt is enabled
              rule: '!has(self.actorJwt) || !has(self.headersFrom) || !self.headersFrom.exists(h,
                h.name.lowerAscii() == ''authorization'')'
            - message: at most one of the fields in [actorJwt tokenPassthrough] may
                be set
              rule: (has(self.actorJwt)?1:0)+(has(self.tokenPassthrough)?1:0) <= 1
          status:
            description: RemoteMCPServerStatus defines the observed state of RemoteMCPServer.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              discoveredTools:
                items:
                  properties:
                    description:
                      type: string
                    name:
                      type: string
                  required:
                  - description
                  - name
                  type: object
                type: array
              observedGeneration:
                description: |-
                  INSERT ADDITIONAL STATUS FIELD - define observed state of cluster
                  Important: Run "make" to regenerate code after modifying this file
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
