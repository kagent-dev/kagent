{{- if .Values.harness.create }}
{{- /*
The chart's own Harness (kagent.dev/v1alpha3): how an agent runs on the API v2 —
a digest-pinned runtime image, an environment and a Substrate policy (a
WorkerPool, a snapshot location); an AgentTemplate becomes Ready only when a
Harness admits it (allowedAgentTemplates.selector). The runtime is the chart's
Go ADK image (controller.agentImage) at the digest the chart was published
with; harness.image overrides it. The CRD pins the image by digest — a moving
tag would silently change every agent under the Harness — so a tag fails here,
at render time, instead of at admission.
*/}}
{{- $image := include "kagent.harness.image" . }}
{{- if not $image }}
{{- fail "harness.create=true needs the runtime image's digest: set controller.agentImage.digest (sha256:<64 hex digits>; a published chart carries it) or harness.image (<repository>@sha256:<64 hex digits>)" }}
{{- end }}
{{- if not (regexMatch "^[^[:space:]@]+@sha256:[a-f0-9]{64}$" $image) }}
{{- fail (printf "harness image %q: a Harness pins its runtime image by digest (<repository>@sha256:<64 hex digits>); a tag is not accepted" $image) }}
{{- end }}
{{- if not .Values.harness.snapshotLocation }}
{{- fail "harness.snapshotLocation is required when harness.create=true (the Substrate snapshot store of the actors run under the Harness, e.g. s3://<bucket>/<prefix>)" }}
{{- end }}
apiVersion: kagent.dev/v1alpha3
kind: Harness
metadata:
  name: {{ .Values.harness.name | quote }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
  annotations:
    # The runtime of every agent admitted under it: kept across an uninstall of the chart.
    helm.sh/resource-policy: keep
spec:
  {{- /* Exactly one of kagent|codex|claude|byo; the Go ADK runtime adapter. */}}
  kagent: {}
  workload:
    image: {{ $image | quote }}
  {{- with .Values.harness.env }}
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  substrate:
    workerPoolRef:
      name: {{ .Values.harness.workerPoolRef | default .Values.substrateWorkerPool.name | quote }}
    snapshotPolicy:
      location: {{ .Values.harness.snapshotLocation | quote }}
  allowedAgentTemplates:
    {{- toYaml .Values.harness.allowedAgentTemplates | nindent 4 }}
{{- end }}
