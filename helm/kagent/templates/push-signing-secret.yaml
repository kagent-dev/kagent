{{- if not .Values.controller.pushSigning.existingSecret }}
{{- $name := printf "%s-push-signing" (include "kagent.fullname" .) }}
{{- $existing := lookup "v1" "Secret" (include "kagent.namespace" .) $name }}
{{- $seed := randBytes 32 }}
{{- if and $existing (index $existing.data "seed") }}
{{- $seed = (index $existing.data "seed" | b64dec) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.controller.labels" . | nindent 4 }}
type: Opaque
data:
  seed: {{ $seed | b64enc | quote }}
{{- end }}
