{{- with include "kagent.anthropicSandboxManagedEncryptionSecret" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ . }}
  namespace: {{ include "kagent.namespace" $ }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ . | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ . }}
  namespace: {{ include "kagent.namespace" $ }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kagent.controller.serviceAccountName" $ | quote }}
    namespace: {{ include "kagent.namespace" $ }}
{{- end }}
