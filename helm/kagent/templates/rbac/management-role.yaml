{{- define "kagent.management.rules" -}}
# Management API writes; dependency reads are granted by the reconciliation Role.
- apiGroups:
  - api.kagent.dev
  resources:
  - harnesses
  - agents
  - sandboxtemplates
  - agenttemplates
  - modelconfigs
  - modelproviderconfigs
  - remotemcpservers
  verbs:
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - create
  - update
  - delete
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - delete
{{- end -}}

{{- include "kagent.rbac.validate" . -}}
{{- $rbacNamespaces := include "kagent.rbacNamespaces" . | fromJsonArray }}
{{- if $rbacNamespaces }}
{{- range $namespace := $rbacNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kagent.fullname" $ }}-management-role
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent.labels" $ | nindent 4 }}
rules:
  {{- include "kagent.management.rules" $ | nindent 2 }}
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kagent.fullname" . }}-management-role
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
rules:
  {{- include "kagent.management.rules" . | nindent 2 }}
{{- end }}
