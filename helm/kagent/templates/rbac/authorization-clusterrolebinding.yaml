{{- if eq .Values.controller.authorization.mode "kubernetes" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kagent.fullname" . }}-authorization-rolebinding
  labels:
    {{- include "kagent.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kagent.fullname" . }}-authorization-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kagent.controller.serviceAccountName" . | quote }}
    namespace: {{ include "kagent.namespace" . }}
{{- end }}
