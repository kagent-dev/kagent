{{- define "kagent.reconciliation.rules" -}}
# Shared reads for reconciliation and management API requests.
- apiGroups:
  - api.kagent.dev
  resources:
  - harnesses
  - agents
  - egresspolicies
  - sandboxtemplates
  - agenttemplates
  - modelconfigs
  - modelproviderconfigs
  - remotemcpservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - api.kagent.dev
  resources:
  - harnesses/finalizers
  - agents/finalizers
  - sandboxtemplates/finalizers
  - modelconfigs/finalizers
  - modelproviderconfigs/finalizers
  - remotemcpservers/finalizers
  verbs:
  - update
- apiGroups:
  - api.kagent.dev
  resources:
  - harnesses/status
  - agents/status
  - modelconfigs/status
  - modelproviderconfigs/status
  - remotemcpservers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - api.kagent.dev
  resources:
  - sandboxtemplates/status
  verbs:
  - update
  - patch
# SandboxTemplate finalizers are persisted through the main resource endpoint.
- apiGroups:
  - api.kagent.dev
  resources:
  - sandboxtemplates
  verbs:
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ate.dev
  resources:
  - workerpools
  verbs:
  - get
  - list
  - watch
{{- end -}}

{{- include "kagent.rbac.validate" . -}}
{{- $rbacNamespaces := include "kagent.rbacNamespaces" . | fromJsonArray }}
{{- if $rbacNamespaces }}
{{- range $namespace := $rbacNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kagent.fullname" $ }}-reconciliation-role
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent.labels" $ | nindent 4 }}
rules:
  {{- include "kagent.reconciliation.rules" $ | nindent 2 }}
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kagent.fullname" . }}-reconciliation-role
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
rules:
  {{- include "kagent.reconciliation.rules" . | nindent 2 }}
  # Cluster-wide namespace discovery uses the manager's cached client.
  - apiGroups:
    - ""
    resources:
    - namespaces
    verbs:
    - get
    - list
    - watch
{{- end }}
