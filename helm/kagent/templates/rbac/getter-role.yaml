{{- define "kagent.getter.rules" -}}
- apiGroups:
  - api.kagent.dev
  resources:
  - harnesses
  - agents
  - sandboxtemplates
  - agenttemplates
  - modelconfigs
  - modelproviderconfigs
  - remotemcpservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kagent.dev
  resources:
  - mcpservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - api.kagent.dev
  resources:
  - harnesses/finalizers
  - agents/finalizers
  - modelconfigs/finalizers
  - modelproviderconfigs/finalizers
  - remotemcpservers/finalizers
  verbs:
  - update
- apiGroups:
  - kagent.dev
  resources:
  - mcpservers/finalizers
  verbs:
  - update
- apiGroups:
  - api.kagent.dev
  resources:
  - harnesses/status
  - agents/status
  - modelconfigs/status
  - modelproviderconfigs/status
  - remotemcpservers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kagent.dev
  resources:
  - mcpservers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - "*"
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ate.dev
  resources:
  - workerpools
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "apps"
  resources:
  - "*"
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "batch"
  resources:
  - "*"
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "rbac.authorization.k8s.io"
  resources:
  - "*"
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - "*"
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - get
  - list
  - watch
{{- end -}}

{{- include "kagent.rbac.validate" . -}}
{{- $rbacNamespaces := include "kagent.rbacNamespaces" . | fromJsonArray }}
{{- if $rbacNamespaces }}
{{- range $namespace := $rbacNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kagent.fullname" $ }}-getter-role
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent.labels" $ | nindent 4 }}
rules:
  {{- include "kagent.getter.rules" $ | nindent 2 }}
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kagent.fullname" . }}-getter-role
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
rules:
  {{- include "kagent.getter.rules" . | nindent 2 }}
{{- end }}
