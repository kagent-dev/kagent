{{- if .Values.substrateWorkerPool.create }}
{{- if not .Values.substrateWorkerPool.workerImage }}
{{- fail "substrateWorkerPool.workerImage is required when substrateWorkerPool.create=true" }}
{{- end }}
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: {{ .Values.substrateWorkerPool.name | quote }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- $labels := mergeOverwrite (dict) (include "kagent.labels" . | fromYaml) (.Values.substrateWorkerPool.labels | default dict) (dict "kagent.dev/worker-pool-name" (toString .Values.substrateWorkerPool.name) "kagent.dev/worker-pool-namespace" (include "kagent.namespace" .)) }}
    {{- toYaml $labels | nindent 4 }}
spec:
  replicas: {{ .Values.substrateWorkerPool.replicas }}
  workerImage: {{ include "kagent.mirroredImage" (dict "root" . "image" .Values.substrateWorkerPool.workerImage) | quote }}
  sandboxClasses:
    - name: {{ .Values.substrateWorkerPool.sandboxClass | default "gvisor" | quote }}
      configRef:
        name: {{ .Values.substrateWorkerPool.sandboxConfigRef | default (ternary "microvm" "gvisor-default" (eq (.Values.substrateWorkerPool.sandboxClass | default "gvisor") "microvm")) | quote }}
  template:
    {{- toYaml (set (deepCopy (.Values.substrateWorkerPool.template | default dict)) "serviceAccountName" (include "kagent.substrateWorkerPool.serviceAccountName" .)) | nindent 4 }}
{{- end }}
