{{- if and .Values.controller.substrate.enabled .Values.substrateWorkerPool.create }}
{{- $ateomImage := .Values.substrateWorkerPool.ateomImage }}
{{- if not $ateomImage }}
  {{- if .Values.substrate.enabled }}
    {{- $substrateVersion := index .Chart.Annotations "substrate.kagent.dev/version" }}
    {{- if $substrateVersion }}
      {{- $ateomImage = printf "ghcr.io/kagent-dev/substrate/ateom-gvisor:v%s" $substrateVersion }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if not $ateomImage }}
  {{- fail "substrateWorkerPool.ateomImage is required when substrateWorkerPool.create=true and the \"substrate\" chart dependency isn't enabled (substrate.enabled=false) - set it explicitly to match your ate-system version" }}
{{- end }}
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: {{ .Values.substrateWorkerPool.name | quote }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
    kagent.dev/worker-pool: {{ .Values.substrateWorkerPool.name | quote }}
    {{- with .Values.substrateWorkerPool.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.substrateWorkerPool.replicas }}
  ateomImage: {{ $ateomImage | quote }}
  sandboxClass: {{ .Values.substrateWorkerPool.sandboxClass | default "gvisor" | quote }}
  {{- with .Values.substrateWorkerPool.template }}
  template:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
