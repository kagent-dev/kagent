{{- $postgres := .Values.database.postgres -}}
{{- $bootstrapEnabled := and $postgres.bundled.enabled $postgres.bundled.bootstrap -}}
{{- $host := printf "%s.%s.svc" (include "kagent.postgresqlServiceName" .) (include "kagent.namespace" .) -}}
{{- if and $postgres.bundled.enabled (not $postgres.bundled.adminSecretRef.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kagent.postgres.adminSecretName" . }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
{{- end }}
{{- if and $postgres.bundled.enabled $bootstrapEnabled (not $postgres.secretRef.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kagent.postgres.connectionSecretName" . }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  {{ $postgres.secretRef.key | default "connectionString" }}: {{ printf "postgresql://kagent_user:kagent@%s:5432/kagent?sslmode=disable" $host | quote }}
---
{{- end }}
{{- $substratePostgres := .Values.substrate.postgres | default dict -}}
{{- $substrateBootstrap := get $substratePostgres "bootstrap" -}}
{{- $readWriteRef := get $substratePostgres "readWriteConnectionStringSecretRef" | default dict -}}
{{- $ownerRef := get $substratePostgres "ownerConnectionStringSecretRef" | default dict -}}
{{- $substrateAdminRef := get $substratePostgres "adminSecretRef" | default dict -}}
{{- if and .Values.substrate.enabled $substrateBootstrap (not $postgres.bundled.enabled) -}}
{{- fail "substrate.postgres.bootstrap requires database.postgres.bundled.enabled=true" -}}
{{- end -}}
{{- if and .Values.substrate.enabled $postgres.bundled.enabled $substrateBootstrap (ne $substratePostgres.database "kagent") -}}
{{- fail "substrate.postgres.database must be kagent when sharing Kagent's bundled PostgreSQL" -}}
{{- end -}}
{{- if and .Values.substrate.enabled $postgres.bundled.enabled $substrateBootstrap (or (ne (get $substrateAdminRef "name") (include "kagent.postgres.adminSecretName" .)) (ne (get $substrateAdminRef "usernameKey") $postgres.bundled.adminSecretRef.usernameKey) (ne (get $substrateAdminRef "passwordKey") $postgres.bundled.adminSecretRef.passwordKey)) -}}
{{- fail "substrate.postgres.adminSecretRef must match database.postgres.bundled.adminSecretRef when sharing bundled PostgreSQL" -}}
{{- end -}}
{{- if and .Values.substrate.enabled $postgres.bundled.enabled $substrateBootstrap (or (ne (get $readWriteRef "name") "substrate-postgres-readwrite") (ne (get $ownerRef "name") "substrate-postgres-owner")) -}}
{{- fail "substrate.postgres.bootstrap requires the chart-managed Substrate application Secret names; disable bootstrap for operator-managed Secrets" -}}
{{- end -}}
{{- if and .Values.substrate.enabled $postgres.bundled.enabled $substrateBootstrap (eq (get $readWriteRef "name") "substrate-postgres-readwrite") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ get $readWriteRef "name" | default "substrate-postgres-readwrite" }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  {{ get $readWriteRef "key" | default "readWriteConnectionString" }}: {{ include "substrate.postgres.readWriteConnectionString" (dict "host" $host "database" $substratePostgres.database "params" "sslmode=disable") | quote }}
---
{{- end }}
{{- if and .Values.substrate.enabled $postgres.bundled.enabled $substrateBootstrap (eq (get $ownerRef "name") "substrate-postgres-owner") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ get $ownerRef "name" | default "substrate-postgres-owner" }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  {{ get $ownerRef "key" | default "ownerConnectionString" }}: {{ include "substrate.postgres.ownerConnectionString" (dict "host" $host "database" $substratePostgres.database "params" "sslmode=disable") | quote }}
{{- end }}
