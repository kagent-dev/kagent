apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kagent.fullname" . }}-ui-agentgateway
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- tpl (.Files.Get "files/agentgateway.yaml") . | trim | nindent 4 }}
