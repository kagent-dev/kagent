{{- if .Values.harnesses.enabled }}
{{- if not .Values.harnesses.snapshotLocation }}
{{- fail "harnesses.snapshotLocation is required when harnesses.enabled=true" }}
{{- end }}
{{- range $adapter := list "kagent" "codex" "claude" }}
{{- if (index $.Values.harnesses $adapter).enabled }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: {{ printf "%s-default" $adapter }}
  namespace: {{ include "kagent.namespace" $ }}
  labels:
    {{- include "kagent.labels" $ | nindent 4 }}
spec:
  {{ $adapter }}: {}
  substrate:
    workerPoolRef:
      name: {{ $.Values.substrateWorkerPool.name | toString | quote }}
    snapshotPolicy:
      location: {{ $.Values.harnesses.snapshotLocation | quote }}
{{- end }}
{{- end }}
{{- end }}
