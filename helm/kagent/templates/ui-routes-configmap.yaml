{{- /*
  Identity headers an upstream auth proxy (oauth2-proxy and friends) sets and a
  backend may trust. The UI forwards every request header, so these are cleared
  unless the operator opted them in, keeping a client from spoofing an identity.
*/}}
{{- $identityHeaders := list
      "x-auth-request-user"
      "x-auth-request-email"
      "x-auth-request-groups"
      "x-auth-request-preferred-username"
      "x-auth-request-access-token"
      "x-auth-request-redirect"
      "x-forwarded-user"
      "x-forwarded-email"
      "x-forwarded-groups"
      "x-forwarded-preferred-username" }}
{{- $forwarded := dict }}
{{- range .Values.ui.additionalForwardedHeaders }}
  {{- $_ := set $forwarded (lower (trim .)) true }}
{{- end }}
{{- if eq .Values.config.server.auth.mode "trusted-proxy" }}
{{- /* Public callers must not enter the authenticator's internal agent path. */}}
{{- $identityHeaders = concat $identityHeaders (list "x-agent-name" "x-user-id") }}
{{- $_ := unset $forwarded "x-agent-name" }}
{{- $_ := unset $forwarded "x-user-id" }}
{{- end }}
{{- $strip := dict }}
{{- range $identityHeaders }}
{{- if not (hasKey $forwarded .) }}{{ $_ := set $strip . "" }}{{ end }}
{{- end }}
{{- $backend := printf "http://%s" (include "kagent.controllerServiceAuthority" .) }}
{{- /* Header values expand $host, $remote_addr, $proxy_add_x_forwarded_for, $scheme and $server_name; "" removes the header. */}}
{{- $proxies := list
      (dict "path" "/.well-known/jwks.json" "backend" $backend "headers" (dict "Host" "$host"))
      (dict "path" "/a2a/" "backend" $backend "headers" (merge (dict
        "Host" "$host"
        "X-Forwarded-Host" "$host"
        "X-Forwarded-Proto" "$scheme"
        "X-Forwarded-For" "$proxy_add_x_forwarded_for"
        "Origin" "$scheme://$host") $strip))
      (dict "path" "/mcp" "backend" $backend "headers" (merge (dict
        "Host" "$host"
        "X-Forwarded-Proto" "$scheme") $strip))
      (dict "path" "/api/" "backend" $backend "headers" (merge (dict
        "Host" "$host"
        "X-Real-IP" "$remote_addr"
        "X-Forwarded-For" "$proxy_add_x_forwarded_for"
        "X-Forwarded-Proto" "$scheme"
        "X-Forwarded-Host" "$server_name") $strip)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kagent.fullname" . }}-ui-config
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
data:
  ui.json: |
    {{- dict
          "listen" (ternary ":8080" "0.0.0.0:8080" .Values.ipv6.enabled)
          "clientMaxBodySize" (toString .Values.ui.nginx.clientMaxBodySize)
          "proxyReadTimeout" (toString .Values.ui.nginx.proxyReadTimeout)
          "proxySendTimeout" (toString .Values.ui.nginx.proxySendTimeout)
          "proxies" $proxies
        | toPrettyJson | nindent 4 }}
