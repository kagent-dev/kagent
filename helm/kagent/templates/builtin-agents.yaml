{{- $catalog := include "kagent.builtinSkillsCatalog" . | default "{}" | mustFromJson }}
{{- $byName := dict }}
{{- range $catalog.skills | default (list) }}
{{- $_ := set $byName .name . }}
{{- end }}
{{- $toolServer := printf "%s-tool-server" (include "kagent.fullname" .) }}
{{- /* platform-agent needs the kagent-default Harness and kagent-tools. */}}
{{- $ready := and (dig "builtins" "enabled" false .Values.AsMap) (dig "harnesses" "enabled" false .Values.AsMap) (dig "harnesses" "kagent" "enabled" false .Values.AsMap) (index .Values "kagent-tools" "enabled") }}
{{- if and $ready (dig "builtins" "platformAgent" "enabled" false .Values.AsMap) }}
{{- $kubernetesDescription := "Kubernetes specialist: diagnoses and fixes unhealthy pods, deployments and services." }}
{{- $skill := get $byName "k8s-troubleshooting" }}
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: platform-kubernetes
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
spec:
  description: {{ $kubernetesDescription | quote }}
  modelConfig:
    name: {{ include "kagent.defaultModelConfigName" . }}
  promptTemplate:
    dataSources:
      - name: kagent-builtin-prompts
        alias: builtin
  systemPrompt: |
    You are a Kubernetes specialist. You help users run and troubleshoot
    workloads in the cluster where kagent runs. When a question matches one of
    your skills, load that skill and follow it.

    {{`{{include "builtin/skills-usage"}}`}}

    {{`{{include "builtin/kubernetes-context"}}`}}

    {{`{{include "builtin/tool-usage-best-practices"}}`}}

    {{`{{include "builtin/safety-guardrails"}}`}}
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ $toolServer }}
        tools:
          - k8s_describe_resource
          - k8s_generate_resource
          - k8s_get_available_api_resources
          - k8s_get_cluster_configuration
          - k8s_get_events
          - k8s_get_pod_logs
          - k8s_get_resource_yaml
          - k8s_get_resources
          - k8s_wait
    # These tools change the cluster, so each call waits for the user's approval.
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ $toolServer }}
        requireApproval: true
        tools:
          - k8s_annotate_resource
          - k8s_apply_manifest
          - k8s_check_service_connectivity
          - k8s_create_resource
          - k8s_create_resource_from_url
          - k8s_delete_resource
          - k8s_execute_command
          - k8s_label_resource
          - k8s_patch_resource
          - k8s_patch_status
          - k8s_remove_annotation
          - k8s_remove_label
          - k8s_rollout
          - k8s_scale
  skills:
    - name: {{ $skill.name | quote }}
      source:
        oci: {{ $catalog.image | quote }}
        path: {{ $skill.path | quote }}
{{- /* One specialist per skill. Read-only tools run freely; tools that change things need approval. */}}
{{- $specialists := list
  (dict "name" "helm" "skill" "helm-release-management"
    "description" "Helm specialist: lists, inspects, upgrades and uninstalls Helm releases and manages chart repositories."
    "prompt" "You are a Helm specialist. You help users inspect, troubleshoot, upgrade and uninstall Helm releases."
    "read" (list "helm_get_release" "helm_list_releases")
    "write" (list "helm_repo_add" "helm_repo_update" "helm_uninstall" "helm_upgrade"))
  (dict "name" "istio" "skill" "istio-traffic-debugging"
    "description" "Istio specialist: debugs service mesh traffic, mTLS, routing, sidecars, ztunnel and waypoints."
    "prompt" "You are an Istio specialist. You diagnose and fix service mesh traffic, security and waypoint problems."
    "read" (list "istio_analyze_cluster_configuration" "istio_generate_waypoint" "istio_list_waypoints" "istio_proxy_config" "istio_proxy_status" "istio_version" "istio_waypoint_status" "istio_ztunnel_config")
    "write" (list "istio_apply_waypoint" "istio_delete_waypoint"))
  (dict "name" "argo-rollouts" "skill" "argo-rollouts-progressive-delivery"
    "description" "Argo Rollouts specialist: checks, promotes, pauses and updates canary and blue-green Rollouts."
    "prompt" "You are an Argo Rollouts specialist. You help users run canary and blue-green releases with Argo Rollouts."
    "read" (list "argo_check_plugin_logs" "argo_rollouts_list" "argo_verify_argo_rollouts_controller_install" "argo_verify_kubectl_plugin_install")
    "write" (list "argo_pause_rollout" "argo_promote_rollout" "argo_set_rollout_image" "argo_verify_gateway_plugin"))
  (dict "name" "kubescape" "skill" "kubescape-security-posture"
    "description" "Security specialist: reviews Kubescape configuration scans, image vulnerabilities and workload behavior."
    "prompt" "You are a Kubernetes security specialist. You review Kubescape results and recommend hardening steps."
    "read" (list "kubescape_check_health" "kubescape_get_application_profile" "kubescape_get_configuration_scan" "kubescape_get_network_neighborhood" "kubescape_get_vulnerability_details" "kubescape_list_application_profiles" "kubescape_list_configuration_scans" "kubescape_list_network_neighborhoods" "kubescape_list_vulnerabilities" "kubescape_list_vulnerability_manifests")
    "write" (list))
  (dict "name" "prometheus" "skill" "prometheus-observability"
    "description" "Observability specialist: writes and runs PromQL queries about cluster and application metrics."
    "prompt" "You are an observability specialist. You turn questions about metrics into PromQL, run them and explain the results."
    "read" (list "prometheus_label_names_tool" "prometheus_promql_tool" "prometheus_query_range_tool" "prometheus_query_tool" "prometheus_targets_tool")
    "write" (list))
}}
{{- /* The catalog has the Prometheus skill only when kagent-tools has a Prometheus URL. */}}
{{- $active := list }}
{{- range $specialists }}{{ if hasKey $byName .skill }}{{ $active = append $active . }}{{ end }}{{ end }}
{{- range $active }}
{{- $skill := get $byName .skill }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: {{ printf "platform-%s" .name | quote }}
  namespace: {{ include "kagent.namespace" $ }}
  labels:
    {{- include "kagent.labels" $ | nindent 4 }}
spec:
  description: {{ .description | quote }}
  modelConfig:
    name: {{ include "kagent.defaultModelConfigName" $ }}
  promptTemplate:
    dataSources:
      - name: kagent-builtin-prompts
        alias: builtin
  systemPrompt: |
    {{ .prompt }} Load your skill and follow it.

    {{`{{include "builtin/skills-usage"}}`}}

    {{`{{include "builtin/tool-usage-best-practices"}}`}}

    {{`{{include "builtin/safety-guardrails"}}`}}
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ $toolServer }}
        tools:
          {{- toYaml .read | nindent 10 }}
    {{- with .write }}
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ $toolServer }}
        requireApproval: true
        tools:
          {{- toYaml . | nindent 10 }}
    {{- end }}
  skills:
    - name: {{ $skill.name | quote }}
      source:
        oci: {{ $catalog.image | quote }}
        path: {{ $skill.path | quote }}
{{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: platform-agent
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
spec:
  description: "Platform assistant: sends Kubernetes, Helm, Istio, Argo Rollouts, security and metrics questions to a specialist."
  modelConfig:
    name: {{ include "kagent.defaultModelConfigName" . }}
  systemPrompt: |
    You help users run and troubleshoot the Kubernetes cluster where kagent
    runs. You do not call cluster tools yourself. Send each task to the
    specialist that owns it, and pass along what the user asked. If a task
    spans several areas, call each specialist in turn and combine the answers.
  tools:
    - subAgent:
        name: kubernetes
        description: {{ $kubernetesDescription | quote }}
        templateRef:
          name: platform-kubernetes
    {{- range $active }}
    - subAgent:
        name: {{ .name | quote }}
        description: {{ .description | quote }}
        templateRef:
          name: {{ printf "platform-%s" .name | quote }}
    {{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: platform-agent
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
spec:
  harnessRef:
    name: kagent-default
  template:
    ref:
      name: platform-agent
{{- end }}
