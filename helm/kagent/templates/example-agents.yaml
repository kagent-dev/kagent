{{- if .Values.exampleAgents.enabled }}
{{- if not (index .Values "kagent-tools" "enabled") }}
{{- fail "exampleAgents.enabled requires kagent-tools.enabled: the example skills call the kagent-tools MCP server" }}
{{- end }}
{{- if not .Values.exampleAgents.snapshotLocation }}
{{- fail "exampleAgents.snapshotLocation is required: set the snapshot storage location for the example Harness" }}
{{- end }}
{{- /* Release packaging resolves the digest of the kagent-tools version this chart pins. */}}
{{- $skillsImage := .Values.exampleAgents.skillsImage }}
{{- if not $skillsImage }}
{{- with .Files.Get "files/kagent-tools-image.json" }}
{{- $skillsImage = get (mustFromJson .) "image" }}
{{- end }}
{{- end }}
{{- if not $skillsImage }}
{{- fail "exampleAgents.enabled requires the kagent-tools image digest. Release charts package it when their kagent-tools version ships the skills. Otherwise, set exampleAgents.skillsImage to <repository>@sha256:<digest>." }}
{{- end }}
{{- if not (regexMatch "^[^[:space:]@]+@sha256:[0-9a-f]{64}$" $skillsImage) }}
{{- fail (printf "exampleAgents.skillsImage must be pinned by sha256 digest: %q" $skillsImage) }}
{{- end }}
{{- $skillsImage = include "kagent.mirroredImage" (dict "root" . "image" $skillsImage) }}
{{- $prefix := .Values.exampleAgents.namePrefix }}
{{- $toolServer := printf "%s-tool-server" (include "kagent.fullname" .) }}
{{- /*
Each Agent binds only the tools its skills name, in one binding. Claude and
Codex accept each MCP server once, one binding lists at most 50 tools, and
OpenAI and Azure OpenAI accept at most 128 tools in one request.
*/}}
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: {{ printf "%s-example" $prefix | quote }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
spec:
  kagent: {}
  substrate:
    workerPoolRef:
      name: {{ .Values.substrateWorkerPool.name | quote }}
    snapshotPolicy:
      location: {{ .Values.exampleAgents.snapshotLocation | quote }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ printf "%s-cluster-ops" $prefix | quote }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
spec:
  harnessRef:
    name: {{ printf "%s-example" $prefix | quote }}
  template:
    inline:
      description: "Kubernetes workload, Helm release, Argo Rollouts, and Prometheus metrics assistant."
      modelConfig:
        name: {{ include "kagent.defaultModelConfigName" . }}
      promptTemplate:
        dataSources:
          - name: kagent-builtin-prompts
            alias: builtin
      systemPrompt: |
        Answer questions about the Kubernetes cluster where kagent runs. When a
        question matches one of your skills, load that skill and follow it. Each
        skill names the kagent-tools MCP tools it uses.

        {{`{{include "builtin/skills-usage"}}`}}

        {{`{{include "builtin/kubernetes-context"}}`}}

        {{`{{include "builtin/tool-usage-best-practices"}}`}}

        {{`{{include "builtin/safety-guardrails"}}`}}
      tools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: {{ $toolServer }}
            tools:
              - k8s_apply_manifest
              - k8s_check_service_connectivity
              - k8s_delete_resource
              - k8s_describe_resource
              - k8s_get_events
              - k8s_get_pod_logs
              - k8s_get_resource_yaml
              - k8s_get_resources
              - k8s_patch_resource
              - k8s_rollout
              - k8s_scale
              - helm_get_release
              - helm_list_releases
              - helm_repo_add
              - helm_repo_update
              - helm_uninstall
              - helm_upgrade
              - argo_pause_rollout
              - argo_promote_rollout
              - argo_rollouts_list
              - argo_set_rollout_image
              - argo_verify_argo_rollouts_controller_install
              - argo_verify_gateway_plugin
              - argo_verify_kubectl_plugin_install
              - prometheus_label_names_tool
              - prometheus_promql_tool
              - prometheus_query_range_tool
              - prometheus_query_tool
              - prometheus_targets_tool
      plugins:
        - source:
            oci: {{ $skillsImage | quote }}
            path: opt/kagent-tools-skills
          skills:
            - k8s-troubleshooting
            - helm-release-management
            - argo-rollouts-progressive-delivery
            - prometheus-observability
---
