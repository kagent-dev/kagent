{{- if and (dig "builtins" "enabled" false .Values.AsMap) (dig "builtins" "harness" "enabled" false .Values.AsMap) .Values.substrateWorkerPool.create }}
{{- if not .Values.builtins.harness.snapshotLocation }}
{{- fail "builtins.harness.snapshotLocation is required: set the snapshot storage location for the default Harness" }}
{{- end }}
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: {{ .Values.builtins.harness.name | quote }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
spec:
  kagent: {}
  substrate:
    workerPoolRef:
      name: {{ .Values.substrateWorkerPool.name | quote }}
    snapshotPolicy:
      location: {{ .Values.builtins.harness.snapshotLocation | quote }}
{{- end }}
