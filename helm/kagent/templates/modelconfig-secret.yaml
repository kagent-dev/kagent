{{- if .Values.providers }}
{{- $dot := . }}
{{- $defaultProvider := .Values.providers.default | default "openAI" }}
{{- if hasKey .Values.providers $defaultProvider }}
{{- $model := index .Values.providers $defaultProvider }}
{{- if $model.apiKey }}
{{- $headers := $model.headers | default list }}
{{- if ne (len $headers) 1 }}
{{- fail "apiKey requires exactly one credential header with a secretKeyRef" }}
{{- end }}
{{- $source := (first $headers).valueFrom | default dict }}
{{- if or (not $source.secretKeyRef) (hasKey $source "tokenPassthrough") }}
{{- fail "apiKey requires a secretKeyRef credential source" }}
{{- end }}
{{- $ref := $source.secretKeyRef }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "headers valueFrom.secretKeyRef.name is required" $ref.name | quote }}
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" $dot | nindent 4 }}
type: Opaque
data:
  {{ required "headers valueFrom.secretKeyRef.key is required" $ref.key | quote }}: {{ $model.apiKey | b64enc }}
{{- end }}
{{- end }}
{{- end }}
