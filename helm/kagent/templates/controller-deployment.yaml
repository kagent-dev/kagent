{{- $databaseConnectionStringSecretRef := .Values.database.postgres.connectionStringSecretRef | default dict -}}
{{- if not (get $databaseConnectionStringSecretRef "name") -}}
{{- fail "database.postgres.connectionStringSecretRef.name is required" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kagent.fullname" . }}-controller
  namespace: {{ include "kagent.namespace" . }}
  {{- $annotations := mergeOverwrite (dict) (default dict .Values.annotations) (default dict .Values.controller.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "kagent.controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "kagent.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/controller-configmap.yaml") . | sha256sum }}
        {{- with .Values.controller.podAnnotations | default .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- /* extra pod labels: component merged over global, selector labels
             applied last so they can never be overridden */}}
        {{- $podLabels := mergeOverwrite (dict) (.Values.podLabels | default dict) (.Values.controller.podLabels | default dict) (include "kagent.controller.selectorLabels" . | fromYaml) }}
        {{- toYaml $podLabels | nindent 8 }}
    spec:
      {{- with include "kagent.imagePullSecrets" (dict "root" . "local" .Values.controller.imagePullSecrets) }}{{- . | nindent 6 }}{{- end }}
      {{- with (.Values.controller.podSecurityContext | default .Values.podSecurityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kagent.controller.serviceAccountName" . | quote }}
      volumes:
      - name: controller-config
        configMap:
          name: {{ include "kagent.fullname" . }}-controller
      - name: controller-secrets
        projected:
          sources:
          - secret:
              name: {{ include "kagent.postgres.connectionStringSecretName" . }}
              items:
              - key: {{ get $databaseConnectionStringSecretRef "key" | default "connectionString" }}
                path: database-url
          {{- if .Values.controller.push.signing.secretName }}
          - secret:
              name: {{ .Values.controller.push.signing.secretName }}
              items:
              - key: private-key.pem
                path: push-private-key.pem
          {{- end }}
      {{- if .Values.database.postgres.clientCertificate.enabled }}
      - name: postgres-client-certificate
        projected:
          sources:
          - podCertificate:
              signerName: postgres.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
              userAnnotations:
                postgres.podcert.ate.dev/username: kagent_user
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      {{- end }}
      {{- if .Values.controller.substrateClientCertificate.enabled }}
      - name: substrate-servicedns
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: substrate-podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      {{- end }}
      {{- with .Values.controller.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "kagent.controllerImage" . | quote }}
          imagePullPolicy: {{ include "kagent.imagePullPolicy" (dict "root" . "local" .Values.controller.image.pullPolicy) }}
          args: ["--config=/etc/kagent/controller.yaml"]
          env:
            # Private pod identity defaults; explicit OTEL resource attributes win.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.controller.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.controller.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.service.ports.targetPort }}
              protocol: TCP
            {{- if include "kagent.controller.metricsEnabled" . }}
            - name: metrics
              containerPort: {{ include "kagent.controller.metricsPort" . | int }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- with (.Values.controller.securityContext | default .Values.securityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.controller.startupProbe }}
          startupProbe:
            {{- toYaml .Values.controller.startupProbe | nindent 12 }}
          {{- else }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            initialDelaySeconds: 15
          {{- end }}
          {{- if .Values.controller.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.controller.readinessProbe | nindent 12 }}
          {{- else }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          {{- end }}
          volumeMounts:
            - name: controller-config
              mountPath: /etc/kagent
              readOnly: true
            - name: controller-secrets
              mountPath: /etc/kagent/secrets
              readOnly: true
            {{- if .Values.database.postgres.clientCertificate.enabled }}
            - name: postgres-client-certificate
              mountPath: /run/postgres.podcert.ate.dev
              readOnly: true
            {{- end }}
            {{- if .Values.controller.substrateClientCertificate.enabled }}
            - name: substrate-servicedns
              mountPath: /run/substrate-servicedns
              readOnly: true
            - name: substrate-podidentity
              mountPath: /run/substrate-podidentity
              readOnly: true
            {{- end }}
            {{- with .Values.controller.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
