apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kagent.fullname" . }}-controller
  namespace: {{ include "kagent.namespace" . }}
  {{- $annotations := mergeOverwrite (dict) (default dict .Values.annotations) (default dict .Values.controller.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "kagent.controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "kagent.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/controller-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/postgresql-secret.yaml") . | sha256sum }}
        {{- with .Values.controller.podAnnotations | default .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- /* extra pod labels: component merged over global, selector labels
             applied last so they can never be overridden */}}
        {{- $podLabels := mergeOverwrite (dict) (.Values.podLabels | default dict) (.Values.controller.podLabels | default dict) (include "kagent.controller.selectorLabels" . | fromYaml) }}
        {{- toYaml $podLabels | nindent 8 }}
    spec:
      {{- with .Values.controller.imagePullSecrets | default .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.controller.podSecurityContext | default .Values.podSecurityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kagent.fullname" . }}-controller
      {{- if or (gt (len .Values.controller.volumes) 0) (and .Values.controller.substrate .Values.controller.substrate.enabled) }}
      volumes:
      {{- if and .Values.controller.substrate .Values.controller.substrate.enabled }}
      - name: substrate-servicedns
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: substrate-podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      {{- end }}
      {{- with .Values.controller.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.registry | default .Values.registry  }}/{{ .Values.controller.image.repository }}:{{ coalesce .Values.tag .Values.controller.image.tag .Chart.Version }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy | default .Values.imagePullPolicy }}
          {{- if or .Values.controller.imageDigest .Values.controller.agentImageRegistry .Values.controller.agentImageRepository }}
          # --image-digest has no build-time equivalent today: scripts/controller-digest-ldflags.sh,
          # which would stamp AgentImageDigest via ldflags, is never invoked by `make build-controller`
          # or any CI workflow. Until that's wired in, set this value explicitly (the digest of the
          # pushed golang-adk image) or SandboxAgent compilation fails with "agent image digest is not set".
          # agentImageRegistry/agentImageRepository point the golang-adk runtime image (used for
          # every declarative SandboxAgent) at a different build than the compiled-in default
          # (ghcr.io/kagent-dev/kagent/golang-adk) — e.g. your own fork's release.
          args:
          {{- if .Values.controller.imageDigest }}
          - --image-digest={{ .Values.controller.imageDigest }}
          {{- end }}
          {{- if .Values.controller.agentImageRegistry }}
          - --image-registry={{ .Values.controller.agentImageRegistry }}
          {{- end }}
          {{- if .Values.controller.agentImageRepository }}
          - --image-repository={{ .Values.controller.agentImageRepository }}
          {{- end }}
          {{- end }}
          env:
            - name: KAGENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AUTH_MODE
              value: {{ .Values.controller.auth.mode | default "unsecure" | quote }}
            {{- if .Values.controller.auth.userIdClaim }}
            - name: AUTH_USER_ID_CLAIM
              value: {{ .Values.controller.auth.userIdClaim | quote }}
            {{- end }}
            {{- if .Values.database.postgres.urlFile }}
            - name: POSTGRES_DATABASE_URL_FILE
              value: {{ .Values.database.postgres.urlFile | quote }}
            {{- else if .Values.database.postgres.url }}
            - name: POSTGRES_DATABASE_URL
              value: {{ .Values.database.postgres.url | quote }}
            {{- else if .Values.database.postgres.bundled.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kagent.passwordSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DATABASE_URL
              value: {{ printf "postgres://kagent:$(POSTGRES_PASSWORD)@%s.%s.svc:5432/kagent?sslmode=disable" (include "kagent.postgresqlServiceName" .) (include "kagent.namespace" .) | quote }}
            {{- else }}
            {{ fail "No database connection configured. Set database.postgres.url, database.postgres.urlFile, or enable database.postgres.bundled." }}
            {{- end }}
            {{- if include "kagent.controller.metricsEnabled" . }}
            - name: METRICS_BIND_ADDRESS
              value: {{ .Values.controller.metrics.bindAddress | quote }}
            - name: METRICS_SECURE
              value: {{ .Values.controller.metrics.secureServing | quote }}
            {{- end }}
            - name: GRPC_BIND_ADDRESS
              value: {{ .Values.controller.grpc.bindAddress | quote }}
            - name: GRPC_MAX_MESSAGE_BYTES
              value: {{ printf "%.0f" (.Values.controller.grpc.maxMessageBytes | float64) | quote }}
            - name: GRPC_REFLECTION
              value: {{ .Values.controller.grpc.reflection | quote }}
            {{- with .Values.controller.grpc.tlsCertFile }}
            - name: GRPC_TLS_CERT_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.controller.grpc.tlsKeyFile }}
            - name: GRPC_TLS_KEY_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.controller.env }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and .Values.controller.substrate .Values.controller.substrate.enabled }}
            - name: SUBSTRATE_ATE_API_ENDPOINT
              value: {{ .Values.controller.substrate.ateApiEndpoint | quote }}
            - name: SUBSTRATE_ATE_API_CA_FILE
              value: /run/substrate-servicedns/trust-bundle.pem
            - name: SUBSTRATE_ATE_API_CLIENT_CERT_FILE
              value: /run/substrate-podidentity/credential-bundle.pem
            {{- with .Values.controller.substrate.atenetRouterURL }}
            - name: SUBSTRATE_ATENET_ROUTER_URL
              value: {{ . | quote }}
            {{- end }}
            - name: SUBSTRATE_DEFAULT_WORKERPOOL_NAMESPACE
              value: {{ .Values.controller.substrate.defaultWorkerPool.namespace | default (include "kagent.namespace" .) | quote }}
            - name: SUBSTRATE_DEFAULT_WORKERPOOL_NAME
              value: {{ .Values.controller.substrate.defaultWorkerPool.name | default (ternary .Values.substrateWorkerPool.name "" .Values.substrateWorkerPool.create) | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "kagent.fullname" . }}-controller
            {{- with .Values.controller.envFrom }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.service.ports.targetPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.controller.service.ports.grpc }}
              protocol: TCP
            {{- if .Values.controller.metrics.enabled }}
            - name: metrics
              containerPort: {{ include "kagent.controller.metricsPort" . | int }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- with (.Values.controller.securityContext | default .Values.securityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.controller.startupProbe }}
          startupProbe:
            {{- toYaml .Values.controller.startupProbe | nindent 12 }}
          {{- else }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            initialDelaySeconds: 15
          {{- end }}
          {{- if .Values.controller.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.controller.readinessProbe | nindent 12 }}
          {{- else }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          {{- end }}
          {{- if or (gt (len .Values.controller.volumeMounts) 0) (and .Values.controller.substrate .Values.controller.substrate.enabled) }}
          volumeMounts:
            {{- if and .Values.controller.substrate .Values.controller.substrate.enabled }}
            - name: substrate-servicedns
              mountPath: /run/substrate-servicedns
              readOnly: true
            - name: substrate-podidentity
              mountPath: /run/substrate-podidentity
              readOnly: true
            {{- end }}
            {{- with .Values.controller.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
