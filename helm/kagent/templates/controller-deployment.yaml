{{- $databaseConnectionStringSecretRef := .Values.database.postgres.secretRef | default dict -}}
{{- $bundled := .Values.database.postgres.bundled -}}
{{- $bootstrapEnabled := and $bundled.enabled $bundled.bootstrap -}}
{{- $databaseSecretVolumeName := "postgres-connection" -}}
{{- $databaseSecretMountPath := "/var/run/secrets/kagent/postgres" -}}
{{- $databaseSecretFileName := "connection-string" -}}
{{- if hasKey .Values.database.postgres "urlFile" -}}
{{- fail "database.postgres.urlFile has been removed; use database.postgres.secretRef.{name,key}" -}}
{{- end -}}
{{- if hasKey .Values.database.postgres "url" -}}
{{- fail "database.postgres.url has been removed; use database.postgres.secretRef.{name,key}" -}}
{{- end -}}
{{- if hasKey .Values.database.postgres "bootstrap" -}}
{{- fail "database.postgres.bootstrap moved to database.postgres.bundled.bootstrap" -}}
{{- end -}}
{{- if not (kindIs "bool" $bundled.bootstrap) -}}
{{- fail "database.postgres.bundled.bootstrap must be true or false" -}}
{{- end -}}
{{- if and $bootstrapEnabled (ne .Values.database.postgres.role "kagent_owner") -}}
{{- fail "database.postgres.role must be kagent_owner while bundled bootstrap is enabled" -}}
{{- end -}}
{{- if and $bootstrapEnabled (get $databaseConnectionStringSecretRef "name") -}}
{{- fail "database.postgres.secretRef.name requires database.postgres.bundled.bootstrap=false" -}}
{{- end -}}
{{- if and (not $bootstrapEnabled) (not (get $databaseConnectionStringSecretRef "name")) -}}
{{- fail "database.postgres.secretRef.name is required when bootstrap is disabled" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kagent.fullname" . }}-controller
  namespace: {{ include "kagent.namespace" . }}
  {{- $annotations := mergeOverwrite (dict) (default dict .Values.annotations) (default dict .Values.controller.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "kagent.controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "kagent.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/controller-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/postgresql-secret.yaml") . | sha256sum }}
        {{- with .Values.controller.podAnnotations | default .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- /* extra pod labels: component merged over global, selector labels
             applied last so they can never be overridden */}}
        {{- $podLabels := mergeOverwrite (dict) (.Values.podLabels | default dict) (.Values.controller.podLabels | default dict) (include "kagent.controller.selectorLabels" . | fromYaml) }}
        {{- toYaml $podLabels | nindent 8 }}
    spec:
      {{- with include "kagent.imagePullSecrets" (dict "root" . "local" .Values.controller.imagePullSecrets) }}{{- . | nindent 6 }}{{- end }}
      {{- with (.Values.controller.podSecurityContext | default .Values.podSecurityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kagent.fullname" . }}-controller
      volumes:
      - name: {{ $databaseSecretVolumeName }}
        projected:
          sources:
          - secret:
              name: {{ include "kagent.postgres.connectionSecretName" . }}
              items:
              - key: {{ get $databaseConnectionStringSecretRef "key" | default "connectionString" }}
                path: {{ $databaseSecretFileName }}
      {{- if $bootstrapEnabled }}
      - name: postgres-admin
        projected:
          sources:
          - secret:
              name: {{ include "kagent.postgres.adminSecretName" . }}
              items:
              - key: {{ .Values.database.postgres.bundled.adminSecretRef.usernameKey }}
                path: username
              - key: {{ .Values.database.postgres.bundled.adminSecretRef.passwordKey }}
                path: password
      {{- end }}
      {{- if and .Values.controller.substrate .Values.controller.substrate.enabled }}
      - name: substrate-servicedns
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: substrate-podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      {{- end }}
      {{- with .Values.controller.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "kagent.controllerImage" . | quote }}
          imagePullPolicy: {{ include "kagent.imagePullPolicy" (dict "root" . "local" .Values.controller.image.pullPolicy) }}
          env:
            - name: KAGENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ list (include "kagent.otel.resourceAttributes" .) "service.instance.id=$(K8S_POD_UID),k8s.pod.uid=$(K8S_POD_UID),k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(KAGENT_NAMESPACE),k8s.node.name=$(K8S_NODE_NAME),k8s.container.name=controller" | compact | join "," | quote }}
            - name: AUTH_MODE
              value: {{ .Values.controller.auth.mode | default "unsecure" | quote }}
            {{- if .Values.controller.auth.userIdClaim }}
            - name: AUTH_USER_ID_CLAIM
              value: {{ .Values.controller.auth.userIdClaim | quote }}
            {{- end }}
            - name: POSTGRES_DATABASE_URL
              value: {{ printf "@file:%s/%s" $databaseSecretMountPath $databaseSecretFileName | quote }}
            - name: KAGENT_DATABASE_BOOTSTRAP
              value: {{ $bootstrapEnabled | quote }}
            {{- if $bootstrapEnabled }}
            - name: POSTGRES_ADMIN_USERNAME_FILE
              value: /var/run/secrets/kagent/postgres-admin/username
            - name: POSTGRES_ADMIN_PASSWORD_FILE
              value: /var/run/secrets/kagent/postgres-admin/password
            {{- end }}
            {{- if include "kagent.controller.metricsEnabled" . }}
            - name: METRICS_BIND_ADDRESS
              value: {{ .Values.controller.metrics.bindAddress | quote }}
            - name: METRICS_SECURE
              value: {{ .Values.controller.metrics.secureServing | quote }}
            {{- end }}
            - name: GRPC_MAX_MESSAGE_BYTES
              value: {{ printf "%.0f" (.Values.controller.grpc.maxMessageBytes | float64) | quote }}
            - name: GRPC_REFLECTION
              value: {{ .Values.controller.grpc.reflection | quote }}
            {{- with .Values.controller.grpc.tlsCertFile }}
            - name: GRPC_TLS_CERT_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.controller.grpc.tlsKeyFile }}
            - name: GRPC_TLS_KEY_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.controller.env }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and .Values.controller.substrate .Values.controller.substrate.enabled }}
            - name: SUBSTRATE_ATE_API_ENDPOINT
              value: {{ include "kagent.substrate.ateApiEndpoint" . | quote }}
            - name: SUBSTRATE_ATE_API_CA_FILE
              value: /run/substrate-servicedns/trust-bundle.pem
            - name: SUBSTRATE_ATE_API_CLIENT_CERT_FILE
              value: /run/substrate-podidentity/credential-bundle.pem
            {{- with include "kagent.substrate.atenetRouterURL" . }}
            - name: SUBSTRATE_ATENET_ROUTER_URL
              value: {{ . | quote }}
            {{- end }}
            - name: SUBSTRATE_DEFAULT_WORKERPOOL_NAMESPACE
              value: {{ .Values.controller.substrate.defaultWorkerPool.namespace | default (include "kagent.namespace" .) | quote }}
            - name: SUBSTRATE_DEFAULT_WORKERPOOL_NAME
              value: {{ .Values.controller.substrate.defaultWorkerPool.name | default (ternary .Values.substrateWorkerPool.name "" .Values.substrateWorkerPool.create) | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "kagent.fullname" . }}-controller
            {{- with .Values.controller.envFrom }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.service.ports.targetPort }}
              protocol: TCP
            {{- if include "kagent.controller.metricsEnabled" . }}
            - name: metrics
              containerPort: {{ include "kagent.controller.metricsPort" . | int }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- with (.Values.controller.securityContext | default .Values.securityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.controller.startupProbe }}
          startupProbe:
            {{- toYaml .Values.controller.startupProbe | nindent 12 }}
          {{- else }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            initialDelaySeconds: 15
          {{- end }}
          {{- if .Values.controller.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.controller.readinessProbe | nindent 12 }}
          {{- else }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          {{- end }}
          volumeMounts:
            - name: {{ $databaseSecretVolumeName }}
              mountPath: {{ $databaseSecretMountPath }}
              readOnly: true
            {{- if $bootstrapEnabled }}
            - name: postgres-admin
              mountPath: /var/run/secrets/kagent/postgres-admin
              readOnly: true
            {{- end }}
            {{- if and .Values.controller.substrate .Values.controller.substrate.enabled }}
            - name: substrate-servicedns
              mountPath: /run/substrate-servicedns
              readOnly: true
            - name: substrate-podidentity
              mountPath: /run/substrate-podidentity
              readOnly: true
            {{- end }}
            {{- with .Values.controller.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
