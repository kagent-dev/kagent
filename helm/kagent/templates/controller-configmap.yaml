apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kagent.fullname" . }}-controller
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.controller.labels" . | nindent 4 }}
data:
  KAGENT_GATEWAY_URL: {{ include "kagent.a2aGatewayUrl" . | quote }}
  DEFAULT_MODEL_CONFIG_NAME: {{ include "kagent.defaultModelConfigName" . | quote }}
  KAGENT_CONTROLLER_NAME: {{ include "kagent.fullname" . }}-controller
  {{- if .Values.ui.externalUrl }}
  KAGENT_UI_URL: {{ .Values.ui.externalUrl | quote }}
  {{- end }}
  IMAGE_REGISTRY: {{ .Values.controller.agentImage.registry | default .Values.registry | quote }}
  IMAGE_REPOSITORY: {{ .Values.controller.agentImage.repository | quote }}
  IMAGE_TAG: {{ coalesce .Values.controller.agentImage.tag .Values.tag .Chart.Version | quote }}
  {{- with .Values.controller.sandbox }}
  SANDBOX_GUEST_IMAGE: {{ include "kagent.sandboxGuestImage" $ | quote }}
  SANDBOX_CPU: {{ .cpu | quote }}
  SANDBOX_MEMORY: {{ .memory | quote }}
  SANDBOX_DEFAULT_TTL: {{ .defaultTTL | quote }}
  SANDBOX_MAX_TTL: {{ .maxTTL | quote }}
  {{- end }}
  {{- with .Values.otel }}
  {{- if not (or .traces.enabled .metrics.enabled .logs.enabled $.Values.controller.metrics.enabled) }}
  OTEL_SDK_DISABLED: "true"
  {{- end }}
  OTEL_TRACES_EXPORTER: {{ ternary "otlp" "none" .traces.enabled | quote }}
  OTEL_METRICS_EXPORTER: {{ ternary "otlp" "none" .metrics.enabled | quote }}
  OTEL_LOGS_EXPORTER: {{ ternary "otlp" "none" .logs.enabled | quote }}
  {{- with .exporter.otlp.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .exporter.otlp.protocol | default "grpc" | quote }}
  {{- with .exporter.otlp.timeout }}
  OTEL_EXPORTER_OTLP_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- range $signal := list "traces" "metrics" "logs" }}
  {{- $config := index $.Values.otel $signal }}
  {{- with $config.endpoint }}
  OTEL_EXPORTER_OTLP_{{ upper $signal }}_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with $config.protocol }}
  OTEL_EXPORTER_OTLP_{{ upper $signal }}_PROTOCOL: {{ . | quote }}
  {{- end }}
  {{- end }}
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: {{ ternary "SPAN_ONLY" "NO_CONTENT" .capture.messageContent | quote }}
  KAGENT_OTEL_CAPTURE_RAW_API_BODIES: {{ .capture.rawApiBodies | quote }}
  {{- with .capture.maxBytes }}
  KAGENT_OTEL_MAX_CAPTURE_BYTES: {{ . | quote }}
  {{- end }}
  {{- with include "kagent.otel.resourceAttributes" $ }}
  KAGENT_OTEL_RESOURCE_ATTRIBUTES: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.proxy.url }}
  PROXY_URL: {{ .Values.proxy.url | quote }}
  {{- end }}
  DATABASE_VECTOR_ENABLED: {{ .Values.database.postgres.vectorEnabled | quote }}
  SKIP_MIGRATIONS: {{ .Values.database.postgres.skipMigrations | default false | quote }}
  {{- with .Values.database.postgres.pool }}
  {{- if and (hasKey . "maxConns") (ne .maxConns nil) }}
  DB_MAX_CONNS: {{ .maxConns | quote }}
  {{- end }}
  {{- if and (hasKey . "minConns") (ne .minConns nil) }}
  DB_MIN_CONNS: {{ .minConns | quote }}
  {{- end }}
  {{- if .maxConnIdleTime }}
  DB_MAX_CONN_IDLE_TIME: {{ .maxConnIdleTime | quote }}
  {{- end }}
  {{- if .maxConnLifetime }}
  DB_MAX_CONN_LIFETIME: {{ .maxConnLifetime | quote }}
  {{- end }}
  {{- end }}
  WATCH_NAMESPACES: {{ include "kagent.watchNamespaces" . | quote }}
  MCP_EGRESS_PLAINTEXT: {{ .Values.controller.mcpEgressPlaintext | default false | quote }}
  {{- if .Values.controller.a2aClientTimeout }}
  KAGENT_A2A_CLIENT_TIMEOUT: {{ .Values.controller.a2aClientTimeout | quote }}
  {{- end }}
  LOG_LEVEL: {{ .Values.controller.loglevel | quote }}
