{{- $namespace := include "kagent.namespace" . -}}
{{- $apiURL := printf "http://%s" (include "kagent.controllerServiceAuthority" .) -}}
{{- $watch := list -}}
{{- with include "kagent.watchNamespaces" . -}}{{- $watch = splitList "," . -}}{{- end -}}
{{- $database := dict "readWrite" (dict "urlFile" "/etc/kagent/secrets/database-readwrite-url") -}}
{{- if not (include "kagent.database.skipMigrations" .) -}}
{{- $_ := set $database "owner" (dict "urlFile" "/etc/kagent/secrets/database-owner-url") -}}
{{- end -}}
{{- $base := dict
  "kubernetes" (dict "namespace" $namespace "watchNamespaces" $watch)
  "server" (dict "bindAddress" (printf ":%v" .Values.controller.service.ports.targetPort))
  "database" $database
  "gateway" (dict "publicUrl" $apiURL)
  "push" (dict)
  "runtimeDefaults" (dict "controlPlaneUrl" $apiURL "gatewayUrl" $apiURL)
-}}
{{- $config := mergeOverwrite $base (deepCopy .Values.config) -}}
{{- if and $config.sandboxes $config.sandboxes.guestImage -}}
{{- $_ := set $config.sandboxes "guestImage" (include "kagent.mirroredImage" (dict "root" . "image" $config.sandboxes.guestImage)) -}}
{{- end -}}
{{- $_ := set $config "harnessImages" (include "kagent.builtinHarnessImages" . | mustFromJson) -}}
{{- if .Values.controller.push.signing.secretName -}}
{{- $_ := set $config.push "signingPrivateKeyFile" "/etc/kagent/secrets/push-private-key.pem" -}}
{{- end -}}
{{- if not (hasKey $config.push "issuer") -}}
{{- $_ := set $config.push "issuer" (coalesce .Values.ui.externalUrl $config.gateway.publicUrl | trimSuffix "/") -}}
{{- end -}}
{{- if not (include "kagent.controller.metricsEnabled" .) -}}
{{- $_ := set $config.metrics "bindAddress" "0" -}}
{{- end -}}
{{- if .Values.controller.substrateClientCertificate.enabled -}}
{{- $_ := set $config.substrate "caFile" "/run/substrate-servicedns/trust-bundle.pem" -}}
{{- $_ := set $config.substrate "clientCertFile" "/run/substrate-podidentity/credential-bundle.pem" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kagent.fullname" . }}-controller
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent.controller.labels" . | nindent 4 }}
data:
  controller.yaml: |
    {{- toYaml $config | nindent 4 }}
