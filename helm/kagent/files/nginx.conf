pid /tmp/nginx.pid;

error_log /dev/stderr;

events {
    worker_connections 1024;
}

{{- /*
  Identity headers an upstream auth proxy (oauth2-proxy and friends) sets and a
  backend may trust. The UI used to be a Next server that forwarded a strict
  allowlist — Authorization plus ui.additionalForwardedHeaders — and dropped
  everything else, so a client-supplied identity header could never reach the
  controller. nginx forwards every request header by default, so these are
  cleared explicitly unless the operator opted them in, keeping that guarantee
  for the headers where spoofing actually matters.
*/}}
{{- $identityHeaders := list
      "x-auth-request-user"
      "x-auth-request-email"
      "x-auth-request-groups"
      "x-auth-request-preferred-username"
      "x-auth-request-access-token"
      "x-auth-request-redirect"
      "x-forwarded-user"
      "x-forwarded-email"
      "x-forwarded-groups"
      "x-forwarded-preferred-username" }}
{{- $forwarded := dict }}
{{- range .Values.ui.additionalForwardedHeaders }}
  {{- $_ := set $forwarded (lower (trim .)) true }}
{{- end }}
{{- if eq .Values.controller.auth.mode "trusted-proxy" }}
{{- /* Public callers must not enter the authenticator's internal agent path. */}}
{{- $identityHeaders = concat $identityHeaders (list "x-agent-name" "x-user-id") }}
{{- $_ := unset $forwarded "x-agent-name" }}
{{- $_ := unset $forwarded "x-user-id" }}
{{- end }}

http {
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_max_body_size {{ .Values.ui.nginx.clientMaxBodySize }};

    log_format main        '[$time_local] $remote_addr - $remote_user - $request $status $body_bytes_sent $http_referer $http_user_agent $http_x_forwarded_for';
    log_format upstreamlog '[$time_local] $remote_addr - $remote_user - $server_name $host to: $upstream_addr: $request $status upstream_response_time $upstream_response_time msec $msec request_time $request_time';

    {{- /*
      The controller is not named in a static upstream block: nginx resolves
      those once, at start, and refuses to start while the name does not
      resolve yet, so a UI that comes up before cluster DNS or the controller
      Service crash-loops. Proxying through a variable makes nginx look the name
      up per request with the resolver below, and a request made before the
      controller answers gets a 502 instead. That resolver uses neither the
      system's nameservers nor its search path, so init.sh renders it from the
      pod's /etc/resolv.conf on every start, together with
      $kagent_cluster_domain for the fully qualified Service name.
    */}}
    include /tmp/nginx/resolver.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    {{- /*
      The UI calls the API as gRPC-Web, and the controller tells those calls
      apart by their application/grpc-web content type. Envoy's grpc_web filter
      (which Envoy Gateway puts on every route of a listener that also carries a
      GRPCRoute) rewrites such a call into native gRPC, application/grpc, before
      it reaches this proxy over HTTP/1.1, where the controller can serve it
      neither as gRPC (that needs HTTP/2) nor as gRPC-Web, and answers an empty
      200 the UI cannot read. The body framing of the two protocols is the same,
      so restoring the gRPC-Web content type lets the controller answer it as
      gRPC-Web, which Envoy passes back to the browser unchanged.
    */}}
    map $http_content_type $kagent_api_content_type {
        default                                 $http_content_type;
        "~*^application/grpc(\+proto)?(;.*)?$"  application/grpc-web+proto;
        "~*^application/grpc\+json(;.*)?$"      application/grpc-web+json;
    }

    server {
        listen 8080;
        {{- if .Values.ipv6.enabled }}
        listen [::]:8080;
        {{- end }}
        server_name localhost;

        set $kagent_backend "{{ include "kagent.controllerServiceHost" . }}.$kagent_cluster_domain:{{ .Values.controller.service.ports.port | int }}";

        root /usr/share/nginx/html;
        index index.html;

        # Drop ui.basePath when the proxy in front forwards it unstripped.
        {{- with trimSuffix "/" .Values.ui.basePath | replace "." "\\." }}
        rewrite ^{{ . }}$ / last;
        rewrite ^{{ . }}(/.*)$ $1 last;
        {{- end }}

        location /health {
            return 200 'OK';
        }

        {{- /*
          Rendered by init.sh from the pod's env on every start, so Helm values
          reach the browser instead of being frozen into the bundle at image
          build time. Never cached: a stale copy would pin the client to the
          previous release's configuration.
        */}}
        location = /env-config.js {
            alias /tmp/kagent/env-config.js;
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
        }

        location = /.well-known/jwks.json {
            proxy_pass http://$kagent_backend;
            proxy_set_header Host $host;
        }

        location /a2a/ {
            {{- /*
              No URI part: with a variable in proxy_pass a URI would replace the
              whole request path, while without one the request URI passes
              unchanged, which is what /a2a/, /mcp and /api/ need.
            */}}
            proxy_pass http://$kagent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Origin $scheme://$host;
            {{- range $header := $identityHeaders }}
            {{- if not (hasKey $forwarded $header) }}
            proxy_set_header {{ $header }} "";
            {{- end }}
            {{- end }}
            proxy_read_timeout {{ .Values.ui.nginx.proxyReadTimeout }};
            proxy_send_timeout {{ .Values.ui.nginx.proxySendTimeout }};
            # Chat is server-sent events; buffering would hold tokens back.
            proxy_buffering off;
        }

        location = /mcp {
            proxy_pass http://$kagent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            {{- range $header := $identityHeaders }}
            {{- if not (hasKey $forwarded $header) }}
            proxy_set_header {{ $header }} "";
            {{- end }}
            {{- end }}
            proxy_read_timeout {{ .Values.ui.nginx.proxyReadTimeout }};
            proxy_send_timeout {{ .Values.ui.nginx.proxySendTimeout }};
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://$kagent_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Content-Type $kagent_api_content_type;
            {{- range $header := $identityHeaders }}
            {{- if not (hasKey $forwarded $header) }}
            proxy_set_header {{ $header }} "";
            {{- end }}
            {{- end }}
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout {{ .Values.ui.nginx.proxyReadTimeout }};
            proxy_send_timeout {{ .Values.ui.nginx.proxySendTimeout }};
            proxy_buffering off;
        }

        {{- /*
          The mock service worker is deleted from the bundle at image build, so
          this path has no file behind it — but the SPA fallback below would
          answer it with index.html and a 200, which is a misleading thing to
          hand a registration attempt. Refuse it outright. As an exact-match
          location this also wins over the fallback if a future build ever ships
          the worker again, so the mock backend cannot be reached in production
          even then.
        */}}
        location = /mockServiceWorker.js {
            return 404;
        }

        # Vite fingerprints these filenames, so a given URL's bytes never change.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # The bundle entrypoint must never be cached, or a client keeps loading
        # the previous release's asset URLs after an upgrade.
        location = /index.html {
            alias /tmp/kagent/index.html;
            add_header Cache-Control "no-store" always;
        }

        # SPA fallback: routing is client-side, so a deep link such as /agents
        # is not a file on disk and must still return the app shell.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
