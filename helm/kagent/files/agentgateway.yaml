{{- /*
  Identity headers an auth proxy sets and the backend may trust. agentgateway forwards
  every header, so these are removed unless opted in, or a client could spoof them.
*/}}
{{- $identityHeaders := list
      "x-auth-request-user"
      "x-auth-request-email"
      "x-auth-request-groups"
      "x-auth-request-preferred-username"
      "x-auth-request-access-token"
      "x-auth-request-redirect"
      "x-forwarded-user"
      "x-forwarded-email"
      "x-forwarded-groups"
      "x-forwarded-preferred-username" }}
{{- $forwarded := dict }}
{{- range .Values.ui.additionalForwardedHeaders }}
  {{- $_ := set $forwarded (lower (trim .)) true }}
{{- end }}
{{- if eq .Values.config.server.auth.mode "trusted-proxy" }}
{{- /* Public callers must not enter the authenticator's internal agent path. */}}
{{- $identityHeaders = concat $identityHeaders (list "x-agent-name" "x-user-id") }}
{{- $_ := unset $forwarded "x-agent-name" }}
{{- $_ := unset $forwarded "x-user-id" }}
{{- end }}
{{- $strip := list }}
{{- range $identityHeaders }}{{ if not (hasKey $forwarded .) }}{{ $strip = append $strip . }}{{ end }}{{ end }}

{{- /* maxBodySize is a size like 20m; a bare-number timeout is seconds. */}}
{{- $size := .Values.ui.agentgateway.maxBodySize | toString | lower }}
{{- $digits := regexFind "^[0-9]+" $size }}
{{- $units := dict "" 1 "k" 1024 "m" 1048576 "g" 1073741824 }}
{{- $unit := trimPrefix $digits $size }}
{{- if or (not $digits) (not (hasKey $units $unit)) }}{{ fail "ui.agentgateway.maxBodySize must be a size like 20m, 512k or 0" }}{{ end }}
{{- $maxBytes := mul (int64 $digits) (get $units $unit) }}
{{- $readTimeout := .Values.ui.agentgateway.timeout | toString }}
{{- if regexMatch "^[0-9]+$" $readTimeout }}{{ $readTimeout = printf "%ss" $readTimeout }}{{ end }}

{{- /* The request host, lowercased, without its port. */}}
{{- $host := `request.host.regexReplace(":[0-9]+$", "").lowerAscii()` }}
{{- $backend := include "kagent.controllerServiceAuthority" . }}
{{- $backendPort := .Values.controller.service.ports.port | int }}
{{- $basePath := trimSuffix "/" .Values.ui.basePath }}
{{- /* With ui.basePath set, its prefixed paths route the same way, with the prefix removed. */}}
{{- $prefixes := list "" }}
{{- if $basePath }}{{ $prefixes = append $prefixes $basePath }}{{ end }}
config:
  enableIpv6: {{ .Values.ipv6.enabled }}
  adminAddr: "off"
  statsAddr: "off"
  readinessAddr: "off"
  # Routes here are plain HTTP, so there are no MCP sessions to encrypt.
  session:
    key: disabled
gateways:
  ui:
    port: {{ .Values.ui.service.ports.targetPort }}
routes:
{{- range $i, $prefix := $prefixes }}
- name: jwks-{{ $i }}
  gateways: ui
  matches:
  - path:
      exact: {{ printf "%s/.well-known/jwks.json" $prefix | quote }}
  policies:
    {{- /* An explicit authority keeps the client's host name; otherwise agentgateway sends the backend's. */}}
    urlRewrite:
      authority:
        port: {{ $backendPort }}
      {{- if $prefix }}
      path:
        full: /.well-known/jwks.json
      {{- end }}
  backends:
  - host: {{ $backend }}
{{- range $route := list "a2a" "mcp" "api" }}
- name: {{ $route }}-{{ $i }}
  gateways: ui
  matches:
  - path:
      {{- if eq $route "mcp" }}
      exact: {{ printf "%s/mcp" $prefix | quote }}
      {{- else }}
      pathPrefix: {{ printf "%s/%s/" $prefix $route | quote }}
      {{- end }}
  policies:
    urlRewrite:
      authority:
        port: {{ $backendPort }}
      {{- if $prefix }}
      path:
        {{- if eq $route "mcp" }}
        full: /mcp
        {{- else }}
        prefix: /{{ $route }}/
        {{- end }}
      {{- end }}
    requestHeaderModifier:
      set:
        X-Forwarded-Proto: http
        {{- if eq $route "api" }}
        X-Forwarded-Host: localhost
        {{- end }}
      {{- with $strip }}
      remove:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if ne $route "mcp" }}
    transformations:
      request:
        set:
          {{- if eq $route "a2a" }}
          X-Forwarded-Host: {{ $host | quote }}
          Origin: {{ printf `"http://" + %s` $host | quote }}
          {{- end }}
          {{- if eq $route "api" }}
          X-Real-IP: source.address
          {{- end }}
          X-Forwarded-For: {{ `"x-forwarded-for" in request.headers ? request.headers["x-forwarded-for"] + ", " + source.address : source.address` | quote }}
    {{- end }}
    {{- /* Streams are never buffered; responseIdleTimeout skips upgraded websockets. */}}
    timeout:
      requestTimeout: {{ $readTimeout }}
      responseIdleTimeout: {{ $readTimeout }}
    {{- if $maxBytes }}
    buffer:
      request:
        maxBytes: {{ $maxBytes }}
        failureMode: failClosed
    {{- end }}
  backends:
  - host: {{ $backend }}
{{- end }}
{{- end }}
- name: ui
  gateways: ui
  backends:
  - host: 127.0.0.1:8081
