suite: controller configuration
templates:
  - controller-configmap.yaml
tests:
  - it: defaults session idle retention to seven days
    asserts:
      - equal:
          path: data.KAGENT_SESSION_IDLE_TTL
          value: 168h

  - it: allows session expiration to be disabled
    set:
      controller.sessionIdleTTL: "0"
    asserts:
      - equal:
          path: data.KAGENT_SESSION_IDLE_TTL
          value: "0"

  - it: allows a longer session idle lifetime
    set:
      controller.sessionIdleTTL: 720h
    asserts:
      - equal:
          path: data.KAGENT_SESSION_IDLE_TTL
          value: 720h

  - it: leaves session shares unbounded by default
    asserts:
      - equal:
          path: data.KAGENT_SESSION_SHARE_MAX_TTL
          value: "0"

  - it: allows a session share lifetime ceiling
    set:
      controller.sessionShareMaxTTL: 72h
    asserts:
      - equal:
          path: data.KAGENT_SESSION_SHARE_MAX_TTL
          value: 72h

  - it: defaults the stalled turn timeout to one hour
    asserts:
      - equal:
          path: data.KAGENT_STALLED_TURN_TIMEOUT
          value: 1h

  - it: allows the stalled turn sweep to be disabled
    set:
      controller.stalledTurnTimeout: "0"
    asserts:
      - equal:
          path: data.KAGENT_STALLED_TURN_TIMEOUT
          value: "0"

  - it: defaults to insecure controller authentication
    asserts:
      - isSubset:
          path: data
          content:
            KAGENT_AUTH_MODE: insecure
            KAGENT_AUTH_USER_ID_CLAIM: ""

  - it: configures trusted proxy authentication and the identity claim
    set:
      controller.auth.mode: trusted-proxy
      controller.auth.userIdClaim: email
    asserts:
      - isSubset:
          path: data
          content:
            KAGENT_AUTH_MODE: trusted-proxy
            KAGENT_AUTH_USER_ID_CLAIM: email

  - it: leaves the guest unconfigured and supplies sandbox policy defaults
    asserts:
      - isSubset:
          path: data
          content:
            KAGENT_SANDBOX_GUEST_IMAGE: ""
            KAGENT_SANDBOX_CPU: "1"
            KAGENT_SANDBOX_MEMORY: 1Gi
            KAGENT_SANDBOX_DEFAULT_TTL: 1h
            KAGENT_SANDBOX_MAX_TTL: 24h

  - it: applies sandbox policy overrides through the ConfigMap
    set:
      controller.sandbox.cpu: "2"
      controller.sandbox.memory: 2Gi
      controller.sandbox.defaultTTL: 30m
      controller.sandbox.maxTTL: 2h
    asserts:
      - isSubset:
          path: data
          content:
            KAGENT_SANDBOX_CPU: "2"
            KAGENT_SANDBOX_MEMORY: 2Gi
            KAGENT_SANDBOX_DEFAULT_TTL: 30m
            KAGENT_SANDBOX_MAX_TTL: 2h

  - it: uses the guest image registry repository and digest
    set:
      controller.sandbox.guestImage.registry: registry.example.com
      controller.sandbox.guestImage.repository: team/guest
      controller.sandbox.guestImage.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: data.KAGENT_SANDBOX_GUEST_IMAGE
          value: registry.example.com/team/guest@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: uses the top-level registry when the guest registry is unset
    set:
      registry: registry.example.com
      tag: v3.0.0
      controller.sandbox.guestImage.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: data.KAGENT_SANDBOX_GUEST_IMAGE
          value: registry.example.com/kagent-dev/kagent/sandbox-guest@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: respects the global mirror without applying the global tag to the guest
    set:
      tag: v3.0.0
      controller.sandbox.guestImage.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      controller.sandbox.guestImage.registry: registry.example.com
      global.imageRegistry: mirror.example.com/
    asserts:
      - equal:
          path: data.KAGENT_SANDBOX_GUEST_IMAGE
          value: mirror.example.com/kagent-dev/kagent/sandbox-guest@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: preserves a custom guest repository under the global mirror
    set:
      tag: v3.0.0
      controller.sandbox.guestImage.registry: registry.example.com
      controller.sandbox.guestImage.repository: team/guest
      controller.sandbox.guestImage.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      global.imageRegistry: mirror.example.com
    asserts:
      - equal:
          path: data.KAGENT_SANDBOX_GUEST_IMAGE
          value: mirror.example.com/team/guest@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
