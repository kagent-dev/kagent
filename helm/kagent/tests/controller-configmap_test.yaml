suite: explicit controller configuration
templates:
  - controller-configmap.yaml
  - controller-deployment.yaml
tests:
  - it: configures Actor JWT discovery with the Substrate trust bundle
    template: controller-configmap.yaml
    set:
      controller.substrateClientCertificate.enabled: true
      config.substrate.actorJwtIssuer: https://actors.example
    asserts:
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'actorJwtIssuer: https://actors.example'
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'caFile: /run/substrate-servicedns/trust-bundle.pem'

  - it: forwards the built-in bash setting to runtime defaults
    template: controller-configmap.yaml
    set:
      config.runtimeDefaults.builtinTools.disableBash: true
      config.runtimeDefaults.builtinTools.disableFileSearch: true
    asserts:
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'disableBash: true'
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'disableFileSearch: true'

  - it: uses full service DNS names for runtime egress
    template: controller-configmap.yaml
    set:
      global.clusterDomain: null
    asserts:
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'controlPlaneUrl: http://RELEASE-NAME-controller.NAMESPACE.svc.cluster.local:8083'
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'gatewayUrl: http://RELEASE-NAME-controller.NAMESPACE.svc.cluster.local:8083'

  - it: supports a custom Kubernetes DNS domain
    template: controller-configmap.yaml
    set:
      global.clusterDomain: cluster.example
    asserts:
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'controlPlaneUrl: http://RELEASE-NAME-controller.NAMESPACE.svc.cluster.example:8083'

  - it: mounts one config document and secret files
    template: controller-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --config=/etc/kagent/controller.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: controller-config
            mountPath: /etc/kagent
            readOnly: true
      - notExists:
          path: spec.template.spec.containers[0].envFrom
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].secret.name
          value: kagent-postgres-readwrite
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[1].secret.name
          value: kagent-postgres-owner
      - notExists:
          path: spec.template.spec.volumes[1].projected.sources[2].secret.name

  - it: retains only file references in application config
    template: controller-configmap.yaml
    set:
      controller.push.signing.secretName: tenant-signing
    asserts:
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'urlFile: /etc/kagent/secrets/database-readwrite-url'
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'urlFile: /etc/kagent/secrets/database-owner-url'
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'signingPrivateKeyFile: /etc/kagent/secrets/push-private-key.pem'
      - notMatchRegex:
          path: data["controller.yaml"]
          pattern: 'apiVersion:|kind:|KAGENT_|OTEL_'

  - it: preserves explicit false and zero duration
    template: controller-configmap.yaml
    set:
      config.sessions.idleTtl: 0s
      config.metrics.secure: false
      config.kubernetes.leaderElection: false
    asserts:
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'idleTtl: 0s'
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'secure: false'
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'leaderElection: false'

  - it: serializes telemetry for controller and runtimes independently
    template: controller-configmap.yaml
    set:
      config.telemetry.traces.endpoint: http://controller-collector:4317
      config.runtimeDefaults.telemetry.logs.endpoint: http://runtime-collector:4318/v1/logs
      config.runtimeDefaults.telemetry.logs.protocol: http/protobuf
    asserts:
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'endpoint: http://controller-collector:4317'
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'endpoint: http://runtime-collector:4318/v1/logs'

  - it: uses explicitly configured secret names
    template: controller-deployment.yaml
    set:
      database.postgres.readWriteConnectionStringSecretRef.name: tenant-readwrite
      database.postgres.readWriteConnectionStringSecretRef.key: url
      database.postgres.ownerConnectionStringSecretRef.name: tenant-owner
      database.postgres.ownerConnectionStringSecretRef.key: url
      controller.push.signing.secretName: tenant-signing
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].secret
          value:
            name: tenant-readwrite
            items:
              - key: url
                path: database-readwrite-url
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[1].secret
          value:
            name: tenant-owner
            items:
              - key: url
                path: database-owner-url
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[2].secret.name
          value: tenant-signing
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[2].secret.items[0]
          value:
            key: private-key.pem
            path: push-private-key.pem

  - it: configures both database logins with their roles
    template: controller-configmap.yaml
    set:
      config.database.owner.role: tenant_owner
      config.database.readWrite.role: tenant_readwrite
    asserts:
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'owner:\n\s+role: tenant_owner\n\s+urlFile: /etc/kagent/secrets/database-owner-url'
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'readWrite:\n\s+role: tenant_readwrite\n\s+urlFile: /etc/kagent/secrets/database-readwrite-url'

  - it: omits the owner login's file when migrations are skipped
    template: controller-configmap.yaml
    set:
      config.database.skipMigrations: true
    asserts:
      - notMatchRegex:
          path: data["controller.yaml"]
          pattern: 'database-owner-url'

  - it: leaves push JWT signing disabled by default
    template: controller-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["controller.yaml"]
          pattern: 'signingPrivateKeyFile:'

  - it: uses explicit database and extension schemas
    template: controller-configmap.yaml
    set:
      config.database.schema: tenant
      config.database.vectorSchema: public
    asserts:
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'schema: tenant'
      - matchRegex:
          path: data["controller.yaml"]
          pattern: 'vectorSchema: public'

  - it: supplies process-local OTEL overrides
    template: controller-deployment.yaml
    set:
      controller.env:
        - name: OTEL_SDK_DISABLED
          value: "true"
      controller.envFrom:
        - secretRef:
            name: telemetry-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SDK_DISABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: telemetry-credentials
