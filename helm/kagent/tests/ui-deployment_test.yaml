suite: test ui deployment
templates:
  - ui-deployment.yaml
  - ui-nginx-configmap.yaml
tests:
  - it: should render ui deployment with default values
    template: ui-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ui
      - equal:
          path: spec.replicas
          value: 1
      - hasDocuments:
          count: 1

  - it: should render ui deployment with custom replica count
    template: ui-deployment.yaml
    set:
      ui:
        replicas: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should have correct ui container image
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: ui
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/kagent-dev/kagent/ui:.+"

  - it: should use global tag when set
    template: ui-deployment.yaml
    set:
      tag: "v1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/kagent-dev/kagent/ui:v1.0.0

  - it: should have correct ui resources
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1000m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: should have correct service account name
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-ui

  - it: should have correct container port
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: should set global annotations on deployment
    template: ui-deployment.yaml
    set:
      annotations:
        app.kubernetes.io/managed-by: "custom"
    asserts:
      - isSubset:
          path: metadata.annotations
          content:
            app.kubernetes.io/managed-by: "custom"

  - it: should set ui annotations on deployment and override global ones
    template: ui-deployment.yaml
    set:
      annotations:
        global-key: "global-value"
        shared-key: "global-wins"
      ui:
        annotations:
          ui-key: "ui-value"
          shared-key: "ui-wins"
    asserts:
      - isSubset:
          path: metadata.annotations
          content:
            global-key: "global-value"
            ui-key: "ui-value"
            shared-key: "ui-wins"

  - it: should set podAnnotations
    template: ui-deployment.yaml
    set:
      ui:
        podAnnotations:
          role: AI
    asserts:
      - isSubset:
          path: spec.template.metadata.annotations
          content:
            role: AI

  - it: should fallback to top-level podAnnotations
    template: ui-deployment.yaml
    set:
      podAnnotations:
        role: AI
    asserts:
      - isSubset:
          path: spec.template.metadata.annotations
          content:
            role: AI

  - it: should set nodeSelector
    template: ui-deployment.yaml
    set:
      ui:
        nodeSelector:
          role: AI
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            role: AI

  - it: should use default httpGet startup probe
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 1

  - it: should use default httpGet readiness probe
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 30

  - it: should allow overriding startup probe
    template: ui-deployment.yaml
    set:
      ui:
        startupProbe:
          exec:
            command: ["curl", "-sf", "http://[::1]:8080/health"]
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 30
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command
          value: ["curl", "-sf", "http://[::1]:8080/health"]
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 3
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.httpGet

  - it: should allow overriding readiness probe
    template: ui-deployment.yaml
    set:
      ui:
        readinessProbe:
          exec:
            command: ["curl", "-sf", "http://[::1]:8080/health"]
          periodSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["curl", "-sf", "http://[::1]:8080/health"]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet

  - it: should mount the ui-config ConfigMap for nginx
    template: ui-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ui-config
            configMap:
              name: RELEASE-NAME-ui-config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ui-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true

  - it: should not mount a supervisord config now that nginx runs as PID 1
    template: ui-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ui-config
            mountPath: /etc/supervisor/conf.d/supervisord.conf
            subPath: supervisord.conf
            readOnly: true

  - it: should include config checksum in pod annotations
    template: ui-deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/ui-config"]

  - it: should set tolerations
    template: ui-deployment.yaml
    set:
      ui:
        tolerations:
          - key: role
            operator: Equal
            value: AI
            effect: NoSchedule
    asserts:
      - contains:
          any: true
          path: spec.template.spec.tolerations
          content:
            key: role
            value: AI
            effect: NoSchedule
            operator: Equal

  - it: should set affinity
    template: ui-deployment.yaml
    set:
      ui:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: kagent-ui
                  topologyKey: topology.kubernetes.io/zone
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: topology.kubernetes.io/zone

  - it: should set topologySpreadConstraints
    template: ui-deployment.yaml
    set:
      ui:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kagent-ui
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kagent-ui

  - it: should not render affinity or topologySpreadConstraints by default
    template: ui-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should pass runtime browser config to init.sh as env
    template: ui-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KAGENT_API_BASE_URL
            value: "/api"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSO_REDIRECT_PATH
            value: "/oauth2/start"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KAGENT_STREAM_TIMEOUT_MS
            value: "1800000"

  - it: should carry an overridden publicBackendUrl through to the browser config
    template: ui-deployment.yaml
    set:
      ui:
        publicBackendUrl: "https://api.example.com/api"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KAGENT_API_BASE_URL
            value: "https://api.example.com/api"

  - it: should fall back to /api when publicBackendUrl is blanked
    template: ui-deployment.yaml
    set:
      ui:
        publicBackendUrl: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KAGENT_API_BASE_URL
            value: "/api"

  - it: should reflect overridden auth and stream settings
    template: ui-deployment.yaml
    set:
      ui:
        auth:
          ssoRedirectPath: /custom/start
        streamTimeoutSeconds: 90
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSO_REDIRECT_PATH
            value: "/custom/start"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KAGENT_STREAM_TIMEOUT_MS
            value: "90000"

  - it: should not set env vars that only the removed node server consumed
    template: ui-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXT_PUBLIC_BACKEND_URL
            value: "/api"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXT_PUBLIC_SSO_REDIRECT_PATH
            value: "/oauth2/start"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKEND_INTERNAL_URL
            value: "http://RELEASE-NAME-controller.NAMESPACE.svc:8083/api"
      # The browser reaches gRPC over the same origin, through nginx, so there is
      # no separate gRPC URL for anything to be configured with.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKEND_GRPC_URL

  - it: should not mount a nextjs build cache
    template: ui-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nextjs-cache
            mountPath: /app/ui/.next/cache
