suite: test ui deployment
templates:
  - ui-deployment.yaml
  - ui-nginx-configmap.yaml
tests:
  - it: mounts the rendered env-config.js and rolls out on changes
    template: ui-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ui-config
            mountPath: /usr/share/nginx/html/env-config.js
            subPath: env-config.js
            readOnly: true
      - notExists:
          path: spec.template.spec.containers[0].envFrom
      - notExists:
          path: spec.template.spec.containers[0].env
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/ui-config"]
          pattern: "^[a-f0-9]{64}$"

  - it: preserves explicit env overrides and Secret references
    template: ui-deployment.yaml
    set:
      ui.env:
        - name: KAGENT_UI_API_BASE_URL
          value: /custom-api
        - name: CUSTOM_TOKEN
          valueFrom:
            secretKeyRef:
              name: ui-token
              key: token
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: KAGENT_UI_API_BASE_URL
              value: /custom-api
            - name: CUSTOM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ui-token
                  key: token
      - matchRegex:
          path: data["env-config.js"]
          pattern: '"API_BASE_URL":"/custom-api"'
        template: ui-nginx-configmap.yaml
      - notMatchRegex:
          path: data["env-config.js"]
          pattern: CUSTOM_TOKEN
        template: ui-nginx-configmap.yaml

  - it: should render ui deployment with default values
    template: ui-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ui
      - equal:
          path: spec.replicas
          value: 1
      - hasDocuments:
          count: 1

  - it: should render ui deployment with custom replica count
    template: ui-deployment.yaml
    set:
      ui:
        replicas: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should have correct ui container image
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: ui
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/kagent-dev/kagent/ui:.+"

  - it: should use global tag when set
    template: ui-deployment.yaml
    set:
      tag: "v1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/kagent-dev/kagent/ui:v1.0.0

  - it: should have correct ui resources
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1000m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: should have correct service account name
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-ui

  - it: should have correct container port
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: should set global annotations on deployment
    template: ui-deployment.yaml
    set:
      annotations:
        app.kubernetes.io/managed-by: "custom"
    asserts:
      - isSubset:
          path: metadata.annotations
          content:
            app.kubernetes.io/managed-by: "custom"

  - it: should set ui annotations on deployment and override global ones
    template: ui-deployment.yaml
    set:
      annotations:
        global-key: "global-value"
        shared-key: "global-wins"
      ui:
        annotations:
          ui-key: "ui-value"
          shared-key: "ui-wins"
    asserts:
      - isSubset:
          path: metadata.annotations
          content:
            global-key: "global-value"
            ui-key: "ui-value"
            shared-key: "ui-wins"

  - it: should set podAnnotations
    template: ui-deployment.yaml
    set:
      ui:
        podAnnotations:
          role: AI
    asserts:
      - isSubset:
          path: spec.template.metadata.annotations
          content:
            role: AI

  - it: should fallback to top-level podAnnotations
    template: ui-deployment.yaml
    set:
      podAnnotations:
        role: AI
    asserts:
      - isSubset:
          path: spec.template.metadata.annotations
          content:
            role: AI

  - it: should set nodeSelector
    template: ui-deployment.yaml
    set:
      ui:
        nodeSelector:
          role: AI
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            role: AI

  - it: should use default httpGet startup probe
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 1

  - it: should use default httpGet readiness probe
    template: ui-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 30

  - it: should allow overriding startup probe
    template: ui-deployment.yaml
    set:
      ui:
        startupProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 30
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 3
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.httpGet

  - it: should allow overriding readiness probe
    template: ui-deployment.yaml
    set:
      ui:
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet

  - it: should mount the ui-config ConfigMap for nginx
    template: ui-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ui-config
            configMap:
              name: RELEASE-NAME-ui-config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ui-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true

  - it: should not mount a supervisord config now that nginx runs as PID 1
    template: ui-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ui-config
            mountPath: /etc/supervisor/conf.d/supervisord.conf
            subPath: supervisord.conf
            readOnly: true

  - it: should include config checksum in pod annotations
    template: ui-deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/ui-config"]

  - it: should set tolerations
    template: ui-deployment.yaml
    set:
      ui:
        tolerations:
          - key: role
            operator: Equal
            value: AI
            effect: NoSchedule
    asserts:
      - contains:
          any: true
          path: spec.template.spec.tolerations
          content:
            key: role
            value: AI
            effect: NoSchedule
            operator: Equal

  - it: should set affinity
    template: ui-deployment.yaml
    set:
      ui:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: kagent-ui
                  topologyKey: topology.kubernetes.io/zone
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: topology.kubernetes.io/zone

  - it: should set topologySpreadConstraints
    template: ui-deployment.yaml
    set:
      ui:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kagent-ui
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kagent-ui

  - it: should not render affinity or topologySpreadConstraints by default
    template: ui-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should render default browser settings into env-config.js
    template: ui-nginx-configmap.yaml
    asserts:
      - equal:
          path: data["env-config.js"]
          value: |
            window.environmentVariables = {"API_BASE_URL":"/api","BASE_PATH":"","ENABLE_MOCK_UI":"false","SSO_REDIRECT_PATH":"/oauth2/start","STREAM_TIMEOUT_MS":"1800000"};
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: sub_filter

  - it: should carry an overridden publicBackendUrl through to the browser config
    template: ui-nginx-configmap.yaml
    set:
      ui:
        publicBackendUrl: "https://api.example.com/api"
    asserts:
      - matchRegex:
          path: data["env-config.js"]
          pattern: '"API_BASE_URL":"https://api.example.com/api"'

  - it: should fall back to /api when publicBackendUrl is blanked
    template: ui-nginx-configmap.yaml
    set:
      ui:
        publicBackendUrl: ""
    asserts:
      - matchRegex:
          path: data["env-config.js"]
          pattern: '"API_BASE_URL":"/api"'

  - it: should pass ui.basePath to the browser config and rewrite <base href>
    template: ui-nginx-configmap.yaml
    set:
      ui:
        basePath: /ui/
    asserts:
      - matchRegex:
          path: data["env-config.js"]
          pattern: '"BASE_PATH":"/ui"'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "sub_filter '<base href=\"/\"' '<base href=\"/ui/\"';"

  - it: should reject a ui.basePath that is not a path
    template: ui-nginx-configmap.yaml
    set:
      ui:
        basePath: ui
    asserts:
      - failedTemplate:
          errorMessage: ui.basePath must be a path like /ui

  - it: should reject a ui.basePath with dot segments
    template: ui-nginx-configmap.yaml
    set:
      ui:
        basePath: /ui/..
    asserts:
      - failedTemplate:
          errorMessage: ui.basePath must be a path like /ui

  - it: should reject a ui.basePath that starts with a path nginx serves
    template: ui-nginx-configmap.yaml
    set:
      ui:
        basePath: /assets/ui
    asserts:
      - failedTemplate:
          errorMessage: ui.basePath cannot start with a path nginx serves, such as /api or /assets

  - it: should accept a ui.basePath that only shares a prefix with a served path
    template: ui-nginx-configmap.yaml
    set:
      ui:
        basePath: /apis
    asserts:
      - matchRegex:
          path: data["env-config.js"]
          pattern: '"BASE_PATH":"/apis"'

  - it: should reflect overridden auth and stream settings
    template: ui-nginx-configmap.yaml
    set:
      ui:
        auth:
          ssoRedirectPath: /custom/start
        streamTimeoutSeconds: 90
    asserts:
      - matchRegex:
          path: data["env-config.js"]
          pattern: '"SSO_REDIRECT_PATH":"/custom/start"'
      - matchRegex:
          path: data["env-config.js"]
          pattern: '"STREAM_TIMEOUT_MS":"90000"'

  - it: should copy extension settings into env-config.js with markup escaped
    template: ui-nginx-configmap.yaml
    set:
      ui.env:
        - name: KAGENT_UI_EXTENSION_GREETING
          value: '</script>"hi"'
        - name: KAGENT_UI_ENABLE_MOCK
          value: "true"
    asserts:
      - matchRegex:
          path: data["env-config.js"]
          pattern: '"KAGENT_UI_EXTENSION_GREETING":"\\u003c/script\\u003e\\"hi\\""'
      - matchRegex:
          path: data["env-config.js"]
          pattern: '"ENABLE_MOCK_UI":"true"'

  - it: should reject an extension setting that uses valueFrom
    template: ui-nginx-configmap.yaml
    set:
      ui.env:
        - name: KAGENT_UI_EXTENSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: ui-token
              key: token
    asserts:
      - failedTemplate:
          errorMessage: "ui.env KAGENT_UI_EXTENSION_TOKEN needs a plain value: the chart renders it into env-config.js"

  - it: should not mount a nextjs build cache
    template: ui-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nextjs-cache
            mountPath: /app/ui/.next/cache
