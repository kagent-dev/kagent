suite: test the UI served by the controller deployment
templates:
  - ui-configmap.yaml
  - controller-deployment.yaml
  - controller-configmap.yaml
tests:
  - it: loads browser settings from the ConfigMap and rolls out on changes
    template: controller-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-ui
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/ui-configmap"]
          pattern: "^[a-f0-9]{64}$"
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: ui
            containerPort: 8080
            protocol: TCP

  - it: preserves explicit env overrides and Secret references
    template: controller-deployment.yaml
    set:
      ui.env:
        - name: KAGENT_UI_API_BASE_URL
          value: /custom-api
        - name: CUSTOM_TOKEN
          valueFrom:
            secretKeyRef:
              name: ui-token
              key: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KAGENT_UI_API_BASE_URL
            value: /custom-api
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOM_TOKEN
            valueFrom:
              secretKeyRef:
                name: ui-token
                key: token
      - equal:
          path: data.KAGENT_UI_API_BASE_URL
          value: /api
        template: ui-configmap.yaml
      - notExists:
          path: data.CUSTOM_TOKEN
        template: ui-configmap.yaml

  - it: binds the UI listener to IPv4 by default
    template: ui-configmap.yaml
    asserts:
      - equal:
          path: data.KAGENT_UI_BIND_ADDRESS
          value: "0.0.0.0:8080"
      - notExists:
          path: data.KAGENT_UI_FORWARDED_HEADERS

  - it: binds the UI listener dual-stack with ipv6.enabled
    template: ui-configmap.yaml
    set:
      ipv6.enabled: true
    asserts:
      - equal:
          path: data.KAGENT_UI_BIND_ADDRESS
          value: ":8080"

  - it: passes opted-in identity headers to the UI listener
    template: ui-configmap.yaml
    set:
      ui.additionalForwardedHeaders: [X-Forwarded-User, X-Forwarded-Email]
    asserts:
      - equal:
          path: data.KAGENT_UI_FORWARDED_HEADERS
          value: "X-Forwarded-User,X-Forwarded-Email"

  - it: should pass runtime browser config to the controller as env
    template: ui-configmap.yaml
    asserts:
      - equal:
          path: data.KAGENT_UI_API_BASE_URL
          value: "/api"
      - equal:
          path: data.KAGENT_UI_SSO_REDIRECT_PATH
          value: "/oauth2/start"
      - equal:
          path: data.KAGENT_UI_STREAM_TIMEOUT_MS
          value: "1800000"

  - it: should carry an overridden publicBackendUrl through to the browser config
    template: ui-configmap.yaml
    set:
      ui:
        publicBackendUrl: "https://api.example.com/api"
    asserts:
      - equal:
          path: data.KAGENT_UI_API_BASE_URL
          value: "https://api.example.com/api"

  - it: should fall back to /api when publicBackendUrl is blanked
    template: ui-configmap.yaml
    set:
      ui:
        publicBackendUrl: ""
    asserts:
      - equal:
          path: data.KAGENT_UI_API_BASE_URL
          value: "/api"

  - it: should pass ui.basePath through to the browser config only when set
    template: ui-configmap.yaml
    set:
      ui:
        basePath: /ui
    asserts:
      - equal:
          path: data.KAGENT_UI_BASE_PATH
          value: "/ui"

  - it: should omit KAGENT_UI_BASE_PATH by default
    template: ui-configmap.yaml
    asserts:
      - notExists:
          path: data.KAGENT_UI_BASE_PATH

  - it: should reject a ui.basePath that is not a path
    template: ui-configmap.yaml
    set:
      ui:
        basePath: ui
    asserts:
      - failedTemplate:
          errorMessage: ui.basePath must be a path like /ui

  - it: should reject a ui.basePath with dot segments
    template: ui-configmap.yaml
    set:
      ui:
        basePath: /ui/..
    asserts:
      - failedTemplate:
          errorMessage: ui.basePath must be a path like /ui

  - it: should reject a ui.basePath that starts with a path the UI serves
    template: ui-configmap.yaml
    set:
      ui:
        basePath: /assets/ui
    asserts:
      - failedTemplate:
          errorMessage: ui.basePath cannot start with a path the UI serves, such as /api or /assets

  - it: should accept a ui.basePath that only shares a prefix with a served path
    template: ui-configmap.yaml
    set:
      ui:
        basePath: /apis
    asserts:
      - equal:
          path: data.KAGENT_UI_BASE_PATH
          value: "/apis"

  - it: should reflect overridden auth and stream settings
    template: ui-configmap.yaml
    set:
      ui:
        auth:
          ssoRedirectPath: /custom/start
        streamTimeoutSeconds: 90
    asserts:
      - equal:
          path: data.KAGENT_UI_SSO_REDIRECT_PATH
          value: "/custom/start"
      - equal:
          path: data.KAGENT_UI_STREAM_TIMEOUT_MS
          value: "90000"
