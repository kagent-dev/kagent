suite: test oauth2-proxy sign-in template
templates:
  - oauth2-proxy-templates.yaml
tests:
  - it: should send the sign-in redirect under ui.basePath
    set:
      oauth2-proxy:
        enabled: true
      ui:
        basePath: /ui/
    asserts:
      - matchRegex:
          path: data["sign_in.html"]
          pattern: 'url=/ui/login\?rd='

  - it: should send the sign-in redirect to the root by default
    set:
      oauth2-proxy:
        enabled: true
    asserts:
      - matchRegex:
          path: data["sign_in.html"]
          pattern: 'url=/login\?rd='

  - it: fails when oauth2-proxy is enabled and the UI is disabled
    set:
      oauth2-proxy:
        enabled: true
      ui:
        enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "oauth2-proxy.enabled requires ui.enabled=true: oauth2-proxy fronts the UI Service, which is not deployed when the UI is disabled"
