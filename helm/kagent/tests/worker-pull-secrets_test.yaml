suite: worker ServiceAccount pull secrets
templates:
  - controller-serviceaccount.yaml
  - substrate-workerpool.yaml
release:
  namespace: kagent
set:
  controller.serviceAccount.create: false
  substrateWorkerPool.create: true
  substrateWorkerPool.name: selected-pool
  substrateWorkerPool.workerImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:test
tests:
  - it: propagates global pull secrets to the worker ServiceAccount
    template: controller-serviceaccount.yaml
    set:
      global.imagePullSecrets:
        - name: mirror-auth
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: selected-pool
      - equal:
          path: metadata.namespace
          value: kagent
      - equal:
          path: imagePullSecrets
          value:
            - name: mirror-auth

  - it: merges chart and global pull secrets without duplicates
    template: controller-serviceaccount.yaml
    set:
      imagePullSecrets:
        - name: local-auth
        - name: shared-auth
      global.imagePullSecrets:
        - name: shared-auth
        - name: mirror-auth
    asserts:
      - equal:
          path: imagePullSecrets
          value:
            - name: local-auth
            - name: shared-auth
            - name: mirror-auth

  - it: preserves chart pull secrets without a global override
    template: controller-serviceaccount.yaml
    set:
      imagePullSecrets:
        - name: local-auth
    asserts:
      - equal:
          path: imagePullSecrets
          value:
            - name: local-auth

  - it: omits pull secrets when none are configured
    template: controller-serviceaccount.yaml
    asserts:
      - notExists:
          path: imagePullSecrets

  - it: does not change an externally managed worker ServiceAccount
    template: controller-serviceaccount.yaml
    set:
      substrateWorkerPool.serviceAccount.create: false
      substrateWorkerPool.serviceAccount.name: external-workers
      global.imagePullSecrets:
        - name: mirror-auth
    asserts:
      - hasDocuments:
          count: 0

  - it: does not create a worker ServiceAccount for an external pool
    template: controller-serviceaccount.yaml
    set:
      substrateWorkerPool.create: false
      global.imagePullSecrets:
        - name: mirror-auth
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the selected worker ServiceAccount and scheduling when mirroring
    template: substrate-workerpool.yaml
    set:
      substrateWorkerPool.serviceAccount.create: false
      substrateWorkerPool.serviceAccount.name: external-workers
      substrateWorkerPool.template.priorityClassName: high
      global.imageRegistry: mirror.example/path
      global.imagePullSecrets:
        - name: mirror-auth
    asserts:
      - equal:
          path: spec.workerImage
          value: mirror.example/path/kagent-dev/substrate/ateom-gvisor:test
      - equal:
          path: spec.template.serviceAccountName
          value: external-workers
      - equal:
          path: spec.template.priorityClassName
          value: high
