suite: test worker pool sandbox selection
templates:
  - substrate-workerpool.yaml
release:
  namespace: kagent
set:
  controller.substrate.enabled: true
  substrateWorkerPool.create: true
  substrateWorkerPool.name: selected-pool
  substrateWorkerPool.workerImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.3.0-alpha1
tests:
  - it: should default to gvisor and label the selected pool
    asserts:
      - isKind:
          of: WorkerPool
      - equal:
          path: metadata.namespace
          value: kagent
      - equal:
          path: metadata.name
          value: selected-pool
      - equal:
          path: metadata.labels["kagent.dev/worker-pool"]
          value: selected-pool
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-namespace"]
          value: kagent
      - equal:
          path: spec.sandboxClass
          value: gvisor
      - equal:
          path: spec.workerImage
          value: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.3.0-alpha1
  - it: should preserve gvisor when the class is empty
    set:
      substrateWorkerPool.sandboxClass: ""
    asserts:
      - equal:
          path: spec.sandboxClass
          value: gvisor
  - it: should scope a same-named pool to its release namespace
    release:
      namespace: tenant-b
    asserts:
      - equal:
          path: metadata.namespace
          value: tenant-b
      - equal:
          path: metadata.labels["kagent.dev/worker-pool"]
          value: selected-pool
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-namespace"]
          value: tenant-b
  - it: should scope placement to the namespace override
    set:
      namespaceOverride: tenant-a
    asserts:
      - equal:
          path: metadata.namespace
          value: tenant-a
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-namespace"]
          value: tenant-a
  - it: should preserve extra labels without allowing placement overrides
    set:
      labels:
        kagent.dev/worker-pool: foreign-global-pool
        kagent.dev/worker-pool-namespace: foreign-global-namespace
      substrateWorkerPool.labels:
        team: platform
        kagent.dev/worker-pool: foreign-pool
        kagent.dev/worker-pool-namespace: foreign-namespace
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform
      - equal:
          path: metadata.labels["kagent.dev/worker-pool"]
          value: selected-pool
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-namespace"]
          value: kagent
  - it: should render microvm with the selected image and worker selector label
    set:
      substrateWorkerPool.sandboxClass: microvm
      substrateWorkerPool.workerImage: ghcr.io/kagent-dev/substrate/ateom-microvm:v0.3.0-alpha1
    asserts:
      - equal:
          path: spec.sandboxClass
          value: microvm
      - equal:
          path: spec.workerImage
          value: ghcr.io/kagent-dev/substrate/ateom-microvm:v0.3.0-alpha1
      - equal:
          path: metadata.labels["kagent.dev/worker-pool"]
          value: selected-pool
  - it: should not create an externally managed pool
    set:
      substrateWorkerPool.create: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should not create a pool when substrate integration is disabled
    set:
      controller.substrate.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should require an explicit worker image
    set:
      substrateWorkerPool.workerImage: ""
    asserts:
      - failedTemplate:
          errorMessage: substrateWorkerPool.workerImage is required when substrateWorkerPool.create=true
