suite: test worker pool sandbox selection
templates:
  - substrate-workerpool.yaml
  - substrate-worker-serviceaccount.yaml
release:
  namespace: kagent
set:
  controller.substrate.enabled: true
  substrateWorkerPool.create: true
  substrateWorkerPool.name: selected-pool
  substrateWorkerPool.workerImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.3.0-alpha1
tests:
  - it: should default to gvisor and label the selected pool
    template: substrate-workerpool.yaml
    asserts:
      - isKind:
          of: WorkerPool
      - equal:
          path: metadata.namespace
          value: kagent
      - equal:
          path: metadata.name
          value: selected-pool
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-name"]
          value: selected-pool
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-namespace"]
          value: kagent
      # Name-only templates from earlier releases select this key; without it
      # they cannot reach this pool from another namespace.
      - notExists:
          path: metadata.labels["kagent.dev/worker-pool"]
      - equal:
          path: spec.sandboxClass
          value: gvisor
      - equal:
          path: spec.workerImage
          value: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.3.0-alpha1
  - it: should preserve gvisor when the class is empty
    template: substrate-workerpool.yaml
    set:
      substrateWorkerPool.sandboxClass: ""
    asserts:
      - equal:
          path: spec.sandboxClass
          value: gvisor
  - it: should scope a same-named pool to its release namespace
    template: substrate-workerpool.yaml
    release:
      namespace: tenant-b
    asserts:
      - equal:
          path: metadata.namespace
          value: tenant-b
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-name"]
          value: selected-pool
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-namespace"]
          value: tenant-b
  - it: should scope placement to the namespace override
    template: substrate-workerpool.yaml
    set:
      namespaceOverride: tenant-a
    asserts:
      - equal:
          path: metadata.namespace
          value: tenant-a
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-namespace"]
          value: tenant-a
  - it: should preserve extra labels without allowing placement overrides
    template: substrate-workerpool.yaml
    set:
      labels:
        environment: production
        kagent.dev/worker-pool-name: foreign-global-pool
        kagent.dev/worker-pool-namespace: foreign-global-namespace
      substrateWorkerPool.labels:
        team: platform
        kagent.dev/worker-pool-name: foreign-pool
        kagent.dev/worker-pool-namespace: foreign-namespace
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels.environment
          value: production
      - equal:
          path: metadata.labels.team
          value: platform
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-name"]
          value: selected-pool
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-namespace"]
          value: kagent
  - it: should render a numeric pool name as a string label
    template: substrate-workerpool.yaml
    set:
      substrateWorkerPool.name: 1234
    asserts:
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-name"]
          value: "1234"
  - it: should render microvm with the selected image and worker selector label
    template: substrate-workerpool.yaml
    set:
      substrateWorkerPool.sandboxClass: microvm
      substrateWorkerPool.workerImage: ghcr.io/kagent-dev/substrate/ateom-microvm:v0.3.0-alpha1
    asserts:
      - equal:
          path: spec.sandboxClass
          value: microvm
      - equal:
          path: spec.workerImage
          value: ghcr.io/kagent-dev/substrate/ateom-microvm:v0.3.0-alpha1
      - equal:
          path: metadata.labels["kagent.dev/worker-pool-name"]
          value: selected-pool
  - it: should not create an externally managed pool
    set:
      substrateWorkerPool.create: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should not create a pool when substrate integration is disabled
    set:
      controller.substrate.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should require an explicit worker image
    template: substrate-workerpool.yaml
    set:
      substrateWorkerPool.workerImage: ""
    asserts:
      - failedTemplate:
          errorMessage: substrateWorkerPool.workerImage is required when substrateWorkerPool.create=true
  - it: should create a worker ServiceAccount and run the workers as it
    asserts:
      - equal:
          path: spec.template.serviceAccountName
          value: selected-pool-worker
        template: substrate-workerpool.yaml
      - isKind:
          of: ServiceAccount
        template: substrate-worker-serviceaccount.yaml
      - equal:
          path: metadata.name
          value: selected-pool-worker
        template: substrate-worker-serviceaccount.yaml
      - equal:
          path: metadata.namespace
          value: kagent
        template: substrate-worker-serviceaccount.yaml
  - it: should use a user ServiceAccount and keep the rest of the template
    set:
      substrateWorkerPool.template:
        serviceAccountName: my-worker-sa
        priorityClassName: high
    asserts:
      - equal:
          path: spec.template.serviceAccountName
          value: my-worker-sa
        template: substrate-workerpool.yaml
      - equal:
          path: spec.template.priorityClassName
          value: high
        template: substrate-workerpool.yaml
      - hasDocuments:
          count: 0
        template: substrate-worker-serviceaccount.yaml
