suite: invocation service-account authentication
templates:
  - controller-deployment.yaml
  - controller-configmap.yaml
  - rbac/invocation-auth.yaml
tests:
  - it: scopes cluster authentication RBAC to the first release namespace
    template: rbac/invocation-auth.yaml
    release:
      name: same-release
      namespace: team-a
    asserts:
      - equal:
          path: metadata.name
          value: team-a-same-release-invocation-auth
      - equal:
          path: roleRef.name
          value: team-a-same-release-invocation-auth
        documentIndex: 1
      - equal:
          path: subjects[0].namespace
          value: team-a
        documentIndex: 1
  - it: scopes cluster authentication RBAC to the second release namespace
    template: rbac/invocation-auth.yaml
    release:
      name: same-release
      namespace: team-b
    asserts:
      - equal:
          path: metadata.name
          value: team-b-same-release-invocation-auth
      - equal:
          path: roleRef.name
          value: team-b-same-release-invocation-auth
        documentIndex: 1
      - equal:
          path: subjects[0].namespace
          value: team-b
        documentIndex: 1
  - it: projects only a downstream credential with the requested TTL
    template: controller-deployment.yaml
    set:
      config.scheduledRuns.outboundCredential.audience: mcp.example
      config.scheduledRuns.outboundCredential.expirationSeconds: 7200
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: outbound-invocation-token
            projected:
              sources:
                - serviceAccountToken:
                    audience: mcp.example
                    expirationSeconds: 7200
                    path: token
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: outbound-invocation-token
            mountPath: /run/kagent-egress
            readOnly: true
      - notExists:
          path: spec.template.spec.volumes[?(@.name == "invocation-token")]
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "invocation-token")]
  - it: keeps tokenFile overrides from changing the scheduler mounts
    template: controller-deployment.yaml
    set:
      config.scheduledRuns.outboundCredential.tokenFile: /token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: outbound-invocation-token
            mountPath: /run/kagent-egress
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: outbound-invocation-token
            projected:
              sources:
                - serviceAccountToken:
                    audience: kagent-egress
                    expirationSeconds: 3600
                    path: token
  - it: keeps the downstream projection when external machine authentication is disabled
    template: controller-deployment.yaml
    set:
      config.server.auth.serviceAccount: null
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name == "invocation-token")]
      - exists:
          path: spec.template.spec.volumes[?(@.name == "outbound-invocation-token")]
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "invocation-token")]
      - exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "outbound-invocation-token")]
  - it: omits scheduler credentials when scheduling is disabled
    template: controller-deployment.yaml
    set:
      config.scheduledRuns.outboundCredential: null
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name == "invocation-token")]
      - notExists:
          path: spec.template.spec.volumes[?(@.name == "outbound-invocation-token")]
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "invocation-token")]
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "outbound-invocation-token")]
  - it: grants TokenReview independently of secure metrics
    template: rbac/invocation-auth.yaml
    set:
      controller.metrics.enabled: false
      controller.serviceAccount.name: scheduler
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: rules
          value:
            - apiGroups: [authentication.k8s.io]
              resources: [tokenreviews]
              verbs: [create]
        documentIndex: 0
      - equal:
          path: subjects[0].name
          value: scheduler
        documentIndex: 1
  - it: grants TokenReview for the scheduler's startup isolation check alone
    template: rbac/invocation-auth.yaml
    set:
      config.server.auth.serviceAccount: null
    asserts:
      - hasDocuments:
          count: 2
  - it: needs no TokenReview RBAC without machine authentication or scheduling
    template: rbac/invocation-auth.yaml
    set:
      config.server.auth.serviceAccount: null
      config.scheduledRuns.outboundCredential: null
    asserts:
      - hasDocuments:
          count: 0
