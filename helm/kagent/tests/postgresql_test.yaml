suite: test postgresql
templates:
  - postgresql.yaml
  - postgresql-secret.yaml
tests:
  - it: should render the bundled PostgreSQL resources
    template: postgresql.yaml
    asserts:
      - hasDocuments:
          count: 4

  - it: should not render PostgreSQL for an external database
    template: postgresql.yaml
    set:
      database.postgres.bundled.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the administrator Secret
    template: postgresql.yaml
    documentIndex: 2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-admin
                key: POSTGRES_USER
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-admin
                key: POSTGRES_PASSWORD

  - it: should use a custom administrator Secret
    template: postgresql.yaml
    documentIndex: 2
    set:
      database.postgres.bundled.adminSecretRef:
        name: custom-admin
        usernameKey: username
        passwordKey: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: custom-admin
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: custom-admin
                key: password

  - it: should configure the bundled database
    template: postgresql.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DB
            value: kagent
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/library/postgres:18.6-alpine3.23
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe

  - it: should use the configured storage
    template: postgresql.yaml
    documentIndex: 1
    set:
      database.postgres.bundled:
        storage: 10Gi
        storageClassName: database
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
      - equal:
          path: spec.storageClassName
          value: database

  - it: should create the default administrator Secret
    template: postgresql-secret.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: postgres-admin
      - equal:
          path: stringData.POSTGRES_USER
          value: postgres
      - equal:
          path: stringData.POSTGRES_PASSWORD
          value: postgres

  - it: should keep the administrator Secret when bundled bootstrap is disabled
    template: postgresql-secret.yaml
    set:
      database.postgres.bundled.bootstrap: false
      database.postgres.secretRef.name: existing-kagent
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: postgres-admin

  - it: should create the default Kagent Secret
    template: postgresql-secret.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: kagent-postgres
      - equal:
          path: stringData.connectionString
          value: postgresql://kagent_user:kagent@RELEASE-NAME-postgresql.NAMESPACE.svc:5432/kagent?sslmode=disable

  - it: should create the Substrate read/write Secret
    template: postgresql-secret.yaml
    documentIndex: 2
    set:
      substrate.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: substrate-postgres-readwrite
      - equal:
          path: stringData.readWriteConnectionString
          value: postgresql://substrate_readwrite_user:substrate-readwrite@RELEASE-NAME-postgresql.NAMESPACE.svc:5432/kagent?sslmode=disable

  - it: should create the Substrate owner Secret
    template: postgresql-secret.yaml
    documentIndex: 3
    set:
      substrate.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: substrate-postgres-owner
      - equal:
          path: stringData.ownerConnectionString
          value: postgresql://substrate_admin_user:substrate-admin@RELEASE-NAME-postgresql.NAMESPACE.svc:5432/kagent?sslmode=disable

  - it: should pass the bundled database address to Substrate with a custom release name
    template: postgresql-secret.yaml
    documentIndex: 2
    set:
      fullnameOverride: custom-kagent
      substrate.enabled: true
    asserts:
      - equal:
          path: stringData.readWriteConnectionString
          value: postgresql://substrate_readwrite_user:substrate-readwrite@custom-kagent-postgresql.NAMESPACE.svc:5432/kagent?sslmode=disable

  - it: should reject a different Substrate database for shared bundled PostgreSQL
    template: postgresql-secret.yaml
    set:
      substrate.enabled: true
      substrate.postgres.database: shared-db
    asserts:
      - failedTemplate:
          errorMessage: substrate.postgres.database must be kagent when sharing Kagent's bundled PostgreSQL

  - it: should reject mismatched administrator Secret references for shared bundled PostgreSQL
    template: postgresql-secret.yaml
    set:
      substrate.enabled: true
      database.postgres.bundled.adminSecretRef.name: custom-admin
    asserts:
      - failedTemplate:
          errorMessage: substrate.postgres.adminSecretRef must match database.postgres.bundled.adminSecretRef when sharing bundled PostgreSQL

  - it: should accept matching custom administrator Secret references
    template: postgresql-secret.yaml
    documentIndex: 1
    set:
      substrate.enabled: true
      database.postgres.bundled.adminSecretRef.name: custom-admin
      substrate.postgres.adminSecretRef.name: custom-admin
    asserts:
      - equal:
          path: metadata.name
          value: substrate-postgres-readwrite

  - it: should reject operator-managed Substrate Secrets during bootstrap
    template: postgresql-secret.yaml
    set:
      substrate.enabled: true
      substrate.postgres.ownerConnectionStringSecretRef.name: custom-owner
    asserts:
      - failedTemplate:
          errorMessage: substrate.postgres.bootstrap requires the chart-managed Substrate application Secret names; disable bootstrap for operator-managed Secrets

  - it: should not create Secrets for an external managed database
    template: postgresql-secret.yaml
    set:
      database.postgres:
        bundled:
          enabled: false
        secretRef:
          name: kagent-database
    asserts:
      - hasDocuments:
          count: 0

  - it: should keep operator Secrets unmanaged
    template: postgresql-secret.yaml
    set:
      database.postgres.bundled.bootstrap: false
      database.postgres.bundled.adminSecretRef.name: custom-admin
      database.postgres.secretRef.name: custom-kagent
    asserts:
      - hasDocuments:
          count: 0

  - it: should apply the database pod labels
    template: postgresql.yaml
    documentIndex: 2
    set:
      podLabels:
        team: platform
      database.postgres.bundled.podLabels:
        tier: data
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: platform
      - equal:
          path: spec.template.metadata.labels.tier
          value: data

  - it: should apply image, resources, security, and scheduling settings
    template: postgresql.yaml
    documentIndex: 2
    set:
      global.imagePullSecrets:
        - name: registry
      database.postgres.bundled:
        image:
          registry: registry.example.com
          repository: platform
          name: postgres
          tag: "18"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
        securityContext:
          allowPrivilegeEscalation: false
        nodeSelector:
          role: database
        tolerations:
          - key: dedicated
            operator: Equal
            value: database
            effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/zone
                      operator: Exists
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/platform/postgres:18
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry
      - equal:
          path: spec.template.spec.nodeSelector.role
          value: database
      - equal:
          path: spec.template.spec.tolerations[0].effect
          value: NoSchedule
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: topology.kubernetes.io/zone

  - it: should keep the default storage configuration
    template: postgresql.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 500Mi
      - notExists:
          path: spec.storageClassName

  - it: should omit an empty image repository
    template: postgresql.yaml
    documentIndex: 2
    set:
      database.postgres.bundled.image:
        registry: docker.io
        repository: ""
        name: postgres
        tag: "18"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/postgres:18

  - it: should keep database paths and default resources
    template: postgresql.yaml
    documentIndex: 2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGDATA
            value: /var/lib/postgresql/data/pgdata
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: should keep database security defaults
    template: postgresql.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: should configure the database Service
    template: postgresql.yaml
    documentIndex: 3
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 5432
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: database

  - it: should use the database ServiceAccount
    template: postgresql.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-postgresql

  - it: should omit optional pod fields by default
    template: postgresql.yaml
    documentIndex: 2
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.affinity
