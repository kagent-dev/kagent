suite: test controller, UI, and bundled Postgres pod labels
templates:
  - controller-deployment.yaml
  - controller-configmap.yaml
  - postgresql.yaml
  - postgresql-secret.yaml
  - ui-deployment.yaml
  - ui-nginx-configmap.yaml
tests:
  - it: should not add extra pod labels by default (controller)
    template: controller-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.labels.team

  - it: should merge global podLabels into the controller pod template
    template: controller-deployment.yaml
    set:
      podLabels:
        team: platform
        cost-center: ai
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: platform
      - equal:
          path: spec.template.metadata.labels["cost-center"]
          value: ai
      # selector labels must remain intact
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: kagent

  - it: should let controller.podLabels override the global podLabels
    template: controller-deployment.yaml
    set:
      podLabels:
        team: platform
      controller:
        podLabels:
          team: controller-team
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: controller-team

  - it: should merge global podLabels into the UI pod template
    template: ui-deployment.yaml
    set:
      podLabels:
        team: platform
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: platform

  - it: should let ui.podLabels override the global podLabels
    template: ui-deployment.yaml
    set:
      podLabels:
        team: platform
      ui:
        podLabels:
          team: ui-team
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: ui-team

  - it: should not allow podLabels to override controller selector labels
    template: controller-deployment.yaml
    set:
      podLabels:
        app.kubernetes.io/name: hijacked
      controller:
        podLabels:
          app.kubernetes.io/instance: hijacked
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: kagent
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should not allow podLabels to override UI selector labels
    template: ui-deployment.yaml
    set:
      ui:
        podLabels:
          app.kubernetes.io/name: hijacked
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: kagent

  - it: should not add extra pod labels by default (bundled postgres)
    template: postgresql.yaml
    asserts:
      - documentIndex: 2
        notExists:
          path: spec.template.metadata.labels.team

  - it: should merge global podLabels into the bundled postgres pod template
    template: postgresql.yaml
    set:
      podLabels:
        team: platform
        cost-center: ai
    asserts:
      - documentIndex: 2
        equal:
          path: spec.template.metadata.labels.team
          value: platform
      - documentIndex: 2
        equal:
          path: spec.template.metadata.labels["cost-center"]
          value: ai
      # selector labels and component label must remain intact
      - documentIndex: 2
        equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: kagent
      - documentIndex: 2
        equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: database

  - it: should let database.postgres.bundled.podLabels override the global podLabels
    template: postgresql.yaml
    set:
      podLabels:
        team: platform
      database:
        postgres:
          bundled:
            podLabels:
              team: postgres-team
    asserts:
      - documentIndex: 2
        equal:
          path: spec.template.metadata.labels.team
          value: postgres-team

  - it: should not allow podLabels to override bundled postgres selector or component labels
    template: postgresql.yaml
    set:
      podLabels:
        app.kubernetes.io/name: hijacked
      database:
        postgres:
          bundled:
            podLabels:
              app.kubernetes.io/component: hijacked
    asserts:
      - documentIndex: 2
        equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: kagent
      - documentIndex: 2
        equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: database
