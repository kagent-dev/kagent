suite: test the k8s Agent
templates:
  - k8s-agent.yaml
release:
  namespace: kagent
set:
  substrateWorkerPool.create: true
  substrateWorkerPool.workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1
tests:
  - it: runs on the default Harness with the default ModelConfig
    asserts:
      - isKind:
          of: Agent
      - equal:
          path: metadata.name
          value: k8s-agent
      - equal:
          path: metadata.namespace
          value: kagent
      - equal:
          path: spec.harnessRef.name
          value: kagent
      - equal:
          path: spec.template.inline.modelConfig.name
          value: default-model-config

  - it: binds only the kagent-tools Kubernetes tools, and cluster changes need approval
    asserts:
      - lengthEqual:
          path: spec.template.inline.tools
          count: 2
      - equal:
          path: spec.template.inline.tools[0].mcp.server
          value:
            kind: RemoteMCPServer
            name: RELEASE-NAME-tool-server
      - notExists:
          path: spec.template.inline.tools[0].mcp.requireApproval
      - equal:
          path: spec.template.inline.tools[0].mcp.tools
          value:
            - k8s_describe_resource
            - k8s_generate_resource
            - k8s_get_available_api_resources
            - k8s_get_cluster_configuration
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_get_resource_yaml
            - k8s_get_resources
            - k8s_wait
      - equal:
          path: spec.template.inline.tools[1].mcp.requireApproval
          value: true
      - equal:
          path: spec.template.inline.tools[1].mcp.tools
          value:
            - k8s_annotate_resource
            - k8s_apply_manifest
            - k8s_check_service_connectivity
            - k8s_create_resource
            - k8s_create_resource_from_url
            - k8s_delete_resource
            - k8s_execute_command
            - k8s_label_resource
            - k8s_patch_resource
            - k8s_patch_status
            - k8s_remove_annotation
            - k8s_remove_label
            - k8s_rollout
            - k8s_scale

  - it: attaches k8s-troubleshooting from the packaged kagent-tools image
    asserts:
      - lengthEqual:
          path: spec.template.inline.skills
          count: 1
      - equal:
          path: spec.template.inline.skills[0].name
          value: k8s-troubleshooting
      - matchRegex:
          path: spec.template.inline.skills[0].source.oci
          pattern: ^ghcr\.io/kagent-dev/kagent/tools@sha256:[0-9a-f]{64}$
      - equal:
          path: spec.template.inline.skills[0].source.path
          value: opt/kagent-tools-skills/skills/k8s-troubleshooting

  - it: mirrors the packaged image through global.imageRegistry
    set:
      global.imageRegistry: mirror.example
    asserts:
      - matchRegex:
          path: spec.template.inline.skills[0].source.oci
          pattern: ^mirror\.example/kagent-dev/kagent/tools@sha256:[0-9a-f]{64}$

  - it: attaches the skill from a configured catalog
    set:
      builtins.skills.image: registry.example/team/skills@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      builtins.skills.list:
        - name: helm-release-management
          description: Inspect, upgrade and uninstall Helm releases.
          path: skills/helm-release-management
        - name: k8s-troubleshooting
          description: Diagnose unhealthy workloads.
          path: catalog/k8s-troubleshooting
    asserts:
      - equal:
          path: spec.template.inline.skills
          value:
            - name: k8s-troubleshooting
              source:
                oci: registry.example/team/skills@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                path: catalog/k8s-troubleshooting

  - it: rejects a skills image without a digest
    set:
      builtins.skills.image: registry.example/team/skills:v1
    asserts:
      - failedTemplate:
          errorMessage: 'builtins.skills.image must be pinned by sha256 digest: "registry.example/team/skills:v1"'

  - it: uses the configured Agent and Harness names
    set:
      builtins.k8sAgent.name: ops
      builtins.harness.name: team
    asserts:
      - equal:
          path: metadata.name
          value: ops
      - equal:
          path: spec.harnessRef.name
          value: team

  - it: is skipped when turned off
    set:
      builtins.k8sAgent.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is skipped when all built-ins are turned off
    set:
      builtins.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is skipped when the built-ins values are missing
    set:
      builtins: null
    asserts:
      - hasDocuments:
          count: 0

  - it: is skipped without the default Harness
    set:
      builtins.harness.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is skipped without kagent-tools
    set:
      kagent-tools.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is skipped without the chart's worker pool
    set:
      substrateWorkerPool.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is skipped when built-in skills are turned off
    set:
      builtins.skills.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is skipped when the catalog lacks k8s-troubleshooting
    set:
      builtins.skills.image: registry.example/team/skills@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      builtins.skills.list:
        - name: helm-release-management
          description: Inspect, upgrade and uninstall Helm releases.
          path: skills/helm-release-management
    asserts:
      - hasDocuments:
          count: 0
