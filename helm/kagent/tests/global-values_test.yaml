suite: test global values
templates:
  - controller-deployment.yaml
  - postgresql-secret.yaml
  - controller-configmap.yaml
  - rbac/getter-role.yaml
  - substrate-workerpool.yaml
tests:
  - it: should override every image registry from global.imageRegistry
    set:
      global.imageRegistry: mirror.example
    template: controller-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^mirror\\.example/kagent-dev/kagent/controller:"
  - it: should rewrite the worker pool image onto global.imageRegistry
    set:
      global.imageRegistry: mirror.example
      controller.substrate.enabled: true
      substrateWorkerPool.create: true
      substrateWorkerPool.workerImage: ghcr.io/kagent-dev/substrate/ateom:v1
    template: substrate-workerpool.yaml
    asserts:
      - equal:
          path: spec.workerImage
          value: mirror.example/kagent-dev/substrate/ateom:v1
  - it: should leave the worker pool image alone when the global is unset
    set:
      controller.substrate.enabled: true
      substrateWorkerPool.create: true
      substrateWorkerPool.workerImage: ghcr.io/kagent-dev/substrate/ateom:v1
    template: substrate-workerpool.yaml
    asserts:
      - equal:
          path: spec.workerImage
          value: ghcr.io/kagent-dev/substrate/ateom:v1
  - it: should keep per-image registry when the global is unset
    template: controller-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/kagent-dev/kagent/controller:"
  - it: should merge global.imagePullSecrets with the local list
    set:
      imagePullSecrets:
        - name: local
      global.imagePullSecrets:
        - name: shared
    template: controller-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: local
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: shared
  - it: should render namespaced RBAC from global.watchNamespaces alone
    release:
      namespace: NAMESPACE
    set:
      global.watchNamespaces:
        - NAMESPACE
        - other
    template: rbac/getter-role.yaml
    asserts:
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          namespace: other
          any: true
  - it: should let rbac.namespaces win over global.watchNamespaces
    release:
      namespace: NAMESPACE
    set:
      rbac.namespaces:
        - NAMESPACE
      global.watchNamespaces:
        - NAMESPACE
        - other
    template: rbac/getter-role.yaml
    asserts:
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          namespace: NAMESPACE
          any: true
      - not: true
        containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          namespace: other
          any: true

  - it: should let an explicit empty rbac.namespaces restore cluster-scoped RBAC under the global
    release:
      namespace: NAMESPACE
    set:
      rbac.namespaces: []
      global.watchNamespaces:
        - NAMESPACE
        - other
    template: rbac/getter-role.yaml
    asserts:
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          any: true

  - it: should auto-append the install namespace when scope comes only from the global
    release:
      namespace: NAMESPACE
    set:
      global.watchNamespaces:
        - other
    template: rbac/getter-role.yaml
    asserts:
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          namespace: NAMESPACE
          any: true
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          namespace: other
          any: true

  - it: should fold controller.watchNamespaces into the RBAC scope under the global
    release:
      namespace: NAMESPACE
    set:
      global.watchNamespaces:
        - NAMESPACE
      controller.watchNamespaces:
        - NAMESPACE
        - extra
    template: rbac/getter-role.yaml
    asserts:
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          namespace: extra
          any: true

  - it: should fail when the watch exceeds an explicit rbac.namespaces
    release:
      namespace: NAMESPACE
    set:
      rbac.namespaces:
        - NAMESPACE
      controller.watchNamespaces:
        - NAMESPACE
        - outside
    template: rbac/getter-role.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'controller\.watchNamespaces includes "outside" but rbac\.namespaces does not'
