suite: test controller deployment
templates:
  - controller-deployment.yaml
  - controller-configmap.yaml
tests:
  - it: should render controller deployment with default values
    template: controller-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-controller
      - equal:
          path: spec.replicas
          value: 1
      - hasDocuments:
          count: 1

  - it: should render the controller deployment with custom replica count
    template: controller-deployment.yaml
    set:
      controller:
        replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should have correct controller container image
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: controller
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/kagent-dev/kagent/controller:.+"

  - it: should use global tag when set
    template: controller-deployment.yaml
    set:
      tag: "v1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/kagent-dev/kagent/controller:v1.0.0

  - it: should have correct controller resources
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 2
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: should have correct service account name
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-controller

  - it: should have correct container port
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8083

  - it: should set global annotations on deployment
    template: controller-deployment.yaml
    set:
      annotations:
        app.kubernetes.io/managed-by: "custom"
    asserts:
      - isSubset:
          path: metadata.annotations
          content:
            app.kubernetes.io/managed-by: "custom"

  - it: should set controller annotations on deployment and override global ones
    template: controller-deployment.yaml
    set:
      annotations:
        global-key: "global-value"
        shared-key: "global-wins"
      controller:
        annotations:
          controller-key: "controller-value"
          shared-key: "controller-wins"
    asserts:
      - isSubset:
          path: metadata.annotations
          content:
            global-key: "global-value"
            controller-key: "controller-value"
            shared-key: "controller-wins"

  - it: should set podAnnotations
    template: controller-deployment.yaml
    set:
      controller:
        podAnnotations:
          role: AI
    asserts:
      - isSubset:
          path: spec.template.metadata.annotations
          content:
            role: AI

  - it: should fallback to top-level podAnnotations
    template: controller-deployment.yaml
    set:
      podAnnotations:
        role: AI
    asserts:
      - isSubset:
          path: spec.template.metadata.annotations
          content:
            role: AI

  - it: should set nodeSelector
    template: controller-deployment.yaml
    set:
      controller:
        nodeSelector:
          role: AI
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            role: AI

  - it: should set tolerations
    template: controller-deployment.yaml
    set:
      controller:
        tolerations:
          - key: role
            operator: Equal
            value: AI
            effect: NoSchedule
    asserts:
      - contains:
          any: true
          path: spec.template.spec.tolerations
          content:
            key: role
            value: AI
            effect: NoSchedule
            operator: Equal

  - it: should set affinity
    template: controller-deployment.yaml
    set:
      controller:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/zone
                      operator: In
                      values:
                        - us-east-1a
                        - us-east-1b
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].operator
          value: In
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values
          value:
            - us-east-1a
            - us-east-1b

  - it: should set topologySpreadConstraints
    template: controller-deployment.yaml
    set:
      controller:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kagent-controller
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kagent-controller

  - it: should not render affinity or topologySpreadConstraints by default
    template: controller-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should render extra volumes and mounts when provided
    template: controller-deployment.yaml
    set:
      controller:
        volumes:
          - name: extra-data
            emptyDir: {}
        volumeMounts:
          - name: extra-data
            mountPath: /extra
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-data
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-data
            mountPath: /extra

  # =============================================================================
  # Database Configuration Tests
  # =============================================================================

  - it: should require a read/write Secret
    template: controller-deployment.yaml
    set:
      database.postgres.readWriteConnectionStringSecretRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: database.postgres.readWriteConnectionStringSecretRef.name is required

  - it: should require an owner Secret when migrations run
    template: controller-deployment.yaml
    set:
      database.postgres.ownerConnectionStringSecretRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: database.postgres.ownerConnectionStringSecretRef.name is required unless config.database.skipMigrations is true

  - it: should not need an owner Secret when migrations are skipped
    template: controller-deployment.yaml
    set:
      config.database.skipMigrations: true
      database.postgres.ownerConnectionStringSecretRef: null
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].secret.name
          value: kagent-postgres-readwrite
      - notExists:
          path: spec.template.spec.volumes[1].projected.sources[1]

  - it: should project both PostgreSQL client certificates when enabled
    template: controller-deployment.yaml
    set:
      database:
        postgres:
          clientCertificate:
            enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: postgres-client-certificate
            projected:
              sources:
                - podCertificate:
                    signerName: postgres.podcert.ate.dev/identity
                    keyType: ECDSAP256
                    credentialBundlePath: kagent_owner_user.pem
                    userAnnotations:
                      postgres.podcert.ate.dev/username: kagent_owner_user
                - podCertificate:
                    signerName: postgres.podcert.ate.dev/identity
                    keyType: ECDSAP256
                    credentialBundlePath: kagent_readwrite_user.pem
                    userAnnotations:
                      postgres.podcert.ate.dev/username: kagent_readwrite_user
                - clusterTrustBundle:
                    signerName: servicedns.podcert.ate.dev/identity
                    labelSelector:
                      matchLabels:
                        podcert.ate.dev/canarying: live
                    path: trust-bundle.pem
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: postgres-client-certificate
            mountPath: /run/postgres.podcert.ate.dev
            readOnly: true

  - it: should project only the read/write client certificate when migrations are skipped
    template: controller-deployment.yaml
    set:
      config.database.skipMigrations: true
      database.postgres.clientCertificate.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: postgres-client-certificate
            projected:
              sources:
                - podCertificate:
                    signerName: postgres.podcert.ate.dev/identity
                    keyType: ECDSAP256
                    credentialBundlePath: kagent_readwrite_user.pem
                    userAnnotations:
                      postgres.podcert.ate.dev/username: kagent_readwrite_user
                - clusterTrustBundle:
                    signerName: servicedns.podcert.ate.dev/identity
                    labelSelector:
                      matchLabels:
                        podcert.ate.dev/canarying: live
                    path: trust-bundle.pem

  - it: should use default httpGet startup probe
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
          value: 15

  - it: should use default httpGet readiness probe
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 30

  - it: should allow overriding startup probe
    template: controller-deployment.yaml
    set:
      controller:
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 20
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.timeoutSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 20

  - it: should allow overriding readiness probe
    template: controller-deployment.yaml
    set:
      controller:
        readinessProbe:
          exec:
            command: ["wget", "-q", "-O-", "http://localhost:8083/health"]
          periodSeconds: 60
          timeoutSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["wget", "-q", "-O-", "http://localhost:8083/health"]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 60
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet

  - it: should not expose metrics container port by default
    template: controller-deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
          any: true

  - it: should expose metrics container port when enabled
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 8443
            protocol: TCP

  - it: should derive metrics container port from a host-qualified bindAddress
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
      config.metrics.bindAddress: "127.0.0.1:9443"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9443
            protocol: TCP

  - it: should derive metrics container port from a bracketed IPv6 bindAddress
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
      config.metrics.bindAddress: "[::1]:9443"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9443
            protocol: TCP
