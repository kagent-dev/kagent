suite: test controller deployment
templates:
  - controller-deployment.yaml
  - controller-configmap.yaml
  - postgresql-secret.yaml
tests:
  - it: should render controller deployment with default values
    template: controller-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-controller
      - equal:
          path: spec.replicas
          value: 1
      - hasDocuments:
          count: 1

  - it: should render the controller deployment with custom replica count
    template: controller-deployment.yaml
    set:
      controller:
        replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should have correct controller container image
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: controller
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/kagent-dev/kagent/controller:.+"

  - it: should use global tag when set
    template: controller-deployment.yaml
    set:
      tag: "v1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/kagent-dev/kagent/controller:v1.0.0

  - it: should have correct controller resources
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 2
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: should have correct service account name
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-controller

  - it: should have correct container port
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8083
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: grpc
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 8084

  - it: should configure the gRPC server
    template: controller-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRPC_BIND_ADDRESS
            value: ":8084"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRPC_MAX_MESSAGE_BYTES
            value: "16777216"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRPC_REFLECTION
            value: "false"

  - it: should set global annotations on deployment
    template: controller-deployment.yaml
    set:
      annotations:
        app.kubernetes.io/managed-by: "custom"
    asserts:
      - isSubset:
          path: metadata.annotations
          content:
            app.kubernetes.io/managed-by: "custom"

  - it: should set controller annotations on deployment and override global ones
    template: controller-deployment.yaml
    set:
      annotations:
        global-key: "global-value"
        shared-key: "global-wins"
      controller:
        annotations:
          controller-key: "controller-value"
          shared-key: "controller-wins"
    asserts:
      - isSubset:
          path: metadata.annotations
          content:
            global-key: "global-value"
            controller-key: "controller-value"
            shared-key: "controller-wins"

  - it: should configure substrate ate-api mTLS when substrate is enabled
    template: controller-deployment.yaml
    set:
      controller:
        substrate:
          enabled: true
          ateApiEndpoint: "dns:///api.ate-system.svc:443"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SUBSTRATE_ATE_API_ENDPOINT
            value: "dns:///api.ate-system.svc:443"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SUBSTRATE_ATE_API_CA_FILE
            value: /run/substrate-servicedns/trust-bundle.pem
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SUBSTRATE_ATE_API_CLIENT_CERT_FILE
            value: /run/substrate-podidentity/credential-bundle.pem
      - equal:
          path: spec.template.spec.volumes[0].name
          value: substrate-servicedns
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[0].clusterTrustBundle.signerName
          value: servicedns.podcert.ate.dev/identity
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].podCertificate.signerName
          value: podidentity.podcert.ate.dev/identity
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].podCertificate.credentialBundlePath
          value: credential-bundle.pem
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: substrate-servicedns
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /run/substrate-servicedns
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /run/substrate-podidentity

  - it: should set A2A_GATEWAY_URL with computed default value
    template: controller-configmap.yaml
    asserts:
      - equal:
          path: data.A2A_GATEWAY_URL
          value: "http://RELEASE-NAME-controller.NAMESPACE.svc:8084"

  - it: should set A2A_GATEWAY_URL with custom value when explicitly set
    template: controller-configmap.yaml
    set:
      controller:
        a2aGatewayUrl: "https://agents.example.com"
    asserts:
      - equal:
          path: data.A2A_GATEWAY_URL
          value: "https://agents.example.com"

  - it: should set PROXY_URL when set
    template: controller-configmap.yaml
    set:
      proxy:
        url: "http://proxy.kagent.svc.cluster.local:8080"
    asserts:
      - equal:
          path: data.PROXY_URL
          value: "http://proxy.kagent.svc.cluster.local:8080"

  - it: should not set PROXY_URL when not set
    template: controller-configmap.yaml
    asserts:
      - notExists:
          path: data.PROXY_URL

  - it: should default MCP_EGRESS_PLAINTEXT to false
    template: controller-configmap.yaml
    asserts:
      - equal:
          path: data.MCP_EGRESS_PLAINTEXT
          value: "false"

  - it: should set MCP_EGRESS_PLAINTEXT to true when enabled
    template: controller-configmap.yaml
    set:
      controller:
        mcpEgressPlaintext: true
    asserts:
      - equal:
          path: data.MCP_EGRESS_PLAINTEXT
          value: "true"

  - it: should use custom loglevel when set
    template: controller-configmap.yaml
    set:
      controller:
        loglevel: "debug"
    asserts:
      - equal:
          path: data.ZAP_LOG_LEVEL
          value: "debug"
  - it: should configure watch namespaces
    template: controller-configmap.yaml
    set:
      controller:
        watchNamespaces:
          - namespace-1
          - namespace-2
    asserts:
      - equal:
          path: data.WATCH_NAMESPACES
          value: "namespace-1,namespace-2"

  - it: should derive watch namespaces from rbac.namespaces when controller.watchNamespaces is unset
    template: controller-configmap.yaml
    set:
      rbac:
        namespaces:
          - NAMESPACE
          - ns2
    asserts:
      - equal:
          path: data.WATCH_NAMESPACES
          value: "NAMESPACE,ns2"

  - it: controller.watchNamespaces should override rbac.namespaces for WATCH_NAMESPACES
    template: controller-configmap.yaml
    set:
      controller:
        watchNamespaces:
          - explicit-ns
      rbac:
        namespaces:
          - NAMESPACE
    asserts:
      - equal:
          path: data.WATCH_NAMESPACES
          value: "explicit-ns"

  - it: should set podAnnotations
    template: controller-deployment.yaml
    set:
      controller:
        podAnnotations:
          role: AI
    asserts:
      - isSubset:
          path: spec.template.metadata.annotations
          content:
            role: AI

  - it: should fallback to top-level podAnnotations
    template: controller-deployment.yaml
    set:
      podAnnotations:
        role: AI
    asserts:
      - isSubset:
          path: spec.template.metadata.annotations
          content:
            role: AI

  - it: should set nodeSelector
    template: controller-deployment.yaml
    set:
      controller:
        nodeSelector:
          role: AI
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            role: AI

  - it: should set tolerations
    template: controller-deployment.yaml
    set:
      controller:
        tolerations:
          - key: role
            operator: Equal
            value: AI
            effect: NoSchedule
    asserts:
      - contains:
          any: true
          path: spec.template.spec.tolerations
          content:
            key: role
            value: AI
            effect: NoSchedule
            operator: Equal

  - it: should set affinity
    template: controller-deployment.yaml
    set:
      controller:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/zone
                      operator: In
                      values:
                        - us-east-1a
                        - us-east-1b
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].operator
          value: In
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values
          value:
            - us-east-1a
            - us-east-1b

  - it: should set topologySpreadConstraints
    template: controller-deployment.yaml
    set:
      controller:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kagent-controller
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kagent-controller

  - it: should not render affinity or topologySpreadConstraints by default
    template: controller-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should render extra volumes and mounts when provided
    template: controller-deployment.yaml
    set:
      controller:
        volumes:
          - name: extra-data
            emptyDir: {}
        volumeMounts:
          - name: extra-data
            mountPath: /extra
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-data
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-data
            mountPath: /extra

  - it: should not render volumes or volumeMounts sections when none are configured
    template: controller-deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.volumes
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts

  # =============================================================================
  # Database Configuration Tests
  # =============================================================================

  - it: should set POSTGRES_PASSWORD from secret and POSTGRES_DATABASE_URL with bundled connection string by default
    template: controller-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-postgresql
                key: POSTGRES_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DATABASE_URL
            value: "postgres://kagent:$(POSTGRES_PASSWORD)@RELEASE-NAME-postgresql.NAMESPACE.svc:5432/kagent?sslmode=disable"

  - it: should set POSTGRES_DATABASE_URL with external url when url is set
    template: controller-deployment.yaml
    set:
      database:
        postgres:
          url: "postgres://user:pass@external-host:5432/db"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DATABASE_URL
            value: "postgres://user:pass@external-host:5432/db"

  - it: should set POSTGRES_DATABASE_URL_FILE and omit POSTGRES_PASSWORD when urlFile is set
    template: controller-deployment.yaml
    set:
      database:
        postgres:
          urlFile: "/var/secrets/db-url"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DATABASE_URL_FILE
            value: "/var/secrets/db-url"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD

  - it: should set DATABASE_VECTOR_ENABLED to false by default
    template: controller-configmap.yaml
    asserts:
      - equal:
          path: data.DATABASE_VECTOR_ENABLED
          value: "false"

  - it: should set DATABASE_VECTOR_ENABLED to true when enabled
    template: controller-configmap.yaml
    set:
      database:
        postgres:
          vectorEnabled: true
    asserts:
      - equal:
          path: data.DATABASE_VECTOR_ENABLED
          value: "true"

  - it: should not set DB pool env vars by default
    template: controller-configmap.yaml
    asserts:
      - notExists:
          path: data.DB_MAX_CONNS
      - notExists:
          path: data.DB_MIN_CONNS
      - notExists:
          path: data.DB_MAX_CONN_IDLE_TIME
      - notExists:
          path: data.DB_MAX_CONN_LIFETIME

  - it: should set DB pool env vars when pool is configured
    template: controller-configmap.yaml
    set:
      database:
        postgres:
          pool:
            maxConns: 4
            minConns: 0
            maxConnIdleTime: 1m
            maxConnLifetime: 10m
    asserts:
      - equal:
          path: data.DB_MAX_CONNS
          value: "4"
      - equal:
          path: data.DB_MIN_CONNS
          value: "0"
      - equal:
          path: data.DB_MAX_CONN_IDLE_TIME
          value: "1m"
      - equal:
          path: data.DB_MAX_CONN_LIFETIME
          value: "10m"

  - it: should not set POSTGRES_DATABASE_URL in configmap
    template: controller-configmap.yaml
    asserts:
      - notExists:
          path: data.POSTGRES_DATABASE_URL

  - it: should not set POSTGRES_PASSWORD when url is set and bundled is enabled
    template: controller-deployment.yaml
    set:
      database:
        postgres:
          url: "postgres://user:pass@external-host:5432/db"
          bundled:
            enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD

  - it: should not set POSTGRES_PASSWORD when url is set and bundled is disabled
    template: controller-deployment.yaml
    set:
      database:
        postgres:
          url: "postgres://user:pass@external-host:5432/db"
          bundled:
            enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD

  - it: should set POSTGRES_DATABASE_URL_FILE and omit POSTGRES_PASSWORD when urlFile and bundled are both enabled
    template: controller-deployment.yaml
    set:
      database:
        postgres:
          urlFile: "/var/secrets/db-url"
          bundled:
            enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DATABASE_URL_FILE
            value: "/var/secrets/db-url"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DATABASE_URL

  - it: should set external POSTGRES_DATABASE_URL and omit POSTGRES_PASSWORD when url and bundled are both enabled
    template: controller-deployment.yaml
    set:
      database:
        postgres:
          url: "postgres://user:pass@external-host:5432/db"
          bundled:
            enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DATABASE_URL
            value: "postgres://user:pass@external-host:5432/db"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD

  - it: should use default httpGet startup probe
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
          value: 15

  - it: should use default httpGet readiness probe
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 30

  - it: should allow overriding startup probe
    template: controller-deployment.yaml
    set:
      controller:
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 20
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.timeoutSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 20

  - it: should allow overriding readiness probe
    template: controller-deployment.yaml
    set:
      controller:
        readinessProbe:
          exec:
            command: ["wget", "-q", "-O-", "http://localhost:8083/health"]
          periodSeconds: 60
          timeoutSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["wget", "-q", "-O-", "http://localhost:8083/health"]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 60
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet

  - it: should not expose metrics container port by default
    template: controller-deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 2
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics

  - it: should not set metrics env vars by default
    template: controller-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_SECURE
          any: true

  - it: should expose metrics container port when enabled
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 8443
            protocol: TCP

  - it: should set metrics env vars when enabled
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
            value: ":8443"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_SECURE
            value: "true"

  - it: should reflect insecure serving in env
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
      controller.metrics.secureServing: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_SECURE
            value: "false"

  - it: should derive metrics container port from bindAddress
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
      controller.metrics.bindAddress: ":9443"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
            value: ":9443"
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9443
            protocol: TCP

  - it: should derive metrics container port from a host-qualified bindAddress
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
      controller.metrics.bindAddress: "127.0.0.1:9443"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9443
            protocol: TCP

  - it: should derive metrics container port from a bracketed IPv6 bindAddress
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
      controller.metrics.bindAddress: "[::1]:9443"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9443
            protocol: TCP

  - it: should not gain metrics wiring when bindAddress disables metrics
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
      controller.metrics.bindAddress: "0"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_SECURE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics

  - it: should let controller.env override the chart-supplied metrics env
    template: controller-deployment.yaml
    set:
      controller.metrics.enabled: true
      controller.env:
        - name: METRICS_BIND_ADDRESS
          value: "0"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
            value: ":8443"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
            value: "0"

  - it: should omit KAGENT_TRACE_CONTEXT_KEYS by default
    template: controller-configmap.yaml
    asserts:
      - notExists:
          path: data.KAGENT_TRACE_CONTEXT_KEYS

  - it: should join otel.tracing.contextKeys into KAGENT_TRACE_CONTEXT_KEYS
    template: controller-configmap.yaml
    set:
      otel.tracing.contextKeys:
        - sub
        - thread_id
        - channel
    asserts:
      - equal:
          path: data.KAGENT_TRACE_CONTEXT_KEYS
          value: "sub,thread_id,channel"

  - it: should encode contextKeys mappings as JSON
    template: controller-configmap.yaml
    set:
      otel.tracing.contextKeys:
        - from: sub
          to: user.id
        - from: thread_id
          to: session.id
        - channel
    asserts:
      - equal:
          path: data.KAGENT_TRACE_CONTEXT_KEYS
          value: '[{"from":"sub","to":"user.id"},{"from":"thread_id","to":"session.id"},"channel"]'

  - it: should omit KAGENT_TRACE_CONTEXT_HASH_KEY by default
    template: controller-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KAGENT_TRACE_CONTEXT_HASH_KEY

