suite: test the built-in Agents and their AgentTemplates
templates:
  - builtin-agents.yaml
release:
  namespace: kagent
set:
  harnesses.enabled: true
tests:
  - it: k8s-agent renders an AgentTemplate and an Agent that references it
    asserts:
      - hasDocuments:
          count: 2
          filterAware: true
        documentSelector:
          path: metadata.name
          value: k8s-agent
          matchMany: true
      - containsDocument:
          apiVersion: api.kagent.dev/v1alpha3
          kind: AgentTemplate
          name: k8s-agent
          namespace: kagent
          any: true
      - equal:
          path: spec.modelConfig.name
          value: default-model-config
        documentSelector:
          path: $[?(@.kind == "AgentTemplate" && @.metadata.name == "k8s-agent")]
      - containsDocument:
          apiVersion: api.kagent.dev/v1alpha3
          kind: Agent
          name: k8s-agent
          namespace: kagent
          any: true
      - equal:
          path: spec.harnessRef.name
          value: kagent-default
        documentSelector:
          path: $[?(@.kind == "Agent" && @.metadata.name == "k8s-agent")]
      - equal:
          path: spec.template
          value:
            ref:
              name: k8s-agent
        documentSelector:
          path: $[?(@.kind == "Agent" && @.metadata.name == "k8s-agent")]

  - it: k8s-agent binds only the kagent-tools Kubernetes tools, and cluster changes need approval
    documentSelector:
      path: $[?(@.kind == "AgentTemplate" && @.metadata.name == "k8s-agent")]
    asserts:
      - lengthEqual:
          path: spec.tools
          count: 2
      - equal:
          path: spec.tools[0].mcp.server
          value:
            kind: RemoteMCPServer
            name: RELEASE-NAME-tool-server
      - notExists:
          path: spec.tools[0].mcp.requireApproval
      - equal:
          path: spec.tools[0].mcp.tools
          value:
            - k8s_describe_resource
            - k8s_generate_resource
            - k8s_get_available_api_resources
            - k8s_get_cluster_configuration
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_get_resource_yaml
            - k8s_get_resources
            - k8s_wait
      - equal:
          path: spec.tools[1].mcp.requireApproval
          value: true
      - equal:
          path: spec.tools[1].mcp.tools
          value:
            - k8s_annotate_resource
            - k8s_apply_manifest
            - k8s_check_service_connectivity
            - k8s_create_resource
            - k8s_create_resource_from_url
            - k8s_delete_resource
            - k8s_execute_command
            - k8s_label_resource
            - k8s_patch_resource
            - k8s_patch_status
            - k8s_remove_annotation
            - k8s_remove_label
            - k8s_rollout
            - k8s_scale

  - it: k8s-agent attaches k8s-troubleshooting from the packaged kagent-tools image
    documentSelector:
      path: $[?(@.kind == "AgentTemplate" && @.metadata.name == "k8s-agent")]
    asserts:
      - lengthEqual:
          path: spec.skills
          count: 1
      - equal:
          path: spec.skills[0].name
          value: k8s-troubleshooting
      - matchRegex:
          path: spec.skills[0].source.oci
          pattern: ^ghcr\.io/kagent-dev/kagent/tools@sha256:[0-9a-f]{64}$
      - equal:
          path: spec.skills[0].source.path
          value: opt/kagent-tools-skills/skills/k8s-troubleshooting

  - it: k8s-agent mirrors the packaged image through global.imageRegistry
    documentSelector:
      path: $[?(@.kind == "AgentTemplate" && @.metadata.name == "k8s-agent")]
    set:
      global.imageRegistry: mirror.example
    asserts:
      - matchRegex:
          path: spec.skills[0].source.oci
          pattern: ^mirror\.example/kagent-dev/kagent/tools@sha256:[0-9a-f]{64}$

  - it: k8s-agent is skipped when turned off, but platform-agent keeps its AgentTemplate
    set:
      builtins.k8sAgent.enabled: false
    asserts:
      - not: true
        containsDocument:
          apiVersion: api.kagent.dev/v1alpha3
          kind: Agent
          name: k8s-agent
          any: true
      - containsDocument:
          apiVersion: api.kagent.dev/v1alpha3
          kind: AgentTemplate
          name: k8s-agent
          any: true
      - containsDocument:
          apiVersion: api.kagent.dev/v1alpha3
          kind: Agent
          name: platform-agent
          any: true

  - it: k8s-agent and its AgentTemplate are skipped when both Agents are turned off
    set:
      builtins.k8sAgent.enabled: false
      builtins.platformAgent.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: k8s-agent is skipped when all built-ins are turned off
    set:
      builtins.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: k8s-agent is skipped when the built-ins values are missing
    set:
      builtins: null
    asserts:
      - hasDocuments:
          count: 0

  - it: k8s-agent is skipped without the default Harnesses
    set:
      harnesses.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: k8s-agent is skipped when the kagent-default Harness is turned off
    set:
      harnesses.kagent.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: k8s-agent is skipped without kagent-tools
    set:
      kagent-tools.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: platform-agent routes to one specialist per skill and reuses k8s-agent for Kubernetes
    documentSelector:
      path: $[?(@.kind == "AgentTemplate" && @.metadata.name == "platform-agent")]
    asserts:
      - notExists:
          path: spec.skills
      - equal:
          path: spec.tools
          value:
            - subAgent:
                name: kubernetes
                description: "Kubernetes specialist: diagnoses and fixes unhealthy pods, deployments and services."
                templateRef:
                  name: k8s-agent
            - subAgent:
                name: helm
                description: "Helm specialist: lists, inspects, upgrades and uninstalls Helm releases and manages chart repositories."
                templateRef:
                  name: platform-helm
            - subAgent:
                name: istio
                description: "Istio specialist: debugs service mesh traffic, mTLS, routing, sidecars, ztunnel and waypoints."
                templateRef:
                  name: platform-istio
            - subAgent:
                name: argo-rollouts
                description: "Argo Rollouts specialist: checks, promotes, pauses and updates canary and blue-green Rollouts."
                templateRef:
                  name: platform-argo-rollouts
            - subAgent:
                name: kubescape
                description: "Security specialist: reviews Kubescape configuration scans, image vulnerabilities and workload behavior."
                templateRef:
                  name: platform-kubescape

  - it: platform-agent runs on kagent-default and references its AgentTemplate
    documentSelector:
      path: $[?(@.kind == "Agent" && @.metadata.name == "platform-agent")]
    asserts:
      - equal:
          path: spec.harnessRef.name
          value: kagent-default
      - equal:
          path: spec.template.ref.name
          value: platform-agent

  - it: a specialist gets its own skill, its read-only tools, and approval on tools that change things
    documentSelector:
      path: $[?(@.kind == "AgentTemplate" && @.metadata.name == "platform-helm")]
    asserts:
      - equal:
          path: spec.skills[0].name
          value: helm-release-management
      - matchRegex:
          path: spec.skills[0].source.oci
          pattern: ^ghcr\.io/kagent-dev/kagent/tools@sha256:[0-9a-f]{64}$
      - equal:
          path: spec.skills[0].source.path
          value: opt/kagent-tools-skills/skills/helm-release-management
      - equal:
          path: spec.tools[0].mcp
          value:
            server:
              kind: RemoteMCPServer
              name: RELEASE-NAME-tool-server
            tools:
              - helm_get_release
              - helm_list_releases
      - equal:
          path: spec.tools[1].mcp
          value:
            server:
              kind: RemoteMCPServer
              name: RELEASE-NAME-tool-server
            requireApproval: true
            tools:
              - helm_repo_add
              - helm_repo_update
              - helm_uninstall
              - helm_upgrade

  - it: a read-only specialist has no approval binding
    documentSelector:
      path: $[?(@.kind == "AgentTemplate" && @.metadata.name == "platform-kubescape")]
    asserts:
      - lengthEqual:
          path: spec.tools
          count: 1
      - notExists:
          path: spec.tools[0].mcp.requireApproval

  - it: platform-agent adds the Prometheus specialist when a Prometheus URL is set
    set:
      kagent-tools.tools.prometheus.url: http://prometheus-server.monitoring:9090
    asserts:
      - equal:
          path: spec.skills[0].name
          value: prometheus-observability
        documentSelector:
          path: $[?(@.kind == "AgentTemplate" && @.metadata.name == "platform-prometheus")]
      - contains:
          path: spec.tools
          content:
            subAgent:
              name: prometheus
              description: "Observability specialist: writes and runs PromQL queries about cluster and application metrics."
              templateRef:
                name: platform-prometheus
        documentSelector:
          path: $[?(@.kind == "AgentTemplate" && @.metadata.name == "platform-agent")]

  - it: platform-agent and its specialists are skipped when turned off
    set:
      builtins.platformAgent.enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - not: true
        containsDocument:
          apiVersion: api.kagent.dev/v1alpha3
          kind: Agent
          name: platform-agent
          any: true
      - not: true
        containsDocument:
          apiVersion: api.kagent.dev/v1alpha3
          kind: AgentTemplate
          name: platform-helm
          any: true

  - it: platform-agent is skipped when all built-ins are turned off
    set:
      builtins.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: platform-agent is skipped without kagent-tools
    set:
      kagent-tools.enabled: false
    asserts:
      - hasDocuments:
          count: 0
