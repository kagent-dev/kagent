suite: test ui service
templates:
  - ui-service.yaml
tests:
  - it: should render ui service with default values
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ui
      - equal:
          path: spec.type
          value: ClusterIP
      - hasDocuments:
          count: 1

  - it: should have correct port configuration
    asserts:
      - equal:
          path: spec.ports[0].name
          value: ui
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: 8080
      - equal:
          path: spec.ports[0].protocol
          value: TCP

  - it: should have correct selector labels
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: kagent
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: ui

  - it: should have correct metadata labels
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: kagent
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - isNotEmpty:
          path: metadata.labels["helm.sh/chart"]

  - it: should be in correct namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: should leave IP-family fields unset by default
    asserts:
      - notExists:
          path: spec.ipFamilyPolicy
      - notExists:
          path: spec.ipFamilies

  - it: should render IPv4-only service settings
    set:
      ui.service.ipFamilyPolicy: SingleStack
      ui.service.ipFamilies: [IPv4]
    asserts:
      - equal:
          path: spec.ipFamilyPolicy
          value: SingleStack
      - equal:
          path: spec.ipFamilies
          value: [IPv4]

  - it: should render IPv6-only service settings
    set:
      ui.service.ipFamilyPolicy: SingleStack
      ui.service.ipFamilies: [IPv6]
    asserts:
      - equal:
          path: spec.ipFamilyPolicy
          value: SingleStack
      - equal:
          path: spec.ipFamilies
          value: [IPv6]

  - it: should render IPv4-primary dual-stack service settings
    set:
      ui.service.ipFamilyPolicy: PreferDualStack
      ui.service.ipFamilies: [IPv4, IPv6]
    asserts:
      - equal:
          path: spec.ipFamilyPolicy
          value: PreferDualStack
      - equal:
          path: spec.ipFamilies
          value: [IPv4, IPv6]

  - it: should render IPv6-primary required dual-stack service settings
    set:
      ui.service.ipFamilyPolicy: RequireDualStack
      ui.service.ipFamilies: [IPv6, IPv4]
    asserts:
      - equal:
          path: spec.ipFamilyPolicy
          value: RequireDualStack
      - equal:
          path: spec.ipFamilies
          value: [IPv6, IPv4]

  - it: should not inherit the other component's IP-family settings
    set:
      controller.service.ipFamilyPolicy: SingleStack
      controller.service.ipFamilies: [IPv6]
    asserts:
      - notExists:
          path: spec.ipFamilyPolicy
      - notExists:
          path: spec.ipFamilies

  - it: should allow the cluster to choose families when only a policy is set
    set:
      ui.service.ipFamilyPolicy: PreferDualStack
    asserts:
      - equal:
          path: spec.ipFamilyPolicy
          value: PreferDualStack
      - notExists:
          path: spec.ipFamilies

  - it: should allow the cluster to choose a policy when only families are set
    set:
      ui.service.ipFamilies: [IPv6]
    asserts:
      - equal:
          path: spec.ipFamilies
          value: [IPv6]
      - notExists:
          path: spec.ipFamilyPolicy
