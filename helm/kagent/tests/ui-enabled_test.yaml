suite: test ui.enabled toggle
templates:
  - ui-configmap.yaml
  - ui-deployment.yaml
  - ui-nginx-configmap.yaml
  - ui-service.yaml
  - ui-serviceaccount.yaml
  - ui-pdb.yaml
  - ui-httproute.yaml
  - openshift-route.yaml
tests:
  - it: renders the UI Deployment by default
    template: ui-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - hasDocuments:
          count: 1

  - it: renders no UI resources when ui.enabled is false
    set:
      ui.enabled: false
      ui.pdb.enabled: true
      ui.replicas: 2
      ui.httpRoute.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  # ui.pdb defaults maxUnavailable to 1, so setting minAvailable=5 is mutually
  # exclusive. Validation must not run when the UI is off.
  - it: does not fail on a stale ui.pdb when ui.enabled is false
    template: ui-pdb.yaml
    set:
      ui.enabled: false
      ui.pdb.enabled: true
      ui.pdb.minAvailable: 5
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render the OpenShift Route when ui.enabled is true but ui.route.enabled is false
    template: openshift-route.yaml
    capabilities:
      apiVersions:
        - route.openshift.io/v1
    set:
      ui.enabled: true
      ui.route.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render the OpenShift Route when ui.enabled is false even if ui.route.enabled is true
    template: openshift-route.yaml
    capabilities:
      apiVersions:
        - route.openshift.io/v1
    set:
      ui.enabled: false
      ui.route.enabled: true
    asserts:
      - hasDocuments:
          count: 0
