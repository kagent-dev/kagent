suite: test toolserver
templates:
  - toolserver-kagent.yaml
tests:
  - it: should render toolserver with default values
    asserts:
      - isKind:
          of: RemoteMCPServer
      - equal:
          path: metadata.name
          value: RELEASE-NAME-tool-server
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: spec.description
          value: "Official KAgent tool server"
      - hasDocuments:
          count: 1

  - it: should have correct SSE configuration
    asserts:
      - equal:
          path: spec.sseReadTimeout
          value: 5m0s
      - equal:
          path: spec.timeout
          value: 30s
      - equal:
          path: spec.url
          value: http://RELEASE-NAME-tools.NAMESPACE.svc.cluster.local:8084/mcp

  - it: should keep the tool URL in the release namespace when the parent namespace is overridden
    set:
      namespaceOverride: "custom-namespace"
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace
      - equal:
          path: spec.url
          value: http://RELEASE-NAME-tools.NAMESPACE.svc.cluster.local:8084/mcp

  - it: should use the kagent-tools.namespaceOverride in the tool URL when overridden
    set:
      kagent-tools.namespaceOverride: "tools-namespace"
    asserts:
      - equal:
          path: spec.url
          value: http://RELEASE-NAME-tools.tools-namespace.svc.cluster.local:8084/mcp

  - it: should support custom port
    set:
      tools.port: 9090
    asserts:
      - equal:
          path: spec.url
          value: http://RELEASE-NAME-tools.NAMESPACE.svc.cluster.local:8084/mcp

  - it: should support custom clusterDomain
    set:
      global.clusterDomain: "custom.domain"
    asserts:
      - equal:
          path: spec.url
          value: http://RELEASE-NAME-tools.NAMESPACE.svc.custom.domain:8084/mcp
