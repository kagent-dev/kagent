suite: test rbac
templates:
  - controller-serviceaccount.yaml
  - ui-serviceaccount.yaml
  - rbac/reconciliation-role.yaml
  - rbac/management-role.yaml
  - rbac/reconciliation-rolebinding.yaml
  - rbac/management-rolebinding.yaml
tests:
  - it: should render controller serviceaccount
    template: controller-serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-controller
      - hasDocuments:
          count: 1

  - it: should render ui serviceaccount
    template: ui-serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ui
      - hasDocuments:
          count: 1

  - it: should render clusterroles by default
    asserts:
      - isKind:
          of: ClusterRole
        template: rbac/reconciliation-role.yaml
      - isKind:
          of: ClusterRole
        template: rbac/management-role.yaml

  - it: reconciliation permissions should own status and finalizer updates
    template: rbac/reconciliation-role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [api.kagent.dev]
            resources: [harnesses/status, agents/status, modelconfigs/status, modelproviderconfigs/status, remotemcpservers/status]
            verbs: [get, patch, update]
      - contains:
          path: rules
          content:
            apiGroups: [api.kagent.dev]
            resources: [sandboxtemplates/status]
            verbs: [update, patch]
      - contains:
          path: rules
          content:
            apiGroups: [api.kagent.dev]
            resources: [harnesses/finalizers, agents/finalizers, sandboxtemplates/finalizers, modelconfigs/finalizers, modelproviderconfigs/finalizers, remotemcpservers/finalizers]
            verbs: [update]
      - contains:
          path: rules
          content:
            apiGroups: [api.kagent.dev]
            resources: [sandboxtemplates]
            verbs: [update]
      - notContains:
          path: rules[*].verbs
          content: create
      - notContains:
          path: rules[*].verbs
          content: delete
      - matchRegex:
          path: rules[?(@.apiGroups[0] == "")].verbs[*]
          pattern: '^(get|list|watch)$'

  - it: management permissions should only grant API writes
    template: rbac/management-role.yaml
    asserts:
      - notMatchRegex:
          path: rules[*].resources[*]
          pattern: '/(status|finalizers)$'
      - matchRegex:
          path: rules[*].verbs[*]
          pattern: '^(create|update|patch|delete)$'

  - it: should always bind both roles to the controller in install and tenant namespaces
    set:
      rbac.namespaces: [NAMESPACE, tenant]
    templates:
      - rbac/reconciliation-rolebinding.yaml
      - rbac/management-rolebinding.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: RELEASE-NAME-controller
              namespace: NAMESPACE

  - it: should not grant workload or RBAC resource permissions cluster-wide
    templates:
      - rbac/reconciliation-role.yaml
      - rbac/management-role.yaml
    asserts:
      - notContains:
          path: rules[*].apiGroups
          content: "*"
      - notContains:
          path: rules[*].apiGroups
          content: apps
      - notContains:
          path: rules[*].apiGroups
          content: batch
      - notContains:
          path: rules[*].apiGroups
          content: gateway.networking.k8s.io
      - notContains:
          path: rules[*].apiGroups
          content: agents.x-k8s.io
      - notContains:
          path: rules[*].apiGroups
          content: rbac.authorization.k8s.io
      - notContains:
          path: rules[*].resources
          content: "*"
      - notMatchRegex:
          path: rules[*].resources[*]
          pattern: '^(pods|nodes|serviceaccounts)(/|$)'

  - it: should not grant workload or RBAC resource permissions in install or tenant namespaces
    set:
      rbac.namespaces: [NAMESPACE, tenant]
    templates:
      - rbac/reconciliation-role.yaml
      - rbac/management-role.yaml
    asserts:
      - hasDocuments:
          count: 2
      - notContains:
          path: rules[*].apiGroups
          content: "*"
      - notContains:
          path: rules[*].apiGroups
          content: apps
      - notContains:
          path: rules[*].apiGroups
          content: batch
      - notContains:
          path: rules[*].apiGroups
          content: gateway.networking.k8s.io
      - notContains:
          path: rules[*].apiGroups
          content: agents.x-k8s.io
      - notContains:
          path: rules[*].apiGroups
          content: rbac.authorization.k8s.io
      - notContains:
          path: rules[*].resources
          content: "*"
      - notMatchRegex:
          path: rules[*].resources[*]
          pattern: '^(pods|nodes|serviceaccounts|namespaces)(/|$)'

  - it: should have correct clusterrole names
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-reconciliation-role
        template: rbac/reconciliation-role.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-management-role
        template: rbac/management-role.yaml

  - it: should render clusterrolebindings by default
    asserts:
      - isKind:
          of: ClusterRoleBinding
        template: rbac/reconciliation-rolebinding.yaml
      - isKind:
          of: ClusterRoleBinding
        template: rbac/management-rolebinding.yaml

  - it: clusterrolebinding should reference correct serviceaccount
    template: rbac/reconciliation-rolebinding.yaml
    asserts:
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-controller
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE

  - it: clusterrolebindings should reference correct clusterroles
    asserts:
      - equal:
          path: roleRef.kind
          value: ClusterRole
        template: rbac/reconciliation-rolebinding.yaml
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-reconciliation-role
        template: rbac/reconciliation-rolebinding.yaml
      - equal:
          path: roleRef.kind
          value: ClusterRole
        template: rbac/management-rolebinding.yaml
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-management-role
        template: rbac/management-rolebinding.yaml

  - it: reconciliation role should read core dependencies and namespaces cluster-wide
    template: rbac/reconciliation-role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets, configmaps, services]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [namespaces]
            verbs: [get, list, watch]

  - it: reconciliation roles should read core dependencies in install and tenant namespaces
    set:
      rbac.namespaces: [NAMESPACE, tenant]
    template: rbac/reconciliation-role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets, configmaps, services]
            verbs: [get, list, watch]

  - it: should authorize sandbox template catalog access
    asserts:
      - contains:
          path: rules[0].resources
          content: sandboxtemplates
        template: rbac/reconciliation-role.yaml
      - contains:
          path: rules[0].resources
          content: sandboxtemplates
        template: rbac/management-role.yaml

  - it: management role should only write managed core resources cluster-wide
    template: rbac/management-role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets, configmaps]
            verbs: [create, update, delete]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [services]
            verbs: [delete]
      - notContains:
          path: rules[*].resources
          content: namespaces

  - it: management roles should only write managed core resources in install and tenant namespaces
    set:
      rbac.namespaces: [NAMESPACE, tenant]
    template: rbac/management-role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets, configmaps]
            verbs: [create, update, delete]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [services]
            verbs: [delete]

  - it: should use custom namespace when overridden
    set:
      namespaceOverride: "custom-namespace"
    templates:
      - controller-serviceaccount.yaml
      - ui-serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace

  - it: should grant agent access in the new group
    templates:
      - rbac/reconciliation-role.yaml
      - rbac/management-role.yaml
    asserts:
      - equal:
          path: rules[0].apiGroups
          value: [api.kagent.dev]
      - equal:
          path: rules[0].resources
          value: [harnesses, agents, egresspolicies, sandboxtemplates, agenttemplates, modelconfigs, modelproviderconfigs, remotemcpservers]
        template: rbac/reconciliation-role.yaml
      - equal:
          path: rules[0].verbs
          value: [get, list, watch]
        template: rbac/reconciliation-role.yaml
      - equal:
          path: rules[0].resources
          value: [harnesses, agents, sandboxtemplates, agenttemplates, modelconfigs, modelproviderconfigs, remotemcpservers]
        template: rbac/management-role.yaml

  - it: should grant namespaced agent access in the new group
    set:
      rbac.namespaces: [NAMESPACE]
    templates:
      - rbac/reconciliation-role.yaml
      - rbac/management-role.yaml
    asserts:
      - equal:
          path: rules[0].apiGroups
          value: [api.kagent.dev]
      - equal:
          path: rules[0].resources
          value: [harnesses, agents, egresspolicies, sandboxtemplates, agenttemplates, modelconfigs, modelproviderconfigs, remotemcpservers]
        template: rbac/reconciliation-role.yaml
      - equal:
          path: rules[0].verbs
          value: [get, list, watch]
        template: rbac/reconciliation-role.yaml
      - equal:
          path: rules[0].resources
          value: [harnesses, agents, sandboxtemplates, agenttemplates, modelconfigs, modelproviderconfigs, remotemcpservers]
        template: rbac/management-role.yaml

  - it: should have correct labels on all resources
    templates:
      - controller-serviceaccount.yaml
      - ui-serviceaccount.yaml
      - rbac/reconciliation-role.yaml
      - rbac/management-role.yaml
      - rbac/reconciliation-rolebinding.yaml
      - rbac/management-rolebinding.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: kagent
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should render Roles when rbac.namespaces is set
    set:
      rbac.namespaces:
        - NAMESPACE
    asserts:
      - isKind:
          of: Role
        template: rbac/reconciliation-role.yaml
      - isKind:
          of: Role
        template: rbac/management-role.yaml

  - it: should render RoleBindings when rbac.namespaces is set
    set:
      rbac.namespaces:
        - NAMESPACE
    asserts:
      - isKind:
          of: RoleBinding
        template: rbac/reconciliation-rolebinding.yaml
      - isKind:
          of: RoleBinding
        template: rbac/management-rolebinding.yaml

  - it: should render a single role/binding in the listed namespace only (no release-ns fallback)
    set:
      rbac.namespaces:
        - NAMESPACE
    asserts:
      - hasDocuments:
          count: 1
        template: rbac/reconciliation-role.yaml
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        template: rbac/reconciliation-role.yaml
      - hasDocuments:
          count: 1
        template: rbac/management-rolebinding.yaml
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        template: rbac/management-rolebinding.yaml

  - it: should render multiple roles and bindings when namespaces are specified
    set:
      rbac.namespaces:
        - NAMESPACE
        - ns2
    asserts:
      - hasDocuments:
          count: 2
        template: rbac/reconciliation-role.yaml
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        template: rbac/reconciliation-role.yaml
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: ns2
        template: rbac/reconciliation-role.yaml
        documentIndex: 1
      - hasDocuments:
          count: 2
        template: rbac/reconciliation-rolebinding.yaml
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        template: rbac/reconciliation-rolebinding.yaml
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: ns2
        template: rbac/reconciliation-rolebinding.yaml
        documentIndex: 1

  - it: should fail rendering if the removed rbac.clusterScoped field is set
    set:
      rbac.clusterScoped: false
    template: rbac/reconciliation-rolebinding.yaml
    asserts:
      - failedTemplate:
          errorMessage: "rbac.clusterScoped has been removed. Leave rbac.namespaces empty for cluster-scoped RBAC, or set rbac.namespaces=[<ns>, ...] for namespaced RBAC."

  - it: should fail rendering if rbac.namespaces is set but does not include the install namespace
    set:
      rbac.namespaces:
        - some-other-ns
    template: rbac/reconciliation-rolebinding.yaml
    asserts:
      - failedTemplate:
          errorMessage: "rbac.namespaces is set but does not include the install namespace \"NAMESPACE\""

  - it: should accept a custom install namespace when listed in rbac.namespaces
    set:
      namespaceOverride: my-ns
      rbac.namespaces:
        - my-ns
        - other-ns
    template: rbac/reconciliation-role.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.namespace
          value: my-ns
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: other-ns
        documentIndex: 1
