suite: controller ServiceAccount
templates:
  - controller-serviceaccount.yaml
  - controller-deployment.yaml
  - controller-configmap.yaml
  - postgresql-secret.yaml
  - rbac/getter-rolebinding.yaml
  - rbac/writer-rolebinding.yaml
  - rbac/leader-election-rolebinding.yaml
  - rbac/metrics-auth-clusterrolebinding.yaml
tests:
  - it: creates the controller ServiceAccount by default
    template: controller-serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-controller

  - it: does not create the controller ServiceAccount when create is false
    template: controller-serviceaccount.yaml
    set:
      controller.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the default name on the Deployment when create is false
    template: controller-deployment.yaml
    set:
      controller.serviceAccount.create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-controller

  - it: names the created ServiceAccount from name
    template: controller-serviceaccount.yaml
    set:
      controller.serviceAccount.name: custom-controller
    asserts:
      - equal:
          path: metadata.name
          value: custom-controller

  - it: runs the Deployment as the named ServiceAccount
    template: controller-deployment.yaml
    set:
      controller.serviceAccount.create: false
      controller.serviceAccount.name: custom-controller
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-controller

  - it: binds the getter role to the named ServiceAccount
    template: rbac/getter-rolebinding.yaml
    set:
      controller.serviceAccount.create: false
      controller.serviceAccount.name: custom-controller
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-controller
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE

  - it: binds the writer role to the named ServiceAccount
    template: rbac/writer-rolebinding.yaml
    set:
      controller.serviceAccount.create: false
      controller.serviceAccount.name: custom-controller
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-controller

  - it: binds the leader election role to the named ServiceAccount
    template: rbac/leader-election-rolebinding.yaml
    set:
      controller.serviceAccount.create: false
      controller.serviceAccount.name: custom-controller
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-controller

  - it: binds the metrics auth role to the named ServiceAccount
    template: rbac/metrics-auth-clusterrolebinding.yaml
    set:
      controller.metrics.enabled: true
      controller.metrics.secureServing: true
      controller.serviceAccount.create: false
      controller.serviceAccount.name: custom-controller
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-controller

  - it: renders a numeric name as a string everywhere it is used
    set:
      controller.serviceAccount.name: "12345"
      controller.metrics.enabled: true
      controller.metrics.secureServing: true
    asserts:
      - equal:
          path: metadata.name
          value: "12345"
        template: controller-serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: "12345"
        template: controller-deployment.yaml
      - equal:
          path: subjects[0].name
          value: "12345"
        template: rbac/getter-rolebinding.yaml
      - equal:
          path: subjects[0].name
          value: "12345"
        template: rbac/writer-rolebinding.yaml
      - equal:
          path: subjects[0].name
          value: "12345"
        template: rbac/leader-election-rolebinding.yaml
      - equal:
          path: subjects[0].name
          value: "12345"
        template: rbac/metrics-auth-clusterrolebinding.yaml
