suite: test ui config configmap
templates:
  - ui-nginx-configmap.yaml
tests:
  - it: preserves internal identity header forwarding in insecure mode
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header x-agent-name "";'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header x-user-id "";'

  - it: routes MCP to the controller without buffering
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /mcp \{\s+proxy_pass http://\$kagent_backend;'

  - it: serves public JWKS through the controller
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /\.well-known/jwks\.json \{\s+proxy_pass http://\$kagent_backend;'

  - it: strips internal agent identity headers in trusted proxy mode even if opted in
    set:
      controller.auth.mode: trusted-proxy
      ui.additionalForwardedHeaders: [X-Agent-Name, X-User-Id]
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header x-agent-name "";'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header x-user-id "";'

  - it: should render the unified UI ConfigMap
    template: ui-nginx-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ui-config
      - exists:
          path: data["nginx.conf"]

  - it: should no longer ship a supervisord config
    template: ui-nginx-configmap.yaml
    asserts:
      - notExists:
          path: data["supervisord.conf"]

  - it: should only have IPv4 listen by default
    template: ui-nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "listen 8080;"
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "listen \\[::\\]:8080;"

  - it: should add IPv6 listen when ipv6 is enabled
    template: ui-nginx-configmap.yaml
    set:
      ipv6:
        enabled: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "listen 8080;"
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "listen \\[::\\]:8080;"

  # ---------------------------------------------------------------------------
  # Controller upstream
  #
  # A static upstream block is resolved once at start, and nginx refuses to
  # start while the name does not resolve yet. The controller is reached through
  # a variable instead, resolved per request by the resolver init.sh renders.
  # ---------------------------------------------------------------------------
  - it: should resolve the controller per request, for IPv4 and IPv6 alike
    template: ui-nginx-configmap.yaml
    set:
      ipv6:
        enabled: true
    asserts: &variableUpstream
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'include /tmp/nginx/resolver\.conf;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'set \$kagent_backend "RELEASE-NAME-controller\.NAMESPACE\.svc\.\$kagent_cluster_domain:8083";'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'upstream kagent_backend'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_pass http://kagent_backend'

  - it: should resolve the controller per request without IPv6
    template: ui-nginx-configmap.yaml
    asserts: *variableUpstream

  - it: should follow the controller service port
    template: ui-nginx-configmap.yaml
    set:
      controller:
        service:
          ports:
            port: 9090
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'set \$kagent_backend "RELEASE-NAME-controller\.NAMESPACE\.svc\.\$kagent_cluster_domain:9090";'

  - it: should pass the request URI unchanged to the controller
    template: ui-nginx-configmap.yaml
    asserts:
      # With a variable in proxy_pass, a URI part would replace the whole path.
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/ \{\s+proxy_pass http://\$kagent_backend;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /a2a/ \{\s+proxy_pass http://\$kagent_backend;'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_pass http://\$kagent_backend/'
      # WebSocket upgrades on /api/ stay as they were.
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header Connection \$connection_upgrade;'

  # ---------------------------------------------------------------------------
  # Static SPA serving
  # ---------------------------------------------------------------------------
  - it: should serve the built bundle from disk with a SPA fallback
    template: ui-nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'root /usr/share/nginx/html;'
      # Deep links such as /agents are client-side routes, not files.
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'try_files \$uri \$uri/ /index\.html;'

  - it: should drop the node upstream now that no server process runs
    template: ui-nginx-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'upstream kagent_ui'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: '127\.0\.0\.1:8001'

  - it: should keep the health endpoint
    template: ui-nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "location /health"

  # The name matters as much as the caching: the document loads this by that exact
  # path before the app, so a rename here is a blank page rather than a stale setting.
  - it: should serve runtime env-config.js uncached
    template: ui-nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /env-config\.js'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'alias /tmp/kagent/env-config\.js;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'add_header Cache-Control "no-store" always;'

  - it: should refuse the mock service worker outright
    template: ui-nginx-configmap.yaml
    asserts:
      # The SPA fallback would otherwise answer this with index.html and a 200.
      # An exact-match location also beats the fallback if a future build ever
      # ships the worker again.
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /mockServiceWorker\.js'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'return 404;'

  - it: should never cache the bundle entrypoint
    template: ui-nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /index\.html'

  # ---------------------------------------------------------------------------
  # Streaming
  # ---------------------------------------------------------------------------
  - it: should route a2a to the backend, not the removed node server
    template: ui-nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /a2a/ \{\s+proxy_pass http://\$kagent_backend;'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_pass http://kagent_ui'

  - it: should keep streaming settings on a2a so SSE is not buffered
    template: ui-nginx-configmap.yaml
    set:
      ui:
        nginx:
          proxyReadTimeout: 900s
          proxySendTimeout: 800s
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_buffering off;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_read_timeout 900s;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_send_timeout 800s;'

  # ---------------------------------------------------------------------------
  # Identity header hygiene
  #
  # The Next proxy forwarded a strict allowlist. nginx forwards everything by
  # default, so auth-proxy identity headers are cleared unless opted in.
  # ---------------------------------------------------------------------------
  - it: should strip spoofable identity headers by default
    template: ui-nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header x-auth-request-email "";'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header x-forwarded-email "";'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header x-forwarded-user "";'

  - it: should forward an identity header the operator opted into
    template: ui-nginx-configmap.yaml
    set:
      ui:
        additionalForwardedHeaders:
          - X-Forwarded-Email
    asserts:
      # Opted in, so no longer cleared...
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header x-forwarded-email "";'
      # ...while the rest of the set stays stripped.
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header x-forwarded-user "";'

  - it: should strip ui.basePath so an unstripped proxy still works
    template: ui-nginx-configmap.yaml
    set:
      ui:
        basePath: /my.ui/
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'rewrite \^/my\\\.ui\(/\.\*\)\$ \$1 last;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'rewrite \^/my\\\.ui\$ / last;'

  - it: should not rewrite paths without ui.basePath
    template: ui-nginx-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'rewrite '

  - it: should not rewrite paths when ui.basePath is the root
    template: ui-nginx-configmap.yaml
    set:
      ui:
        basePath: /
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'rewrite '

  - it: should set client_max_body_size by default
    template: ui-nginx-configmap.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "client_max_body_size 20m;"

  - it: should allow overriding client_max_body_size
    template: ui-nginx-configmap.yaml
    set:
      ui:
        nginx:
          clientMaxBodySize: 200m
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "client_max_body_size 200m;"

  - it: restores the gRPC-Web content type of a call an Envoy grpc_web filter turned into gRPC
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'map \$http_content_type \$kagent_api_content_type \{\s+default\s+\$http_content_type;\s+"~\*\^application/grpc\(\\\+proto\)\?\(;\.\*\)\?\$"\s+application/grpc-web\+proto;\s+"~\*\^application/grpc\\\+json\(;\.\*\)\?\$"\s+application/grpc-web\+json;\s+\}'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/ \{[^}]*proxy_set_header Content-Type \$kagent_api_content_type;'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location /a2a/ \{[^}]*proxy_set_header Content-Type'
