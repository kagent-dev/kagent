# Default values for kagent

# ==============================================================================
# GLOBAL CONFIGURATION
# ==============================================================================

# -- Enable IPv6/dual-stack support.
# When true, configures all components for dual-stack (IPv4+IPv6) networking:
#   - nginx listens on both IPv4 and IPv6 (adds `listen [::]:8080`)
#   - Next.js binds to `::` instead of `0.0.0.0`
#   - Agent pods bind to `::` for dual-stack reachability
# Leave disabled on clusters where IPv6 is disabled at the kernel level.
# @default -- false
ipv6:
  enabled: false

# Values under `global` are visible to this chart and to every subchart. A parent
# chart or an operator sets one value here instead of one value per chart.
global:
  # -- Kubernetes DNS domain used in runtime-facing service URLs.
  clusterDomain: cluster.local
  # -- Registry that overrides every per-image registry when set. This is the
  # air-gap mirror knob: one value redirects all images. Repository and tag stay
  # per-image. For per-image control, leave this unset and set the per-image
  # registry keys. Covers this chart's own images: controller, sandbox guest, ui,
  # substrateWorkerPool.workerImage, and built-in Harness images
  # (both packaged defaults and config.harnessImages overrides). The vendored subcharts
  # kagent-tools adopts it when its pinned version bumps.
  imageRegistry: ""
  # -- Pull secrets for every pod. The chart merges this list (union) into each
  # pod's own imagePullSecrets, so a local secret is never removed. Coverage
  # matches imageRegistry above.
  imagePullSecrets: []
  # -- Fallback imagePullPolicy where neither a component nor the top-level
  # imagePullPolicy sets one.
  imagePullPolicy: ""
  # -- Namespace scope for the whole install. A non-empty list replaces
  # ClusterRoles with Roles and scopes the controller's watch. Both derive from
  # this one value, so they cannot disagree. Prefer this value over the
  # per-surface keys. rbac.namespaces overrides it when the key is present. An
  # explicit empty rbac.namespaces restores cluster-scoped RBAC. Mixing in
  # config.kubernetes.watchNamespaces is validated: the watch must stay inside the RBAC
  # scope. A watched namespace without a Role is a permanent Forbidden loop at
  # runtime.
  watchNamespaces: []

tag: ""
registry: "ghcr.io"

imagePullSecrets: []
# -- Pull policy for all containers. Empty falls back to global.imagePullPolicy,
# then IfNotPresent.
imagePullPolicy: ""

nameOverride: ""
fullnameOverride: ""

# -- Override the namespace
# @default -- `.Release.Namespace`
namespaceOverride: ""

# -- Additional annotations to add to all Kubernetes deployment resources
annotations: {}

podAnnotations: {}

# -- Additional labels to add to all pod templates (merged into pod labels of
# the controller and UI Deployments; can be overridden per component).
# Useful for admission policies that require specific labels on pods.
podLabels: {}

# -- Additional labels to add to all Kubernetes resources
labels: {}
  # environment: production
  # team: platform

# -- Security context for all pods
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
# fsGroup: 2000

# -- Security context for all containers
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
# runAsUser: 1000

# ==============================================================================
# CORE KAGENT COMPONENTS
# ==============================================================================

# -- Node taints which will be tolerated for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
tolerations: []

# -- Node labels to match for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
nodeSelector: {}

# ==============================================================================
# DATABASE CONFIGURATION
# ==============================================================================

database:
  postgres:
    # -- Secret holding the owner login's connection string. The owner creates the schema and runs
    # migrations; it is not used when config.database.skipMigrations is true. Secret changes require restarting the controller.
    ownerConnectionStringSecretRef:
      name: kagent-postgres-owner
      key: ownerConnectionString
    # -- Secret holding the read/write login's connection string, used for every runtime query. Required.
    # Secret changes require restarting the controller.
    readWriteConnectionStringSecretRef:
      name: kagent-postgres-readwrite
      key: readWriteConnectionString
    # -- Project the bundled PostgreSQL client certificates for kagent_readwrite_user and, unless
    # config.database.skipMigrations is true, kagent_owner_user.
    # The connection strings must reference the files under /run/postgres.podcert.ate.dev.
    clientCertificate:
      enabled: false
# ==============================================================================
# RBAC CONFIGURATION
# ==============================================================================

rbac:
  # -- Namespaces in which to create Role and RoleBinding resources.
  # Left unset (the default), the scope falls back to global.watchNamespaces.
  # If that is also unset, the chart creates cluster-scoped ClusterRole and
  # ClusterRoleBinding resources, and the controller watches all namespaces.
  # If set, the chart creates a Role and a RoleBinding per listed namespace.
  # The controller watches the same list, unless config.kubernetes.watchNamespaces
  # overrides it.
  # An explicit empty list forces cluster-scoped RBAC, even under a parent that
  # sets global.watchNamespaces. This is why the key ships commented out: a
  # declared default [] would make every install look explicitly cluster-scoped,
  # and the global fallback would be unreachable.
  # namespaces: []
  {}

# ==============================================================================
# APPLICATION CONFIGURATION
# ==============================================================================

# Application settings use the ControllerConfig protobuf schema, with no
# Kubernetes kind/version envelope. Durations use seconds (e.g. 3600s).
# Namespace, listeners, endpoints and secret paths are supplied by the chart.
config:
  # Digest-pinned built-in Harness images, merged over the packaged release
  # catalog. Keys: release, kagent, claude, codex. Empty images disable defaults.
  # global.imageRegistry rewrites both packaged defaults and overrides set here.
  harnessImages: {}
  kubernetes: {}
  server:
    auth:
      mode: insecure
      # Opt in to Kubernetes TokenReview authentication independently of the mode.
      # serviceAccount:
      #   authority: kubernetes
    grpcReflection: false
  database:
    # Role each login assumes after connecting. Set distinct roles for each install sharing a database.
    # The owner applies migrations and is not used when skipMigrations is true.
    owner:
      role: kagent_owner
    readWrite:
      role: kagent_readwrite
    # PostgreSQL schema for Kagent tables and the shared pgvector extension.
    schema: kagent
    vectorSchema: extensions
    vectorEnabled: false
    # Skip applying migrations at controller startup; verify they are already applied.
    # Apply migrations out-of-band before installing or upgrading when true.
    skipMigrations: false
  push:
    allowHttp: false
    allowPrivateNetworks: false
    # Maximum concurrent callback deliveries per controller replica.
    maxConcurrency: 10
    # Timeout for each callback attempt.
    sendTimeout: 5s
    # Recovery scans for missed wake-ups and unbound registration cleanup.
    recoveryInterval: 60s
  sessions:
    idleTtl: 604800s
    shareMaxTtl: 0s
  sandboxes:
    guestImage: ""
    cpu: "1"
    memory: 1Gi
    defaultTtl: 3600s
    maxTtl: 86400s
  substrate:
    apiEndpoint: dns:///api.ate-system.svc:443
    routerUrl: http://atenet-router.ate-system.svc:80
    # Must match Substrate's ateApi.actorJWTIssuer; discovery uses substrate.caFile.
    actorJwtIssuer: https://idp.ate-system.svc
  logging:
    level: info
  metrics:
    bindAddress: ":8443"
    secure: true
  telemetry: {}
  runtimeDefaults:
    # Limits for each agent runtime; Substrate requires both.
    cpu: "1"
    memory: 1Gi
    builtinTools:
      disableFileSearch: false
      bashVenvPath: ""
      disableBash: false
      # Disable built-in questions across ADK agents, including Shared subagents.
      disableAskUser: false
    logging:
      level: info
    telemetry: {}

# ==============================================================================
# CONTROLLER DEPLOYMENT
# ==============================================================================

controller:
  # Standard OTEL overrides and external SDK credentials for this process only.
  env: []
  envFrom: []
  # Mount rotating Substrate PodIdentity/ServiceDNS credentials.
  substrateClientCertificate:
    enabled: false
  push:
    signing:
      # Optional operator-managed Secret with an unencrypted PKCS#8 Ed25519 key
      # in private-key.pem. Empty disables push JWT signing.
      secretName: ""
  # -- ServiceAccount settings for the controller pod
  serviceAccount:
    # -- Create the controller ServiceAccount. Set to false to use one managed outside the chart.
    create: true
    # -- Name of the controller ServiceAccount.
    # @default -- `<fullname>-controller`
    name: ""
    # -- Annotations to add to the controller ServiceAccount.
    # Useful for GCP Workload Identity, AWS IRSA, or Azure Workload Identity.
    # @default -- {} (no extra annotations)
    annotations: {}
  replicas: 1
  # -- Additional annotations to add to the controller Deployment metadata
  annotations: {}

  podAnnotations: {}

  # -- Additional labels for the controller pod template, merged over the
  # global `podLabels` (per-key; component keys win). Selector labels can
  # never be overridden.
  podLabels: {}

  # -- Node taints which will be tolerated for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
  tolerations: []

  # -- Node labels to match for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
  nodeSelector: {}

  # -- [Affinity](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity) rules for the controller pod.
  affinity: {}

  # -- [Topology spread constraints](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#pod-topology-spread-constraints) for the controller pod.
  topologySpreadConstraints: []

  # -- [PodDisruptionBudget](https://kubernetes.io/docs/tasks/run-application/configure-pdb/)
  # for the controller pods. Disabled by default: `controller.replicas` is 1, and a
  # `minAvailable: 1` budget on a single-replica Deployment blocks every voluntary
  # eviction, so node drains and cluster upgrades hang indefinitely. Raise
  # `controller.replicas` before switching to `minAvailable`.
  pdb:
    # -- Set to true to create the PodDisruptionBudget.
    enabled: false
    # -- Minimum number of pods that must remain available. Int or percentage string
    # (e.g. `1` or `"50%"`). Mutually exclusive with `maxUnavailable`.
    # @default -- unset (`maxUnavailable` is used instead)
    minAvailable: null
    # -- Maximum number of pods that may be unavailable. Int or percentage string
    # (e.g. `1` or `"50%"`). Mutually exclusive with `minAvailable`.
    maxUnavailable: 1
    # -- `spec.unhealthyPodEvictionPolicy`, one of `IfHealthyBudget` (the Kubernetes
    # default) or `AlwaysAllow`. `AlwaysAllow` lets unhealthy pods be evicted even when
    # the budget is exhausted, which avoids drains wedging on a crash-looping pod.
    # Requires Kubernetes >= 1.27. Omitted from the manifest when empty.
    # @default -- "" (defer to the Kubernetes default)
    unhealthyPodEvictionPolicy: ""
    # -- Additional labels for the controller PodDisruptionBudget.
    labels: {}
    # -- Annotations for the controller PodDisruptionBudget.
    annotations: {}

  image:
    registry: ""
    repository: kagent-dev/kagent/controller
    tag: "" # Will default to global, then Chart version
    pullPolicy: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2
      memory: 512Mi
  service:
    type: ClusterIP
    ports:
      port: 8083
      targetPort: 8083
    annotations: {}
  # Kubernetes packaging for the controller's Prometheus listener. Its address
  # and TLS mode come from config.metrics.
  metrics:
    enabled: false
    service:
      type: ClusterIP
      port: 8443
    # -- Prometheus Operator `ServiceMonitor` for the metrics `Service`.
    # Requires `controller.metrics.enabled` and the
    # `monitoring.coreos.com/v1` CRDs; the chart only renders it when the
    # target cluster serves that API, so enabling it on a cluster without
    # the Prometheus Operator is a no-op rather than a failed install
    # (`helm template` needs `--api-versions monitoring.coreos.com/v1`).
    # The endpoint follows
    # `secureServing`: port name, scheme, bearer token and TLS settings are
    # all derived from it, so flipping `secureServing` alone keeps the
    # scrape working. With `secureServing` enabled the scrape is also
    # authorized only once `<fullname>-metrics-reader` is bound to the
    # Prometheus ServiceAccount; set `prometheusServiceAccount` below and
    # the chart renders that binding for you.
    # @default -- disabled
    serviceMonitor:
      enabled: false
      # -- ServiceAccount Prometheus scrapes with. When `name` is set and
      # `secureServing` is enabled, the chart binds
      # `<fullname>-metrics-reader` to it with a `ClusterRoleBinding` so
      # the scrape does not fail with 403. Leave `name` empty to manage
      # the binding yourself.
      prometheusServiceAccount:
        name: ""
        # -- Namespace of the Prometheus ServiceAccount.
        # @default -- `serviceMonitor.namespace`, then the release namespace
        namespace: ""
      # -- Namespace to create the `ServiceMonitor` in. The scrape target
      # stays the release namespace either way.
      # @default -- the release namespace
      namespace: ""
      # -- Extra labels for the `ServiceMonitor` (merged with the chart
      # labels). Set whatever label your Prometheus
      # `serviceMonitorSelector` matches on.
      labels: {}
      # -- Annotations for the `ServiceMonitor`.
      annotations: {}
      # -- Scrape interval. Prometheus' global default when empty.
      interval: ""
      # -- Scrape timeout. Prometheus' global default when empty.
      scrapeTimeout: ""
      # -- Keep the scraped labels when they collide with server-side ones.
      honorLabels: false
      # -- `relabelings` applied to the scrape targets.
      relabelings: []
      # -- `metricRelabelings` applied to the scraped samples.
      metricRelabelings: []
      # -- Token presented to the authenticated metrics endpoint. Only used
      # when `secureServing` is enabled; set to `""` to omit it.
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      # -- `tlsConfig` for the scrape. Only used when `secureServing` is
      # enabled, where the controller serves a self-signed certificate.
      # @default -- insecureSkipVerify: true
      tlsConfig: {}
  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  # -- Custom startup probe for the controller container.
  # Setting a value replaces the default probe entirely — include a handler
  # (httpGet / exec / tcpSocket / grpc) when overriding.
  # @default -- httpGet /health on port http, periodSeconds=15, initialDelaySeconds=15
  startupProbe: {}

  # -- Custom readiness probe for the controller container.
  # Setting a value replaces the default probe entirely — include a handler
  # (httpGet / exec / tcpSocket / grpc) when overriding.
  # @default -- httpGet /health on port http, periodSeconds=30
  readinessProbe: {}

# -- Optional Agent Substrate WorkerPool installed by this chart. This is platform
# capacity and is not owned by individual agents.
substrateWorkerPool:
  create: false
  name: kagent-default
  replicas: 1
  workerImage: ""
  # sandboxClass selects the sandbox runtime family (gvisor|microvm) for workers
  # and kagent-generated ActorTemplates whose Harness references this pool.
  # Use a matching workerImage (ateworker-gvisor or ateworker-microvm). Substrate must have
  # the corresponding SandboxConfig installed (gvisor-default or microvm);
  # microvm also requires runtime assets and KVM-capable nodes with atelet's device plugin.
  sandboxClass: gvisor
  # Optional override for the SandboxConfig referenced by the selected class.
  # Defaults to "microvm" for sandboxClass=microvm and "gvisor-default" otherwise.
  sandboxConfigRef: ""
  # Extra labels merged onto the WorkerPool metadata. The placement labels
  # kagent.dev/worker-pool-name and kagent.dev/worker-pool-namespace always use this
  # pool's name and namespace, so ActorTemplates generated for other namespaces
  # do not select its workers.
  labels: {}
  # -- ServiceAccount settings for the worker pods
  serviceAccount:
    # -- Create the worker ServiceAccount. Set to false to use one managed outside the chart.
    create: true
    # -- Name of the worker ServiceAccount.
    # @default -- `<substrateWorkerPool.name>`
    name: ""
  # Optional pod scheduling/resources for worker pods (WorkerPool.spec.template).
  # nodeSelector / tolerations / priorityClassName / nodeAffinity / resources.
  template: {}

# ==============================================================================
# UI CONFIGURATION
# ==============================================================================

ui:
  # -- ServiceAccount settings for the UI pod
  serviceAccount:
    # -- Annotations to add to the UI ServiceAccount.
    # Useful for GCP Workload Identity, AWS IRSA, or Azure Workload Identity.
    # @default -- {} (no extra annotations)
    annotations: {}
  # -- Additional annotations to add to the UI Deployment metadata
  annotations: {}

  # -- Public-facing base URL of the UI (e.g. https://kagent.example.com).
  # When set, the controller injects KAGENT_UI_URL into agent pods so that
  # share link tools return full clickable URLs instead of relative paths.
  # @default -- "" (share tools return paths only)
  externalUrl: ""
  replicas: 1
  image:
    registry: ""
    repository: kagent-dev/kagent/ui
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  service:
    type: ClusterIP
    ports:
      port: 8080
      targetPort: 8080
    annotations: {}
  # Authentication redirect configuration
  # Change this if using a different auth proxy (e.g., Pomerium, Authelia)
  auth:
    # Path to redirect users to when they click "Sign in with SSO" on the login page
    # Default: /oauth2/start (oauth2-proxy's authentication start endpoint)
    ssoRedirectPath: "/oauth2/start"
  # -- Client-side chat stream inactivity timeout (seconds). The browser aborts a
  # streaming response if no event is received within this window. Should be >=
  # ui.nginx.proxyReadTimeout so nginx isn't the silent limit. Default 1800 (30m).
  streamTimeoutSeconds: 1800
  # -- Nginx configuration for the UI sidecar (timeout values are passed directly
  # to the corresponding nginx directives, e.g. "1800s").
  nginx:
    # -- proxy_read_timeout: max time between two successive reads from the upstream.
    proxyReadTimeout: 1800s
    # -- proxy_send_timeout: max time between two successive writes to the upstream.
    proxySendTimeout: 1800s
    # -- client_max_body_size: max request body size (0 disables it). Just above the
    # gateway's 16 MiB gRPC cap, which chat attachments hit first.
    clientMaxBodySize: 20m
  # -- Extra environment variables for the UI container, applied after ConfigMap
  # defaults. Entries stay in the Deployment to support valueFrom and $(VAR_NAME)
  # expansion. An installed app extension's settings go here, named
  # `KAGENT_UI_EXTENSION_*`; the container's entrypoint copies
  # those onto `window.environmentVariables` for the browser to read.
  env: []
  # -- Identity headers the UI's nginx proxy will forward to the backend on
  # /api/, /a2a/, and /mcp. Names are case-insensitive. Authorization is always
  # forwarded; the auth-proxy identity headers (x-auth-request-*, x-forwarded-user,
  # x-forwarded-email, x-forwarded-groups, x-forwarded-preferred-username) are
  # stripped from client requests unless listed here, so a caller cannot spoof
  # an identity the backend trusts. Headers outside that set are forwarded by
  # nginx as normal. In trusted-proxy mode, X-Agent-Name and X-User-Id are
  # always stripped, even if listed here.
  additionalForwardedHeaders: []
  # Example:
  #   additionalForwardedHeaders:
  #     - X-Forwarded-User
  #     - X-Forwarded-Email
  # -- Base URL the browser calls the controller API on. Reaches the browser at
  # runtime as the `apiBaseUrl` key of /config.json, which the app fetches on
  # startup — it is deliberately not baked into the bundle, so changing it here
  # takes effect on pod restart rather than requiring an image rebuild.
  # The default is a path on the UI's own hostname, which nginx proxies to the
  # controller; set an absolute URL only if the browser must reach the API
  # somewhere other than the UI origin.
  publicBackendUrl: "/api"
  # -- Prefix a reverse proxy strips before forwarding, e.g. `/ui`; root-relative URLs such as `publicBackendUrl` get it too.
  # With oauth2-proxy, set `OIDC_REDIRECT_URL` under it and restart oauth2-proxy after changing it.
  basePath: ""
  # -- Pod-level security context for the UI pod. Overrides the global podSecurityContext.
  # @default -- (uses global podSecurityContext)
  podSecurityContext: {}
  # fsGroup: 2000
  # -- Container-level security context for the UI container. Overrides the global securityContext.
  # @default -- (uses global securityContext)
  securityContext: {}
  #   readOnlyRootFilesystem: true
  # -- EmptyDir volume sizes for the UI workload (typically used when enabling readOnlyRootFilesystem)
  volumes:
    # -- Size limit for temporary files (/tmp). Holds the nginx temp directories
    # and the generated config.json. Default 50Mi is ample for both.
    tmp: 50Mi
  # capabilities:
  #   drop:
  #   - ALL
  # runAsNonRoot: true
  # runAsUser: 1000

  podAnnotations: {}

  # -- Additional labels for the UI pod template, merged over the
  # global `podLabels` (per-key; component keys win). Selector labels can
  # never be overridden.
  podLabels: {}

  # -- Node taints which will be tolerated for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
  tolerations: []

  # -- Node labels to match for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
  nodeSelector: {}

  # -- [Affinity](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity) rules for the UI pod.
  affinity: {}

  # -- [Topology spread constraints](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#pod-topology-spread-constraints) for the UI pod.
  topologySpreadConstraints: []

  # -- [PodDisruptionBudget](https://kubernetes.io/docs/tasks/run-application/configure-pdb/)
  # for the UI pods. Disabled by default: `ui.replicas` is 1, and a `minAvailable: 1`
  # budget on a single-replica Deployment blocks every voluntary eviction, so node
  # drains and cluster upgrades hang indefinitely. Raise `ui.replicas` before
  # switching to `minAvailable`.
  pdb:
    # -- Set to true to create the PodDisruptionBudget.
    enabled: false
    # -- Minimum number of pods that must remain available. Int or percentage string
    # (e.g. `1` or `"50%"`). Mutually exclusive with `maxUnavailable`.
    # @default -- unset (`maxUnavailable` is used instead)
    minAvailable: null
    # -- Maximum number of pods that may be unavailable. Int or percentage string
    # (e.g. `1` or `"50%"`). Mutually exclusive with `minAvailable`.
    maxUnavailable: 1
    # -- `spec.unhealthyPodEvictionPolicy`, one of `IfHealthyBudget` (the Kubernetes
    # default) or `AlwaysAllow`. `AlwaysAllow` lets unhealthy pods be evicted even when
    # the budget is exhausted, which avoids drains wedging on a crash-looping pod.
    # Requires Kubernetes >= 1.27. Omitted from the manifest when empty.
    # @default -- "" (defer to the Kubernetes default)
    unhealthyPodEvictionPolicy: ""
    # -- Additional labels for the UI PodDisruptionBudget.
    labels: {}
    # -- Annotations for the UI PodDisruptionBudget.
    annotations: {}

  # -- Custom startup probe for the UI container.
  # Override to adjust thresholds or change the health path. The image has no shell or curl, so use httpGet or tcpSocket.
  # @default -- httpGet /health on port http, periodSeconds=1, initialDelaySeconds=1
  startupProbe: {}
  # Example:
  #   startupProbe:
  #     httpGet:
  #       path: /health
  #       port: http
  #     initialDelaySeconds: 10
  #     periodSeconds: 5
  #     failureThreshold: 20
  # -- Custom readiness probe for the UI container.
  # Override to adjust thresholds or change the health path. The image has no shell or curl, so use httpGet or tcpSocket.
  # @default -- httpGet /health on port http, periodSeconds=30
  readinessProbe: {}
  # Example:
  #   readinessProbe:
  #     httpGet:
  #       path: /health
  #       port: http
  #     periodSeconds: 15
  # -- Gates the OpenShift `Route` for the UI. Additionally conditional on the
  # `route.openshift.io/v1` API being present, so it is a no-op off-OpenShift.
  # Set to `false` to front the UI with your own Route/ingress or the bundled
  # oauth2-proxy instead of the chart's edge-terminated Route.
  route:
    enabled: true

  # OpenShift Route only (when route.openshift.io/v1 exists). Long timeouts are required
  # for A2A/SSE streaming through the cluster router; defaults are often ~60s and cause
  # net::ERR_INCOMPLETE_CHUNKED_ENCODING in the browser.
  openshiftRoute:
    annotations:
      haproxy.router.openshift.io/timeout: 120m

  # -- Gateway API `HTTPRoute` for the UI. Requires the Gateway API CRDs
  # (`gateway.networking.k8s.io/v1`) and an existing `Gateway` to attach to via
  # `parentRefs`. Disabled by default; enable to front the UI with a Gateway API
  # implementation (kgateway, Istio, Envoy Gateway, etc.) instead of the
  # OpenShift Route or bundled oauth2-proxy.
  httpRoute:
    enabled: false
    # -- Extra labels to add to the `HTTPRoute` (merged with the chart labels).
    labels: {}
    # -- Annotations to add to the `HTTPRoute`.
    annotations: {}
    # -- Gateways this route attaches to. Required when `enabled` is `true`.
    parentRefs: []
    #   - name: my-gateway
    #     namespace: gateway-system
    #     sectionName: https
    # -- Hostnames matched by the route.
    hostnames: []
    #   - kagent.example.com
    # -- Routing rules. When a rule omits `backendRefs`, it defaults to the UI
    # `Service` on `ui.service.ports.port`. Each rule may also set `matches`,
    # `filters`, and `timeouts`.
    rules: []
    #   - matches:
    #       - path:
    #           type: PathPrefix
    #           value: /
    #     filters:
    #       - type: RequestHeaderModifier
    #         requestHeaderModifier:
    #           set:
    #             - name: X-Forwarded-Proto
    #               value: https
    #     timeouts:
    #       request: "0s"
    #       backendRequest: "0s"

# ==============================================================================
# LLM PROVIDERS CONFIGURATION
# ==============================================================================
# https://kagent.dev/docs/getting-started/configuring-providers

providers:
  default: openAI
  # -- Annotations added to the metadata of the generated default ModelConfig
  # (the one derived from `providers.default`). Omitted from the resource when empty.
  annotations: {}
  openAI:
    provider: OpenAI
    model: "gpt-4.1-mini"
    apiKeySecretRef: kagent-openai
    apiKeySecretKey: OPENAI_API_KEY
    # apiKey: ""
    # Optional TLS settings for the generated ModelConfig.
    # This same block can be used under any provider.
    # tls:
    #   disableVerify: false
  ollama:
    provider: Ollama
    # A local model, pulled with `ollama pull`. Ollama Cloud models are listed in
    # the UI (see the controller's static catalog) and reached with a ":cloud" tag
    # or bare cloud tag such as "deepseek-v4.1-flash".
    model: "llama3.2"
    # apiKeySecretRef/apiKeySecretKey point at the Secret holding OLLAMA_API_KEY.
    # With no explicit host, a cloud model reaches api.ollama.com via gateway
    # credential injection; without a Secret it uses the signed-in local daemon.
    # Remove config.host below for direct cloud routing (the default host pins
    # requests to the local daemon even when a Secret is configured).
    # apiKeySecretRef: "kagent-ollama-cloud"
    # apiKeySecretKey: "OLLAMA_API_KEY"
    config:
      host: host.docker.internal:11434
      options:
        num_ctx: "64000"

  anthropic:
    provider: Anthropic
    model: "claude-haiku-4-5"
    apiKeySecretRef: kagent-anthropic
    apiKeySecretKey: ANTHROPIC_API_KEY
    # apiKey: ""
    # Provider options rendered into spec.anthropic of the generated ModelConfig.
    # promptCaching bills the stable prefix of every agent-loop call (tools,
    # system prompt, previous turns) as a cache read instead of fresh input.
    # config:
    #   promptCaching: true
    #   cacheTTL: "5m" # or "1h" for calls spaced more than 5 minutes apart
  azureOpenAI:
    provider: AzureOpenAI
    model: "gpt-4.1-mini"
    apiKeySecretRef: kagent-azure-openai
    apiKeySecretKey: AZUREOPENAI_API_KEY
    # apiKey: ""
    config:
      apiVersion: "2023-05-15"
      azureAdToken: ""
      azureDeployment: ""
      azureEndpoint: ""
  gemini:
    provider: Gemini
    model: "gemini-3.5-flash-lite"
    apiKeySecretRef: kagent-gemini
    apiKeySecretKey: GOOGLE_API_KEY
    # apiKey: ""
  mistral:
    provider: Mistral
    model: "mistral-large-latest"
    apiKeySecretRef: kagent-mistral
    apiKeySecretKey: MISTRAL_API_KEY
    # apiKey: ""

# ==============================================================================
# BUILT-IN TOOLS
# ==============================================================================

kagent-tools:
  enabled: true
  nameOverride: tools
  replicaCount: 1
  # -- Node taints which will be tolerated for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
  tolerations: []
  # -- Node labels to match for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
  nodeSelector: {}
  # Settings for the RemoteMCPServer this chart creates for the built-in tool server.
  remoteMCPServer:
    # -- Namespaces whose Agents may reference the tool server (spec.allowedNamespaces).
    # Unset by default, which allows only the release namespace. Example:
    # allowedNamespaces:
    #   from: Selector   # All | Same | Selector
    #   selector:
    #     matchLabels:
    #       kagent-tools: allowed
    allowedNamespaces: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  tools:
    loglevel: "debug"
    metrics:
      port: 8085 # Use a different port than the controller service port to avoid duplicate port definitions

# ==============================================================================
# PROXY CONFIGURATION
# ==============================================================================
# Global proxy configuration for the controller
# This proxy applies to all internally-built k8s URLs:
# - Agents as tools (agent -> agent traffic)
# - Services as MCP Tools
# - RemoteMCPServer resources with internal k8s URLs
# Set this once and the controller will apply it to all agents automatically
# Note: RemoteMCPServer resources use user-supplied URLs and do not use this proxy unless the URL is an internal k8s URL.
proxy:
  # Proxy URL for internally-built k8s URLs
  # Example: "http://proxy.kagent.svc.cluster.local:8080"
  url: ""

# ==============================================================================
# OAUTH2-PROXY CONFIGURATION (Optional)
# ==============================================================================
# Enable oauth2-proxy subchart for OIDC authentication
# Set config.server.auth.mode=trusted-proxy to authenticate controller requests; see
# docs/architecture/oidc-proxy-authentication.md.

oauth2-proxy:
  enabled: false

  # Cookie-based sessions (the redis-ha sub-chart is disabled by default;
  # enable `redis-ha.enabled` + `sessionStorage.type: redis` to switch)
  sessionStorage:
    type: cookie

  # Mount custom templates for branded login redirect
  # The ConfigMap is created by templates/oauth2-proxy-templates.yaml
  extraVolumes:
    - name: custom-templates
      configMap:
        name: kagent-oauth2-proxy-templates

  extraVolumeMounts:
    - name: custom-templates
      mountPath: /templates
      readOnly: true

  # Mount custom CA certificate for TLS verification (if needed)
  # Add to extraVolumes:
  #   - name: custom-ca-cert
  #     secret:
  #       secretName: my-ca-cert
  #       items:
  #         - key: ca.crt
  #           path: ca.crt
  # Add to extraVolumeMounts:
  #   - name: custom-ca-cert
  #     mountPath: /etc/ssl/certs/custom-ca.crt
  #     subPath: ca.crt
  #     readOnly: true
  # Add to extraEnv:
  #   - name: SSL_CERT_FILE
  #     value: /etc/ssl/certs/custom-ca.crt

  config:
    # Option 1: Reference existing secret (recommended for production)
    # Secret must contain: client-id, client-secret, cookie-secret
    existingSecret: ""

    # Option 2: Inline values (for dev/testing only, chart creates secret)
    clientID: ""
    clientSecret: ""
    cookieSecret: ""

  # Cluster-specific OIDC settings - override these per deployment
  # These are set as env vars and referenced in args for easy patching
  extraEnv:
    # Forces a rollout whenever the sign_in.html ConfigMap's content changes.
    - name: KAGENT_OAUTH2_PROXY_SIGNIN_TEMPLATE_CHECKSUM
      value: '{{ include "kagent.oauth2ProxySignInHTML" . | sha256sum }}'
    - name: OIDC_ISSUER_URL
      value: ""
    - name: OIDC_REDIRECT_URL
      value: ""
    # IMPORTANT: This must match the UI service name, which is templated as
    # "<release-name>-ui" (or "<fullnameOverride>-ui"). Override this value
    # if your release name is not "kagent" or you set fullnameOverride.
    - name: UPSTREAM_URL
      value: "http://kagent-ui:8080"

  # extraArgs as a map - each key becomes --key=value in container args
  # Uses $(VAR_NAME) syntax to reference env vars set above
  extraArgs:
    provider: oidc
    oidc-issuer-url: "$(OIDC_ISSUER_URL)"
    redirect-url: "$(OIDC_REDIRECT_URL)"
    upstream: "$(UPSTREAM_URL)"
    email-domain: "*"
    pass-authorization-header: true
    set-authorization-header: true
    approval-prompt: "auto"
    scope: "openid profile email groups"
    # Cookie security settings
    cookie-secure: true
    cookie-samesite: "lax"
    # Allow API clients with valid JWT tokens to bypass OIDC flow
    skip-jwt-bearer-tokens: true
    # Skip authentication for kagent's branded login page, health checks, and static assets
    # This allows unauthenticated users to see the landing page and k8s probes to work
    skip-auth-route: "^/(health|login)$"
    # The single-page app serves /login from index.html and loads its bundle from
    # /assets/ with env-config.js ahead of it, so all three have to be reachable
    # unauthenticated or the branded login page renders blank. The Next.js paths
    # this replaces (_next/static, _next/image, login-bg) no longer exist.
    skip-auth-regex: "^/(login|assets/|env-config\\.js|logo-.*\\.png|favicon\\.ico).*$"
    # Use custom templates that redirect to kagent's branded /login page
    custom-templates-dir: "/templates"

  service:
    type: ClusterIP
    portNumber: 4180

# ==============================================================================
# OBSERVABILITY
# ==============================================================================

# ==============================================================================
# EXTRA OBJECTS
# ==============================================================================

# -- Additional arbitrary Kubernetes manifests to deploy alongside the chart.
# Each list entry is rendered through `tpl`, so values may reference the release
# context (e.g. `{{ include "kagent.fullname" . }}`, `{{ .Release.Namespace }}`).
# Both map and multi-line string entries are supported. Use this to manage
# resources such as ExternalSecret, HTTPRoute, or NetworkPolicy within the same
# chart lifecycle without maintaining a separate chart.
#
# To use, replace the empty list below with your manifests, e.g.:
#   extraObjects:
#     - apiVersion: external-secrets.io/v1
#       kind: ExternalSecret
#       metadata:
#         name: '{{ include "kagent.fullname" . }}-openai'
#         namespace: '{{ .Release.Namespace }}'
#       spec:
#         secretStoreRef:
#           name: aws-secretsmanager
#           kind: ClusterSecretStore
#         target:
#           name: kagent-openai
#         data:
#           - secretKey: OPENAI_API_KEY
#             remoteRef:
#               key: prod/kagent/openai
#               property: api_key
# @default -- []
extraObjects: []
