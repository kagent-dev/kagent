suite: test grafana-mcp deployment
templates:
  - deployment.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: should render deployment with default values
    template: deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-grafana-mcp
      - equal:
          path: spec.replicas
          value: 1
      - hasDocuments:
          count: 1

  - it: should have correct container name
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: grafana-mcp

  - it: should have correct service account name
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-grafana-mcp

  - it: should have correct container port
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8000

  # =============================================================================
  # Security Context Tests
  # =============================================================================
  - it: should apply default pod security context
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should apply default container security context
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 999
      - isNull:
          path: spec.template.spec.containers[0].securityContext.seccompProfile

  - it: should allow pod security context override
    template: deployment.yaml
    set:
      podSecurityContext:
        runAsNonRoot: true
        fsGroup: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000

  - it: should allow container security context override
    template: deployment.yaml
    set:
      securityContext:
        readOnlyRootFilesystem: false
        runAsUser: 1000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000

  - it: should render the default container image
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcp/grafana:latest

  - it: should omit empty registry segment in image
    template: deployment.yaml
    set:
      image:
        registry: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: grafana:latest
      - notMatchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^/"          # no leading slash

  # =============================================================================
  # Host allow-list
  #
  # The server rejects any Host it was not told about, and its own default covers only
  # loopback — so without these args it answers the handshake with "forbidden: host not
  # allowed" and the RemoteMCPServer reports no tools. The first assertion holds the
  # allow-list to the URL in remotemcpserver.yaml: if that URL ever changes shape, the
  # host it implies has to change with it.
  # =============================================================================
  - it: should allow the host the RemoteMCPServer URL dials
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: -allowed-hosts
      - equal:
          path: spec.template.spec.containers[0].args[3]
          value: RELEASE-NAME-grafana-mcp:8000,RELEASE-NAME-grafana-mcp.NAMESPACE:8000,RELEASE-NAME-grafana-mcp.NAMESPACE.svc:8000,RELEASE-NAME-grafana-mcp.NAMESPACE.svc.cluster.local:8000,localhost:8000,127.0.0.1:8000

  - it: should follow the service port into the allow-list
    template: deployment.yaml
    set:
      service.port: 9100
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[3]
          pattern: RELEASE-NAME-grafana-mcp\.NAMESPACE:9100

  - it: should let allowedHosts override the default
    template: deployment.yaml
    set:
      allowedHosts: "*"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[3]
          value: "*"
