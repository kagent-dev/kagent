[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kagent-core"
version = "0.2.0"
description = "kagent common library for kagent python packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]>=1.1.0,<2",
  "kagent-proto>=0.1.0",
  "opentelemetry-api>=1.42.1,<1.43.0",
  "opentelemetry-sdk>=1.42.1,<1.43.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.42.1,<1.43.0",
  "opentelemetry-exporter-otlp-proto-http>=1.42.1,<1.43.0",
  "opentelemetry-instrumentation-openai>=0.52.5,<0.53.0",
  "opentelemetry-instrumentation-anthropic>=0.52.5,<0.53.0",
  "opentelemetry-instrumentation-httpx>=0.63b0,<0.64",
  "opentelemetry-instrumentation-fastapi>=0.63b0,<0.64",
  "opentelemetry-instrumentation-google-generativeai>=0.52.5,<0.53.0",
  "typing-extensions>=4.16.0",
]

[tool.uv.sources]
kagent-proto = {workspace = true}

[tool.ruff]
extend = "../../pyproject.toml"

[tool.hatch.build.targets.wheel]
packages = ["src/kagent"]
