[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kagent-core"
version = "0.2.0"
description = "kagent common library for kagent python packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]>=1.1.5,<2",
  "kagent-proto>=0.1.0",
  "opentelemetry-api>=1.42.1,<2",
  "opentelemetry-sdk>=1.42.1,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.42.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.42.1,<2",
  "opentelemetry-distro>=0.63b0,<1",
  "opentelemetry-instrumentation-fastapi>=0.63b0,<1",
  "opentelemetry-instrumentation-grpc>=0.63b0,<1",
  "opentelemetry-instrumentation-httpx>=0.63b0,<1",
  "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
langgraph = [
  "opentelemetry-instrumentation-genai-langchain>=1.2b0,<1.3",
]
openai-agents = [
  "opentelemetry-instrumentation-genai-openai>=1.2b0,<1.3",
  "opentelemetry-instrumentation-genai-openai-agents>=1.2b0,<1.3",
]
crewai = [
  "opentelemetry-instrumentation-genai-anthropic>=1.2b0,<1.3",
  "opentelemetry-instrumentation-genai-openai>=1.2b0,<1.3",
]

[tool.uv.sources]
kagent-proto = {workspace = true}

[tool.ruff]
extend = "../../pyproject.toml"

[tool.hatch.build.targets.wheel]
packages = ["src/kagent"]
