[project]
name = "kagent-tools"
version = "0.1.0"
description = "Shared filesystem, shell, and workspace helpers for kagent Python adapters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kagent.tools*"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
line-length = 120
target-version = "py311"
lint.select = ["E", "F", "I", "N", "W", "UP"]
lint.ignore = ["E501", "N803", "N806"]
