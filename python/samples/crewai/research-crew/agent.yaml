apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: research-crew-agent
  namespace: kagent
spec:
  description: A crew that researches a topic and writes a report.
  type: BYO
  byo:
    image: localhost:5001/research-crew:latest
    cmd: python
    args: [samples/crewai/research-crew/src/research_crew/main.py]
    env:
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: kagent-openai
            key: OPENAI_API_KEY
      - name: SERPER_API_KEY
        valueFrom:
          secretKeyRef:
            name: kagent-serper
            key: SERPER_API_KEY
