[project]
name = "research-crew"
version = "0.1.0"
description = "A sample research crew using kagent-crewai"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "kagent-crewai",
]

[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
kagent-crewai = { workspace = true }
