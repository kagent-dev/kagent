[project]
name = "currency"
version = "0.1.0"
description = "Basic LangGraph agent for KAgent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "kagent-langgraph",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.6",
    "langchain-openai>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langsmith[otel]>=0.14.0",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
currency = "currency.cli:main"

[tool.uv.sources]
kagent-langgraph = { workspace = true }
