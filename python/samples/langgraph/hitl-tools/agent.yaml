apiVersion: kagent.dev/v1alpha3
kind: SandboxAgent
metadata:
  name: hitl-tools-agent
spec:
  description: A LangGraph agent demonstrating HITL tool approval with safe and dangerous tools
  type: BYO
  byo:
    image: localhost:5001/langgraph-hitl-tools:latest
    cmd: uv
    args: [run, samples/langgraph/hitl-tools/hitl_tools/cli.py]
    env:
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: kagent-openai
            key: OPENAI_API_KEY
